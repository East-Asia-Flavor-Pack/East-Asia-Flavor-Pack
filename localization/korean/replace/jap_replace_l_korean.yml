# Imperial restoration petition
je_meiji_restoration_proclaim_imperial_restoration_desc: "위기를 끝내려면 황실과의 합의가 이루어져야 합니다. 쇼군의 통치권을 재확인받든, 천황이 이끄는 정부 안에서 도쿠가와의 새로운 역할을 인정받든, 이 결정으로 양측의 관계와 일본의 통치 질서를 새롭게 확정지어야 합니다.\n\n이는 무대에서 뛰어내리듯 운명에 치명적인 영향을 미칠 계획입니다. 황실이 협력할 의지를 보이지 않는다면, 도쿠가와 막부는 복수심에 불타는 반대파와 홀로 맞서야만 합니다."
meiji_restoration_restore_emperor_1_tt: "#bold 공무합체#! 성공 시: #indent_newline:3 \n• $emperor_legitimize_shogun_tt$\n• $sonno_joi_militant_tt$#!"
meiji_restoration_restore_emperor_2_tt: "#bold 공의여론#! 성공 시: #indent_newline:3 \n• $emperor_restored_tt$\n• $tokugawa_becomes_lo_leader_tt$\n• $gain_landed_voting_tt$#!"
