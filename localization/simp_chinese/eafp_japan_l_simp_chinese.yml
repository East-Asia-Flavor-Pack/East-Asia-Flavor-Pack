formosa_expedition_events.2.f: "\"岛屿的每一处弯曲、河流、山脉，以及农田和原住民村庄的位置，都准确地记录在了地图上。凭借这一张地图，我们就能将[SCOPE.sState('formosa_scope').GetName]彻底收入囊中。\""
