eafp_japan.9998.t:0 "公武合体提案"
eafp_japan.9997.t:0 "三闭伊起义"
eafp_japan.9997.d:0 "在盛冈藩三闭伊地区发生了两次大规模的农民起义"
eafp_japan.9997.f:0 "盛冈藩三闭伊地区工商业和渔业发达，但农业生产力低下。面临财政困难的藩加强专卖制度，设立新役，征收新税，盘剥百姓，因此农民和渔民进行了两次大规模起义，抵抗藩的暴政。他们使藩接受了他们坚持的要求，并导致许多藩官员受到惩罚"
eafp_japan.9997.a:0 "剥削过度会导致民心背离，引发起义。让盛冈藩自行收拾局面"
eafp_japan.9997.b:0 "镇压起义，但要说服盛冈藩安抚民心。"
eafp_japan.9995.t:0 "各藩引进西式武器"
eafp_japan.9995.d:0 "各藩主争先恐后地引进新式武器。"
eafp_japan.9995.f:0 "“不仅是萨摩藩和长州藩，甚至连越前藩都在引进西方武器。我不知道他们的目的是什么，但可以肯定的是，这绝不是出于好意。我们必须采取特别措施。”"
eafp_japan.9995.a:0 "调查所有大名！"
eafp_japan.9995.b:0 "保障自治。"
