 # Regional administration: combined state modifier contributions and calculations.
 eafp_japan_region_effects_intro: "根据藩的独立性，本地区受到以下效果："
 eafp_japan_region_TOHOKU_tax_effect: "#tooltippable;tooltip:[JournalEntry.GetCountry.GetTooltipTag],eafp_japan_region_TOHOKU_tax_effect_tooltip [Multiply_CFixedPoint(JournalEntry.GetCountry.MakeScope.ScriptValue('eafp_japan_tax_loss_TOHOKU'),'(CFixedPoint)1')|%2-=]#! $state_tax_waste_add$"
 eafp_japan_region_TOHOKU_tax_effect_tooltip: "#tooltip_header $STATE_TOHOKU$: $state_tax_waste_add$#!\n$TOOLTIP_DELIMITER$\n$eafp_japan_regional_tax_waste$\n当前独立性: #v [Country.MakeScope.Var('eafp_japan_independency_TOHOKU').GetValue|2]/100#!\n基础系数: #v 1#!\n应用倍率: [Country.MakeScope.Var('eafp_japan_independency_TOHOKU').GetValue|2] / 100 × [Country.MakeScope.ScriptValue('eafp_japan_regional_tax_cap')|2] = #v [Country.MakeScope.ScriptValue('eafp_japan_tax_loss_TOHOKU')|4]#!\n计算: 1 × [Country.MakeScope.ScriptValue('eafp_japan_tax_loss_TOHOKU')|4] = [Multiply_CFixedPoint(Country.MakeScope.ScriptValue('eafp_japan_tax_loss_TOHOKU'),'(CFixedPoint)1')|%2-=]\n\n此处列出两个地区修正的额外效果，不包括该地区的其他修正。忠诚度不直接参与这四项效果的计算。"
 eafp_japan_region_TOHOKU_conscription_effect: "#tooltippable;tooltip:[JournalEntry.GetCountry.GetTooltipTag],eafp_japan_region_TOHOKU_conscription_effect_tooltip [Multiply_CFixedPoint(Multiply_CFixedPoint(JournalEntry.GetCountry.MakeScope.Var('eafp_japan_independency_TOHOKU').GetValue,'(CFixedPoint)0.01'),'(CFixedPoint)-50')|2+=]#! $state_building_conscription_center_max_level_add$"
 eafp_japan_region_TOHOKU_conscription_effect_tooltip: "#tooltip_header $STATE_TOHOKU$: $state_building_conscription_center_max_level_add$#!\n$TOOLTIP_DELIMITER$\n$eafp_japan_regional_autonomy$\n当前独立性: #v [Country.MakeScope.Var('eafp_japan_independency_TOHOKU').GetValue|2]/100#!\n基础系数: #v -50#!\n应用倍率: [Country.MakeScope.Var('eafp_japan_independency_TOHOKU').GetValue|2] / 100 = #v [Multiply_CFixedPoint(Country.MakeScope.Var('eafp_japan_independency_TOHOKU').GetValue,'(CFixedPoint)0.01')|4]#!\n计算: -50 × [Multiply_CFixedPoint(Country.MakeScope.Var('eafp_japan_independency_TOHOKU').GetValue,'(CFixedPoint)0.01')|4] = [Multiply_CFixedPoint(Multiply_CFixedPoint(Country.MakeScope.Var('eafp_japan_independency_TOHOKU').GetValue,'(CFixedPoint)0.01'),'(CFixedPoint)-50')|2+=]\n\n此处列出两个地区修正的额外效果，不包括该地区的其他修正。忠诚度不直接参与这四项效果的计算。"
