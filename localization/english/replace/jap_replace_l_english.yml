l_english:
ig_samurai: "Samurai"
ig_samurai_desc: "The samurai are Japan's hereditary military nobility, serving as privileged retainers to powerful landowners known as daimyo. They also execute the will of the feudal lords."
yuanzhumin: "Taiwan Aborigines"
je_meiji_restoration: "The Honorable Restoration"
je_meiji_restoration_reason: "Opening the country has broken the old political balance. End Bakufu rule and stabilize an imperial government to complete the EAFP restoration."
je_meiji_main: "The Meiji Transformation"
je_meiji_main_reason: "Japan must complete its economic, military, and diplomatic transformations under the new order."
je_meiji_economy: "The Meiji Economy"
je_meiji_economy_reason: "Build modern urban centers and connect the incorporated states by railway without falling into default."
je_meiji_army: "The Meiji Military"
je_meiji_army_reason: "Replace feudal levies and obsolete formations with a modern national military."
je_meiji_diplomacy: "The Meiji Diplomacy"
je_meiji_diplomacy_reason: "A sovereign and recognized Japan must leave traditionalism behind and enter international society on its own terms."
je_taming_the_north: "Taming the North"
je_taming_the_north_reason: "Develop and incorporate Hokkaido while managing relations with the Ainu through EAFP's own northern program."
