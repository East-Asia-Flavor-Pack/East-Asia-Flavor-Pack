 eafp_concession_profit_heading: "Weekly urban profit"
 eafp_concession_profit_value: "@money![GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_state_profit')|D=]"
 eafp_concession_activity_summary: "Active holders #v [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_active_holder_count')|0]#! · Trade center equivalent #v [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_trade_equivalent')|0] levels#!"
 eafp_concession_open_state: "View state"
 eafp_concession_open_building: "View concession building"
 eafp_concession_rights_heading: "Rights holders · Status"
