 eafp_japan_start_kobu_reforms_tt: "Establishing Kōbu Gattai starts four subsequent reforms: opening the country, the army, internal administration and public finance."
 eafp_japan_marriage_ended_tt: "The imperial marriage undertaking ends. Progress towards the other reform goal is preserved."
 meiji_restoration_restore_emperor_1_tt: "#bold If Kōbu Gattai#! succeeds: #indent_newline:3 \n• $emperor_legitimize_shogun_tt$\n• $sonno_joi_militant_tt$#!"
 meiji_restoration_restore_emperor_2_tt: "#bold If Kōgi Yoron#! succeeds: #indent_newline:3 \n• $emperor_restored_tt$\n• $tokugawa_becomes_lo_leader_tt$\n• $gain_landed_voting_tt$#!"
 je_meiji_restoration_proclaim_imperial_restoration_desc: "For the crisis to end, an agreement must be reached with the Imperial Court. Whether securing confirmation of the Shōgun’s right to govern or recognition of a new role for the Tokugawa within a government led by the Emperor, this decision must redefine the relationship between the two sides and establish a new political order for Japan.\n\nSuch a scheme is a fateful jump off the stage—if the Imperial Court is unwilling to cooperate, the Tokugawa Shogunate will find itself alone amidst its vengeful opponents."
 eafp_japan_kogi_petition_accepted_tt: "Secured approval of the Kōgi Yoron settlement through the petition for imperial restoration"
 eafp_japan_reform_not_completed_tt: "The outcomes of #v $je_meiji_restoration$#! and #v $je_bakufu_kaikaku$#! have not yet been settled"
