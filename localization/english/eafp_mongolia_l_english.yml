 law_eafp_military_headquarters_desc: "An autocratic government in which an imperially appointed general directs military and civil affairs. The end of Qing military rule replaces this system with ordinary Autocracy."
 character_role_eafp_jebtsundamba: "Jebtsundamba Khutuktu"
 character_role_eafp_jebtsundamba_title: "Jebtsundamba Khutuktu"
 eafp_mgl_jebtsundamba_line_ended: "The historical Jebtsundamba succession has ended."
 eafp_mgl_bogd_enthroned_tt: "[SCOPE.sCharacter('eafp_mgl_bogd_ruler').GetFullName] becomes Bogd Khan. The Devout join the government, and the crown follows the Jebtsundamba line of reincarnations."
 eafp_mgl.104.t: "The Jebtsundamba Succession"
 eafp_mgl.104.d: "[SCOPE.sCharacter('eafp_mgl_successor').GetFullName] has assumed the sacred seat of the Jebtsundamba Khutuktu. The new incarnation will lead Mongolia's monasteries and faithful as the leader of the Devout."
 eafp_mgl.104.d_bogd: "[SCOPE.sCharacter('eafp_mgl_successor').GetFullName] has inherited the sacred seat of the Jebtsundamba Khutuktu and the crown of the Bogd Khan. The new incarnation is entrusted with Mongolia's spiritual and temporal affairs."
 eafp_mgl.104.f: "Silk was spread and offerings laid before the sacred seat. As the temple bells rang, pilgrims from the distant steppe bowed their heads. A life had passed, but the teaching endured."
 eafp_mgl.104.a: "The lineage continues."
 eafp_mgl_jebtsundamba_succeeded_tt: "[SCOPE.sCharacter('eafp_mgl_successor').GetFullName] succeeds as Jebtsundamba Khutuktu. After the enthronement of the Bogd Khan, the successor also inherits the crown, with a regency for a child ruler."
 eafp_mgl_jebtsundamba_not_installed: "The Jebtsundamba Khutuktu has not yet been installed."
