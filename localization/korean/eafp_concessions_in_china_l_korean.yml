l_korean:

 # 개념
 concept_concession: "조계지"
 concept_concessions: "조계지"
 concept_concession_desc: "[concept_treaty]에 따라 관내18성에서 미승인국이 소유한 [concept_state]에 외국 [concept_great_power]이 얻는 권리입니다. $concept_concession$을 얻은 [concept_country]는 조계 [concept_company]를 세우고, 이 기업이 그 $concept_state$의 $building_eafp_concession$을 소유합니다. $building_eafp_concession$ 1레벨은 무역소 1레벨과 같은 고용과 무역 능력을 가집니다.\n\n$concept_concession$은 $concept_treaty$으로 맺거나, 상대가 '조계 요구' [concept_diplomatic_play]에서 요구를 받아들이거나 패배하면 얻습니다. 조계 조약은 [concept_influence]를 소모하며, 맺어지면 보유국의 해당 지역 관여가 크게 늘어납니다. $concept_state$마다 $building_eafp_concession$ 규모는 도심지 레벨에 따른 상한을 넘을 수 없으며, 보유국은 국고를 들여 자국 지분을 늘릴 수 있습니다.\n\n보유국은 $building_eafp_concession$의 무역과 [concept_dividends]으로 이익을 얻습니다. 조계를 내준 쪽은 보유국보다 국가 등급이 높을 때만 조약에서 탈퇴할 수 있습니다. 탈퇴·파기·전쟁·사건으로 권리가 끝나면 그 보유국의 지분만 사라지고, 마지막 권리가 끝나면 $building_eafp_concession$은 철거됩니다."

 # 건물·생산 방식·회사·modifier
 building_eafp_concession: "조계지"
 pmg_base_building_eafp_concession: "$pm_base$"
 pm_eafp_concession: "$building_eafp_concession$"
 company_eafp_concession: "조계회사"
 eafp_concession_company_slot: "조계회사 특별 기업 한도"
 eafp_concession_forced_loss: "강제 조계 반환의 충격"

 # 조약 항목 (조계 양도)
 eafp_grant_concession: "조계 양도"
 eafp_grant_concession_effects_desc: "• 두 [Concept('concept_country', '$concept_countries|q$')] 사이에 협정을 수립하여, 한 $concept_country$가 상대 $concept_country$에 선택한 주의 [concept_concession] 권리를 공식적으로 부여합니다."
 eafp_grant_concession_article_short_desc: "[SOURCE_COUNTRY.GetNameNoFormatting]: [TARGET_COUNTRY.GetNameNoFormatting]에 조계 양도"
 eafp_grant_concession_valid_tt: "관내18성에 있으며 조약항이 아니고 미승인국이 소유한 주여야 하며, 도심지 상한에 조계지 5레벨을 추가할 여유가 있어야 함. 받는 쪽은 수도가 있는 열강이며 이 주에 조계권이 없어야 함"
 eafp_concession_duplicate_article_tt: "같은 주·국가·방향의 조약 항목을 중복 추가할 수 없음"
 eafp_concession_treaty_name: "조계 조약"
 eafp_concession_grant_failed_title: "조계지 설치 실패"
 eafp_concession_grant_failed_desc: "조계회사 또는 기업 소유 조계지 생성이 완료되지 않아 권리를 등록하지 않았습니다. 해당 조약 항목을 정리한 뒤 다시 협상해야 합니다."
 EAFP_CONCESSION_AI_RIGHT: "조계 권리의 가치"
 EAFP_CONCESSION_AI_TRADE_CENTER: "조계회사 소유 조계지 5레벨의 가치 (무역소 5레벨 상당)"
 EAFP_CONCESSION_AI_CITY: "조계 대상 도시의 규모 (도심지 레벨)"

 # 외교전·전쟁 목표: 조계 요구
 dp_eafp_demand_concession: "$war_goal_eafp_demand_concession_type_name$"
 dp_eafp_demand_concession_desc: "대상 [concept_country]의 선택한 주에 [concept_concession]를 요구합니다. 상대가 요구를 받아들이면 조계 조약이 즉시 발효되고, 거부하면 이 요구를 주요 [concept_war_goal]로 하는 [concept_diplomatic_play]가 시작됩니다."
 dp_eafp_demand_concession_tooltip: "#header $dp_eafp_demand_concession$ [concept_diplomatic_play] 시작#!\n$TOOLTIP_DELIMITER$\n$dp_eafp_demand_concession_desc$"
 war_goal_eafp_demand_concession_type_name: "조계 요구"
 war_goal_eafp_demand_concession_type_desc: "다른 [concept_country]에 [concept_state]의 [concept_concession]를 내주도록 강요합니다."
 war_goal_eafp_demand_concession: "[WAR_GOAL_DRAFT.GetTargetState.GetName] [concept_concession]"
 war_goal_eafp_demand_concession_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName]: [WAR_GOAL_DRAFT.GetTarget.GetName]에 [WAR_GOAL_DRAFT.GetTargetState.GetName]의 [concept_concession] 양도를 강요합니다."
 war_goal_eafp_demand_concession_sway_desc: "[WAR_GOAL_DRAFT.GetWarGoalStakeholder.GetName]에게서 [WAR_GOAL_DRAFT.GetTargetState.GetName]의 [concept_concession]를 받아 내 주겠다고 약속하여 [WAR_GOAL_DRAFT.GetHolder.GetName]를 우리 편으로 끌어들입니다."

 # 외교전·전쟁 목표: 조계 반환 (사건)
 dp_eafp_concession_incident: "조계 반환 전쟁"
 dp_eafp_concession_incident_desc: "월간 조계 사건에서 시작된 반환 전쟁."
 dp_eafp_concession_incident_tooltip: "$dp_eafp_concession_incident_desc$"
 war_goal_eafp_concession_incident_return_type_name: "조계 반환"
 war_goal_eafp_concession_incident_return_type_desc: "선택된 주의 외국 조계 권리를 반환시킨다. 강제 반환의 관계·위신 손실은 보유 레벨과 도심지 대비 비율에 따라 증가한다."
 war_goal_eafp_concession_incident_return: "[WAR_GOAL_DRAFT.GetTargetState.GetName] 조계 반환"
 war_goal_eafp_concession_incident_return_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName]: [WAR_GOAL_DRAFT.GetTarget.GetName]의 [WAR_GOAL_DRAFT.GetTargetState.GetName] 조계 반환 요구"
 war_goal_eafp_concession_incident_return_sway_desc: "$war_goal_eafp_concession_incident_return_desc$"

 # 저널
 je_concessions_in_china: "중국 내 조계지"
 # https://zh.wikisource.org/wiki/二十年目睹之怪現狀/第001回 참고
 je_concessions_in_china_reason: "조계로 상인들이 떼지어 모여든다. 중국인과 외국인이 뒤섞여 살고, 기선이 오가며 온갖 상품이 실려 나르고 들어온다. 한낱 갈대밭이었던 땅에 외국 상사와 번듯한 건물이 들어서고, 부유한 상인들을 따라 술집과 유흥가도 번성한다.\n$TOOLTIP_DELIMITER$\n@information! [concept_great_power]은 미승인국이 소유한 관내18성의 [concept_state]에서 #b 조계 [concept_treaty]#!이나 #b $war_goal_eafp_demand_concession_type_name$#! [concept_diplomatic_play]로 [concept_concession]를 얻을 수 있습니다. 보유국마다 세우는 조계 [concept_company]가 그 주 #b $building_eafp_concession$#!의 지분을 소유합니다.\n\n보유국은 이 [concept_journal_entry]에서 국고를 들여 자국 지분을 늘릴 수 있고, 조계 기업은 매달 수익성 있는 현지 산업에 투자합니다."
 je_concessions_in_china_status: "현재 #v [GetDataModelSize(GetGlobalList('concession_candidate_states_gvarlist'))]#!개 주에 조계지가 있다."

 # 저널 위젯: 주 행 (현재/상한)
 eafp_concession_card_total: "[GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_total_levels')|0] / [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_urban_cap')|0]"
 eafp_concession_cap_tt: "#header 조계지 상한#!\n도심지가 #v [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_urban_levels')|0]#!레벨이므로 조계지 상한은 #v [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_urban_cap')|0]#!레벨입니다.\n현재 조계지 #v [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_total_levels')|0]#!레벨\n$eafp_concession_cap_status$\n\n새 조계권 획득과 저널 확장에는 각각 5레벨의 여유가 필요합니다. 도시가 커져 도심지가 늘면 상한도 늘어납니다. 도심지가 줄어 상한을 넘더라도 기존 조계지는 유지되지만 더 늘릴 수 없습니다."
 eafp_concession_cap_status: "[SelectLocalization(GreaterThan_CFixedPoint(GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_over_capacity'), '(CFixedPoint)0'), 'eafp_concession_cap_exceeded', SelectLocalization(GreaterThan_CFixedPoint(GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_free_capacity'), '(CFixedPoint)0'), 'eafp_concession_cap_available', 'eafp_concession_cap_full'))]"
 eafp_concession_cap_available: "#p 확장 여유 [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_free_capacity')|0]레벨#! · 도심지 상한 이내"
 eafp_concession_cap_full: "#v 상한 도달#! · 추가 설치·확장 불가"
 eafp_concession_cap_exceeded: "#n 상한 초과 [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_over_capacity')|0]레벨#! · 기존 건물 유지"

 # 저널 위젯: 국가별 소유 지분
 eafp_concession_ownership_heading: "국가별 소유 지분"
 eafp_concession_owner_share_tt: "[Company.GetCountry.GetFlagTextIcon] [Company.GetCountry.GetNameNoFlag] · [Company.GetName]\n#v [BuildingOwnership.GetLevel|0]레벨#! · [BuildingOwnership.GetOwnershipRatio|%0]"
 eafp_concession_company_asset: "[BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.GetFlagTextIcon] [BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.GetNameNoFlag]\n[BuildingOwnership.GetOwnerBuilding.GetCompany.GetName]"
 eafp_concession_company_asset_tt: "$eafp_concession_company_ownership_row$\n$eafp_concession_company_right_tt$"
 eafp_concession_company_ownership_row: "[BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.GetFlagTextIcon] [BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.GetNameNoFlag] / [BuildingOwnership.GetOwnerBuilding.GetCompany.GetName]: [BuildingOwnership.GetLevel|0]레벨"
 eafp_concession_company_right_tt: "[SelectLocalization(GetScriptedGui('eafp_concession_holder_right_gui').IsShown(GuiScope.SetRoot(State.MakeScope).AddScope('holder', BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.MakeScope).End), 'eafp_concession_right_live', 'eafp_concession_right_returned')]"
 eafp_concession_right_live: "조계권 보유"
 eafp_concession_right_returned: "조계권 없음 · 잔존 지분"
 eafp_concession_asset_amount: "#v [BuildingOwnership.GetLevel|0]레벨#!\n[BuildingOwnership.GetOwnershipRatio|%0]"
 eafp_concession_urban_usage: "도심 건물 #v [State.MakeScope.GetVariableFromVariableMap('eafp_concession_urban_map', Company.GetCountry.MakeScope).GetValue|0]#! / [BuildingOwnership.GetLevel|0]레벨"
 eafp_concession_urban_usage_tt: "이 조계회사가 이 주에서 소유한 산업·항구 레벨 합계는 #v [State.MakeScope.GetVariableFromVariableMap('eafp_concession_urban_map', Company.GetCountry.MakeScope).GetValue|0]#!레벨이고, 한도는 이 주 $building_eafp_concession$ 지분과 같은 #v [BuildingOwnership.GetLevel|0]#!레벨입니다.\n한도에 이르면 이 회사는 이 주에서 더 이상 산업에 투자하지 않습니다."
 eafp_concession_company_building_row: "[Building.GetName] · #v [BuildingOwnership.GetLevel|0]#!레벨 ([BuildingOwnership.GetOwnershipRatio|%0])"

 # 저널 위젯: 조계 확장 버튼
 eafp_concession_expand_label: "자국 조계 +5레벨 확장 (@money![GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_expansion_cost')|D])"
 eafp_concession_expand_title: "조계 확장"
 eafp_concession_expand_desc: "[State.GetName]에서 자국 조계회사 지분을 5레벨 늘립니다."
 eafp_concession_expand_button_tt: "#header $eafp_concession_expand_title$#!\n$eafp_concession_expand_desc$\n$TOOLTIP_DELIMITER$\n[GetScriptedGui('eafp_concession_expand_gui').IsValidTooltip(GuiScope.SetRoot(State.MakeScope).AddScope('actor', GetPlayer.MakeScope).End)]\n\n#title 효과:#!\n[GetScriptedGui('eafp_concession_expand_gui').ExecuteTooltip(GuiScope.SetRoot(State.MakeScope).AddScope('actor', GetPlayer.MakeScope).End)]"
 eafp_concession_expand_effect_tt: "[SCOPE.sState('concession_state').GetName]의 $building_eafp_concession$에서 자국 조계회사 지분을 #v 5#! 크기 늘림"
 eafp_concession_expand_active_tt: "해당 주에 유효한 조계 권리가 있어야 함"
 eafp_concession_expand_capacity_tt: "도심지 상한에 5레벨 이상의 여유가 있어야 함"
 eafp_concession_expand_treasury_tt: "[concept_gold_reserves]가 @money!#variable [GetPlayer.MakeScope.ScriptValue('eafp_concession_expansion_cost')|D]#! 이상이어야 함"
 eafp_concession_expand_ownership_tt: "이 주의 $building_eafp_concession$에 자국 소유 레벨이 있어야 함"

 # 월간 조계 사건 (concessions_in_china.200~207)
 concessions_in_china.200.t: "조계의 납세 분쟁"
 concessions_in_china.200.d: "[SCOPE.sState('concession_state').GetName]의 상인들이 현지 세무 관행에 항의하며 [SCOPE.sCountry('concession_holder').GetName]의 개입을 요구한다. [SCOPE.sCountry('concession_host').GetName] 당국은 조계 권리가 모든 납세 의무를 없애는 것은 아니라는 입장이다."
 concessions_in_china.200.f: "세금 장부 옆에 번역된 조약문이 놓였다. 같은 조항에 그어진 두 줄의 밑줄은 서로 다른 문장에서 끝났다."
 concessions_in_china.200.a: "현지 당국과 조정하라."
 concessions_in_china.200.b: "우리의 면세 권리를 주장하라."
 concessions_in_china.201.t: "조계 경계의 충돌"
 concessions_in_china.201.d: "[SCOPE.sState('concession_state').GetName]에서 [SCOPE.sCountry('concession_holder').GetName] 측 경비와 현지 경찰이 충돌했다. [SCOPE.sCountry('concession_host').GetName]의 관리들은 피해 배상과 관할권 문제의 해결을 요구한다."
 concessions_in_china.201.f: "넘어진 노점은 그대로였고 양쪽 순찰대는 길 양편에 섰다. 상인들은 문을 닫은 채 누가 먼저 물러나는지 지켜보았다."
 concessions_in_china.201.a: "배상으로 사건을 마무리하라."
 concessions_in_china.201.b: "공식 항의를 전달하라."
 concessions_in_china.201.c: "전쟁으로 조계 반환을 요구한다."
 concessions_in_china.202.t: "상인들의 대표"
 concessions_in_china.202.d: "[SCOPE.sState('concession_state').GetName]의 중국인 상인들이 [SCOPE.sCountry('concession_holder').GetName] 조계 당국과의 협의에 참여할 대표를 요구한다. [SCOPE.sCountry('concession_host').GetName] 당국도 이 요구를 지지한다."
 concessions_in_china.202.f: "청원서 끝에는 크고 작은 상점의 인장이 빼곡했다. 서기는 익숙한 상호를 짚으며 빈 의자를 하나 더 들여놓았다."
 concessions_in_china.202.a: "상인 대표의 의견을 듣자."
 concessions_in_china.202.b: "협의는 기존 당사자만으로 충분하다."
 concessions_in_china.203.t: "수리비의 몫"
 concessions_in_china.203.d: "[SCOPE.sState('concession_state').GetName]에서 조계와 주변 시가가 함께 사용하는 도로와 배수로의 수리가 필요해졌다. [SCOPE.sCountry('concession_host').GetName] 당국은 [SCOPE.sCountry('concession_holder').GetName]에 비용 분담을 요구한다."
 concessions_in_china.203.f: "비가 그친 뒤에도 경계석 아래에는 물이 고여 있었다. 수리공은 어느 쪽 관할인지 묻기 전에 먼저 막힌 도랑을 가리켰다."
 concessions_in_china.203.a: "수리비를 분담하라."
 concessions_in_china.203.b: "현지 당국이 부담할 일이다."
 concessions_in_china.204.t: "강제로 반환된 조계"
 concessions_in_china.204.d: "[SCOPE.sCountry('concession_host').GetName] 당국이 [SCOPE.sState('concession_state').GetName]의 [SCOPE.sCountry('concession_holder').GetName] 조계 권리를 강제로 폐지했다. 반환 규모에 따라 관계와 위신에 충격이 발생했다."
 concessions_in_china.204.f: "관리들은 새 고시를 붙이고 구문서를 봉인했다. 장부를 넘기는 소리 사이로 거리의 소문이 관청 안까지 밀려들었다."
 concessions_in_china.204.a: "반환 결과를 확인했다."
 concessions_in_china.205.t: "조계 분쟁의 전쟁"
 concessions_in_china.205.d: "[SCOPE.sState('concession_state').GetName]의 조계 분쟁이 [SCOPE.sCountry('concession_host').GetName]와 [SCOPE.sCountry('concession_holder').GetName] 사이의 전쟁으로 번졌다. [SCOPE.sCountry('concession_host').GetName]의 목표는 해당 주 조계의 반환이다. 권리는 전쟁 목표가 관철되어야 제거된다."
 concessions_in_china.205.f: "협상용 지도가 치워진 자리에 동원 명령서가 놓였다. 전령은 답장을 기다리지 않고 다음 관청으로 향했다."
 concessions_in_china.205.a: "전쟁이 시작되었다."
 concessions_in_china.206.t: "내전 속의 조계"
 concessions_in_china.206.d: "[SCOPE.sCountry('concession_host').GetName]의 내전으로 [SCOPE.sState('concession_state').GetName] 주변의 치안과 교역이 흔들리고 있다. 현지 당국은 [SCOPE.sCountry('concession_holder').GetName]에 구호와 경비 비용을 지원해 달라고 요청한다."
 concessions_in_china.206.f: "피란민의 수레가 검문소 앞에 줄을 이었다. 창고 문을 여는 일과 장부에 비용을 올리는 일은 서로 다른 사람의 결재를 기다렸다."
 concessions_in_china.206.a: "구호 비용을 지원하라."
 concessions_in_china.206.b: "우리 부담을 늘릴 수는 없다."
 concessions_in_china.207.t: "새로운 조약의 기회"
 concessions_in_china.207.d: "[SCOPE.sState('concession_state').GetName]의 [SCOPE.sCountry('concession_holder').GetName] 상인들이 다른 중국 주에도 교역 거점을 마련하자고 건의한다. [SCOPE.sCountry('concession_host').GetName]와 맺은 기존 관계를 계기로 추가 조약 협상을 검토할 수 있다."
 concessions_in_china.207.f: "상회가 보낸 지도에는 아직 방문하지 않은 도시들이 표시되어 있었다. 그 옆에는 항로보다 긴 협상 상대의 명단이 적혀 있었다."
 concessions_in_china.207.a: "조약 협상을 검토하자."
