l_english:
 je_concessions_in_china2_status: "Concession income and prestige"
 je_concessions_in_china2_reason: "Our concessions in China provide footholds for trade and revenue for the treasury. We must manage relations with local governments and maintain the prestige needed to exercise our rights."
 eafp_grant_concession: "Grant Concession"
 eafp_grant_concession_desc: "Establish a foreign concession right in the selected state."
 eafp_grant_concession_effects_desc: "• Retains state ownership and adds five trade center levels owned by the new holder\n• Adds 5% of combined urban weekly profit to the Chinese owner's national expenses and each active holder's tax income\n• Suspends the economic effect when the state owner's prestige exceeds the holder's"
 eafp_grant_concession_article_short_desc: "[SOURCE_COUNTRY.GetNameNoFormatting] grants a concession to [TARGET_COUNTRY.GetNameNoFormatting]"
 eafp_return_concession: "Return Concession"
 eafp_return_concession_desc: "Return the existing concession right in the selected state."
 eafp_return_concession_effects_desc: "• Removes the source country's concession and concession payment in the selected state\n• Suspended concessions can also be returned\n• Existing trade center ownership is retained"
 eafp_return_concession_article_short_desc: "[SOURCE_COUNTRY.GetNameNoFormatting] returns a concession to [TARGET_COUNTRY.GetNameNoFormatting]"
 eafp_grant_concession_valid_tt: "Requires an eligible Chinese-owned state in China Proper and a Great Power recipient with an interest in its strategic region and no existing concession there"
 eafp_return_concession_valid_tt: "The recipient must be the state's current Chinese owner and the source must hold a concession there"
 eafp_concession_duplicate_article_tt: "The same article cannot be duplicated for the same state and countries in the same direction"
 eafp_concession_treaty_instructions: "Select Grant Concession or Return Concession and a state in treaty negotiations. These articles can also be enforced as war demands. A new grant adds five holder-owned trade center levels in that state."
 eafp_concession_state_income: "Urban weekly profit: @money![GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_state_profit')|D=] · Active holders: [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_active_holder_count')|0]"
 eafp_concession_economy_tt: "Urban weekly profits are summed before applying the rate; a nonpositive total transfers nothing.\nRate per holder: #v 5%#!\nReceipt per active holder: @money![GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_state_share')|D=]/week\nChinese owner's burden from this state: @money![GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_state_debit')|D=]/week\n\nApplied to the Chinese owner's national expenses and the holder's tax income without changing building profits. These are current calculated values; budget modifiers are refreshed together weekly."
 eafp_concession_holder_row: "[Country.GetFlagTextIcon] [Country.GetNameNoFlag]: [SelectLocalization(GetScriptedGui('eafp_concession_holder_active_gui').IsShown(GuiScope.SetRoot(State.MakeScope).AddScope('holder', Country.MakeScope).End), 'eafp_concession_active_label', 'eafp_concession_inactive_label')]"
 eafp_concession_active_label: "#positive_value Active#!"
 eafp_concession_inactive_label: "#negative_value Suspended#!"
 eafp_concession_prestige_tt: "State owner's prestige: [State.GetOwner.GetPrestige|0]\nHolder's prestige: [Country.GetPrestige|0]\n\nHigher state-owner prestige suspends income and new monthly incidents. Equal prestige permits operation. A non-Chinese owner or treaty-port state also suspends operation. Rights and existing trade center ownership are retained."
 EAFP_CONCESSION_AI_RIGHT: "Value of concession rights"
 EAFP_CONCESSION_AI_TRADE_CENTER: "Value of five trade center levels"
 EAFP_CONCESSION_AI_INCOME: "Tax income at current profits"
 dp_eafp_concession_incident: "Concession Return War"
 dp_eafp_concession_incident_desc: "A war for the return of a concession, triggered by a monthly incident."
 dp_eafp_concession_incident_tooltip: "$dp_eafp_concession_incident_desc$"
 war_goal_eafp_concession_incident_return_type_name: "Return Concession"
 war_goal_eafp_concession_incident_return_type_desc: "Remove the foreign concession right in the selected state. Trade center ownership is retained."
 war_goal_eafp_concession_incident_return: "Return the [WAR_GOAL_DRAFT.GetTargetState.GetName] Concession"
 war_goal_eafp_concession_incident_return_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName] demands that [WAR_GOAL_DRAFT.GetTarget.GetName] return its concession in [WAR_GOAL_DRAFT.GetTargetState.GetName]."
 war_goal_eafp_concession_incident_return_sway_desc: "$war_goal_eafp_concession_incident_return_desc$"
 concessions_in_china.200.t: "Disputed Tax Bills"
 concessions_in_china.200.d: "Merchants in [SCOPE.sState('concession_state').GetName] have asked [SCOPE.sCountry('concession_holder').GetName] to intervene in a dispute over local taxes. The authorities of [SCOPE.sCountry('concession_host').GetName] maintain that concession rights do not exempt every transaction."
 concessions_in_china.200.f: "A translated treaty lay beside the tax ledger. The two officials had underlined different sentences in the same article."
 concessions_in_china.200.a: "Seek an arrangement with the local authorities."
 concessions_in_china.200.b: "Insist on our exemptions."
 concessions_in_china.201.t: "Clash at the Concession Boundary"
 concessions_in_china.201.d: "Guards serving [SCOPE.sCountry('concession_holder').GetName] have clashed with local police in [SCOPE.sState('concession_state').GetName]. Officials of [SCOPE.sCountry('concession_host').GetName] demand compensation and a settlement of the jurisdictional dispute."
 concessions_in_china.201.f: "The overturned stall remained between the patrols. Behind shuttered shops, merchants waited to see which side would withdraw first."
 concessions_in_china.201.a: "Settle the incident with compensation."
 concessions_in_china.201.b: "Deliver a formal protest."
 concessions_in_china.201.c: "Go to war for the concession's return."
 concessions_in_china.202.t: "A Voice for Local Merchants"
 concessions_in_china.202.d: "Chinese merchants in [SCOPE.sState('concession_state').GetName] seek representatives in consultations with the [SCOPE.sCountry('concession_holder').GetName] concession authorities. The government of [SCOPE.sCountry('concession_host').GetName] supports their request."
 concessions_in_china.202.f: "Seals from shops large and small crowded the petition. Recognizing the names, a clerk brought another chair into the meeting room."
 concessions_in_china.202.a: "Hear the merchants' representatives."
 concessions_in_china.202.b: "Keep consultations between the existing parties."
 concessions_in_china.203.t: "Sharing the Repair Bill"
 concessions_in_china.203.d: "Roads and drains shared by the concession and neighboring districts of [SCOPE.sState('concession_state').GetName] need repairs. [SCOPE.sCountry('concession_host').GetName] has asked [SCOPE.sCountry('concession_holder').GetName] to contribute."
 concessions_in_china.203.f: "Water still pooled beneath the boundary stone after the rain. Before asking whose jurisdiction it was, the workman pointed to the blocked drain."
 concessions_in_china.203.a: "Contribute to the repairs."
 concessions_in_china.203.b: "Leave the bill to the local authorities."
 concessions_in_china.204.t: "A Concession Reclaimed"
 concessions_in_china.204.d: "[SCOPE.sCountry('concession_host').GetName] has forcibly abolished the [SCOPE.sCountry('concession_holder').GetName] concession in [SCOPE.sState('concession_state').GetName]. Its concession payment has ended; existing trade center ownership remains unchanged."
 concessions_in_china.204.f: "Officials posted the new notice and sealed the old papers. As ledgers changed hands, rumors from the street filled the office."
 concessions_in_china.204.a: "The return is recorded."
 concessions_in_china.205.t: "War over a Concession"
 concessions_in_china.205.d: "The concession dispute in [SCOPE.sState('concession_state').GetName] has become a war between [SCOPE.sCountry('concession_host').GetName] and [SCOPE.sCountry('concession_holder').GetName]. [SCOPE.sCountry('concession_host').GetName] demands the concession's return. The right remains until that war goal is enforced."
 concessions_in_china.205.f: "Mobilization orders replaced the negotiation map. The courier left for the next office without waiting for an answer."
 concessions_in_china.205.a: "The war has begun."
 concessions_in_china.206.t: "A Concession amid Civil War"
 concessions_in_china.206.d: "Civil war in [SCOPE.sCountry('concession_host').GetName] is disrupting security and trade around [SCOPE.sState('concession_state').GetName]. Local officials have asked [SCOPE.sCountry('concession_holder').GetName] to help fund relief and protection."
 concessions_in_china.206.f: "Refugee carts queued at the checkpoint. Opening the warehouse and authorizing its expenses each required a different official's signature."
 concessions_in_china.206.a: "Help fund relief."
 concessions_in_china.206.b: "We cannot take on further costs."
 concessions_in_china.207.t: "An Opening for a New Treaty"
 concessions_in_china.207.d: "Merchants from [SCOPE.sCountry('concession_holder').GetName] in [SCOPE.sState('concession_state').GetName] propose establishing footholds in other Chinese states. Existing contacts with [SCOPE.sCountry('concession_host').GetName] offer an occasion to consider further treaty negotiations."
 concessions_in_china.207.f: "The merchants' map marked cities they had yet to visit. Beside it lay a list of negotiating partners longer than the proposed itinerary."
 concessions_in_china.207.a: "Consider treaty negotiations."
