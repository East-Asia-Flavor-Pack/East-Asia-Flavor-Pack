 # 朝鲜调试决议
 kor_scramble_for_korea_setup: "(调试) 朝鲜争夺战：准备日本方面的条件"
 kor_scramble_for_korea_setup_desc: "视需要解除日本的锁国状态、加快维新进程，并使日本获得列强承认。"
 kor_samjeong: "(调试) 三政的紊乱：提高三项进度"
 kor_samjeong_desc: "将官厅状况、军政状况和民生状况的进度各设为#v 2000#!。"
 kor_yangjeon: "(调试) 量田：完成"
 kor_yangjeon_desc: "将量田进度设为完成所需的#v 360#!。"
 kor_sedo: "(调试) 势道政治：结束"
 kor_sedo_desc: "将权力平衡降至结束势道政治所需的#v 0#!。"
 kor_manchurian_policy: "(调试) 满洲政策：启动"
 kor_manchurian_policy_desc: "添加满洲政策日志条目。"
