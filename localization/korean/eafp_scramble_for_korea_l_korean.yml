l_korean:
 je_scramble_for_korea: "조선 쟁탈전"
 je_scramble_for_korea_reason: "조선의 개혁과 열강의 개입이 한반도의 장래를 결정한다. 각 관여국의 영향력은 별도로 축적된다. 외국은 단독 100에 도달하면 승리한다. 조선은 독립국이자 승인국이며 단독 100이면 자주권을 확보한다. 조선 이외의 관여국이 모두 이탈하면 영향력·승인·독립 여부와 무관하게 조선이 승리한다. 청 이외 국가가 조선의 직접 종주국이면 점수와 무관하게 승리한다.\n\n청·일의 소멸이나 중국 붕괴로는 경쟁이 중단되지 않으며 남은 관여국끼리 계속한다. 청 종속 조선에 다른 관여국이 영향력으로 승리하면 종속관계가 승자에게 이전된다. 일지 진행 중 조선의 세력 블록 지렛대 저항은 50% 감소한다."
 korea_scramble_influence_100_tt: "조선 쟁탈전 영향력이 #v 100#! 이상"
 korea_scramble_gui_heading: "관여국별 영향력"
 korea_scramble_role_korea: "자주권"
 korea_scramble_role_foreign: "외국 영향력"
 korea_scramble_gui_value: "[Country.Custom('korea_scramble_role')]: [Country.MakeScope.Var('scramble_for_korea_participants_influence').GetValue|1]/100"
 korea_scramble_gui_tooltip: "예상 월간 변화: [Country.MakeScope.ScriptValue('scramble_for_korea_monthly_change')|=+2]\n[Country.MakeScope.GetScriptValueDesc('scramble_for_korea_monthly_change')]\n월간 합계는 -1~+1, 영향력은 0~100으로 제한된다. 표시값은 현재 조건으로 계산한 예상치다."
 korea_scramble_drift_pressure: "외세 압력 억제"
 korea_scramble_drift_rank: "조선 국가 등급"
 korea_scramble_drift_money: "조선에 대한 금전 지원"
 korea_scramble_drift_obligation: "조선이 진 의무"
 korea_scramble_drift_advisers: "수락된 군사고문"
 korea_scramble_drift_bloc: "조선 소속 세력 블록의 지도자"
 modifier_korea_enlightenment_support: "조선 개화파 지원"
 modifier_reject_korea_enlightenment_support: "개화파 지원 거부"
 modifier_enlightenment_support_from_foreign: "외국의 개화 지원"
 modifier_kor_foreign_influence: "조선 쟁탈: 외국의 영향"
 modifier_kor_improved_labor_conditions: "노동 조건 개선"
 modifier_curtailed_kor_labor_abuses: "노동 착취 단속"
 modifier_struggling_kor_colonists: "곤경에 처한 조선 거류민"
 modifier_korea_scramble_advisers: "조선 군사고문단"
 modifier_korea_scramble_diplomatic_cost: "조선 개입 외교 비용"
 modifier_korea_scramble_administration_cost: "자주 외교 행정 비용"
 modifier_korea_scramble_sovereignty: "조선 자주권 확보"
 modifier_korea_scramble_victory: "조선에서의 우세"
 korea_scramble_claim_button: "종주권·권익 주장"
 korea_scramble_claim_button_desc: "외국 선두보다 영향력이 낮을 때 사용. 외교력 50을 36개월 부담하고 영향력 +3. 경쟁국이 비용을 들여 최대 3을 상쇄할 수 있다. 재사용 대기 36개월."
 korea_scramble_invest_button: "조선 상권 지원"
 korea_scramble_invest_button_desc: "조선 내 자국 소유 건물이 필요하다. 제안 제출 시 £10,000 지출. 조선 수락 시 영향력 +3, 건물 노동 조건 개선 및 조선에 £5,000 지원. 재사용 대기 24개월."
 korea_scramble_advisers_button: "군사고문 제안"
 korea_scramble_advisers_button_desc: "제안 제출 시 외교력 50을 24개월 부담. 조선 수락 시 영향력 +3, 24개월 동안 월 +0.5. 경쟁국이 대응할 수 있다. 재사용 대기 24개월."
 korea_scramble_lobby_button: "조정 인사 포섭"
 korea_scramble_lobby_button_desc: "조선의 정부 내 이해집단을 후원한다. 제안 제출 시 £10,000 지출. 수락 시 친우리나라 로비에 가입시키고 영향력 +3. 재사용 대기 24개월."
 korea_scramble_sovereignty_button: "자주 외교"
 korea_scramble_sovereignty_button_desc: "행정력 50을 24개월 부담. 조선 영향력 +3, 외국 단독 선두 -3. 외국 선두 동률이면 감소분만 생략. 재사용 대기 24개월."
 scramble_for_korea_events.1.t: "풍전등화" # 조선
 scramble_for_korea_events.1.d: "제국주의의 거센 파도가 [ROOT.GetCountry.GetName]의 해안가에 도달했다. 국경을 맞댄 이웃국들부터 바다 건너의 낯선 열강들까지, 수많은 외세가 검은 속내를 드러내고 있다."
 scramble_for_korea_events.1.f: "\"지금 우리나라는 실로 아시아의 목구멍에 해당하는 위치에 있으니 그 형세가 마치 무거운 돌이 계란을 누르고 있는 것과 같아 위태롭기 그지없다. 강대국들은 서로를 꺼려하며 감히 먼저 움직이지 못하고 우리를 주시하고 있으나, 만약 어느 한 나라가 침범해 온다면 다른 나라들이 가만히 있지 않을 것이니, 우리나라는 반드시 그 재앙을 감당해 내지 못할 것이다.\"" # 유길준 전서에 있다는데 암만 뒤져도 못 찾겠다. 적당해서 넣음.
 scramble_for_korea_events.1.a: "호랑이 굴에 들어가도 정신만 차리면 산다."

 scramble_for_korea_events.2.t: "한반도를 향한 야망" # 청, 일본 등
 scramble_for_korea_events.2.d: "이웃한 저 반도는 대륙과 해양을 잇는 전략적 요충지이자, 동아시아의 패권을 쥐기 위해 확보해야 할 교두보이다. 그러나 우리만 저 땅을 노리는 것이 아니다."
 scramble_for_korea_events.2.f: "\"지도를 보십시오. 조선 땅은 우리 [ROOT.GetCountry.GetName]의 심장을 향해 겨누어진 비수와 같습니다. 저 비수의 자루를 우리가 쥐지 않고 다른 열강이 쥐게 놔둔다면, 우리는 언제 찔릴지 모르는 공포 속에서 살아야 할 것입니다.\"" # Jacob Meckel 말 적당히 써먹음
 scramble_for_korea_events.2.a: "그곳은 마땅히 우리의 영향권 아래에 있어야 한다."

 scramble_for_korea_events.3.t: "조선 문제" # 그 외 열강
 scramble_for_korea_events.3.d: "지역의 패권국들이 서로를 견제하며 조선을 자신의 영향권에 넣으려 혈안이 되어 있다."
 scramble_for_korea_events.3.f: "\"조선 문제를 이해하려는 자는 누구든, 조선이 강력한 이웃 국가들이라는 맷돌 사이에 끼인 알갱이라는 사실을 명확히 파악해야 한다. 조선은 높은 전략적 가치를 지닌 탓에, 경쟁국들이 서로의 면전에 대고 치고받는 배드민턴의 셔틀콕과 같은 신세가 되고 말았다.\"" # 그리피스, 은자의 왕국 조선 + 조지 커존, 극동의 문제들. 적당히 섞음.
 scramble_for_korea_events.3.a: "극동을 주시하라."
 scramble_for_korea_events.23.t: "일본의 우세"
 scramble_for_korea_events.23.d: "[SCOPE.sCountry('scramble_winner').GetName](이)가 조선 쟁탈의 승자가 되었다. 확정된 종속관계와 외교적 지위가 새로운 질서의 토대가 된다."
 scramble_for_korea_events.23.f: "\"이제 세계는 한결같이 일본의 실력이 위대함을 인정하고 자연히 열강의 대오에 나란히 서게 되었다. 그런데 제군이 10년 내지 20년 전의 옛 꿈을 상기하여 시세의 변천을 깨닫지 못하고서 자기 마음대로 판단을 내리는 일 같은 것은 몹시 시세에 통하지 않는 것이다. 귀국은 독립에 필요한 실력을 갖지 못했다. 실로 허명의 독립에 지나지 않는다.\"" # 출처: 이토 히로부미, 1905년 11월 16일 「伊藤 大使 한국 각 대신 및 원로대신과 담화의 요령」, 『주한일본공사관기록』, 국사편찬위원회 한국사데이터베이스. 발췌·중간 생략. https://db.history.go.kr/joseon/level.do?levelId=jh_025r_0070_0030&types=r
 scramble_for_korea_events.23.a: "우리의 지위를 굳혔다."
 scramble_for_korea_events.23.b: "새로운 질서에 대응해야 한다."
 scramble_for_korea_events.24.t: "청의 종주권 재확립"
 scramble_for_korea_events.24.d: "[SCOPE.sCountry('scramble_winner').GetName](이)가 조선 쟁탈의 승자가 되었다. 확정된 종속관계와 외교적 지위가 새로운 질서의 토대가 된다."
 scramble_for_korea_events.24.f: "\"역량을 타산해보면 약점만 나타나서 자주 국가로 될 수 없을 뿐만 아니라 강국의 보호도 받는 데가 없기 때문에 결코 자기 스스로 보존하기 어려운 것은 자연적인 이치로서 천하가 다 아는 것입니다.\n\n조선은 본래 중국에 속해 있었는데, 지금 중국을 버리고 다른 데로 향하려 한다면 이것은 어린아이가 자기 부모에게서 떨어져서 다른 사람의 보살핌을 받으려는 것과 같은 것입니다.\"" # 출처: 원세개 「조선대국론(朝鮮大局論)」, 『고종실록』 23권, 고종 23년(1886) 음력 7월 29일 제3기사, 국사편찬위원회. 발췌·중간 생략 및 종결 어미 조정. https://sillok.history.go.kr/id/wza_12307029_003
 scramble_for_korea_events.24.a: "우리의 지위를 굳혔다."
 scramble_for_korea_events.24.b: "새로운 질서에 대응해야 한다."
 scramble_for_korea_events.22.t: "새로운 패권국"
 scramble_for_korea_events.22.d: "[SCOPE.sCountry('scramble_winner').GetName](이)가 조선 쟁탈의 승자가 되었다. 확정된 종속관계와 외교적 지위가 새로운 질서의 토대가 된다."
 scramble_for_korea_events.22.f: "\"한반도는 시간이 흐르면 [SCOPE.sCountry('scramble_winner').GetName]의 소유가 될 것이다. [SCOPE.sCountry('scramble_winner').GetName]의 경계를 점차적으로 넓히고, 우리의 영토로 우리의 보호 통치를 조금씩 확장시키고, 마침내 우리를 움직이도록 했던 거부할 수 없는 불가항력적인 힘이 우리를 한반도로 향하게 하고 있다.\"" # 출처: 로젠 남작, 「4등관 로젠 남작이 제출한 단신」(1902. 9. 12.), 『러시아국립해군성문서Ⅱ(1900~1903)』, 문서 57. РГАВМФ, ф. 417, оп. 1, д. 2303, лл. 51–63. 특정 국가에 한정되지 않도록 재구성. https://db.history.go.kr/item/compareViewer.do?levelId=fs_021r_0570
 scramble_for_korea_events.22.a: "우리의 지위를 굳혔다."
 scramble_for_korea_events.22.b: "새로운 질서에 대응해야 한다."
 scramble_for_korea_events.20.t: "조선 자주권 확보"
 scramble_for_korea_events.20.d: "조선 쟁탈은 조선의 승리로 끝났다. 한반도를 둘러싼 경쟁이 일단락되고, 조선은 자국의 장래를 결정할 입지를 굳혔다."
 scramble_for_korea_events.20.f: "\"한 나라의 권리는 경솔한 말에 흔들리는 것이 아닐뿐더러, 천만인이 함께 지키는 주권을 한 사람의 독단으로 처분할 수 없음은 이치상 명백한 일이라. 한 가지 비유를 들건대, 남의 집에 고용된 자가 그 주인의 지휘와 명령도 없이 다른 사람을 상대로 주인집의 사무를 제멋대로 처리하여도, 본래 그 일을 처리할 권한이 없은즉 그가 의논하여 처리한 일은 주인의 승인을 얻지 못하고, 다른 사람도 그 고용된 자의 허황됨을 비웃을지니, 그러한 까닭에 나라의 권리는 위협과 독단으로 바꿀 수 없는 것이라.\"" # 출처: 유길준, 『서유견문』 제3편 「방국의 권리」 제8절 후반부. 원문의 논지와 비유를 유지하고 생소한 한자어와 연결 표현을 고풍스러운 현대어로 다듬음. https://ko.wikisource.org/wiki/서유견문/제3편
 scramble_for_korea_events.20.a: "우리의 앞날은 우리가 정한다."
 scramble_for_korea_events.20.b: "조선의 지위를 인정해야 한다."
 scramble_for_korea_events.4.t: "개화파 지원"
 scramble_for_korea_events.4.d: "조선의 개혁을 후원하면 조정에 우호적인 인사를 늘릴 수 있다. 자금을 제공하되 실행 여부는 조선의 판단에 맡겨야 한다."
 scramble_for_korea_events.4.f: "새로운 책과 기계가 도착하는 길에는 언제나 외교관의 발길도 뒤따랐다."
 scramble_for_korea_events.4.a: "제안을 추진하자."
 scramble_for_korea_events.4.b: "이번에는 물러서자."
 scramble_for_korea_events.4.cancel: "상황이 달라졌다. 이 제안은 철회한다."
 scramble_for_korea_events.5.t: "조선 내 사업"
 scramble_for_korea_events.5.d: "조선에 있는 우리 소유 사업장의 노동 조건과 추가 지원을 둘러싸고 협의가 필요하다."
 scramble_for_korea_events.5.f: "상인은 장부를 펼쳤고 관리는 보고서를 펼쳤다. 같은 숫자도 서로 다른 의미를 가졌다."
 scramble_for_korea_events.5.a: "제안을 추진하자."
 scramble_for_korea_events.5.b: "이번에는 물러서자."
 scramble_for_korea_events.5.cancel: "상황이 달라졌다. 이 제안은 철회한다."
 scramble_for_korea_events.6.t: "군사고문단 제안"
 scramble_for_korea_events.6.d: "조선에 군사고문단을 파견하여 군제 개편을 도울 수 있다. 조선의 동의가 있어야 고문단이 활동할 수 있다."
 scramble_for_korea_events.6.f: "교련장의 명령어가 바뀌는 일은 군대만의 문제가 아니었다."
 scramble_for_korea_events.6.a: "제안을 추진하자."
 scramble_for_korea_events.6.b: "이번에는 물러서자."
 scramble_for_korea_events.6.cancel: "상황이 달라졌다. 이 제안은 철회한다."
 scramble_for_korea_events.8.t: "종주권과 권익"
 scramble_for_korea_events.8.d: "경쟁국의 영향력이 우리보다 앞서 있다. 청은 종주권을, 일본은 조약상 권익을, 다른 국가는 자국 권익을 내세워 조선에서의 지위를 주장할 수 있다."
 scramble_for_korea_events.8.f: "외교 문서의 한 문장이 군함 한 척보다 오래 남을 때도 있었다."
 scramble_for_korea_events.8.a: "제안을 추진하자."
 scramble_for_korea_events.8.b: "이번에는 물러서자."
 scramble_for_korea_events.8.cancel: "상황이 달라졌다. 이 제안은 철회한다."
 scramble_for_korea_events.9.t: "조정 내 후원자 탐색"
 scramble_for_korea_events.9.d: "조선 정부의 이해집단 중 우리의 제안을 들을 만한 상대를 찾아보자. 실제 후원은 별도의 협의와 조선의 동의를 거친다."
 scramble_for_korea_events.9.f: "문을 여는 소개장은 때로 공식 조약보다 먼저 도착했다."
 scramble_for_korea_events.9.a: "제안을 추진하자."
 scramble_for_korea_events.9.b: "이번에는 물러서자."
 scramble_for_korea_events.9.cancel: "상황이 달라졌다. 이 제안은 철회한다."
 scramble_for_korea_events.10.t: "거류민 분쟁"
 scramble_for_korea_events.10.d: "조선에 거주하는 우리 문화권 주민들의 처우를 둘러싸고 분쟁이 생겼다. 조선과 협의하거나 자발적 귀환을 지원할 수 있다."
 scramble_for_korea_events.10.f: "공사관에 쌓인 진정서는 숫자가 아니라 사람들의 사정으로 가득했다."
 scramble_for_korea_events.10.a: "제안을 추진하자."
 scramble_for_korea_events.10.b: "이번에는 물러서자."
 scramble_for_korea_events.10.cancel: "상황이 달라졌다. 이 제안은 철회한다."
 scramble_for_korea_events.12.t: "친외국 세력 지원"
 scramble_for_korea_events.12.d: "조선의 한 정부 내 이해집단이 우리와의 협력을 논의할 수 있다. 조선이 제안을 수락하면 친우리나라 로비를 조직하거나 기존 로비에 참여시킨다."
 scramble_for_korea_events.12.f: "공개된 회의장 밖에서도 정책을 둘러싼 설득은 계속되었다."
 scramble_for_korea_events.12.a: "제안을 추진하자."
 scramble_for_korea_events.12.b: "이번에는 물러서자."
 scramble_for_korea_events.12.cancel: "상황이 달라졌다. 이 제안은 철회한다."
 scramble_for_korea_events.10.c: "자발적 귀환 희망자를 지원하라."
 scramble_for_korea_events.7.t: "조선의 대응"
 scramble_for_korea_events.7.d: "[SCOPE.sCountry('scramble_actor').GetName]의 제안을 검토해야 한다."
 scramble_for_korea_events.7.f: "대신들은 얻을 것과 잃을 것을 저울질했다. 나라의 문을 여는 방법은 하나만 있는 것이 아니었다."
 scramble_for_korea_events.7.a: "제안을 수락한다."
 scramble_for_korea_events.7.b: "우리 힘으로 해결하겠다."
 scramble_for_korea_events.7.c: "일회성 협력으로 절충하자."
 scramble_for_korea_events.7.cancel: "더 이상 유효한 제안이 아니다."
 scramble_for_korea_events.7.d4: "[SCOPE.sCountry('scramble_actor').GetName](이)가 개화파 지원을 제안했다. 수락하면 해당국 영향력이 3 증가하고 제안 효과가 적용된다. 거부하면 조선 +3·제안국 -2, 절충하면 양국 +1만 적용한다."
 scramble_for_korea_events.7.d5: "[SCOPE.sCountry('scramble_actor').GetName](이)가 사업장 노동 조건 개선과 자금 지원을 제안했다. 수락하면 해당국 영향력이 3 증가하고 제안 효과가 적용된다. 거부하면 조선 +3·제안국 -2, 절충하면 양국 +1만 적용한다."
 scramble_for_korea_events.7.d6: "[SCOPE.sCountry('scramble_actor').GetName](이)가 군사고문단 파견을 제안했다. 수락하면 해당국 영향력이 3 증가하고 제안 효과가 적용된다. 거부하면 조선 +3·제안국 -2, 절충하면 양국 +1만 적용한다."
 scramble_for_korea_events.7.d10: "[SCOPE.sCountry('scramble_actor').GetName](이)가 거류민 분쟁 협의와 지원금을 제안했다. 수락하면 해당국 영향력이 3 증가하고 제안 효과가 적용된다. 거부하면 조선 +3·제안국 -2, 절충하면 양국 +1만 적용한다."
 scramble_for_korea_events.7.d12: "[SCOPE.sCountry('scramble_actor').GetName](이)가 친외국 로비 후원을 제안했다. 수락하면 해당국 영향력이 3 증가하고 제안 효과가 적용된다. 거부하면 조선 +3·제안국 -2, 절충하면 양국 +1만 적용한다."
 scramble_for_korea_events.11.t: "고문단 충돌 위기"
 scramble_for_korea_events.11.d: "[SCOPE.sCountry('scramble_actor').GetName]와 [SCOPE.sCountry('scramble_rival').GetName]의 고문단 사이에 충돌이 일어났다. 조선은 중재하거나 한쪽의 철수를 요구할 수 있다."
 scramble_for_korea_events.11.f: "훈련을 돕겠다는 약속이 외교적 대치로 변해 있었다."
 scramble_for_korea_events.11.a: "양측 모두 자제하라."
 scramble_for_korea_events.11.b: "[SCOPE.sCountry('scramble_actor').GetName] 고문단의 철수를 요구한다."
 scramble_for_korea_events.11.cancel: "충돌을 논의할 상황이 사라졌다."
 scramble_for_korea_events.13.t: "경쟁국의 대응"
 scramble_for_korea_events.13.d: "[SCOPE.sCountry('scramble_actor').GetName]의 조선 내 활동에 대응할 차례다. 외교 비용을 부담하여 영향력을 견제하거나, 현 상황을 받아들이거나, 우리 고문단을 철수할 수 있다."
 scramble_for_korea_events.13.f: "한 나라의 전진은 다른 나라의 계산을 바꾸었다."
 scramble_for_korea_events.13.a: "외교적으로 견제하라."
 scramble_for_korea_events.13.b: "이번에는 받아들이겠다."
 scramble_for_korea_events.13.c: "우리 고문단을 철수하라."
 scramble_for_korea_events.13.cancel: "대응의 전제가 사라졌다."
