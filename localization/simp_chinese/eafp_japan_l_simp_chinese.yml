#### 事件 1000号 ####
eafp_japan.1001.t: "查获走私" # 1836年12月23日
eafp_japan.1001.d: "滨田藩因与朝鲜进行走私贸易而被抓获。"
eafp_japan.1001.f: "滨田藩的八右卫门与藩的官员共谋进行走私贸易而被抓获。据说前老中松平康任也牵涉其中。"
eafp_japan.1001.a: "严惩不贷，以儆效尤。"
eafp_japan.1001.b: "考虑到滨田藩的财政状况，赦免并给予警告。"
eafp_japan.1001.c: "这次机会一定要捞一笔。"
eafp_japan.1002.t: "走私贸易被抓获" # 1840年11月
eafp_japan.1002.d: "中冈藩因进行走私贸易而被抓获。"
eafp_japan.1002.f: "新泻的航运批发商小川屋金右卫门未经长崎会所，走私汉药材而被发现。据说新泻町的实力商人也被怀疑。"
eafp_japan.1002.a: "严惩不贷，以儆效尤。"
eafp_japan.1002.b: "考虑到藩的财政状况，赦免并给予警告。"
eafp_japan.1002.c: "这次机会一定要捞一笔。"
eafp_japan.1003.t: "继承问题" # 反复事件
eafp_japan.1003.d: "[SCOPE.sState('scope_state').GetName]的藩内，家臣团之间因争夺继承人之位而发生争执。"
eafp_japan.1003.f: "“如果让只会胡闹的人继承家业，藩肯定会崩溃。还不如让侧室的儿子来追求稳定。”\n\n“应该分清拒绝主君隐居的重臣们是真的为藩着想，还是为了维持自己的权力。”" # 正室所生改革派 vs 侧室所生保守派
eafp_japan.1003.a: "不介入。"
eafp_japan.1003.b: "敦促现任当主隐居。" # 改革派胜
eafp_japan.1003.c: "支持当主的决定。" # 保守派胜
eafp_japan.1004.t: "藩政改革争议" # 반복 이벤트
eafp_japan.1004.d: "[SCOPE.sState('scope_state').GetName]的藩内，围绕藩政，改革派和保守派激烈对立，最终改革派袭击了保守派重臣。"
eafp_japan.1004.f: "\"如果放任那些迷恋西方机械的人，藩的根本将会动摇。\"\n\n\"如果固守旧方式，藩就会灭亡！\"" # 개혁파의 보수파 암살 사건 등
eafp_japan.1004.a: "不介入。"
eafp_japan.1004.b: "严惩袭击者。" # 보수파 승
eafp_japan.1004.c: "念在他们是志士，就放过他们吧。" # 개혁파 승
eafp_japan.1005.t: "查获走私" # 반복 이벤트
eafp_japan.1005.d: "在[SCOPE.sState('scope_state').GetName]的藩内，有人走私被查获。"
eafp_japan.1005.f: "\"到底是怎么想的才会做出这种事？违反幕府的规矩偷偷进行贸易，这不是单纯的失误，而是明目张胆的叛逆行为。这件事也会给其他藩一个警告。\""
eafp_japan.1005.a: "严惩，以儆效尤。"
eafp_japan.1005.b: "考虑到藩的财政状况，赦免并给予警告。"
eafp_japan.1005.c: "这次机会一定要捞一笔。"
smuggling_continues_modifier: "持续走私"
eafp_japan.1006.t: "伪造货币" # 반복 이벤트
eafp_japan.1006.d: "在[SCOPE.sState('scope_state').GetName]的藩内，有人秘密大量制造伪造货币被查获。"
eafp_japan.1006.f: "\"伪造货币是蛊惑百姓的腐败根源。必须严惩。\""
eafp_japan.1006.a: "惩罚所有制造伪造货币的人。"
eafp_japan.1006.b: "仅给予警告。"
eafp_japan.1006.c: "借此机会加强中央政府的控制。"
counterfeiting_continues_modifier: "持续的货币伪造"
eafp_japan.1007.t: "国绘图编写完成" # 1838年
eafp_japan.1007.d: "3年前下令编写的天保国绘图终于完成了。"
eafp_japan.1007.f: "“既然藩的边界和土地都已明确记录，那么在征税方面就不会再有混乱了。”"
eafp_japan.1007.a: "是件好事。"
tenpo_kuniezu_modifier: "天保国绘图"
eafp_japan.1009.t: "弘道馆开设" # 1841年 某时
eafp_japan.1009.d: "水户藩开设了弘道馆，作为面向藩内武士及其子弟的藩立学校。"
eafp_japan.1009.f: "东照宫平定叛乱，匡正时局，尊王攘夷，真可谓文武兼备，开创了太平之基。魏公受封于东土，早年便仰慕倭建命的品格，尊崇神道，修习武备。懿公继承其志，更加崇尚儒教，阐明人伦，正名以作国家之屏障。\n\n自此百余年间，世代继承遗志，蒙受恩惠，直至今日，为臣为子者，岂能不思广布此道，发扬先德？此乃设立此馆之缘由。" # 弘道馆记, 魏公 - 德川赖房, 懿公 - 德川光圀
eafp_japan.1009.a: "应该没问题吧？"
mitogaku_modifier: "水户学"
eafp_japan.1012.t: "善光寺地震"
eafp_japan.1012.d: "善光寺地区发生地震，造成重大损失。"
eafp_japan.1012.f: "晚上10点刚过，发生了大地震。正要急着去登城，还没来得及说出“取出非常服”，灯笼就灭了，在黑暗中摇摇晃晃地走着，摔倒了三次。\n\n站稳脚跟整理好仪容，推开纸拉门，借助星光看向外面，只见周围一片雾气和烟雾。后来才知道，这是南墙倒塌时的尘土。"
eafp_japan.1012.a: "$natural_disaster_events.1.a$"
eafp_japan.1012.b: "$natural_disaster_events.1.b$"
eafp_japan.1014.t: "约翰·万次郎"
eafp_japan.1014.d: "名为约翰·万次郎的人登陆并接受审问。许多人对他的经历很感兴趣。"
eafp_japan.1014.f: "“我乘坐了一艘以前从未见过的船，这里称之为‘蒸汽船’。‘蒸汽船’的船体长度约为 40 间，没有帆，只是在船体中央安装了一个巨大的水箱。它使用从这个水箱中煮沸的蒸汽来转动安装在船体内外的铁轮。它的速度快得无法形容。”"
eafp_japan.1014.a: "真是个奇妙的故事。"
eafp_japan.1015.t: "大规模起义"
eafp_japan.1015.d: "[SCOPE.sState('scope_state').GetName]的藩发生了大规模起义"
eafp_japan.1015.f: "“这次起义似乎是由于税收过高。最好接受农民的要求。”"
eafp_japan.1015.a: "严惩藩的管理人员。"
eafp_japan.1015.b: "镇压起义，但说服藩接受他们的要求。"
# 我國未曾有ノ變革ヲ爲ントシ、朕󠄁躬ヲ以テ衆ニ先ンシ、天地神󠄀明ニ誓ヒ、大ニ斯國是ヲ定メ、萬民保全󠄁ノ道󠄁ヲ立ントス。衆亦此旨趣ニ基キ協心努力セヨ。
eafp_japan.1018.t: "幸仁亲王诞生" # 天皇成为统治者时
eafp_japan.1018.d: "天皇的后宫生下了第二个儿子。"
eafp_japan.1018.f: "出生后立即举行了清秽仪式和产浴仪式。在进行了剪脐带和烧灼伤口的仪式后，用鸭川的水进行了沐浴。脐带被埋葬在六所吉田神社。"
eafp_japan.1018.a: "宣告亲王诞生。"
eafp_japan.1018.tt: "#variable 幸仁亲王#!成为[ROOT.GetCountry.GetAdjective]王位的继承人"
eafp_japan.1019.t: "迪宫诞生" # 天皇成为统治者时
eafp_japan.1019.d: "天皇的侧室生下了一个儿子。"
eafp_japan.1019.f: "对于失去了四个儿子的天皇来说，传来了一个足以减轻忧虑的消息。那就是其中一位侧室生下了一个男孩。由于亲王患有湿疹，因此判断不宜举行出生后的清秽仪式和产浴仪式，故予以保留。"
eafp_japan.1019.a: "宣告亲王诞生。"
eafp_japan.1019.tt: "#variable 迪宫#!成为[ROOT.GetCountry.GetAdjective]王位的继承人"
eafp_japan.1020.t: "睦仁亲王诞生" # 天皇成为统治者时
eafp_japan.1020.d: "天皇的长子诞生了。"
eafp_japan.1020.f: "在赤坂御所，天皇的长子诞生。皇子从负责出生礼仪的人那里获得了“迪宫”的称号，意为“领悟美德之人”。举行了出生后的沐浴仪式和产后仪式。"
eafp_japan.1020.a: "宣告皇子的诞生。"
eafp_japan.1020.tt: "#variable 迪宫#!成为[ROOT.GetCountry.GetAdjective]王位的继承人"
