l_simp_chinese:
 je_eafp_joseon_qing_war: "朝清战争"
 je_eafp_joseon_qing_war_reason: "呜呼，南汉山城之耻，岂可忘乎？奉天被围，箭矢飞入御床，宗庙社稷危在旦夕，国王终至徒步走入胡营，即使勾践之辱，又岂能与之相比？\n\n如今[ROOT.GetCountry.GetName]欲雪当日之耻，然而若战争再使百姓饥寒交迫，那么胜利也将留作一道新的伤痕。"
 je_eafp_joseon_qing_war_status: "当前[concept_war_support]：#variable [SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').GetValue|0+=]#!"
 je_eafp_joseon_qing_war_status_pending: ""
 je_eafp_joseon_qing_war_progress: "胜利时，将根据战争的[concept_war_support]获得不同奖励，具体如下。\n[SelectLocalization(And(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').IsSet,GreaterThanOrEqualTo_CFixedPoint(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').GetValue,'(CFixedPoint)50')),'@green_checkmark_box!','@simple_box!')] #tooltippable;tooltip:[SCOPE.GetRootScope.GetCountry.GetTooltipTag],eafp_jqw_victory_high_reward_tt #p 50或更高#!#!\n[SelectLocalization(And(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').IsSet,And(GreaterThanOrEqualTo_CFixedPoint(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').GetValue,'(CFixedPoint)0'),LessThan_CFixedPoint(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').GetValue,'(CFixedPoint)50'))),'@green_checkmark_box!','@simple_box!')] #tooltippable;tooltip:[SCOPE.GetRootScope.GetCountry.GetTooltipTag],eafp_jqw_victory_medium_reward_tt #v 低于50且不低于0#!#!\n[SelectLocalization(And(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').IsSet,LessThan_CFixedPoint(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').GetValue,'(CFixedPoint)0')),'@green_checkmark_box!','@simple_box!')] #tooltippable;tooltip:[SCOPE.GetRootScope.GetCountry.GetTooltipTag],eafp_jqw_victory_low_reward_tt #n 低于0#!#!"
 eafp_jqw_victory_high_reward_tt: "#header $eafp_joseon_qing_war_events.2.c$#!\n$TOOLTIP_DELIMITER$\n[GetScriptedGui('eafp_jqw_victory_high_reward_sgui').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 eafp_jqw_victory_medium_reward_tt: "#header $eafp_joseon_qing_war_events.2.b$#!\n$TOOLTIP_DELIMITER$\n[GetScriptedGui('eafp_jqw_victory_medium_reward_sgui').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 eafp_jqw_victory_low_reward_tt: "#header $eafp_joseon_qing_war_events.2.a$#!\n$TOOLTIP_DELIMITER$\n[GetScriptedGui('eafp_jqw_victory_low_reward_sgui').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"

 eafp_joseon_qing_war_events.1.t: "鸭绿江彼岸的炮声"
 eafp_joseon_qing_war_events.1.d: "朝鲜与清国之间爆发了全面战争。"
 eafp_joseon_qing_war_events.1.f: "\"朝鲜与清国的战争开始了。歌谣流传开来，唱道中国虽曾有圣贤之教，是孔孟诞生的中华，如今却已成为暴逆无道的蛮国，理当加以惩戒。月琴师傅的家中被人投石，吹奏明笛的青年则被当作卖国贼殴打。剑舞班的女子系上红色肩带与头巾，唱起军舰出征的歌。\""
 # 出处：萩原朔太郎，《日清战争异闻：原田重吉之梦》上篇。
 eafp_joseon_qing_war_events.1.a: "天下秩序正在动摇。"

 eafp_joseon_qing_war_events.2.t: "战后的国体"
 eafp_joseon_qing_war_events.2.d3: "在对[SCOPE.sCountry('qing_enemy').GetName]取得前所未有的大胜并赢得完全自主独立后，[SCOPE.sCountry('joseon_scope').GetName]向天下宣告其作为堂堂主权国家的地位。"
 eafp_joseon_qing_war_events.2.d2: "在与[SCOPE.sCountry('qing_enemy').GetName]的战乱结束后，[SCOPE.sCountry('joseon_scope').GetName]摆脱了长久以来事大关系的桎梏，实现了自主独立，但为胜利付出的代价并不小。"
 eafp_joseon_qing_war_events.2.d1: "[SCOPE.sCountry('joseon_scope').GetName]最终挣脱了对[SCOPE.sCountry('qing_enemy').GetName]事大关系的桎梏，赢得了自主独立，却也在这一过程中遭受了惨重创伤。"
 eafp_joseon_qing_war_events.2.f3: "清国的要塞陷落，其舰队覆灭；北方的朝鲜大军如潮水般推进，辽河以东不见敌军一骑。不久，议和使者到来，缔结和平条约的消息传遍各地。朝鲜军凯旋后，战争仿佛大鹏收拢双翼一般戛然而止。"
 # 出处：德富芦花（徳冨蘆花），《不如归（不如帰）》下篇第七章第一节。
 eafp_joseon_qing_war_events.2.f2: "九月将尽时，黄海的捷报传来；又过数日，她在负伤者中找到了丈夫的姓名。她彻夜未眠。幸而她得知丈夫伤势并不严重，现正在医院。生死之忧虽稍得宽慰，可一想到远方的丈夫和种种想为他做的事，无法如愿的身世之恨便再次堵住了她的胸口。"
 # 出处：德富芦花（徳冨蘆花），《不如归（不如帰）》中篇第四章第二节，青空文库。https://www.aozora.gr.jp/cards/000280/files/1706_44742.html
 eafp_joseon_qing_war_events.2.f1: "\"我只顾着患病和负伤的士兵，根本没有余暇想到那些事情。那里毫无准备，救治也无法周全，我们忙得不可开交。我们连五分钟的休息都没有，夜里也不曾合眼。可是器具和药品都不齐全，许多人因得不到妥善护理而被眼睁睁看着死去，哪里还顾得上探查敌情？\""
 # 出处：泉镜花（泉鏡花），《海城发电（海城発電）》第三节。
 eafp_joseon_qing_war_events.2.c: "向举国上下宣告这场大捷。"
 eafp_joseon_qing_war_events.2.b: "莫要忘记胜利的代价。"
 eafp_joseon_qing_war_events.2.a: "先收拾胜战留下的创伤。"

 eafp_joseon_qing_war_events.3.t: "社稷蒙羞"
 eafp_joseon_qing_war_events.3.d: "[SCOPE.sCountry('joseon_scope').GetName]未能挣脱对[SCOPE.sCountry('qing_enemy').GetName]事大关系的桎梏，只得背负战败的耻辱与惨重创伤。"
 eafp_joseon_qing_war_events.3.f: "我这么年轻，竟被赶到这种地方打仗，像狗一样毫无缘由地死去。首先，我恨那个砍伤我的清兵。其次，我恨派我们出去侦察的长官。最后，我恨发动这场战争的朝鲜和清国。"
 # 出处：芥川龙之介（芥川龍之介），《掉下脑袋的故事（首が落ちた話）》上篇。
 eafp_joseon_qing_war_events.3.a: "这份耻辱将长久留存。"

 eafp_modifier_joseon_qing_war_great_victory: "朝清战争：大捷"
 eafp_modifier_joseon_qing_war_costly_victory: "朝清战争：代价高昂的胜利"
 eafp_modifier_joseon_qing_war_pyrrhic_victory: "朝清战争：惨胜"
 eafp_modifier_joseon_qing_war_defeat: "朝清战争：败北"
