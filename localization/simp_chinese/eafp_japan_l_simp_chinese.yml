eafp_japan.4.t: "提拔老中首座"
eafp_japan.4.d: "围绕这次老中首座的任命，幕府内的派系正在竞争，以提高各自的利益和影响力。"
eafp_japan.4.f: "围绕老中首座的任命，各派系为了各自的利益，在暗地里展开激烈的竞争。在这种冲突中，将军的选择将对幕府的未来走向产生重大影响。"
