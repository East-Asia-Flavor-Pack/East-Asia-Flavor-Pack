eafp_japan.2010.d: "将军为商议重要的国事而上京拜谒天皇。"
eafp_japan.2010.f: "将军从二条城出发，在华丽的行列中前往天皇所在的京都御所。负责警卫的武士们表情紧张地环顾四周。每当行列经过京都狭窄的街道时，商人们都会关上店门，路边的所有市民都跪下低头。"
