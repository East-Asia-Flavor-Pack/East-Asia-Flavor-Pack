 je_eafp_mgl_restoration_of_the_state: "Restoration of the State"
 je_eafp_mgl_restoration_of_the_state_reason: "While a Qing-appointed general governs temporal affairs, the Jebtsundamba Khutuktu remains Mongolia's spiritual leader. Upon full independence and the proclamation of the [concept_eafp_mgl_restoration|l], the incumbent Jebtsundamba will ascend as Bogd Khan and lead the state."
 je_eafp_mgl_unite_the_mongols: "Unite the Mongols"
 je_eafp_mgl_unite_the_mongols_reason: "Inheriting the historic legacy of the [concept_eafp_mgl_golden_lineage|l], we must unite Inner Mongolia, Barga, Buryatia, Oirat, and Tuva into a single All-Mongol state."
 je_eafp_mgl_echoes_of_chinggis: "Echoes of Chinggis"
 je_eafp_mgl_echoes_of_chinggis_reason: "Convening a Great Kurultai on the Onon River, we present Chinggis Khan's memory as a shared diplomatic language and ratify a peaceful covenant of steppe nations under a common [concept_eafp_mgl_steppe_charter|l]."
 eafp_mgl_united_gdp_growth_goal_tt: "The [Concept('concept_gdp', '$concept_gdp_short$')] of the [concept_eafp_mgl_united_industrial_area|l] is at least #v 1.5 times#! its value when the Journal Entry began: @gdp!#variable [GetPlayer.MakeScope.Var('eafp_mgl_united_gdp_goal').GetValue|K]#! (Current: @gdp!#variable [GetPlayer.MakeScope.ScriptValue('eafp_mgl_united_gdp')|K]#!)"
 eafp_mgl_united_raw_reserves_goal_tt: "The participating industrial area has Coal Mines, Iron Mines, or Logging Camps, and at least #v 75%#! of these buildings have cash reserves above #v 25%#!"
 eafp_mgl_united_industry_reserves_goal_tt: "The participating industrial area has Tooling Workshops, Power Plants, Food Industries, or Textile Mills, and at least #v 75%#! of these buildings have cash reserves above #v 25%#!"
 je_eafp_mgl_develop_the_united_mongol_lands: "The United Mongol Industrial Area"
 je_eafp_mgl_develop_the_united_mongol_lands_reason: "Connect resource surveys, transport, processing industries, and vocational training across the [concept_eafp_mgl_united_industrial_area|l] to build a self-sustaining industrial foundation. Grow regional GDP and maintain healthy cash reserves in resource and industrial buildings."
 eafp_mgl_secular_clerks: "Secular Clerks"
 eafp_mgl_secular_clerks_desc: "A secular clerical corps supports administration and public schooling while weakening monastic influence."
 eafp_mgl_frontier_commission: "Frontier Commission"
 eafp_mgl_frontier_commission_desc: "A permanent commission coordinates frontier obligations and lends authority to the restored state."
 eafp_mgl_diplomatic_secretariat: "Diplomatic Secretariat"
 eafp_mgl_diplomatic_secretariat_desc: "Trained interpreters and envoys make Mongolia's diplomacy more effective."
 eafp_mgl_national_volunteers: "National Volunteers"
 eafp_mgl_national_volunteers_desc: "Volunteer formations strengthen military confidence and the prestige of the restored state."
 eafp_mgl_popular_mandate: "Popular Mandate"
 eafp_mgl_popular_mandate_desc: "Petitions from ordinary Mongols broaden the government's mandate and reduce social division."
 eafp_mgl_debt_inspection: "Debt Ledger Inspection"
 eafp_mgl_debt_inspection_desc: "A temporary effect reflecting the chosen policy's impact on the state and industrial base."
 eafp_mgl_russian_trade_credit: "Russian Trade Credit"
 eafp_mgl_russian_trade_credit_desc: "Commercial credit from Russian trading houses and banks lowers procurement costs and stimulates goods flow."
 eafp_mgl_translation_school: "Translation School"
 eafp_mgl_translation_school_desc: "A temporary effect reflecting the chosen policy's impact on the state and industrial base."
 eafp_mgl_independence_crisis: "Independence Fiscal Crisis"
 eafp_mgl_independence_crisis_desc: "Trade blockage with China and debt settlement crises after independence have depleted the treasury."
 eafp_mgl_russian_military_mission: "Russian Military Mission"
 eafp_mgl_russian_military_mission_desc: "Russian instructors and drill manuals reform Mongolian army structure, cavalry tactics, and marksmanship."
 eafp_mgl_steppe_federal_charter: "Steppe Federal Charter"
 eafp_mgl_steppe_federal_charter_desc: "The Steppe Federal Charter guarantees religion, customary law, and local representation equally across members."
 eafp_mgl_steppe_imperial_charter: "Greater Mongol Restoration Charter"
 eafp_mgl_steppe_imperial_charter_desc: "A powerful mobilization charter restores Great Mongol imperial glory beneath the Golden Lineage and Bogd Khan."
 eafp_mgl_steppe_patron_charter: "Northern Patron Charter"
 eafp_mgl_steppe_patron_charter_desc: "The patron charter secures diplomatic protection and financial loans from a northern great power."
 eafp_mgl_industrial_roads: "Industrial Roads"
 eafp_mgl_industrial_roads_desc: "Upgraded wagon and motor roads connecting Urga, mines, and postal stations reduce transport costs."
 eafp_mgl_resource_survey: "Resource Survey"
 eafp_mgl_resource_survey_desc: "Geologists and mining engineers survey national mineral deposits, cataloging coal, iron, and gold."
 eafp_mgl_artisan_procurement: "Artisan Procurement"
 eafp_mgl_artisan_procurement_desc: "Traditional leather and wool artisans are organized into central procurement, expanding hide and textile output."
 eafp_mgl_foreign_technical_dependency: "Foreign Technical Dependency"
 eafp_mgl_foreign_technical_dependency_desc: "Reliance on foreign engineers and capital keeps mines running but strains sovereignty and profit-sharing."
 eafp_mgl_cooperative_procurement: "Cooperative Procurement"
 eafp_mgl_cooperative_procurement_desc: "The Mutual Aid Cooperative system collects and processes pastoral raw materials at fair market prices."
 eafp_mgl_vocational_training: "Vocational Training"
 eafp_mgl_vocational_training_desc: "Secular vocational institutes train workers in modern machinery operation, sanitation, and mining skills."
 eafp_mgl_industrial_hygiene: "Industrial Hygiene"
 eafp_mgl_industrial_hygiene_desc: "The Songino Veterinary Station and disease quarantine control rinderpest, raising wool and leather quality."
 eafp_mgl_mongolor_concession: "Mongolor Concession"
 eafp_mgl_mongolor_concession_desc: "The Mongolor gold mining concession introduces foreign tech while yielding mineral rights to foreign firms."
 eafp_mgl_nalaikh_fuel_program: "Nalaikh Fuel Program"
 eafp_mgl_nalaikh_fuel_program_desc: "Nationalization and expansion of Nalaikh coal pits supply fuel to Urga's power plants and factories."
 eafp_mgl_mining_regulations: "Mining Regulations"
 eafp_mgl_mining_regulations_desc: "The 1923 Mining Regulations curb unauthorized foreign extraction and secure state royalties."
 eafp_mgl_mining_bureau: "Mining Bureau"
 eafp_mgl_mining_bureau_desc: "A modest inspectorate improves mine safety, productivity, and access to markets without operating the pits."
 eafp_mgl_fiscal_cadastre: "Fiscal Cadastre"
 eafp_mgl_fiscal_cadastre_desc: "A national register improves taxable capacity and curbs leakage while challenging princely exemptions."
 eafp_mgl_tugrik_industrial_credit: "Tögrög Industrial Credit"
 eafp_mgl_tugrik_industrial_credit_desc: "The Mongol-Russian Bank and Tögrög currency reform supply central credit for domestic industry."
 eafp_mgl_mongoltrans: "Mongoltrans"
 eafp_mgl_mongoltrans_desc: "Mongoltrans state transport trust operates motor trucks and heavy wagons, modernizing steppe logistics."
 eafp_mgl_public_works_office: "Public Works Office"
 eafp_mgl_public_works_office_desc: "A public works office accelerates construction and road building while raising material costs."
 eafp_mgl_workshop_registry: "Workshop Registry"
 eafp_mgl_workshop_registry_desc: "Registered workshops are easier to expand and organize their labor more efficiently."
 eafp_mgl_emergency_supply_board: "Emergency Supply Board"
 eafp_mgl_emergency_supply_board_desc: "Coordinated food distribution steadies industrial towns and attracts workers during shortages."
 eafp_mgl_state_industrial_board: "State Industrial Board"
 eafp_mgl_state_industrial_board_desc: "A state industrial board coordinates construction and manufacturing at the cost of political flexibility."
 eafp_mgl_industrial_takeoff: "Industrial Takeoff"
 eafp_mgl_industrial_takeoff_desc: "Integrated coal, iron, electrical power, toolmaking, and light industry trigger an economic takeoff."
 eafp_mgl_livestock_and_factory_crisis: "Livestock and Factory Crisis"
 eafp_mgl_livestock_and_factory_crisis_desc: "Mass slaughter of herds, flight of nomadic pastoralists, and factory raw material shortages paralyze output."
 eafp_mgl_united_industrial_market: "United Industrial Market"
 eafp_mgl_united_industrial_market_desc: "A unified regional industrial market operates across all united Mongol territories with common standards."
 eafp_mgl_autonomy_resistance: "Autonomy Resistance"
 eafp_mgl_autonomy_resistance_desc: "Armed militias and underground resistance networks stand ready to defend national self-governance."
 eafp_mgl.100.t: "The Secret Council at Ikh Khüree"
 eafp_mgl.100.d: "In the summer of 1911, defying Qing oppression, leading princes of the four Khalkha aimags and eminent Buddhist dignitaries gathered in absolute secrecy amidst the dense forests of the Bogd Khan Mountain outside Ikh Khüree. Visionaries such as Namnansüren, Khanddorj, and Tserenchimed are deliberating a historic uprising to sever imperial vassalage and restore sovereign statehood to Mongolia."
 eafp_mgl.100.f: "\"Around a crackling fire in the pine forests, the destiny of the steppes was weighed. The time has come to end two centuries of submission and raise the banner of our own Khanate once more!\"\n\n— Records of the 1911 Ikh Khüree conclave"
 eafp_mgl.100.a: "The time has come to declare Mongolia's sovereignty!"
 eafp_mgl.100.b: "It is not yet time. Let us bide our time in secret."
 eafp_mgl.103.t: "The Enthronement of the Bogd"
 eafp_mgl.103.d: "The Jebtsundamba Khutuktu, [SCOPE.sCharacter('eafp_mgl_bogd_ruler').GetFullName], has been enthroned as Bogd Khan of independent Mongolia. The religious seat now carries the responsibility of governing the country."
 eafp_mgl.103.f: "Princes and lamas bowed in turn before the temple. Chanted prayers rose through the incense as standard-bearers outside raised the flags of the new state. From this day, the occupant of the sacred seat was also the sovereign of Mongolia."
 eafp_mgl.103.a: "We shall be a sacred Buddhist state serving the Bogd Khan."
 eafp_mgl.210.t: "Arms and Instructors"
 eafp_mgl.210.d: "To modernize the fledgling armed forces of the Bogd Khanate, the Russian Empire has delivered shipments of Mosin-Nagant rifles, Maxim machine guns, and artillery, accompanied by seasoned military instructors. At the Khujirbulan military encampment outside Urga, thousands of nomadic cavalrymen are being drilled in modern tactics, marksmanship, and combined arms to forge a disciplined national army."
 eafp_mgl.210.f: "\"The age of the composite bow has passed. In the hands of our steppe riders now rests the thunder of rifled steel, ready to defend our holy borders against all foes.\"\n\n— A Mongolian officer at Khujirbulan"
 eafp_mgl.210.a: "Actively accept Russian weapons and instructors."
 eafp_mgl.210.b: "We must foster our own independent military capability."
 eafp_mgl.211.t: "Loans and Commercial Rights"
 eafp_mgl.211.d: "Crippled by empty coffers and the abrupt withdrawal of Qing merchants, the Bogd Khanate has opened urgent loan negotiations with the Siberian Commercial Bank and the Russian government. In exchange for the vital bullion, Saint Petersburg demands sweeping economic concessions: duty-free transit across all banners, telegraph concessions, and priority mining rights, tightening its economic grip over the steppe."
 eafp_mgl.211.f: "\"For every bag of silver coin that enters our vaults, another Russian boundary stake is driven deep into our pastures. Is this the bitter price of our survival?\"\n\n— Contemplation of a treasury clerk"
 eafp_mgl.211.a: "Secure loans even if it means conceding commercial rights."
 eafp_mgl.211.b: "Economic subjugation leads to political subjugation. Refuse."
 eafp_mgl.212.t: "Russian Mediation"
 eafp_mgl.212.d: "As the newly formed Republic of China threatens military reconquest to suppress Mongolia's independence, the Russian Empire has stepped in as an assertive arbiter. Seeking to prevent an all-out border war, Saint Petersburg is pressing Urga to accept a compromise: recognizing nominal Chinese suzerainty while preserving Outer Mongolia's broad internal autonomy and Russian commercial hegemony."
 eafp_mgl.212.f: "\"The Russian envoy demands that we slice our sovereignty in half. How can a nation be half-free? Yet without the northern shield, who shall turn back the armies gathering in the south?\"\n\n— Foreign Minister Prince Khanddorj"
 eafp_mgl.212.a: "Accept Russia's diplomatic mediation."
 eafp_mgl.212.b: "We will go directly to the negotiating table ourselves."
 eafp_mgl.213.t: "An Independent Course"
 eafp_mgl.213.d: "Refusing to bow before foreign ultimatums and humiliating diplomatic compromises, the Bogd Khanate has defiantly resolved to chart an 'Independent Course'. Relying on its own grit rather than imperial protectors, the government has mobilized all banners to reinforce frontier outposts, accepting the severe risks of complete diplomatic isolation and economic embargo."
 eafp_mgl.213.f: "\"Our sovereignty is not a bargaining chip to be bartered across foreign tea tables! Freedom bought on borrowed goodwill is a house built upon shifting sands; let us stand on our own boots!\"\n\n— Da Lama Tserenchimed"
 eafp_mgl.213.a: "We decide our own path. We will walk alone."
 eafp_mgl.213.b: "We cannot maintain the state without foreign support..."
 eafp_mgl.300.t: "The Bogd's Edict to the Four Directions"
 eafp_mgl.300.d: "Following the declaration of independence in Urga, the Bogd Khan issued imperial edicts to all Mongolian-speaking banners across the four corners of Inner Asia: the 49 banners of Inner Mongolia, Barga in Hulunbuir, the Buryats under Russian rule, the Oirats of Xinjiang, and Tannu Tuva. Invoking the common bloodline of Chinggis Khan and the bonds of the Buddhist faith, the proclamation summons all Mongols to unite under one sovereign crown."
 eafp_mgl.300.f: "\"Sons of the same blue wolf are separated by sands and borders, weeping under foreign yokes. Gather beneath the holy banner of the Bogd, and let the ancestral empire rise again!\"\n\n— The Bogd Khan's Call to all Mongols"
 eafp_mgl.300.a: "All Mongols are brothers"
 eafp_mgl.305.t: "Diverging Roads"
 eafp_mgl.305.d: "Squeezed between Russian supply blockades, gathering Chinese counteroffensives, and great power diplomacy, the pan-Mongolian unification campaign has reached a tragic crossroads. We must make a fateful choice: withdraw forces north of the Gobi to consolidate the hard-won sovereignty of the Khalkha heartland, or risk national annihilation to fight for the complete unification of all Mongols."
 eafp_mgl.305.f: "\"The heavy sighs of warriors forced to turn their steeds northward echo across the endless plains. Though severed by foreign lines today, the dream of a united homeland will burn forever.\"\n\n— Chronicle of the Great Retreat"
 eafp_mgl.305.a: "We will never give up the dream of Greater Mongolia."
 eafp_mgl.305.b: "Let us be content with firmly holding the Khalkha region."
 eafp_mgl.400.t: "Banners on the Onon"
 eafp_mgl.400.d: "Upon the sacred banks of the Onon River, where Temüjin was born and first proclaimed the Great Mongol Empire, tribal chiefs, khans, and envoys from across Inner Asia have assembled. In this epochal 'Grand Kurultai'—attended by Khalkhas, Oirats, Buryats, Tuvans, and even delegates of the western Kazakh and Kyrgyz steppes—the heirs of Chinggis Khan debate the resurrection of a vast confederation of the steppes."
 eafp_mgl.400.f: "\"Above the rushing blue currents of the Onon, the Nine White Banners rise once again! The seven-century-old oaths rekindle the heart of the steppe, gathering all riders under one sky!\"\n\n— Opening Proclamation of the Onon Kurultai"
 eafp_mgl.400.a: "Summon the Great Kurultai on the banks of the Onon River!"
 eafp_mgl.407.t: "Adoption and Ratification of the Steppe Charter"
 eafp_mgl.407.d: "Representatives of the countries that joined the Steppe League have gathered to adopt and ratify its charter. By pledging cooperation while respecting each member's autonomy and customs, they have made their solidarity a shared commitment."
 eafp_mgl.407.f: "\"This Charter is inscribed not merely in ink upon parchment, but sealed in the eternal oaths of the sons and daughters of the steppe. The sun of the Great Khan rises anew!\"\n\n— Proclamation of the Steppe Charter"
 eafp_mgl.407.a: "Adopt and ratify the Steppe Charter."
 eafp_mgl.408.t: "An Invitation to the Steppe League"
 eafp_mgl.408.d: "An invitation has arrived from Mongolia to join the Steppe League. We must decide whether to send representatives and participate in mutual defense and cooperation, or decline and follow our own path."
 eafp_mgl.408.f: "\"As seals were stamped and banners exchanged, every man in the assembly embraced in joyous tears. We have found our long-lost brothers once more beneath the sky!\"\n\n— Chronicle of the Ratification Ceremony"
 eafp_mgl.408.a: "Join the vision of the steppe federation and send representatives."
 eafp_mgl.408.b: "We have enough to handle on our own."
 eafp_mgl.409.t: "An Empire on Horseback or a Federation by Covenant?"
 eafp_mgl.409.d: "With the solid establishment of the Steppe Confederation, a profound civilizational question confronts its leadership. Shall this great union evolve into a centralized, expansionist empire echoing the conquests of Chinggis Khan, or blossom into an egalitarian, progressive federation of sovereign steppe nations? The future of Asia hangs upon our choice."
 eafp_mgl.409.f: "\"Lands conquered by the sword are lost by the sword, but a union bound by mutual honor and sacred law endures as eternal stone. What legacy shall we leave for our children?\"\n\n— Closing address of the Kurultai"
 eafp_mgl.409.a: "The glory of the Golden Lineage shall command Asia once again!"
 eafp_mgl.409.b: "It will be a loose federation respecting the autonomy of each tribe."
 eafp_mgl.500.t: "Roads to the Factories"
 eafp_mgl.500.d: "Mongolia's ambition for modern industrial takeoff is bottlenecked by the primitive state of its transport network. Relying on slow camel caravans and oxcarts across hundreds of kilometers of unpaved Gobi trails is no longer viable. We must engineer reliable roads, reinforce bridges, and upgrade logistics routes between vital mining sites, urban hubs, and regional markets to transport heavy machinery and raw materials."
 eafp_mgl.500.f: "\"It takes weeks for bricks and iron strapped to camel backs to reach Urga. Unless we pave proper roads and bridge the rivers, the chimneys of our factories will remain cold and dark.\"\n\n— Report of a Public Works surveyor"
 eafp_mgl.500.a: "Dissolve the handicraft guilds and convert to modern factories."
 eafp_mgl.500.b: "We must not threaten the livelihoods of the artisans."
 eafp_mgl.500.c: "Cooperate with the guilds for gradual industrialization."
 eafp_mgl.501.t: "Surveyors of Coal and Iron"
 eafp_mgl.501.d: "To secure the foundational fuel and metallurgy required for national industrialization, extensive geological surveying expeditions have been deployed across the northern mountain valleys. Prospecting the coal beds of Nalaikh and iron ore deposits in the central provinces, geologists and engineers are mapping the mineral wealth of the homeland to establish modern, state-backed extraction facilities."
 eafp_mgl.501.f: "\"The black gold and red iron sleeping within the bosom of our ancient earth are brought to light at last. These riches will become the beating heart of Mongolia's modern engines.\"\n\n— Journal of the Chief Geologist"
 eafp_mgl.501.a: "Attract foreign capital to develop mines on a large scale."
 eafp_mgl.501.b: "The resources are ours. We will dig them out ourselves."
 eafp_mgl.502.t: "Workshops of Urga"
 eafp_mgl.502.d: "Traditional blacksmiths, leather tanners, saddlers, and felt artisans scattered across the alleys of Urga are being reorganized into structured cooperative workshops. By moving beyond primitive cottage labor to introduce division of labor, standardized tools, and basic mechanical equipment, these workshops are rapidly expanding the domestic production of uniforms, saddles, boots, and consumer goods."
 eafp_mgl.502.f: "\"The rhythmic clatter of looms and the ringing anvils awaken the dawn in Urga. United in common purpose, our craftsmen's calloused hands are weaving the wealth of a modern nation.\"\n\n— Head of the Urga Artisans' Guild"
 eafp_mgl.502.a: "The state controls the rights of the Nalaikh mine."
 eafp_mgl.502.b: "Guarantee the autonomy of foreign mining companies."
 eafp_mgl.502.c: "Improving the rights and treatment of mine workers is a priority."
 eafp_mgl.503.t: "The Industrial Procurement Ledger"
 eafp_mgl.503.d: "To balance the vast capital expenditures and material procurement necessary for mines and factories, the Ministry of Finance has drafted comprehensive state procurement ledgers. Mobilizing domestic merchant capital and foreign credits to purchase timber, cement, bricks, and imported machinery, we must ensure that vital development projects proceed without financial collapse."
 eafp_mgl.503.f: "\"Not a single silver coin or beam of timber must be squandered into the sand. These meticulous ledgers are the silent stones upon which our factories shall rise.\"\n\n— Chief Treasury Accountant"
 eafp_mgl.503.a: "Gather livestock nationwide to build a large-scale leather factory."
 eafp_mgl.503.b: "We must protect traditional leather processing methods."
 eafp_mgl.503.c: "Raise industrial capital through the export of leather and meat."
 eafp_mgl.504.t: "Food for Mines and Towns"
 eafp_mgl.504.d: "As nomadic laborers flock to burgeoning mining settlements and industrial workshops, feeding the urban and industrial workforce has become an acute logistical challenge. To avert food shortages and strikes, the government must organize regular meat and dairy supply contracts with nearby pastoral banners while maintaining strategic grain reserves."
 eafp_mgl.504.f: "\"A starving miner cannot swing his pickaxe, nor can a hungry weaver tend the looms. Only when the meat and flour of our pastures flow steadily will the fires of industry burn bright.\"\n\n— Supply Commissioner's Report"
 eafp_mgl.504.a: "Force nomads to settle and farm."
 eafp_mgl.504.b: "The nomadic life is Mongolia's identity. We cannot force them."
 eafp_mgl.504.c: "Increase food imports to supply the cities."
 eafp_mgl.505.t: "The Mutual Aid Cooperative"
 eafp_mgl.505.d: "Founded in 1921 to break the stranglehold of foreign merchant monopolies and protect common nomads, the 'People's Mutual Aid Cooperative' (Ardyn Khariltsan Tuslaltsakh Khorsho) has expanded rapidly. By purchasing wool, hides, and livestock at guaranteed fair prices and distributing consumer necessities, tools, and tea, the cooperative forms the democratic backbone of domestic trade."
 eafp_mgl.505.f: "\"No longer shall our sheep be seized by predatory usurers. Under the banner of the Cooperative, we produce with our own hands and share the fruits in fairness!\"\n\n— Cheers at the Cooperative Inauguration"
 eafp_mgl.505.a: "Seize control of the distribution network through the People's Mutual Aid Cooperative."
 eafp_mgl.505.b: "Leave the commercial rights of Chinese and Russian merchants intact."
 eafp_mgl.505.c: "The state directly exercises trade monopoly rights."
 eafp_mgl.506.t: "The First Secular Vocational School"
 eafp_mgl.506.d: "To cultivate the technical specialists essential for modern nation-building, the state has established Mongolia's first secular primary schools and vocational training institutes. Enrolling nomadic youths to study mechanical engineering, cartography, bookkeeping, veterinary science, and modern literacy, these schools are raising a home-grown cadre of engineers and managers to run future industries."
 eafp_mgl.506.f: "\"Boys who held horse whips yesterday now grasp wrenches, compasses, and drafting pens. Their thirst for knowledge will become the beacon illuminating the future of the steppe.\"\n\n— Address of the Technical Institute Director"
 eafp_mgl.506.a: "Build Western-style technical schools widely to train engineers."
 eafp_mgl.506.b: "Control the pace of education reform, mindful of the monasteries' backlash."
 eafp_mgl.506.c: "Select only a few talents and send them abroad to study."
 eafp_mgl.507.t: "Songino Veterinary Station and Industrial Hygiene"
 eafp_mgl.507.d: "In 1923, the 'Songino Central Biological and Veterinary Laboratory' was founded to combat devastating outbreaks of anthrax, rinderpest, and foot-and-mouth disease. Establishing a national quarantine network and producing homegrown serums, Songino has drastically lowered livestock mortality, securing the hygienic supply of wool and hides for domestic processing industries."
 eafp_mgl.507.f: "\"A single vial of vaccine synthesized under the microscope has saved tens of thousands of sheep. The power of modern science shields the herds and turns the leather tanneries' wheels.\"\n\n— Report from the Songino Institute"
 eafp_mgl.507.a: "Mandate a nationwide livestock quarantine system."
 eafp_mgl.507.b: "Respect the will of nomads who distrust new veterinary medicine."
 eafp_mgl.507.c: "Promote Songino's achievements to induce voluntary participation."
 eafp_mgl.508.t: "The Mongolor Concession"
 eafp_mgl.508.d: "The government has opened contentious renegotiations over the sweeping 'Mongolor' gold mining concessions in the Yero and Selenge river basins, long dominated by Russian financiers. Seeking to halt the outflow of precious bullion, expand state royalties, and eliminate the brutal exploitation of local workers, Urga must assert sovereign regulation over the foreign concession."
 eafp_mgl.508.f: "\"The gold extracted from the soils of our homeland must not vanish into the vaults of foreign bankers. The mineral wealth of Mongolia belongs by right to the prosperity of our own people!\"\n\n— Mining Commissioner's Resolution"
 eafp_mgl.508.a: "The state reclaims shares in the Mongolor Gold Mining Company."
 eafp_mgl.508.b: "Recognize foreign capital's gold mining rights and only collect taxes."
 eafp_mgl.508.c: "Significantly raise the wages of workers in the gold mines."
 eafp_mgl.509.t: "Nalaikh and Industrial Fuel"
 eafp_mgl.509.d: "The large-scale modernization of the Nalaikh coalfield, located 35 miles southeast of Urga, has gathered unstoppable momentum. Upgrading underground shafts and installing steam-powered hoists, Nalaikh's coal output is directly fueling Urga's first thermal power stations, brick kilns, and metal foundries, injecting continuous energy into the nation's industrial core."
 eafp_mgl.509.f: "\"The black coal of Nalaikh lights the electric bulbs of the capital and spins the turbines of our mills. Behold the bright dawn of modern industry upon the steppes!\"\n\n— Nalaikh Mine Administrator"
 eafp_mgl.509.a: "Construct a large-scale thermal power plant in Ulaanbaatar."
 eafp_mgl.509.b: "The construction cost is too immense. Cancel the plan."
 eafp_mgl.509.c: "Introduce small generators to prioritize factory operations."
 eafp_mgl.510.t: "Mining and Factory Regulations"
 eafp_mgl.510.d: "In 1923, to eliminate chaotic wildcat extraction and ensure industrial safety across burgeoning facilities, the government promulgated the 'National Mining and Factory Regulations'. Codifying maximum working hours, wage standards, mandatory safety gear, and environmental conservation, these laws lay a humane foundation for sustainable industrial growth."
 eafp_mgl.510.f: "\"An industrialization built upon the broken bodies of its workers is no blessing, but a curse. When the law guards the factory floor, the smoke of our stacks ascends with dignity.\"\n\n— Labor Inspector"
 eafp_mgl.510.a: "Enact strict labor regulations and mining laws."
 eafp_mgl.510.b: "Minimize regulations for the convenience of capitalists."
 eafp_mgl.510.c: "Allow the formation of labor unions and guarantee bargaining rights."
 eafp_mgl.511.t: "The Mongol-Russian Bank and the Tögrög"
 eafp_mgl.511.d: "In 1924, the joint Mongol-Russian Commercial Bank was founded, followed in 1925 by the momentous issuance of Mongolia's sovereign national currency—the 'Tögrög'. Sweeping away the chaotic circulation of foreign silver dollars, Mexican pesos, and barter tea bricks, the silver-backed Tögrög secured monetary independence and provided stable credit for industrial ventures."
 eafp_mgl.511.f: "\"Silver coins stamped with the sacred Soyombo emblem gleam in the hands of our people. To buy and sell the products of our own mills with our own currency is the truest proof of economic freedom!\"\n\n— Governor of the Mongolbank"
 eafp_mgl.511.a: "Establish the State Bank of Mongolia and issue our own currency, the Tögrög!"
 eafp_mgl.511.b: "Maintain the existing circulation of silver and Mexican dollars."
 eafp_mgl.511.c: "Adopt the Russian Ruble as Mongolia's official currency."
 eafp_mgl.512.t: "Mongoltrans and Industrial Transport"
 eafp_mgl.512.d: "Founded in 1925, the state transport enterprise 'Mongoltrans' has introduced fleets of heavy motor trucks, revolutionizing logistics across the vast expanses of the steppe. Rapidly hauling coal from mines and fabrics from factories, Mongoltrans has slashed transit times between the Siberian border and the capital from months of camel trekking to a matter of days."
 eafp_mgl.512.f: "\"The roaring engine of the 'iron horse' echoes across the plains in clouds of dust! Where the gentle chimes of camel bells once lingered, the unrelenting speed of the modern age now thunders.\"\n\n— A Mongoltrans truck driver"
 eafp_mgl.512.a: "Nationalize Mongoltrans and let the state control the logistics network."
 eafp_mgl.512.b: "Tolerate the transport monopoly of foreign merchants for now."
 eafp_mgl.512.c: "Invest first in infrastructure expansion, such as paving roads and building bridges."
 eafp_mgl.513.t: "From Artisan to Factory Worker"
 eafp_mgl.513.d: "Tens of thousands of pastoral nomads and independent artisans are undergoing a profound social transformation into disciplined wage laborers in mechanized factories. Migrating to urban centers to master modern machinery and assembly techniques, they form the first generation of an industrial working class, altering the social fabric of the steppe forever."
 eafp_mgl.513.f: "\"We have folded our felt yurts to don the overalls of the machine shop. With hands that shape steel and tend spinning jennies, we are forging an unbreakable future for Mongolia!\"\n\n— Resolution of an Urga Machinist"
 eafp_mgl.513.a: "Incorporate artisans massively into factories to create a proletariat class."
 eafp_mgl.513.b: "Attract nomads from rural areas and steppes to become urban workers."
 eafp_mgl.513.c: "Import skilled workers from abroad."
 eafp_mgl.514.t: "The Choibalsan Industrial Combine"
 eafp_mgl.514.d: "In 1934, Mongolia's crowning industrial achievement—the 'Choibalsan Industrial Combine'—was officially inaugurated on the banks of the Tuul River. Integrating large-scale wool-scouring mills, leather tanneries, shoe factories, textile spinning plants, and an on-site power station into an organic complex, the Combine marks the total self-sufficiency of the national light industry."
 eafp_mgl.514.f: "\"The smoke rising from the colossal stacks along the Tuul River is a triumphant monument forged by a nation of nomads. Mongolia's self-reliant industry stands unconquerable!\"\n\n— 1934 Inauguration Address of the Combine"
 eafp_mgl.514.a: "Construct a massive industrial combinat in the Choibalsan area!"
 eafp_mgl.514.b: "Such a mega-project is beyond our means."
 eafp_mgl.519.t: "A New Industrial State"
 eafp_mgl.519.d: "Having weathered internal crises and successfully executed modernization, Mongolia stands triumphant as a 'New Industrial State'. Synthesizing resource extraction, power generation, transport logistics, and light manufacturing into a harmonious economy, the land of nomadic herdsmen has leaped into a sovereign, prosperous modern nation."
 eafp_mgl.519.f: "\"Upon the eternal serenity of our steppes now thrives the vibrant heartbeat of industry. We stand beholden to no foreign masters, forging our own boundless prosperity!\"\n\n— Commemorative Address on National Industrialization"
 eafp_mgl.519.a: "Establish an integrated industrial plan encompassing all Mongol lands."
 eafp_mgl.519.b: "Respect the unique economic systems of each region and allow independent development."
 eafp_mgl.519.c: "Concentrate resources only on the industrialization of the Khalkha heartland."
 eafp_mgl.520.t: "A National Industrial Plan"
 eafp_mgl.520.d: "Encompassing the Khalkha heartland, Inner Mongolia, Buryatia, Tuva, and Xinjiang, the 'Master Pan-Mongolian Industrial Plan' has been inaugurated. Strategically distributing mining complexes, livestock processing hubs, and manufacturing zones according to local resource advantages, the plan seeks balanced regional development across the unified empire."
 eafp_mgl.520.f: "\"The ores of the Altai and the fine wools of the Gobi now move under a single synchronized blueprint. The entire expanse of Greater Mongolia begins to pulse like one mighty engine.\"\n\n— State Planning Commission Report"
 eafp_mgl.520.a: "Suppress the backlash from local princes and enforce a centralized command economy."
 eafp_mgl.520.b: "Compromise by conceding some economic rights to the provinces."
 eafp_mgl.520.c: "Only a capitalist market economy will enrich everyone."
 eafp_mgl.521.t: "Common Customs and Industrial Standards"
 eafp_mgl.521.d: "Abolishing internal transit tolls, feudal customs barriers, and disparate local excises across all unified banners, the state has enacted a Single Customs Union and National Industrial Standards. Standardizing weights, measures, and mechanical components, this reform unlocks seamless commerce and industrial synergy across thousands of kilometers."
 eafp_mgl.521.f: "\"No longer must a merchant empty his pockets at every banner border. Under a single tariff and one honest measure, the trade and industry of all Mongolia become one.\"\n\n— Commerce Ministry Decree"
 eafp_mgl.521.a: "Abolish all tariffs within the Steppe Federation and create a single market."
 eafp_mgl.521.b: "Gradually lower tariffs considering industrial disparities between regions."
 eafp_mgl.521.c: "Maintain intra-regional tariffs to preserve tax revenue."
 eafp_mgl.522.t: "A Transregional Transport Network"
 eafp_mgl.522.d: "A monumental infrastructure initiative is underway to stitch together the vast lands from Lake Baikal to the Inner Mongolian steppe and the Tian Shan peaks into a 'Trans-Steppe Transport Grid'. Constructing arterial railways, paved highways, and telegraph corridors, this lifeline ensures that raw resources and manufactured goods traverse the empire within days."
 eafp_mgl.522.f: "\"Along endless ribbons of steel, the steam locomotive blares its triumphant whistle across the wilderness! Where thousands of horses once galloped, the iron horse now flies like lightning!\"\n\n— Railway Inauguration Jubilation"
 eafp_mgl.522.a: "Lay down a railway network to connect all of Mongolia!"
 eafp_mgl.522.b: "Prioritize cheaper road and communication network expansion."
 eafp_mgl.522.c: "Expanding transport networks could create invasion routes. Suspend it."
 eafp_mgl.523.t: "Locating Resources and Factories"
 eafp_mgl.523.d: "The government has implemented a strategic reallocation of industrial processing to resolve the geographical divide between primary raw material zones and manufacturing centers. Constructing wool-scouring and mineral refining facilities adjacent to raw resource hubs drastically lowers transport overheads while locating consumer manufacturing near major urban markets."
 eafp_mgl.523.f: "\"We scour the wool where it is sheared and tan the hides where they are flayed, wasting neither time nor coin on hauling raw dirt. This is the true wisdom of industrial planning.\"\n\n— Ministry of Industry Planner"
 eafp_mgl.523.a: "Exploit resources from the periphery to concentrate wealth in Ulaanbaatar."
 eafp_mgl.523.b: "Build factories near resource areas to promote balanced regional development."
 eafp_mgl.523.c: "Conform to the existing structure of exporting raw materials and importing finished goods."
 eafp_mgl.524.t: "Workers and Migrants"
 eafp_mgl.524.d: "As rapid industrialization attracts hundreds of thousands of internal migrants and specialists to booming manufacturing hubs, labor distribution and inter-ethnic harmony have become pressing matters. We must ensure fair wage structures, technical training, and civil integration between nomadic workers and migrant specialists to secure lasting social stability."
 eafp_mgl.524.f: "\"Pastoralists of the plains and urban mechanics now work shoulder to shoulder beneath the same factory roof. Diverse in origin, we are united as proud builders of our sovereign nation!\"\n\n— National Labor Congress Declaration"
 eafp_mgl.524.a: "Actively accept the influx of foreign workers like Han Chinese to solve labor shortages."
 eafp_mgl.524.b: "Strictly control foreign influx and enforce Mongol-centric employment."
 eafp_mgl.524.c: "Levy special taxes on foreign workers to expand state finances."
 eafp_mgl.525.t: "One Industrial Market"
 eafp_mgl.525.d: "Through years of coordinated investment and infrastructural integration, Greater Mongolia has blossomed into a self-sustaining, fully integrated 'Single Industrial Market'. Raw ores, wool, machinery, and consumer goods circulate with frictionless efficiency, sealing the sovereign economic independence of the empire against all foreign coercion."
 eafp_mgl.525.f: "\"We extract with our own hands, manufacture with our own machines, and trade within our own sovereign market. The empire of the steppes stands unshakeable upon bedrock of steel!\"\n\n— Address on the Unified Industrial Market"
 eafp_mgl.525.a: "Finally, the grand integrated Mongol industrial zone is complete!"
 eafp_mgl.525.b: "It came with many sacrifices, but we have succeeded in modernization."
 eafp_mgl.525.c: "We need welfare for those left behind in the shadow of industrialization."
 eafp_mgl.526.t: "Integration or Extraction?"
 eafp_mgl.526.d: "With the full maturity of the trans-regional industrial zone, a profound ideological question divides the leadership regarding the relationship between the metropole and the borderlands. Shall Mongolia treat the outer provinces as mere resource extraction colonies to enrich Urga, or consummate an equitable, fraternal commonwealth where industrial wealth is shared by all?"
 eafp_mgl.526.f: "\"An empire built upon the exploitation of its own blood brothers will crumble like a palace of sand. Only when every child of the steppe shares in our prosperity will this union endure forever.\"\n\n— Supreme Council Resolution"
 eafp_mgl.526.a: "We have firmly bound our blood brothers together."
 eafp_mgl.526.b: "It is an empire built on the exploitation of brothers."
 eafp_mgl.526.c: "How long can this grand federation be maintained?"
 eafp_mgl.411.t: "The Steppe League Expands"
 eafp_mgl.411.d: "The official Grand Register of the Steppe Confederation, surveying the territories, populations, clans, and resources of all member banners, juzes, and autonomous provinces, has been completed. Serving as the master administrative framework for military mobilization, economic planning, and infrastructure development, it codifies the unified rebirth of the steppe."
 eafp_mgl.411.f: "\"From the frozen waters of Lake Baikal in the north to the snowy crests of the Tian Shan in the south, every clan and valley is registered in this golden ledger. Our ancestral lands are whole once more.\"\n\n— Report of the Chief Archivist"
 eafp_mgl.411.a: "Confirm the new territorial registry of the Steppe Federation."
