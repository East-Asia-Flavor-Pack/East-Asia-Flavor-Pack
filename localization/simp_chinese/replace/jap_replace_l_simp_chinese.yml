# Imperial restoration petition
je_meiji_restoration_proclaim_imperial_restoration_desc: "若要结束危机，就必须与朝廷达成协议。无论是让将军的统治权得到重申，还是让德川家在天皇领导的政府中的新角色得到认可，都必须通过这一决定重新确立双方的关系与日本的统治秩序。\n\n这样的计划如同纵身跃下高台，是一场攸关命运的冒险。如果朝廷不愿合作，德川幕府就只能独自面对满怀复仇之心的反对者。"
meiji_restoration_restore_emperor_1_tt: "#bold 公武合体#!成功时： #indent_newline:3 \n•$emperor_legitimize_shogun_tt$\n•$sonno_joi_militant_tt$#!"
meiji_restoration_restore_emperor_2_tt: "#bold 公议舆论#!成功时： #indent_newline:3 \n•$emperor_restored_tt$\n•$tokugawa_becomes_lo_leader_tt$\n•$gain_landed_voting_tt$#!"
