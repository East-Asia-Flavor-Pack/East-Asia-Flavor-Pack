 je_scramble_for_korea_reason: "改革与列强干预将决定朝鲜的未来。各参与国独立积累影响力。外国独自达到100即获胜；朝鲜独立、获得认可并独自达到100时，即可巩固主权。如果所有外国参与国均已退出，朝鲜将获胜，无须满足影响力、认可或独立条件。清朝以外的直接宗主国无须影响力即可获胜。\n\n清朝或日本灭亡，或中国崩溃，都不会终止争夺；其余参与国将继续竞争。其他参与国在朝鲜仍附属于清朝时赢得影响力竞争，将接管朝鲜的宗主权。日志期间朝鲜的势力集团控制力抵抗降低50%。"
