 korea_scramble_claim_button: "Assert our rights"
 korea_scramble_claim_button_desc: "Available below the foreign leader. Commit 50 Influence for 36 months for +3 influence; one rival may counter up to 3. Cooldown: 36 months."
 korea_scramble_invest_button: "Support commerce in Korea"
 korea_scramble_invest_button_desc: "Requires an owned building in Korea. Offering costs £10,000. Acceptance grants +3 influence, improved working conditions and £5,000 to Korea. Cooldown: 24 months."
 korea_scramble_advisers_button: "Offer military advisers"
 korea_scramble_advisers_button_desc: "Offering commits 50 Influence for 24 months. Acceptance grants +3 influence and +0.5 monthly for 24 months. A rival may respond. Cooldown: 24 months."
 korea_scramble_lobby_button: "Cultivate court supporters"
 korea_scramble_lobby_button_desc: "Support a governing Korean interest group. Offering costs £10,000. Acceptance adds it to a pro-country lobby and grants +3 influence. Cooldown: 24 months."
 korea_scramble_sovereignty_button: "Independent diplomacy"
 korea_scramble_sovereignty_button_desc: "Commit 50 Bureaucracy for 24 months. Korea gains 3 influence; the unique foreign leader loses 3. Tied foreign leaders lose nothing. Cooldown: 24 months."
 scramble_for_korea_events.1.t: "A Candle in the Wind"
 scramble_for_korea_events.1.d: "The rising tide of imperialism has reached the shores of [ROOT.GetCountry.GetName]. From neighbors along our borders to unfamiliar great powers across the sea, foreign nations are revealing their dark intentions."
 scramble_for_korea_events.1.f: "\"Our country lies at the very throat of Asia, its position as precarious as an egg beneath a heavy stone. The great powers watch us, each wary of moving before the others. Should one invade, the rest will not stand idle, and our country will surely be unable to withstand the resulting calamity.\""
 scramble_for_korea_events.1.a: "Even in a tiger's den, a clear head can save us."

 scramble_for_korea_events.2.t: "Ambitions toward the Korean Peninsula"
 scramble_for_korea_events.2.d: "The neighboring peninsula is a strategic crossroads between continent and ocean, a bridgehead essential to securing supremacy in East Asia. Yet we are not alone in coveting it."
 scramble_for_korea_events.2.f: "\"Look at the map. Korea is a dagger pointed at the heart of [ROOT.GetCountry.GetName]. If we leave its hilt in the hands of another great power, we must live in constant fear of the moment it strikes.\""
 scramble_for_korea_events.2.a: "It rightfully belongs within our sphere of influence."

 scramble_for_korea_events.3.t: "The Korean Question"
 scramble_for_korea_events.3.d: "The regional powers keep each other in check, each determined to bring Korea within its sphere of influence."
 scramble_for_korea_events.3.f: "\"Anyone seeking to understand the Korean question must recognize that Korea is a grain caught between the millstones of its powerful neighbors. Its strategic value has made it a shuttlecock, struck back and forth as rival powers confront one another.\""
 scramble_for_korea_events.3.a: "Keep watch on the Far East."
 scramble_for_korea_events.23.t: "Japanese Ascendancy"
 scramble_for_korea_events.23.d: "[SCOPE.sCountry('scramble_winner').GetName] has prevailed in the Korean contest. The resulting subject relationship and diplomatic position define the new order."
 scramble_for_korea_events.23.f: "Once the seals were set, the balance of power changed more than the lines on the map."
 scramble_for_korea_events.23.a: "Our position is secured."
 scramble_for_korea_events.23.b: "We must respond to this new order."
 scramble_for_korea_events.24.t: "Qing Ascendancy"
 scramble_for_korea_events.24.d: "[SCOPE.sCountry('scramble_winner').GetName] has prevailed in the Korean contest. The resulting subject relationship and diplomatic position define the new order."
 scramble_for_korea_events.24.f: "Once the seals were set, the balance of power changed more than the lines on the map."
 scramble_for_korea_events.24.a: "Our position is secured."
 scramble_for_korea_events.24.b: "We must respond to this new order."
 scramble_for_korea_events.22.t: "A New Ascendant Power"
 scramble_for_korea_events.22.d: "[SCOPE.sCountry('scramble_winner').GetName] has prevailed in the Korean contest. The resulting subject relationship and diplomatic position define the new order."
 scramble_for_korea_events.22.f: "Once the seals were set, the balance of power changed more than the lines on the map."
 scramble_for_korea_events.22.a: "Our position is secured."
 scramble_for_korea_events.22.b: "We must respond to this new order."
 scramble_for_korea_events.20.t: "Korean Sovereignty Secured"
 scramble_for_korea_events.20.d: "Independent and internationally recognized, Korea has established an uncontested position. Its future can now be decided on its own terms."
 scramble_for_korea_events.20.f: "Sovereignty required more than a declaration: it required the means to uphold it."
 scramble_for_korea_events.20.a: "We shall determine our own future."
 scramble_for_korea_events.20.b: "We must acknowledge Korea’s position."
 scramble_for_korea_events.21.t: "The Contest Ends"
 scramble_for_korea_events.21.d: "The conditions for the contest no longer exist."
 scramble_for_korea_events.21.f: "Old calculations lost their meaning in a changed world."
 scramble_for_korea_events.21.a: "Reassess the situation."
 scramble_for_korea_events.21.dkorea: "Korea no longer exists, ending the contest."
 scramble_for_korea_events.21.dcollapse: "China’s collapse has ended the basis of the contest."
 scramble_for_korea_events.21.dchina: "Qing no longer exists, ending the established contest."
 scramble_for_korea_events.21.djapan: "Japan no longer exists, ending the established contest."
 scramble_for_korea_events.4.t: "Supporting Reform"
 scramble_for_korea_events.4.d: "Supporting reform could win friends in Korea’s government. We can offer funds, but Korea must decide whether to accept."
 scramble_for_korea_events.4.f: "Diplomats followed the routes opened by new books and machinery."
 scramble_for_korea_events.4.a: "Proceed with the proposal."
 scramble_for_korea_events.4.b: "Not this time."
 scramble_for_korea_events.4.cancel: "Circumstances have changed. Withdraw the proposal."
 scramble_for_korea_events.5.t: "Business in Korea"
 scramble_for_korea_events.5.d: "Our business interests in Korea require an agreement on working conditions and further support."
 scramble_for_korea_events.5.f: "The merchant opened a ledger; the official opened a report. The same figures meant different things."
 scramble_for_korea_events.5.a: "Proceed with the proposal."
 scramble_for_korea_events.5.b: "Not this time."
 scramble_for_korea_events.5.cancel: "Circumstances have changed. Withdraw the proposal."
 scramble_for_korea_events.6.t: "A Military Mission"
 scramble_for_korea_events.6.d: "We can offer a military mission to assist Korea’s army reforms. The advisers can operate only with Korean consent."
 scramble_for_korea_events.6.f: "A change in drill commands carried implications beyond the parade ground."
 scramble_for_korea_events.6.a: "Proceed with the proposal."
 scramble_for_korea_events.6.b: "Not this time."
 scramble_for_korea_events.6.cancel: "Circumstances have changed. Withdraw the proposal."
 scramble_for_korea_events.8.t: "Suzerainty and Rights"
 scramble_for_korea_events.8.d: "A rival has gained more influence. Qing may invoke suzerainty, Japan treaty rights, and other countries their national interests to assert a stronger position in Korea."
 scramble_for_korea_events.8.f: "A sentence in a diplomatic note could outlast a warship."
 scramble_for_korea_events.8.a: "Proceed with the proposal."
 scramble_for_korea_events.8.b: "Not this time."
 scramble_for_korea_events.8.cancel: "Circumstances have changed. Withdraw the proposal."
 scramble_for_korea_events.9.t: "Seeking Support at Court"
 scramble_for_korea_events.9.d: "We should seek a receptive group in Korea’s government. Any support will require a further proposal and Korean consent."
 scramble_for_korea_events.9.f: "Letters of introduction sometimes arrived before formal treaties."
 scramble_for_korea_events.9.a: "Proceed with the proposal."
 scramble_for_korea_events.9.b: "Not this time."
 scramble_for_korea_events.9.cancel: "Circumstances have changed. Withdraw the proposal."
 scramble_for_korea_events.10.t: "A Dispute over Residents"
 scramble_for_korea_events.10.d: "A dispute has arisen over residents of our cultures in Korea. We can seek an agreement or support those wishing to return voluntarily."
 scramble_for_korea_events.10.f: "The petitions at the legation told human stories, not merely statistics."
 scramble_for_korea_events.10.a: "Proceed with the proposal."
 scramble_for_korea_events.10.b: "Not this time."
 scramble_for_korea_events.10.cancel: "Circumstances have changed. Withdraw the proposal."
 scramble_for_korea_events.12.t: "Supporting a Friendly Lobby"
 scramble_for_korea_events.12.d: "A governing Korean interest group may be receptive to cooperation. If Korea agrees, it will join an existing friendly lobby or help establish one."
 scramble_for_korea_events.12.f: "Persuasion continued beyond the public chamber."
 scramble_for_korea_events.12.a: "Proceed with the proposal."
 scramble_for_korea_events.12.b: "Not this time."
 scramble_for_korea_events.12.cancel: "Circumstances have changed. Withdraw the proposal."
 scramble_for_korea_events.10.c: "Assist those wishing to return voluntarily."
 scramble_for_korea_events.7.t: "Korea’s Response"
 scramble_for_korea_events.7.d: "We must consider the proposal from [SCOPE.sCountry('scramble_actor').GetName]."
 scramble_for_korea_events.7.f: "The ministers weighed what might be gained and lost. There was more than one way to open the country’s doors."
 scramble_for_korea_events.7.a: "Accept the proposal."
 scramble_for_korea_events.7.b: "We will rely on our own resources."
 scramble_for_korea_events.7.c: "Agree to limited, one-off cooperation."
 scramble_for_korea_events.7.cancel: "The proposal is no longer valid."
 scramble_for_korea_events.7.d4: "[SCOPE.sCountry('scramble_actor').GetName] proposes support for reform. Acceptance grants it 3 influence and implements the proposal. Refusal gives Korea +3 and the proposer −2. Compromise grants each +1 without continuing commitments."
 scramble_for_korea_events.7.d5: "[SCOPE.sCountry('scramble_actor').GetName] proposes improved working conditions and funding. Acceptance grants it 3 influence and implements the proposal. Refusal gives Korea +3 and the proposer −2. Compromise grants each +1 without continuing commitments."
 scramble_for_korea_events.7.d6: "[SCOPE.sCountry('scramble_actor').GetName] proposes a military advisory mission. Acceptance grants it 3 influence and implements the proposal. Refusal gives Korea +3 and the proposer −2. Compromise grants each +1 without continuing commitments."
 scramble_for_korea_events.7.d10: "[SCOPE.sCountry('scramble_actor').GetName] proposes a settlement and funding for the residents’ dispute. Acceptance grants it 3 influence and implements the proposal. Refusal gives Korea +3 and the proposer −2. Compromise grants each +1 without continuing commitments."
 scramble_for_korea_events.7.d12: "[SCOPE.sCountry('scramble_actor').GetName] proposes support for a friendly political lobby. Acceptance grants it 3 influence and implements the proposal. Refusal gives Korea +3 and the proposer −2. Compromise grants each +1 without continuing commitments."
 scramble_for_korea_events.11.t: "A Clash of Advisers"
 scramble_for_korea_events.11.d: "Advisers from [SCOPE.sCountry('scramble_actor').GetName] and [SCOPE.sCountry('scramble_rival').GetName] have clashed. Korea may mediate or demand that one mission withdraw."
 scramble_for_korea_events.11.f: "A promise to help with training had turned into a diplomatic confrontation."
 scramble_for_korea_events.11.a: "Both sides must exercise restraint."
 scramble_for_korea_events.11.b: "Demand the withdrawal of [SCOPE.sCountry('scramble_actor').GetName]’s mission."
 scramble_for_korea_events.11.cancel: "The circumstances of the dispute have changed."
 scramble_for_korea_events.13.t: "A Rival’s Response"
 scramble_for_korea_events.13.d: "We must respond to [SCOPE.sCountry('scramble_actor').GetName]’s activities in Korea. We can spend diplomatic resources to counter its influence, accept the situation, or withdraw our own advisers."
 scramble_for_korea_events.13.f: "One country’s advance changed another’s calculations."
 scramble_for_korea_events.13.a: "Counter them diplomatically."
 scramble_for_korea_events.13.b: "Accept the situation this time."
 scramble_for_korea_events.13.c: "Withdraw our advisers."
 scramble_for_korea_events.13.cancel: "There is no longer a basis for a response."
