 kor_reformation_military_complete: "(调试) 富国强兵之路：标记军制改革完成"
 kor_reformation_military_complete_desc: "设置军制改革的调试完成标记。"
 kor_reformation_economy_complete: "(调试) 富国强兵之路：标记振兴工商业完成"
 kor_reformation_economy_complete_desc: "设置振兴工商业的调试完成标记。"
 kor_reformation_diplomacy_complete: "(调试) 富国强兵之路：标记外交改革完成"
 kor_reformation_diplomacy_complete_desc: "设置外交改革的调试完成标记。"

 # 양요 디버그 결단
 kor_yangyo_make_interested_power: "(调试) 洋扰：制造利害相关列强"
 kor_yangyo_make_interested_power_desc: "让朝鲜以外的一个列强在东北亚宣布利益。"
 kor_yangyo_fire_ship_event: "(调试) 洋扰：触发异样船事件"
 kor_yangyo_fire_ship_event_desc: "立即触发一个符合条件的异样船事件。"
 kor_yangyo_grant_grievance: "(调试) 洋扰：给予所有列强名分"
 kor_yangyo_grant_grievance_desc: "所有利害相关列强获得讨伐朝鲜的名分。"
 kor_yangyo_launch_now: "(调试) 洋扰：立即发动"
 kor_yangyo_launch_now_desc: "一个拥有战舰的利害相关列强立即发出最后通牒。"
 kor_yangyo_make_opened: "(调试) 洋扰：解除锁国"
 kor_yangyo_make_opened_desc: "解除锁国，以检查远征国只要求赔款的分支。"
 kor_yangyo_reset: "(调试) 洋扰：重置状态"
 kor_yangyo_reset_desc: "清除进行中的远征和固定的远征结果。"
 kor_yangyo_become_aggressor: "(调试) 洋扰：准备朝鲜远征"
 kor_yangyo_become_aggressor_desc: "我国在东北亚宣布利益，并获得讨伐朝鲜的名分。"

 # 예치의 길 디버그 결단
 kor_yechi_complete: "(调试) 礼治之路：完成"
 kor_yechi_complete_desc: "将礼治扎根时间设为#v 60#!个月。下次日志检查时触发礼治之路结局。"
 kor_yangyo_set_fort_level: "(调试) 洋扰：更改京畿海军要塞等级"
 kor_yangyo_set_fort_level_desc: "将京畿海军要塞依次改为#v 0#! → #v 5#! → #v 10#!级。"
 kor_yangyo_force_result: "(调试) 洋扰：固定远征结果"
 kor_yangyo_force_result_desc: "依次固定下一次远征结果：完胜 → 击退 → 战败 → 随机。"

 # 선교사 (docs/joseon_missionaries.md 9)
 kor_missionary_list: "(调试) 传教士：查看潜伏的传教士"
 kor_missionary_list_desc: "虚空中的传教士#v [GetPlayer.MakeScope.ScriptValue('eafp_val_hidden_missionary')|0]#!名（活动中#v [GetPlayer.MakeScope.ScriptValue('eafp_val_active_missionary')|0]#!名，无名传教士#v [GetPlayer.MakeScope.ScriptValue('eafp_val_unnamed_missionary')|0]#!名）\n\n莫邦：[GetPlayer.GetCustom('eafp_debug_missionary_maubant')]\n沙斯当：[GetPlayer.GetCustom('eafp_debug_missionary_chastan')]\n安世权：[GetPlayer.GetCustom('eafp_debug_missionary_imbert')]\n费雷奥尔：[GetPlayer.GetCustom('eafp_debug_missionary_ferreol')]\n达沃吕：[GetPlayer.GetCustom('eafp_debug_missionary_daveluy')]\n金大建：[GetPlayer.GetCustom('eafp_debug_missionary_daegeon')]\n崔良业：[GetPlayer.GetCustom('eafp_debug_missionary_yangup')]\n贝尔讷：[GetPlayer.GetCustom('eafp_debug_missionary_berneux')]\n里德尔：[GetPlayer.GetCustom('eafp_debug_missionary_ridel')]"
 kor_missionary_list_tt: "说明中列出虚空中的传教士。没有其他效果。"
 kor_missionary_spawn: "(调试) 传教士：引入传教士"
 kor_missionary_spawn_desc: "创建一名无名传教士并置于虚空中。活动期限为3至8年之一。"
 kor_missionary_activity_now: "(调试) 传教士：触发传教活动"
 kor_missionary_activity_now_desc: "一名活动中的传教士立即传教，可以检查通知和儒学王国日志中的最近传闻。"
 kor_missionary_reset_purge_cooldown: "(调试) 传教士：重置集中教化冷却"
 kor_missionary_reset_purge_cooldown_desc: "使集中教化可以立即再次使用。"
 eafp_debug_missionary_active: "#P 活动中#!"
 eafp_debug_missionary_jailed: "#N 关押中#!"
