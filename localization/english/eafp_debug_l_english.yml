l_english:

# eafp_debug.3
 eafp_debug.3.t: "Debug Event 3"
 eafp_debug.3.d: "This event is used to test mod functionality."
 eafp_debug.3.a: "Continue"

 # Japan debug decisions
 jap_bakufu_authority_zero: "(Debug) Bakuhan System: Set Shogunate Authority to Zero"
 jap_bakufu_authority_zero_desc: "Sets Shogunate Authority in the Bakuhan System journal entry to #v 0#!."

 # Joseon debug decisions
 kor_scramble_for_korea_setup: "(Debug) The Scramble for Korea: Prepare Japan"
 kor_scramble_for_korea_setup_desc: "Ends Japanese isolationism, speeds up the Restoration, and grants Japan recognition as needed."
 kor_samjeong: "(Debug) Three Administrative Corruptions: Raise All Three Progress Bars"
 kor_samjeong_desc: "Sets the Administrative, Military, and Civilian Status bars to #v 2000#! each."
 kor_yangjeon: "(Debug) Land Survey: Complete"
 kor_yangjeon_desc: "Sets Land Survey progress to the completion threshold of #v 360#!."
 kor_sedo: "(Debug) Sedo Politics: End"
 kor_sedo_desc: "Lowers the Power Balance to #v 0#!, the threshold for ending Sedo Politics."
 kor_manchurian_policy: "(Debug) Manchurian Policy: Start"
 kor_manchurian_policy_desc: "Adds the Manchurian Policy journal entry."
 kor_own_manchuria: "(Debug) Manchurian Policy: Take All of Manchuria"
 kor_own_manchuria_desc: "Transfers all states in Manchuria to Joseon."

 # Qing debug decisions
 chi_chiwes1: "(Debug) Transformation Through Foreign Learning: Start"
 chi_chiwes1_desc: "Triggers the Establishment of Zongli Yamen event to start the Transformation Through Foreign Learning journal entry."
 chi_chiwes2: "(Debug) Transformation Through Foreign Learning: Mark Complete"
 chi_chiwes2_desc: "Sets the variables that record the start and completion of Transformation Through Foreign Learning."
 chi_chistate: "(Debug) Take All Han Homeland States"
 chi_chistate_desc: "Transfers all states in the Han homelands to Qing."
 chi_collapse: "(Debug) Unstable Integration: Set Qing Integration to Zero"
 chi_collapse_desc: "Lowers Qing Integration to the collapse threshold of #v 0%#!."

 # National Wealth and Military Strength debug decisions
 kor_reformation_society_complete: "(Debug) National Wealth and Military Strength: Mark Social Reform Complete"
 kor_reformation_society_complete_desc: "Sets the debug completion flag for Social Reform."
 kor_reformation_military_complete: "(Debug) National Wealth and Military Strength: Mark Military System Reform Complete"
 kor_reformation_military_complete_desc: "Sets the debug completion flag for Military System Reform."
 kor_reformation_economy_complete: "(Debug) National Wealth and Military Strength: Mark Promoting Commerce and Industry Complete"
 kor_reformation_economy_complete_desc: "Sets the debug completion flag for Promoting Commerce and Industry."
 kor_reformation_diplomacy_complete: "(Debug) National Wealth and Military Strength: Mark Diplomatic Reform Complete"
 kor_reformation_diplomacy_complete_desc: "Sets the debug completion flag for Diplomatic Reform."

 # 양요 디버그 결단
 kor_yangyo_make_interested_power: "(Debug) Western Disturbance: Create Interested Power"
 kor_yangyo_make_interested_power_desc: "A great power other than Joseon declares an interest in Northeast Asia."
 kor_yangyo_fire_ship_event: "(Debug) Western Disturbance: Fire Ship Event"
 kor_yangyo_fire_ship_event_desc: "Immediately fires one eligible foreign ship event."
 kor_yangyo_grant_grievance: "(Debug) Western Disturbance: Grant Grounds to All Powers"
 kor_yangyo_grant_grievance_desc: "Every interested power gains grounds to move against Joseon."
 kor_yangyo_launch_now: "(Debug) Western Disturbance: Start Now"
 kor_yangyo_launch_now_desc: "An interested power with warships immediately sends an ultimatum."
 kor_yangyo_make_opened: "(Debug) Western Disturbance: End Isolation"
 kor_yangyo_make_opened_desc: "Lifts isolationism to test the branch where only an indemnity is demanded."
 kor_yangyo_reset: "(Debug) Western Disturbance: Reset"
 kor_yangyo_reset_desc: "Clears any expedition in progress and the forced expedition result."
 kor_yangyo_become_aggressor: "(Debug) Western Disturbance: Prepare an Expedition"
 kor_yangyo_become_aggressor_desc: "Our country declares an interest in Northeast Asia and gains grounds to move against Joseon."

 # 예치의 길 디버그 결단
 kor_yechi_complete: "(Debug) Path of Rule by Ritual: Complete"
 kor_yechi_complete_desc: "Sets the time settled to #v 60#! months. The Path of Rule by Ritual ending fires at the next journal check."
 kor_yangyo_set_fort_level: "(Debug) Western Disturbance: Change Gyeonggi Naval Fortification"
 kor_yangyo_set_fort_level_desc: "Cycles the Gyeonggi naval fortification through levels #v 0#! → #v 5#! → #v 10#!."
 kor_yangyo_force_result: "(Debug) Western Disturbance: Force Expedition Result"
 kor_yangyo_force_result_desc: "Cycles the next expedition result: decisive victory → repelled → defeat → random."
