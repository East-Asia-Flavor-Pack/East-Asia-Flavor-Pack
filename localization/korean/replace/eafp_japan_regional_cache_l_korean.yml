l_korean:
 DAIMYO_LOYALTY_IMPACT_TOKUGAWA_TT: "[Character.GetHomeState.GetName]: 지역 충성도에 따른 도쿠가와 충성파 운동의 흡인력 [Character.GetHomeState.MakeScope.ScriptValue('state_daimyo_loyalty_impact_tokugawa')|=+0%].\n지역 충성도 캐시를 기준으로 계산합니다. EAFP의 막번체제 관리 중에는 독자적인 주 충성도가 이 캐시에 반영됩니다."
 DAIMYO_LOYALTY_IMPACT_RESTORATIONIST_TT: "[Character.GetHomeState.GetName]: 지역 충성도에 따른 메이지 유신파 운동의 흡인력 [Character.GetHomeState.MakeScope.ScriptValue('state_daimyo_loyalty_impact_restorationist')|=+0%].\n지역 충성도 캐시를 기준으로 계산합니다. EAFP의 막번체제 관리 중에는 독자적인 주 충성도가 이 캐시에 반영됩니다."
