l_korean:
ig_samurai: "무사"
ig_samurai_desc: "무사는 일본의 세습제 군사 귀족으로, 특권 계층 가신으로서 강력한 지주인 다이묘를 섬깁니다. 그뿐만 아니라 봉건 군주의 뜻을 집행하기도 합니다."
yuanzhumin: "대만 원주민"
je_meiji_restoration: "명예로운 유신"
je_meiji_restoration_reason: "개항으로 옛 정치 질서의 균형이 무너졌다. 막부 통치를 끝내고 천황 중심 정부를 안정시켜 EAFP 유신을 완수해야 한다."
je_meiji_main: "메이지 국가 개조"
je_meiji_main_reason: "새 질서 아래에서 경제·군사·외교 개혁을 모두 완수해야 한다."
je_meiji_economy: "메이지 경제"
je_meiji_economy_reason: "채무 불이행 없이 근대 도시를 육성하고 편입 주를 철도로 연결해야 한다."
je_meiji_army: "메이지 군제"
je_meiji_army_reason: "봉건적 징집제와 낡은 편제를 폐지하고 근대 국민군을 건설해야 한다."
je_meiji_diplomacy: "메이지 외교"
je_meiji_diplomacy_reason: "전통주의를 벗어난 독립 승인국으로서 일본의 국제적 지위를 확립해야 한다."
je_taming_the_north: "북방 개척"
je_taming_the_north_reason: "EAFP 자체 북방 계획에 따라 홋카이도를 개발·편입하고 아이누와의 관계를 관리해야 한다."
