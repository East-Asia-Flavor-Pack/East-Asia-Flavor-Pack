 DAIMYO_LOYALTY_IMPACT_RESTORATIONIST_TT: "[Character.GetHomeState.GetName]: 地区忠诚度对明治维新派吸引力的影响 [Character.GetHomeState.MakeScope.ScriptValue('state_daimyo_loyalty_impact_restorationist')|=+0%].\n根据地区忠诚度缓存计算。在EAFP幕藩体制管理期间，该缓存取自独立保存的地区忠诚度。"
