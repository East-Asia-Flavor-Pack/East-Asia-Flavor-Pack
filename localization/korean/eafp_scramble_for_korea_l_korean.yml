 korea_scramble_sovereignty_button_desc: "행정력 50을 24개월 부담. 조선 영향력 +3, 외국 단독 선두 -3. 외국 선두 동률이면 감소분만 생략. 재사용 대기 24개월."
 scramble_for_korea_events.1.t: "풍전등화" # 조선
 scramble_for_korea_events.1.d: "제국주의의 거센 파도가 [ROOT.GetCountry.GetName]의 해안가에 도달했다. 국경을 맞댄 이웃국들부터 바다 건너의 낯선 열강들까지, 수많은 외세가 검은 속내를 드러내고 있다."
 scramble_for_korea_events.1.f: "\"지금 우리나라는 실로 아시아의 목구멍에 해당하는 위치에 있으니 그 형세가 마치 무거운 돌이 계란을 누르고 있는 것과 같아 위태롭기 그지없다. 강대국들은 서로를 꺼려하며 감히 먼저 움직이지 못하고 우리를 주시하고 있으나, 만약 어느 한 나라가 침범해 온다면 다른 나라들이 가만히 있지 않을 것이니, 우리나라는 반드시 그 재앙을 감당해 내지 못할 것이다.\"" # 유길준 전서에 있다는데 암만 뒤져도 못 찾겠다. 적당해서 넣음.
 scramble_for_korea_events.1.a: "호랑이 굴에 들어가도 정신만 차리면 산다."

 scramble_for_korea_events.2.t: "한반도를 향한 야망" # 청, 일본 등
 scramble_for_korea_events.2.d: "이웃한 저 반도는 대륙과 해양을 잇는 전략적 요충지이자, 동아시아의 패권을 쥐기 위해 확보해야 할 교두보이다. 그러나 우리만 저 땅을 노리는 것이 아니다."
 scramble_for_korea_events.2.f: "\"지도를 보십시오. 조선 땅은 우리 [ROOT.GetCountry.GetName]의 심장을 향해 겨누어진 비수와 같습니다. 저 비수의 자루를 우리가 쥐지 않고 다른 열강이 쥐게 놔둔다면, 우리는 언제 찔릴지 모르는 공포 속에서 살아야 할 것입니다.\"" # Jacob Meckel 말 적당히 써먹음
 scramble_for_korea_events.2.a: "그곳은 마땅히 우리의 영향권 아래에 있어야 한다."

 scramble_for_korea_events.3.t: "조선 문제" # 그 외 열강
 scramble_for_korea_events.3.d: "지역의 패권국들이 서로를 견제하며 조선을 자신의 영향권에 넣으려 혈안이 되어 있다."
 scramble_for_korea_events.3.f: "\"조선 문제를 이해하려는 자는 누구든, 조선이 강력한 이웃 국가들이라는 맷돌 사이에 끼인 알갱이라는 사실을 명확히 파악해야 한다. 조선은 높은 전략적 가치를 지닌 탓에, 경쟁국들이 서로의 면전에 대고 치고받는 배드민턴의 셔틀콕과 같은 신세가 되고 말았다.\"" # 그리피스, 은자의 왕국 조선 + 조지 커존, 극동의 문제들. 적당히 섞음.
 scramble_for_korea_events.3.a: "극동을 주시하라."
 scramble_for_korea_events.4.t: "조선 자주권 확보"
 scramble_for_korea_events.4.d: "조선 쟁탈은 조선의 승리로 끝났다. 한반도를 둘러싼 경쟁이 일단락되고, 조선은 자국의 장래를 결정할 입지를 굳혔다."
 scramble_for_korea_events.4.f: "\"한 나라의 권리는 경솔한 말에 흔들리는 것이 아닐뿐더러, 천만인이 함께 지키는 주권을 한 사람의 독단으로 처분할 수 없음은 이치상 명백한 일이라. 한 가지 비유를 들건대, 남의 집에 고용된 자가 그 주인의 지휘와 명령도 없이 다른 사람을 상대로 주인집의 사무를 제멋대로 처리하여도, 본래 그 일을 처리할 권한이 없은즉 그가 의논하여 처리한 일은 주인의 승인을 얻지 못하고, 다른 사람도 그 고용된 자의 허황됨을 비웃을지니, 그러한 까닭에 나라의 권리는 위협과 독단으로 바꿀 수 없는 것이라.\"" # 출처: 유길준, 『서유견문』 제3편 「방국의 권리」 제8절 후반부. 원문의 논지와 비유를 유지하고 생소한 한자어와 연결 표현을 고풍스러운 현대어로 다듬음. https://ko.wikisource.org/wiki/서유견문/제3편
 scramble_for_korea_events.4.a: "우리의 앞날은 우리가 정한다."
 scramble_for_korea_events.4.b: "조선의 지위를 인정해야 한다."
 scramble_for_korea_events.5.t: "새로운 패권국"
 scramble_for_korea_events.5.d: "[SCOPE.sCountry('scramble_winner').GetName](이)가 조선 쟁탈의 승자가 되었다. 확정된 종속관계와 외교적 지위가 새로운 질서의 토대가 된다."
 scramble_for_korea_events.5.f: "\"한반도는 시간이 흐르면 [SCOPE.sCountry('scramble_winner').GetName]의 소유가 될 것이다. [SCOPE.sCountry('scramble_winner').GetName]의 경계를 점차적으로 넓히고, 우리의 영토로 우리의 보호 통치를 조금씩 확장시키고, 마침내 우리를 움직이도록 했던 거부할 수 없는 불가항력적인 힘이 우리를 한반도로 향하게 하고 있다.\"" # 출처: 로젠 남작, 「4등관 로젠 남작이 제출한 단신」(1902. 9. 12.), 『러시아국립해군성문서Ⅱ(1900~1903)』, 문서 57. РГАВМФ, ф. 417, оп. 1, д. 2303, лл. 51–63. 특정 국가에 한정되지 않도록 재구성. https://db.history.go.kr/item/compareViewer.do?levelId=fs_021r_0570
 scramble_for_korea_events.5.a: "우리의 지위를 굳혔다."
 scramble_for_korea_events.5.b: "새로운 질서에 대응해야 한다."
 scramble_for_korea_events.6.t: "일본의 우세"
 scramble_for_korea_events.6.d: "[SCOPE.sCountry('scramble_winner').GetName](이)가 조선 쟁탈의 승자가 되었다. 확정된 종속관계와 외교적 지위가 새로운 질서의 토대가 된다."
 scramble_for_korea_events.6.f: "\"이제 세계는 한결같이 일본의 실력이 위대함을 인정하고 자연히 열강의 대오에 나란히 서게 되었다. 그런데 제군이 10년 내지 20년 전의 옛 꿈을 상기하여 시세의 변천을 깨닫지 못하고서 자기 마음대로 판단을 내리는 일 같은 것은 몹시 시세에 통하지 않는 것이다. 귀국은 독립에 필요한 실력을 갖지 못했다. 실로 허명의 독립에 지나지 않는다.\"" # 출처: 이토 히로부미, 1905년 11월 16일 「伊藤 大使 한국 각 대신 및 원로대신과 담화의 요령」, 『주한일본공사관기록』, 국사편찬위원회 한국사데이터베이스. 발췌·중간 생략. https://db.history.go.kr/joseon/level.do?levelId=jh_025r_0070_0030&types=r
 scramble_for_korea_events.6.a: "우리의 지위를 굳혔다."
 scramble_for_korea_events.6.b: "새로운 질서에 대응해야 한다."
 scramble_for_korea_events.7.t: "청의 종주권 재확립"
 scramble_for_korea_events.7.d: "[SCOPE.sCountry('scramble_winner').GetName](이)가 조선 쟁탈의 승자가 되었다. 확정된 종속관계와 외교적 지위가 새로운 질서의 토대가 된다."
 scramble_for_korea_events.7.f: "\"역량을 타산해보면 약점만 나타나서 자주 국가로 될 수 없을 뿐만 아니라 강국의 보호도 받는 데가 없기 때문에 결코 자기 스스로 보존하기 어려운 것은 자연적인 이치로서 천하가 다 아는 것입니다.\n\n조선은 본래 중국에 속해 있었는데, 지금 중국을 버리고 다른 데로 향하려 한다면 이것은 어린아이가 자기 부모에게서 떨어져서 다른 사람의 보살핌을 받으려는 것과 같은 것입니다.\"" # 출처: 원세개 「조선대국론(朝鮮大局論)」, 『고종실록』 23권, 고종 23년(1886) 음력 7월 29일 제3기사, 국사편찬위원회. 발췌·중간 생략 및 종결 어미 조정. https://sillok.history.go.kr/id/wza_12307029_003
 scramble_for_korea_events.7.a: "우리의 지위를 굳혔다."
 scramble_for_korea_events.7.b: "새로운 질서에 대응해야 한다."
