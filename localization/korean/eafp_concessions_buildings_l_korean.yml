 eafp_concession_expand_active_tt: "유효한 조계권과 조계회사가 있으며, 자국 위신이 주 소유국 이상이어야 합니다."
 eafp_concession_expand_capacity_tt: "도심지 상한에 최소 5레벨의 여유가 있어야 합니다."
 eafp_concession_expand_treasury_tt: "조계회사가 존재하며 자국 국고에 표시된 확장 비용이 있어야 합니다."
 eafp_concession_expand_ownership_tt: "이 주의 조계지에 자국 소유 레벨이 있어야 합니다."
 eafp_concession_expand_effect_tt: "자국 조계회사 지분이 5레벨 증가하고 국고에서 확장 비용을 지불합니다.\n기존 조계지 건물을 그대로 두고 자국 지분만 새 값으로 덮어쓰므로 다른 국가 지분·근로자·현금보유고·생산 방식·보조금은 유지됩니다."
