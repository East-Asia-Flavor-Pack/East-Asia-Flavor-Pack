 je_eafp_mgl_restoration_of_the_state: "국가의 복원"
 je_eafp_mgl_restoration_of_the_state_reason: "청의 조정이 붕괴하는 혼란 속에서 [concept_eafp_mgl_restoration|l]을 선포하고, 외교적 후원과 유효한 통치 구조를 확보하여 몽골 국가의 주권을 우뚝 세워야 합니다."
 je_eafp_mgl_bogd_khanate: "복드 칸국"
 je_eafp_mgl_bogd_khanate_reason: "독립 선언 이후 5부 행정 관청과 세속 서기관단을 정비하고, 복드 칸의 종교적 정통성과 근대적 국가 행정 사이의 균형을 확립해야 합니다."
 je_eafp_mgl_unite_the_mongols: "전 몽골의 통합"
 je_eafp_mgl_unite_the_mongols_reason: "[concept_eafp_mgl_golden_lineage|l]의 역사적 유산을 계승하여 내몽골, 바르가, 부랴트, 오이라트, 투바의 모든 몽골 민족을 하나의 전 몽골 국가로 결합해야 합니다."
 je_eafp_mgl_echoes_of_chinggis: "칭기즈의 메아리"
 je_eafp_mgl_echoes_of_chinggis_reason: "오논강 상류에서 대쿠릴타이를 개최하여 칭기즈 칸의 기억을 외교 언어로 제시하고, 공동 [concept_eafp_mgl_steppe_charter|l] 아래 유목 초원 나라들의 평화로운 연대를 비준해야 합니다."
 je_eafp_mgl_develop_the_heartland: "몽골 본토의 산업화"
 je_eafp_mgl_develop_the_heartland_reason: "할하 본토의 자원 조사, 수공업 조합, 날라이흐 석탄과 전력, 직업교육을 연계하여 몽골 본토의 자립적 산업 기반과 경제적 도약을 완성해야 합니다."
 eafp_mgl_heartland_gdp_growth_goal_tt: "몽골 본토의 [Concept('concept_gdp', '$concept_gdp_short$')]이 저널 시작 당시의 #v 1.5배#!인 @gdp!#variable [GetPlayer.MakeScope.Var('eafp_mgl_heartland_gdp_goal').GetValue|K]#! 이상임 (현재: @gdp!#variable [GetPlayer.MakeScope.ScriptValue('eafp_mgl_heartland_gdp')|K]#!)"
 je_eafp_mgl_develop_the_united_mongol_lands: "전몽골 통합 산업권"
 je_eafp_mgl_develop_the_united_mongol_lands_reason: "전 몽골 통합 영토를 연결하는 도로·수송망, 공통 세관, 가공 산업 및 광역 시장을 구축하여 [concept_eafp_mgl_united_industrial_area|l] 전체의 균형 잡힌 번영을 이루어야 합니다."
 je_eafp_mgl_kiakhta_settlement: "캬흐타 협정"
 je_eafp_mgl_kiakhta_settlement_reason: "러시아와 중국 강대국 사이에서 캬흐타 외교 협상을 전개하여 몽골의 실질적 자치권과 대외 조약권을 지켜내야 합니다."
 je_eafp_mgl_autonomy_in_peril: "위기에 처한 자치"
 je_eafp_mgl_autonomy_in_peril_reason: "중국 군벌의 자치 철폐 압박과 이흐 후레 점령 위기에 맞서 지하 저항망과 군사·외교적 결의를 모아 자치권을 수호해야 합니다."
 je_eafp_mgl_people_revolution: "인민혁명"
 je_eafp_mgl_people_revolution_reason: "수흐바타르와 처이발상이 이끄는 인민 의용군과 외부 지원을 결합하여 이흐 후레를 해방하고, 근대 세속 공화국의 틀을 다져야 합니다."
 eafp_mgl_secular_clerks: "세속 서기관"
 eafp_mgl_secular_clerks_desc: "세속 서기관단이 행정과 공교육을 지원하는 대신 사원의 영향력을 약화합니다."
 eafp_mgl_frontier_commission: "변경 위원회"
 eafp_mgl_frontier_commission_desc: "상설 위원회가 변경 기군의 의무를 조정하고 복원 국가의 권위를 높입니다."
 eafp_mgl_diplomatic_secretariat: "외교 서기국"
 eafp_mgl_diplomatic_secretariat_desc: "훈련된 통역관과 사절이 몽골 외교의 효율을 높입니다."
 eafp_mgl_national_volunteers: "국민 의용대"
 eafp_mgl_national_volunteers_desc: "의용대가 군사적 자신감과 복원 국가의 위신을 강화합니다."
 eafp_mgl_princely_compact: "왕공 협약"
 eafp_mgl_princely_compact_desc: "협상된 맹약이 왕공을 국가에 결속시키고 통합의 정통성을 높입니다."
 eafp_mgl_popular_mandate: "민중의 위임"
 eafp_mgl_popular_mandate_desc: "평민의 청원이 정부의 기반을 넓히고 사회적 분열을 완화합니다."
 eafp_mgl_petition_registry: "청원 등록국"
 eafp_mgl_petition_registry_desc: "청원을 기록하고 답변하는 제도가 정치적 정통성을 넓히지만 자의적인 권위를 제한합니다."
 eafp_mgl_debt_inspection: "부채 장부 조사"
 eafp_mgl_debt_inspection_desc: "선택한 정책이 국가와 산업 기반에 미치는 기간제 효과입니다."
 eafp_mgl_russian_trade_credit: "러시아 교역 신용"
 eafp_mgl_russian_trade_credit_desc: "러시아 상관 및 은행으로부터 상업 신용을 제공받아 조달 비용을 낮추고 물자 유통을 촉진합니다."
 eafp_mgl_translation_school: "번역 학교"
 eafp_mgl_translation_school_desc: "선택한 정책이 국가와 산업 기반에 미치는 기간제 효과입니다."
 eafp_mgl_independence_prepared: "준비된 독립"
 eafp_mgl_independence_prepared_desc: "독립 선언에 앞서 행정과 조세 조정을 마쳐 국가 선포 직후의 정치적 혼란을 최소화했습니다."
 eafp_mgl_independence_crisis: "독립 재정 위기"
 eafp_mgl_independence_crisis_desc: "독립 직후 청과의 교역 차단과 부채 청산 문제로 국고가 고갈되고 행정 재정이 마비된 상태입니다."
 eafp_mgl_secular_state: "세속 국가"
 eafp_mgl_secular_state_desc: "성직자의 정치 관여를 배제하고 세속 정부와 서기관단이 중심이 되어 근대 국가 제도를 운용합니다."
 eafp_mgl_russian_military_mission: "러시아 군사 사절단"
 eafp_mgl_russian_military_mission_desc: "러시아 교관과 무기 교범이 파견되어 몽골 국군의 편제와 기병 훈련, 근대 사격술을 개혁합니다."
 eafp_mgl_steppe_federal_charter: "초원 연방 헌장"
 eafp_mgl_steppe_federal_charter_desc: "참가국의 종교, 관습법, 지역 대표권을 평등하게 보장하는 대초원 연방 헌장이 가동 중입니다."
 eafp_mgl_steppe_imperial_charter: "대몽골 복원 헌장"
 eafp_mgl_steppe_imperial_charter_desc: "황금씨족과 복드 칸의 위계 아래 대몽골 제국의 영광을 복원하자는 강한 동원 헌장이 가동 중입니다."
 eafp_mgl_steppe_patron_charter: "북방 후원 헌장"
 eafp_mgl_steppe_patron_charter_desc: "북방 강대국의 외교적 보호와 경제 차관을 조약으로 보장받는 연맹 헌장이 가동 중입니다."
 eafp_mgl_steppe_revolutionary_charter: "혁명 초원 헌장"
 eafp_mgl_steppe_revolutionary_charter_desc: "왕공과 사원의 특권을 폐지하고 유목 민중과 민중 혁명 연대를 강조하는 혁명 헌장이 가동 중입니다."
 eafp_mgl_industrial_roads: "산업 도로"
 eafp_mgl_industrial_roads_desc: "우르가와 탄광, 주요 역로를 잇는 마차·자동차 도로 정비가 가속화되어 수송 비용이 감소합니다."
 eafp_mgl_resource_survey: "자원 조사"
 eafp_mgl_resource_survey_desc: "지질학자와 광산 기사들이 전국 지질 조사를 수행하여 석탄, 철, 금, 매장 자원을 파악합니다."
 eafp_mgl_artisan_procurement: "수공업 조달"
 eafp_mgl_artisan_procurement_desc: "전통 가죽·양모 수공업자들을 중앙 조달망에 편입하여 피혁 및 직물 원료 생산을 확충합니다."
 eafp_mgl_foreign_technical_dependency: "외국 기술 의존"
 eafp_mgl_foreign_technical_dependency_desc: "외국 기술자와 자본에 의존하여 광산과 공장을 가동함으로써 주권 행사와 이익 공유에 제약이 생깁니다."
 eafp_mgl_cooperative_procurement: "협동 조달"
 eafp_mgl_cooperative_procurement_desc: "인민상호원조협동조합을 통해 유목민들의 가축 원료를 정당한 가격으로 수집·가공하는 체제입니다."
 eafp_mgl_vocational_training: "직업 교육"
 eafp_mgl_vocational_training_desc: "세속 직업학교와 기술 강습소가 근대 기계 조작, 위생, 광업 기술 인력을 양성하고 있습니다."
 eafp_mgl_industrial_hygiene: "산업 위생"
 eafp_mgl_industrial_hygiene_desc: "송기노 수의소와 가축 전염병 방역 체계가 양모와 가죽의 품질을 높이고 질병 손실을 줄입니다."
 eafp_mgl_mongolor_concession: "몽골로르 양허"
 eafp_mgl_mongolor_concession_desc: "몽골로르 금광 양허 계약으로 외자 기술이 들어오는 대신 광산 채굴권과 세수가 외국 자본에 인계됩니다."
 eafp_mgl_nalaikh_fuel_program: "날라이흐 연료 계획"
 eafp_mgl_nalaikh_fuel_program_desc: "날라이흐 탄광 국유화 및 증산 계획으로 수도 우르가와 인근 산업 시설에 석탄 연료를 공급합니다."
 eafp_mgl_mining_regulations: "광업 규정"
 eafp_mgl_mining_regulations_desc: "1923년 광업 규정과 세칙을 시행하여 외국 채공의 무단 채굴을 제한하고 국가 세수를 확보합니다."
 eafp_mgl_mining_bureau: "광무국"
 eafp_mgl_mining_bureau_desc: "소규모 감독 기관이 광산을 직접 운영하지 않으면서 안전·생산성·시장 접근을 개선합니다."
 eafp_mgl_fiscal_cadastre: "재정 토지대장"
 eafp_mgl_fiscal_cadastre_desc: "전국 장부가 과세 역량과 세수 누수를 개선하는 대신 왕공의 면세 특권을 침해합니다."
 eafp_mgl_tugrik_industrial_credit: "투그릭 산업 신용"
 eafp_mgl_tugrik_industrial_credit_desc: "몽골-러시아 은행과 투그릭 화폐 개혁이 국내 산업 형성을 위한 중앙 신용을 공급하고 있습니다."
 eafp_mgl_mongoltrans: "몽골트란스"
 eafp_mgl_mongoltrans_desc: "몽골트란스 국영 자동차·마차 운송 회사가 낙타 대상에 의존하던 초원 물류망을 근대화하고 있습니다."
 eafp_mgl_public_works_office: "공공사업국"
 eafp_mgl_public_works_office_desc: "공공사업국이 건설과 도로 정비를 촉진하지만 자재 비용을 높입니다."
 eafp_mgl_workshop_registry: "작업장 등록제"
 eafp_mgl_workshop_registry_desc: "등록된 작업장은 증설하기 쉬워지고 노동력을 더 효율적으로 조직합니다."
 eafp_mgl_emergency_supply_board: "비상 배급 위원회"
 eafp_mgl_emergency_supply_board_desc: "조정된 식량 배급이 부족기에 산업 도시를 안정시키고 노동자를 끌어들입니다."
 eafp_mgl_state_industrial_board: "국가 산업위원회"
 eafp_mgl_state_industrial_board_desc: "국가 산업위원회가 건설과 제조업을 조정하지만 정치적 유연성을 희생합니다."
 eafp_mgl_industrial_takeoff: "산업 도약"
 eafp_mgl_industrial_takeoff_desc: "석탄, 철, 전력, 도구 및 경공업 연쇄가 완성되어 몽골 경제가 대대적인 산업 도약 단계에 진입했습니다."
 eafp_mgl_forced_collectivization: "강제 집산화"
 eafp_mgl_forced_collectivization_desc: "급진적 강제 집산화로 유목민 가축을 징발하고 사원 재산 몰수를 강행하여 심각한 사회적 위기를 불렀습니다."
 eafp_mgl_livestock_and_factory_crisis: "가축·공장 위기"
 eafp_mgl_livestock_and_factory_crisis_desc: "가축 도살, 유목민 이탈 및 가공 공장 원료 난으로 농업과 산업 생태계가 마비된 상황입니다."
 eafp_mgl_new_turn: "신전환"
 eafp_mgl_new_turn_desc: "1932년 신전환 정책으로 강제 집산화를 철회하고 사유 목축과 자유 교역을 복원하여 가축과 시장을 회복합니다."
 eafp_mgl_united_industrial_market: "통합 산업 시장"
 eafp_mgl_united_industrial_market_desc: "전 몽골 통합 영토의 관세 철폐, 공통 규격, 가공 공장 연계로 거대한 단일 통합 산업 시장이 형성되었습니다."
 eafp_mgl_kiakhta_compromise: "캬흐타 타협"
 eafp_mgl_kiakhta_compromise_desc: "1915년 캬흐타 삼국 협정으로 외몽골의 내정 자치와 러시아의 경제적 기득권을 인정받은 상태입니다."
 eafp_mgl_autonomy_resistance: "자치 저항"
 eafp_mgl_autonomy_resistance_desc: "외세의 자치 철폐 시도에 맞서 민병대 결성과 지하 조직으로 결사 항전을 펼치는 중입니다."
 eafp_mgl_revolutionary_network: "혁명 조직망"
 eafp_mgl_revolutionary_network_desc: "수흐바타르의 우르가 소조와 처이발상의 혁명 소조가 결합하여 전국적인 인민 혁명 비밀망을 구축했습니다."
 eafp_mgl_soviet_support: "소련 지원"
 eafp_mgl_soviet_support_desc: "붉은 군대 군사 원정과 소련 적십자 및 무기 지원으로 인민 정부의 군사적·행정적 기반이 강화됩니다."
 eafp_mgl.100.t: "이흐 후레의 비밀 회의"
 eafp_mgl.100.d: "1911년 여름, 청조의 신정 정책과 가혹한 압제에 맞서 할하 4부의 주요 왕공들과 고위 승려들이 이흐 후레 외곽 보그드 산(Bogd Khan Mountain) 숲속에 은밀히 집결했습니다. 남난수렌, 한드도르지, 체렌치메드 등 핵심 지도자들은 청과의 굴욕적인 종속 관계를 단절하고 몽골의 고유한 주권을 복원하기 위한 대대적인 거사를 모의하고 있습니다."
 eafp_mgl.100.f: "세상은 너무나 조용하고 평화로웠지만, 그 고요는 오히려 불안을 일으켰다. 모든 것이 폭풍 전의 정적처럼 비현실적으로 가라앉아 있었고, 다가오는 격변을 알릴 단 하나의 기척을 잡으려 모든 감각이 어둠 속으로 곤두섰다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.100.a: "이제 몽골의 주권을 선포할 때가 왔다!"
 eafp_mgl.100.b: "아직은 때가 아니다. 은밀히 힘을 기르자."
 eafp_mgl.101.t: "상트페테르부르크로 가는 사절단"
 eafp_mgl.101.d: "청과의 결전을 앞두고 한드도르지 친왕과 다 라마 체렌치메드를 비롯한 비밀 사절단이 러시아 제국의 수도 상트페테르부르크로 급파되었습니다. 사절단은 차르 니콜라이 2세와 러시아 정부를 상대로 몽골의 독립에 대한 공식 외교 승인과 함께 근대식 소총, 탄약, 차관 지원을 간절히 요청하고 있습니다. 그러나 상트페테르부르크 조정은 중국과의 전면전을 우려하며 자치 보장 이상의 지원에는 신중한 태도를 보이고 있습니다."
 eafp_mgl.101.f: "이주민의 우두머리는 해밖에 길잡이가 없는데도 문명의 거처에 단호히 등을 돌리고 한 걸음마다 더 깊은 미지의 땅으로 들어갔다. 날이 저물 무렵에야 그의 마음에는 어둠이 내린 뒤 사람들에게 필요한 것을 마련해야 한다는 근심이 희미하게 자라기 시작했다.\n\n— 제임스 페니모어 쿠퍼, 『대초원』"
 eafp_mgl.101.a: "러시아의 후원만이 우리의 독립을 보장한다."
 eafp_mgl.101.b: "다른 열강들과도 접촉하여 외교적 고립을 피하라."
 eafp_mgl.101.c: "외부의 도움 없이 우리 스스로의 힘으로 서야 한다."
 eafp_mgl.102.t: "청과의 관계를 끊다"
 eafp_mgl.102.d: "몽골 의용군들이 관아를 포위한 가운데 청나라 관리들과 수비대는 무장을 해제당하고 국경 밖으로 추방되었다. 이로써 1691년 돌론노르 회맹 이후 이어져 온 청조의 지배가 종식되고, 몽골 국가의 전면적인 복원이 선포되었다."
 eafp_mgl.102.f: "갈아엎어진 새까만 들판 한가운데, 수레바퀴에 짓밟힌 엉겅퀴 한 포기가 비스듬히 서 있었다. 마치 몸의 한 조각을 뜯기고, 내장이 헤집어지고, 팔 하나가 잘리고, 눈 하나가 뽑힌 듯했다. 그런데도 그것은 여전히 서 있었다. 주변의 모든 형제를 없애 버린 인간에게 굴복하지 않았다.\n\n'이 얼마나 놀라운 생명력인가! 인간은 모든 것을 정복하고 수백만 포기의 풀을 없애 버렸다. 그런데도 이 한 포기는 끝내 굴복하지 않는구나.'"
 eafp_mgl.102.a: "만세!"
 eafp_mgl.103.t: "복드의 즉위"
 eafp_mgl.103.d: "이흐 후레의 대법당에서 거행된 성대한 즉위식을 통해 젭춘담바 후툭투가 전 몽골의 종교와 세속을 통솔하는 '복드 칸'으로 즉위했다."
 eafp_mgl.103.f: "노장 가운데 하나가 지휘봉을 새 지도자에게 가져갔고, 그는 관습에 따라 두 번 사양한 뒤 세 번째에야 받아들였다. 군중의 환호가 터지며 온 평원에 멀리까지 울려 퍼졌고, 가장 나이 든 전사들은 빗물에 젖은 흙을 한 줌씩 그의 머리 위에 얹었다."
 eafp_mgl.103.a: "복드 칸을 모시는 신성한 불교 국가가 될 것이다."
 eafp_mgl.103.b: "왕공들의 권리를 보장하는 입헌 군주정을 세운다."
 eafp_mgl.200.t: "몽골-티베트 우호 조약"
 eafp_mgl.200.d: "1913년 1월, 우르가에서 대몽골국 정부와 티베트 달라이 라마 13세의 전권대표인 아그완 도르지예프(Agvan Dorjiev) 사이에 역사적인 우호 조약이 체결되었습니다. 양국은 청조의 굴레에서 벗어난 상호 주권과 독립을 공식 인정하고, 황모파 불교의 신성한 유대를 바탕으로 외세의 침략에 맞서 군사적·외교적 원조를 아끼지 않을 것을 엄숙히 선언했습니다."
 eafp_mgl.200.f: "작은 방 안에서는 세계 노동자 모두가 한 핏줄이라는 거대한 감정이 태어났다. 그들은 동시에 세계의 주인이자 노예였으나 이미 편견의 속박에서 벗어나 스스로를 삶의 새로운 주인으로 느꼈고, 그 감정은 모두를 하나의 영혼으로 결합했다.\n\n— 막심 고리키, 『어머니』"
 eafp_mgl.200.a: "티베트와의 신성한 동맹을 체결한다."
 eafp_mgl.200.b: "지금은 국제적 승인에 더 집중해야 한다."
 eafp_mgl.210.t: "무기와 교관"
 eafp_mgl.210.d: "신생 대몽골국의 군사력을 현대화하기 위해 러시아 제국으로부터 현대식 모신나강 소총, 맥심 기관총, 속사포와 함께 군사 고문단이 파견되었습니다. 후지르불란(Khujirbulan)에 세워진 군사 훈련소에서 러시아 교관들의 지휘 아래 수천 명의 몽골 유목 기병들이 근대식 제식 훈련과 사격술을 전수받으며 정예 국군으로 거듭나고 있습니다."
 eafp_mgl.210.f: "전사들의 대열은 성벽 앞에 고요히 섰다. 칼자루와 총의 장식에서 번쩍이는 빛 말고는 어디에도 금빛이 없었으며, 싸움터에서 치장하기를 즐기지 않는 그들의 갑옷과 옷은 소박했고 검은 테를 두른 붉은 모자는 멀리서 어둡게 보였다.\n\n— 니콜라이 고골, 『타라스 불바』"
 eafp_mgl.210.a: "러시아의 무기와 교관을 적극 수용한다."
 eafp_mgl.210.b: "우리의 독립적인 군사력을 육성해야 한다."
 eafp_mgl.211.t: "차관과 상업권"
 eafp_mgl.211.d: "독립 이후 청나라 상인들이 떠나고 재정이 고갈된 몽골 조정은 국가 운영 자금을 확보하기 위해 러시아 시베리아 상업은행과 대규모 차관 협상에 나섰습니다. 러시아는 긴급한 재정 차관을 제공하는 대가로 몽골 전역에서의 무관세 무역 특권, 통신선 가설권, 광산 채굴 우선권 등 광범위한 경제적 이권을 요구하며 경제적 영향력을 강화하려 하고 있습니다."
 eafp_mgl.211.f: "철도는 운임을 지배하고 은행가와 증권 투기꾼은 가격을 지배하여 농민들을 오래전부터 빚 속에서 피 흘리게 했다. 은행과 거대 기업들은 막대한 돈을 빌려 그들을 그물에 가두었고, 이제 남은 일은 그 그물을 천천히 끌어당기는 것뿐이었다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.211.a: "상업권을 내어주고라도 차관을 확보하라."
 eafp_mgl.211.b: "경제적 예속은 정치적 예속으로 이어진다. 거절하라."
 eafp_mgl.212.t: "러시아의 외교 중재"
 eafp_mgl.212.d: "몽골의 완전한 독립 선언에 분노한 중화민국 북양정부가 무력 진압을 천명하자, 러시아 제국이 중재관을 자처하고 나섰습니다. 러시아는 베이징과 우르가 사이에서 전쟁을 방지한다는 명분 아래, 몽골의 대외 주권을 중국의 명목상 종주권 아래 두고 내정 자치권과 러시아의 경제적 특권만을 온전히 보장받는 타협안을 강요하고 있습니다."
 eafp_mgl.212.f: "거대한 기업 연합과 중간 계층의 동맹은 사자와 어린양의 동맹이었다. 시장이 무너지고 위기가 닥치자 산업의 지배자들은 온 힘을 틈새에 밀어 넣었고, 그들의 도움을 받던 이들은 곧 자신들이 누구와 손잡았는지 알게 되었다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.212.a: "러시아의 외교적 중재를 받아들인다."
 eafp_mgl.212.b: "우리 스스로 직접 협상 테이블에 나서겠다."
 eafp_mgl.213.t: "단독 노선"
 eafp_mgl.213.d: "외세의 외교적 압박과 타협 요구에 굴복하지 않고, 대몽골국 정부는 독자적인 국방력과 주권을 끝까지 지켜내겠다는 '단독 노선'을 천명했습니다. 외세의 보호에 의존하는 대신 전국의 왕공과 유목민들을 총동원하여 국경 수비를 강화하고 독자적인 국가 건설에 나섰으나, 이는 주변 강대국들의 전면적인 외교적 고립과 경제 제재의 위험을 수반하고 있습니다."
 eafp_mgl.213.f: "자유를 얻은 순간부터 강철 군화의 첩자들이 발걸음을 뒤쫓았으므로 사라지는 것 자체가 쉬운 일이 아니었다. 추적을 떨쳐 내고 홀로 목적지까지 이르기 위해서는 익숙했던 이름과 모습과 삶을 모두 뒤에 남겨야 했다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.213.a: "우리의 길은 우리가 결정한다. 단독 노선을 걷겠다."
 eafp_mgl.213.b: "외세의 지원 없이는 국가를 유지할 수 없다..."
 eafp_mgl.300.t: "사방에 보내는 복드의 칙서"
 eafp_mgl.300.d: "우르가의 복드 칸 조정은 대몽골국의 독립 선언에 이어 내몽골 49기, 후룬베이얼의 바르가, 러시아령 부랴트, 신장의 오이라트와 탄누 투바 등 사방의 모든 몽골계 부족들에게 어지를 반포했습니다. 칙서는 칭기즈 칸의 피와 불법의 인연으로 맺어진 모든 몽골 민족이 만주와 한족의 지배를 벗어나 하나의 통일된 대몽골 제국 아래 결집할 것을 엄숙히 촉구하고 있습니다."
 eafp_mgl.300.f: "대초원은 흩어진 민족들이 마지막으로 모이는 땅처럼 보였다. 오랜 세월 서로 적대하여 민족의 원한을 대대로 물려주던 여러 부족의 남은 이들이 이 광대한 평원으로 밀려와, 같은 하늘과 같은 지평선 아래 다시 자리를 잡았다.\n\n— 제임스 페니모어 쿠퍼, 『대초원』"
 eafp_mgl.300.a: "모든 몽골인은 형제다. 합류를 촉구하라!"
 eafp_mgl.300.b: "우선 인접한 내몽골 지역의 호응부터 이끌어내자."
 eafp_mgl.300.c: "외교적 마찰을 피하기 위해 신중하게 행동하라."
 eafp_mgl.301.t: "왕공의 답장"
 eafp_mgl.301.d: "복드 칸의 호소에 부응하여 내몽골 49개 기 가운데 30개 이상의 기(旗) 왕공들과 대표단이 우르가로 충성 서약 서한을 보내왔습니다. 그러나 중화민국의 군사적 보복과 한인 이주민들의 토지 개간에 억눌려 있던 남부의 일부 왕공들은 작위와 재산권 보전을 조건으로 내걸며 망설이고 있습니다. 내몽골 귀족들의 충성을 온전히 얻기 위해서는 이들의 지위와 자치를 철저히 보장해 주어야 합니다."
 eafp_mgl.301.f: "북소리가 울리자 검은 벌 떼 같은 전사들이 광장으로 모여들어 거대한 원을 이루었다. 지휘봉을 든 수장과 군대의 인장을 지닌 판관, 잉크병을 찬 서기와 참모가 차례로 나타나 사방의 군중에게 머리를 숙였다.\n\n— 니콜라이 고골, 『타라스 불바』"
 eafp_mgl.301.a: "그들의 합류를 열렬히 환영한다!"
 eafp_mgl.301.b: "왕공들의 자율성을 보장하며 점진적으로 통합한다."
 eafp_mgl.302.t: "평민의 청원"
 eafp_mgl.302.d: "내몽골과 바르가 일대에서 한인 상인들의 약탈적인 고리대와 왕공들의 가혹한 세금 징수에 시달리던 '아라드(Arad, 평민 유목민)'들이 대규모 '두구이랑(Duguilang, 원형 서명 운동)'을 결성하고 청원단을 파견했습니다. 이들은 우르가 조정이 부패한 특권층의 이익만을 대변하지 말고, 평민들의 목초지를 보호하며 채무를 탕감해 줄 것을 눈물로 호소하고 있습니다."
 eafp_mgl.302.f: "상호 부조 기금은 아직 너무 작아 싸움이 시작되면 금세 바닥날 터였다. 그러면 파업한 사람들은 마침내 노동자 협회로 몰려들 것이고, 모든 나라의 형제들이 그들을 돕기 위해 손을 내밀 수 있었다.\n\n— 에밀 졸라, 『제르미날』"
 eafp_mgl.302.a: "평민들의 청원을 수용하여 착취를 금지하라."
 eafp_mgl.302.b: "왕공들의 지지가 더 중요하다. 청원을 묵살하라."
 eafp_mgl.303.t: "고비를 건너는 군대"
 eafp_mgl.303.d: "1913년, 내몽골을 해방하고 전 몽골의 통일을 완성하기 위해 복드 칸 정부는 5개로(路) 군대를 편성하여 고비 사막을 건넜습니다. 전설적인 맹장 산닥도르지인 막사르자브와 잠스랑기인 담딘수렌, 토그토흐 타이지가 이끄는 몽골 의용 기병대는 혹독한 보급난과 기갈을 뚫고 내몽골 전역에서 중화민국 북양군을 연파하며 승전보를 울리고 있습니다."
 eafp_mgl.303.f: "여행자들은 잠시 말에서 내려 빵과 기름으로 끼니를 때우고 기운을 돋울 만큼만 마셨다. 길 위에서 취하는 일을 허락하지 않는 지휘관의 뜻에 따라, 기병대는 해가 질 때까지 쉬지 않고 다시 말을 몰았다.\n\n— 니콜라이 고골, 『타라스 불바』"
 eafp_mgl.303.a: "군대를 파견하여 고비 이남의 형제들을 해방하라!"
 eafp_mgl.303.b: "무력 충돌은 피하고 외교적 압박을 가한다."
 eafp_mgl.304.t: "러시아의 각서"
 eafp_mgl.304.d: "몽골군의 파죽지세 진격으로 중화민국과의 전면전 위기가 고조되자, 러시아 제국 정부가 우르가 조정에 강경한 외교 각서를 전달했습니다. 러시아는 내몽골에서의 군사 작전을 즉각 중단하고 고비 이북으로 철군하지 않는다면 모든 무기 공급과 재정 차관을 전면 중단하겠다고 위협하며, 몽골의 야망을 외몽골 자치 수준으로 억누르려 하고 있습니다."
 eafp_mgl.304.f: "첫 타격은 자원자들이 돈을 모아 수백만 부씩 나누어 주던 특별 신문을 겨냥했고, 그 한 번의 조치는 치명적이었다. 우편 당국의 자의적인 판정 한 줄이 그 신문을 정규 간행물에서 지워 버리고 모든 우편로를 닫아 버렸다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.304.a: "러시아의 경고를 무시하고 진군을 계속하라!"
 eafp_mgl.304.b: "러시아를 자극해선 안 된다. 군대를 물려라."
 eafp_mgl.305.t: "갈라진 길"
 eafp_mgl.305.d: "러시아의 군수 지원 중단과 중화민국의 대규모 반격, 열강의 외교적 압박 속에서 전 몽골 통합 원정은 중대한 기로에 섰습니다. 고비 이남의 군대를 물려 할하 본토의 자치와 생존을 우선 확보할 것인지, 아니면 막대한 희생과 외교적 파국을 무릅쓰고 대몽골 통일의 대업을 끝까지 밀어붙일 것인지 운명의 결단을 내려야 합니다."
 eafp_mgl.305.f: "모든 삶을 새롭게 만들 힘이 그들에게 있는지는 아직 알 수 없었고, 먼 훗날의 형제애를 바라보며 길고 험한 길을 걸으려는 사람도 많지 않았다. 눈앞의 끼니를 미루려는 이는 드물었고, 약속된 나라를 길 끝에서 볼 수 있는 눈 또한 누구에게나 주어진 것은 아니었다.\n\n— 막심 고리키, 『어머니』"
 eafp_mgl.305.a: "우리는 대몽골의 꿈을 결코 포기하지 않을 것이다."
 eafp_mgl.305.b: "할하 지역만이라도 굳건히 지키는 데 만족하자."
 eafp_mgl.400.t: "오논강의 깃발들"
 eafp_mgl.400.d: "칭기즈 칸이 탄생하고 대몽골 제국을 선포했던 유서 깊은 오논 강변에 전 초원의 부족장들과 사절들이 집결했습니다. 할하와 오이라트, 부랴트와 투바는 물론 머나먼 서방의 카자흐와 키르기스 유목 대표단까지 참석한 가운데 거행된 '초원 대쿠릴타이(Grand Kurultai)'에서, 칭기즈 칸의 후예들이 역사상 가장 거대한 유목 민족 연맹의 재건을 논의하고 있습니다."
 eafp_mgl.400.f: "젊은 전사들은 동료들과 함께 끝없는 초원으로 나가 새와 사슴과 들염소를 사냥했고, 강과 호수에서는 그물을 던져 공동체 모두가 나눌 풍성한 먹을거리를 건져 올렸다. 어떤 일에도 물러서지 않는 용기와 대담함은 곧 그들을 동료들 가운데 돋보이게 했다.\n\n— 니콜라이 고골, 『타라스 불바』"
 eafp_mgl.400.a: "오논 강변에 대쿠릴타이를 소집하라!"
 eafp_mgl.400.b: "왕공들만 모여 조촐하게 선포식을 갖자."
 eafp_mgl.400.c: "과거의 영광에 집착할 필요는 없다."
 eafp_mgl.401.t: "누가 칭기즈의 유산을 말하는가"
 eafp_mgl.401.d: "대쿠릴타이가 열리자 연맹의 정통성과 지도권을 둘러싸고 열띤 논쟁이 벌어졌습니다. 보르지긴 가문의 순수 혈통을 내세우는 황금씨족 왕공들과, 복드 칸의 종교적 성스러움을 강조하는 불교 고위 라마들, 그리고 모든 초원 유목민의 평등과 연대를 주장하는 평민 지식인들이 각자의 명분을 내세우며 주도권 다툼을 벌이고 있습니다."
 eafp_mgl.401.f: "그 시대의 모든 지도자는 자식에게 교육을 베푸는 일을 필수로 여겼기에 소년들은 먼 학교로 보내졌다. 속박 없는 자유 속에서 자란 그들은 그곳에서 얼마간의 세련됨과 공통된 지식을 얻었지만, 초원에서 익힌 거친 기질까지 잊지는 않았다.\n\n— 니콜라이 고골, 『타라스 불바』"
 eafp_mgl.401.a: "오직 황금 씨족만이 이 위대한 유산을 계승할 수 있다."
 eafp_mgl.401.b: "복드 칸의 신성한 권위가 우리를 하나로 묶을 것이다."
 eafp_mgl.401.c: "초원의 인민 모두가 칭기즈 칸의 진정한 후예다!"
 eafp_mgl.402.t: "카자흐 토레의 빈 자리"
 eafp_mgl.402.d: "서방 킵차크 초원의 카자흐 주즈(Jüz)들을 다스리던 칭기즈계 귀족 '토레(Töre)' 계층과 부족 원로들이 쿠릴타이에 참석했습니다. 이들은 몽골과의 역사적 유대를 인정하면서도, 러시아 제국의 식민 지배를 겪으며 발전한 이슬람 전통과 자치 관습법(Adat)을 침해당하지 않을까 경계하고 있습니다. 카자흐 대표단을 연맹의 동등한 주체로 포용할 수 있는 지혜가 필요합니다."
 eafp_mgl.402.f: "서로 다른 부족의 남은 이들은 마침내 같은 대초원에 모였지만, 오랜 적의와 민족의 원한은 세대에서 세대로 전해졌다. 공화국의 힘이 이 거친 땅에 평화를 되찾은 뒤에야 문명인이 한 세대 전에는 보호 없이 감히 지나지 못했던 길을 안전하게 여행할 수 있었다.\n\n— 제임스 페니모어 쿠퍼, 『대초원』"
 eafp_mgl.402.a: "서방의 카자흐 형제들을 우리 연맹에 초대하라."
 eafp_mgl.402.b: "투르크계 유목민들에게 자치를 약속하며 동맹을 맺는다."
 eafp_mgl.402.c: "그들의 땅은 너무 멀다. 몽골계에만 집중하자."
 eafp_mgl.403.t: "초승달 아래의 맹세"
 eafp_mgl.403.d: "불교를 숭상하는 몽골계 부족들과 이슬람을 신봉하는 투르크계 유목민들이 종교적 화합과 관용을 선언하는 역사적인 공동 협약을 맺었습니다. 대초원 헌장은 종교와 신앙의 자유를 절대적으로 보장하며, 불교의 법당과 이슬람의 모스크가 초원 연맹의 보호 아래 평화롭게 공존할 것임을 엄숙히 규정했습니다."
 eafp_mgl.403.f: "세계의 노동자들이 모두 한 핏줄이라는 감정은 작은 방 안의 사람들을 하나의 영혼으로 엮었다. 그 힘은 미처 다 이해하지 못한 이의 등까지 곧게 펴 주었고, 젊고 승리감에 찬 희망으로 마음을 대담하게 만들었다.\n\n— 막심 고리키, 『어머니』"
 eafp_mgl.403.a: "불교와 이슬람 모두 초원의 품 안에서 동등하다."
 eafp_mgl.403.b: "우리의 중심은 불교다. 이교도들을 배척하라."
 eafp_mgl.404.t: "차르의 국경 관리들"
 eafp_mgl.404.d: "시베리아와 중앙아시아의 유목 민족들이 몽골을 중심으로 대규모 연맹을 결성하려는 움직임을 보이자, 러시아 제국의 국경 총독들과 외교관들이 극도의 경계심을 드러냈습니다. 러시아 당국은 카자흐와 부랴트의 동요를 차단하기 위해 국경 수비를 대폭 증강하고, 연맹의 확장을 저지하기 위한 정치적·외교적 압박을 개시했습니다."
 eafp_mgl.404.f: "기마대는 반 마일 밖에서 점점 좁아지는 원을 그리며 달렸고, 그 원은 달아난 이들이 숨은 곳을 한 치씩 조여 왔다. 눈은 추적할 자들이 아직 뒤에 있음을 알려 주었으며, 전사들은 지치지 않는 인내로 은신처의 경계를 에워쌌다.\n\n— 제임스 페니모어 쿠퍼, 『대초원』"
 eafp_mgl.404.a: "러시아 국경 관리관의 요구를 단호히 거절한다."
 eafp_mgl.404.b: "충돌을 피하기 위해 적당한 선에서 타협한다."
 eafp_mgl.405.t: "베이징의 항의문"
 eafp_mgl.405.d: "중화민국 정부는 오논강 대쿠릴타이의 개최와 전초원 연맹 결성을 명백한 국가 주권 침해이자 반란 행위로 규정하고 강력한 공식 항의문을 전달했습니다. 베이징 조정은 내외몽골과 신장, 서북 변경이 불가분의 중국 영토임을 주장하며, 연맹을 즉각 해체하지 않을 경우 대규모 무력 정벌에 나설 것임을 경고하고 있습니다."
 eafp_mgl.405.f: "정부의 모든 힘을 등에 업은 지배 세력은 흔들림도 동요도 없이 폐허 위로 솟아올랐다. 그 평온과 확신은 두려울 정도였고, 그들은 자기 힘뿐 아니라 나라의 국고와 법과 제도까지 계획을 이루는 도구로 사용했다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.405.a: "중화민국은 몽골에 간섭할 권리가 없다!"
 eafp_mgl.405.b: "외교적 수사를 동원해 중국의 분노를 누그러뜨린다."
 eafp_mgl.406.t: "치타에서 온 자금"
 eafp_mgl.406.d: "러시아 내전의 소용돌이 속에서 바이칼 너머 치타를 장악한 백군 지도자 그리고리 세묘노프(Grigory Semyonov) 아타만과 일본 제국의 후원 세력이 범몽골 연맹을 지원하겠다며 막대한 자금과 무기를 제안해 왔습니다. 이 원조는 군사력 확충에 큰 도움이 되지만, 자칫 외세의 괴뢰로 전락하거나 볼셰비키와의 치명적인 전면전을 촉발할 위험을 내포하고 있습니다."
 eafp_mgl.406.f: "신문의 거대한 특별판은 뜻을 함께한 작은 자원자 군대가 돈을 대고 직접 나누어 주었다. 그러나 외부의 손길로 이어지던 그 조직망은 우편 당국의 단 한 번의 자의적 판정 앞에서 순식간에 막혀 버렸다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.406.a: "치타에서 온 자금을 받아 초원 연맹의 기반을 다진다."
 eafp_mgl.406.b: "그 돈에는 독이 들었을지 모른다. 거부하라."
 eafp_mgl.407.t: "대초원 헌장"
 eafp_mgl.407.d: "수개월간 이어진 쿠릴타이의 숙의 끝에, 전 유목 민족의 연합 체제를 규정할 최고 규범인 '대초원 헌장(The Steppe Charter)'이 마침내 성안되었습니다. 헌장은 참가국들의 고유한 자치권과 군사 방위 협력, 공동 시장과 관습법 보장을 명문화하며, 20세기 유목 세계의 부활을 알리는 영구적인 법적 초석으로 자리매김했습니다."
 eafp_mgl.407.f: "지휘봉은 관습에 따라 두 번 거절된 뒤 세 번째에 받아들여졌고, 군중의 찬성이 온 평원을 뒤흔들었다. 가장 나이 든 전사 넷이 앞으로 나와 비에 젖은 흙을 새 지도자의 머리에 얹었으며, 그는 흙탕물이 얼굴을 타고 흘러도 움직이지 않은 채 공동체가 베푼 명예에 감사했다.\n\n— 니콜라이 고골, 『타라스 불바』"
 eafp_mgl.407.a: "신정 국가의 기틀 위에서 대몽골을 선포한다."
 eafp_mgl.407.b: "왕공들의 입헌 군주국으로 대몽골을 선포한다."
 eafp_mgl.407.c: "모든 유목민이 평등한 공화국으로 대몽골을 선포한다."
 eafp_mgl.407.e: "자유롭고 민주적인 초원 연방을 향하여!"
 eafp_mgl.408.t: "초원 연맹의 초청"
 eafp_mgl.408.d: "오논강 헌장이 제정된 후, 참가한 주요 부족과 국가들의 최고 회의에서 헌장 비준 절차가 개시되었습니다. 서방의 카자흐와 오이라트, 투바와 부랴트의 대표들이 자국 의회와 부족 회의의 압도적인 지지를 얻어 헌장을 정식으로 비준함에 따라, 초원 연맹은 명실상부한 다자간 국제 연합체로 가동되기 시작했습니다."
 eafp_mgl.408.f: "혁명의 조직은 한 나라의 백오십만 명을 세계 다른 곳의 이천삼백오십만 명과 이어 주었다. 그 수와 결속의 규모가 드러나자 모인 사람들의 얼굴에는 근심이 번지고 굳게 다문 입술이 늘어났으며, 마침내 피할 수 없는 겨룸의 표지가 던져졌다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.408.a: "초원 연맹의 구상에 동참하여 대표를 파견한다."
 eafp_mgl.408.b: "우리는 우리 스스로의 앞가림만으로도 벅차다."
 eafp_mgl.409.t: "말 위의 제국인가, 맹약의 연방인가"
 eafp_mgl.409.d: "초원 연맹의 성립과 함께 대외적 위상이 확립되면서, 연맹의 미래 비전에 관한 근본적인 국가적 결단의 순간이 다가왔습니다. 칭기즈 칸 시대의 정복 제국으로 회귀하여 대외 팽창에 나설 것인지, 아니면 상호 존중과 자치에 기반한 평화로운 근대 초원 연방을 번영시킬 것인지에 따라 아시아 대륙의 세력 균형이 완전히 재편될 것입니다."
 eafp_mgl.409.f: "전사의 선언은 차분했으나 분명하고 단호했다. 여러 수장이 지도자를 바라보았지만 누구도 오래된 관습에 맞는 원로의 결정을 거스르지 않았고, 적의와 야심을 품은 자조차 겉으로는 말없이 결과를 기다렸다.\n\n— 제임스 페니모어 쿠퍼, 『대초원』"
 eafp_mgl.409.a: "황금 씨족의 영광이 다시 한번 아시아를 호령하리라!"
 eafp_mgl.409.b: "각 부족의 자치를 존중하는 느슨한 연방이 될 것이다."
 eafp_mgl.409.c: "유목민들의 권익을 보호하는 거대한 방벽이 세워졌다."
 eafp_mgl.500.t: "공장으로 가는 길"
 eafp_mgl.500.d: "근대 산업화를 추진하기 위해 필수적인 원자재와 기계를 수송할 교통망이 절대적으로 부족합니다. 흙먼지 날리는 수백 킬로미터의 고비 대상로와 비포장 역참에만 의존하던 낙타와 소 수레의 운송 방식에서 벗어나, 주요 광산과 도시를 잇는 간선 도로망을 확충하고 교량을 건설하여 건설 자재와 산업 물자의 유통 속도를 획기적으로 끌어올려야 합니다."
 eafp_mgl.500.f: "초원은 나무와 물이 모자라 사람이 터를 잡기에 큰 어려움이 따르는 땅이었다. 그러나 땅속에는 석탄이 풍부했고 우물을 파는 일도 대개 성공했으므로, 이주민의 끈질긴 노력은 조금씩 자연이 놓은 장벽을 이겨 내고 있었다.\n\n— 제임스 페니모어 쿠퍼, 『대초원』"
 eafp_mgl.500.a: "수공업 길드를 해체하고 근대식 공장으로 전환하라."
 eafp_mgl.500.b: "수공업자들의 생계를 위협해선 안 된다."
 eafp_mgl.500.c: "수공업 길드와 협력하여 점진적 산업화를 꾀한다."
 eafp_mgl.501.t: "석탄과 철의 조사대"
 eafp_mgl.501.d: "국가 산업화의 근간이 되는 연료와 금속 자원을 확보하기 위해 지질학자들과 광업 기술자들로 구성된 대규모 국토 자원 조사대가 파견되었습니다. 날라이흐 탄전과 북부 산림지대의 철광석 매장지를 정밀 탐사하여 광산 개발의 경제성을 평가하고, 국내 자급자족을 위한 근대식 광업 인프라 구축 계획을 수립하고 있습니다."
 eafp_mgl.501.f: "어둠 속에서 갱도가 모습을 드러내자 절망도 다시 고개를 들었다. 둑 위의 철 바구니 세 개에서는 작업장을 밝히고 덥힐 석탄불이 타올랐고, 살아 있는 그림자 같은 인부들은 그 불 곁에서 광차를 기울여 쓸모없는 돌을 쏟아 냈다.\n\n— 에밀 졸라, 『제르미날』"
 eafp_mgl.501.a: "외국 자본을 유치하여 광산을 대규모로 개발하자."
 eafp_mgl.501.b: "자원은 우리의 것이다. 우리 손으로 직접 파내겠다."
 eafp_mgl.502.t: "우르가의 작업장"
 eafp_mgl.502.d: "우르가의 골목길에 흩어져 있던 대장장이, 가죽 무두장이, 마구 제작자, 펠트 직공 등 수공업 장인들이 국가의 지원 아래 협동 작업장으로 재편되고 있습니다. 낡은 가내수공업 방식을 탈피하여 분업과 표준화된 규격을 도입하고, 기초적인 동력 기계를 보급함으로써 군용 마구와 의류, 생필품 생산성을 크게 향상시키고 있습니다."
 eafp_mgl.502.f: "지평선 곳곳에는 일감이 줄어든 작업장과 간신히 돌아가는 제분소와 밧줄 공장이 흩어져 있었다. 세 개의 용광로 가운데 둘만 불을 밝혔고, 임금 삭감 소문이 도는 유리 공장에서는 파업의 기운이 자라나고 있었다.\n\n— 에밀 졸라, 『제르미날』"
 eafp_mgl.502.a: "날라이흐 광산의 이권을 국가가 통제한다."
 eafp_mgl.502.b: "외국 광산 회사의 자율성을 보장한다."
 eafp_mgl.502.c: "광산 노동자들의 권익과 처우 개선이 우선이다."
 eafp_mgl.503.t: "산업 조달 장부"
 eafp_mgl.503.d: "공장 건설과 광산 개발에 필요한 자본과 원자재를 조달하기 위해 정부의 재무 조달 장부가 작성되었습니다. 목재와 벽돌, 시멘트와 수입 기계를 확보하기 위해 국내 상인들의 자본을 유치하고, 세수와 차관을 효율적으로 배분하여 산업 프로젝트들이 자금 고갈 없이 원활히 진행될 수 있도록 총력을 기울여야 합니다."
 eafp_mgl.503.f: "각 노동자는 장벽 앞에서 자기 번호가 찍힌 등불을 받아 직접 살피고 잠갔다. 탁자에 앉은 기록원은 내려간 시간을 장부에 적었고, 마지막 검사관은 모두의 등불이 제대로 닫혔는지를 다시 확인했다.\n\n— 에밀 졸라, 『제르미날』"
 eafp_mgl.503.a: "전국의 가축을 모아 대규모 가죽 가공 공장을 세운다."
 eafp_mgl.503.b: "전통적인 피혁 가공 방식을 보호해야 한다."
 eafp_mgl.503.c: "가죽과 육류의 수출을 통해 산업 자본을 마련하자."
 eafp_mgl.504.t: "광산과 도시의 식량"
 eafp_mgl.504.d: "광산촌과 공장 지대로 유입되는 노동자 인구가 급증함에 따라 도시의 식량 및 육류 수급 문제가 심각한 현안으로 대두되었습니다. 광산 노동자들과 도시 주민들의 굶주림을 방지하기 위해 주변 유목민들로부터 안정적으로 가축과 유제품을 수매하고, 곡물 비축 창고를 운영하는 체계적인 식량 보급망을 구축해야 합니다."
 eafp_mgl.504.f: "찬장은 비었고 어린것들은 빵과 버터를 찾았으며 커피마저 떨어졌다. 물은 배앓이를 일으켰고, 긴 하루하루는 삶은 양배추 잎으로 허기를 속이며 지나갔다.\n\n— 에밀 졸라, 『제르미날』"
 eafp_mgl.504.a: "유목민들에게 정착과 농경을 강요한다."
 eafp_mgl.504.b: "유목 생활은 몽골의 정체성이다. 강요할 수 없다."
 eafp_mgl.504.c: "식량 수입을 늘려 도시에 식량을 공급한다."
 eafp_mgl.505.t: "인민상호원조협동조합"
 eafp_mgl.505.d: "1921년, 외국 상인들의 폭리와 중간 착취를 근절하고 유목민과 노동자들의 권익을 보호하기 위해 '인민상호원조협동조합(Ardyn Khariltsan Tuslaltsakh Khorsho)'이 설립되었습니다. 협동조합은 가축과 양모, 가죽을 공정한 가격에 수매하고 생필품과 농기구를 저렴하게 공급함으로써, 국가 경제의 자립적 유통망을 굳건히 다지고 있습니다."
 eafp_mgl.505.f: "작은 방에서 태어난 연대감은 사람들을 하나의 영혼으로 묶었다. 삶의 주인이면서 동시에 노예였던 이들이 오래된 편견의 사슬을 벗고 새로운 주인으로 일어서자, 젊고 힘찬 희망이 방 안을 가득 채웠다.\n\n— 막심 고리키, 『어머니』"
 eafp_mgl.505.a: "인민상호원조협동조합을 통해 유통망을 장악한다."
 eafp_mgl.505.b: "중국과 러시아 상인들의 상권을 그대로 둔다."
 eafp_mgl.505.c: "국가가 직접 무역 독점권을 행사한다."
 eafp_mgl.506.t: "첫 세속·직업 학교"
 eafp_mgl.506.d: "국가 근대화와 산업화를 이끌어갈 전문 기술 인력을 양성하기 위해 최초의 세속 공립학교와 직업기술학당이 문을 열었습니다. 청년 유목민들에게 기계 공학, 측량술, 부기 회계, 수의학 및 기초 문해 교육을 실시함으로써, 외국인 기사에 의존하던 산업 현장을 자국민 기술자들의 손으로 채워나갈 발판을 마련했습니다."
 eafp_mgl.506.f: "토요일마다 동무들이 한집에 모였고, 모임 하나하나는 먼 곳으로 이어진 긴 계단의 한 층이 되었다. 사람들은 조금씩 더 높이 올라갔지만 계단의 꼭대기는 아직 보이지 않았고, 그래서 책을 읽고 생각을 나누는 일은 멈추지 않았다.\n\n— 막심 고리키, 『어머니』"
 eafp_mgl.506.a: "서구식 기술 학교를 널리 세워 기술자를 양성하라."
 eafp_mgl.506.b: "사원의 반발을 의식하여 교육 개혁의 속도를 조절한다."
 eafp_mgl.506.c: "소수의 인재만 선발하여 해외로 유학 보낸다."
 eafp_mgl.507.t: "송기노 수의소와 산업 위생"
 eafp_mgl.507.d: "1923년, 탄저병과 구제역 등 가축 전염병의 창궐을 막고 피혁·양모 가공 산업의 원료 위생을 확보하기 위해 '송기노(Songino) 중앙 생물학·수의 연구소'가 설립되었습니다. 전국적인 가축 방역망을 구축하고 백신을 생산하여 가축 폐사율을 대폭 낮춤으로써, 축산 기반 경제와 가공 산업의 안정성을 획기적으로 개선하고 있습니다."
 eafp_mgl.507.f: "바위를 파고 벽돌로 둥글게 쌓은 마구간에는 스무 마리의 말을 들일 수 있었고, 신선한 깔짚과 살아 있는 짐승의 온기가 편안하게 감돌았다. 등불 하나가 잔잔한 빛을 내는 가운데 말들은 커다랗고 순한 눈으로 고개를 돌렸다가 서두르지 않고 다시 건초를 먹었다.\n\n— 에밀 졸라, 『제르미날』"
 eafp_mgl.507.a: "전국적인 가축 방역 시스템을 의무화한다."
 eafp_mgl.507.b: "새로운 수의학을 불신하는 유목민들의 뜻을 존중한다."
 eafp_mgl.507.c: "송기노 수의소의 성과를 홍보하여 자발적 참여를 유도한다."
 eafp_mgl.508.t: "몽골로르 양허"
 eafp_mgl.508.d: "러시아 자본이 지배하던 예로와 셀렝게 유역의 거대한 금광 개발 회사인 '몽골로르(Mongolor)' 양허권에 대한 전면적인 재협상이 시작되었습니다. 광산에서 채굴되는 막대한 귀금속의 국외 유출을 억제하고, 국가 세수를 증대시키며 현지 몽골 노동자들의 가혹한 노동 조건을 개선하기 위해 양허권의 국유화 또는 국가 지분 확대를 추진해야 합니다."
 eafp_mgl.508.f: "거대 기업들은 중간 상인과 작은 제조업자를 무너뜨리는 와중에도 굳건히 서 있었고, 스스로 불러온 폭풍을 견딜 힘으로 떠다니는 잔해를 약탈했다. 가치가 믿기 어려울 만큼 쪼그라들자 그들은 헐값에 소유를 불리고 새로운 영역까지 손을 뻗었다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.508.a: "몽골로르 금광 회사의 지분을 국가가 회수한다."
 eafp_mgl.508.b: "외국 자본의 금광 채굴권을 인정하고 세금만 거둔다."
 eafp_mgl.508.c: "금광에서 일하는 노동자들의 임금을 대폭 인상하라."
 eafp_mgl.509.t: "날라이흐와 산업의 연료"
 eafp_mgl.509.d: "우르가 동남쪽 35마일 지점에 위치한 날라이흐(Nalaikh) 탄전의 대대적인 근대화 개발이 본궤도에 올랐습니다. 갱도를 현대화하고 증기 동력 권양기를 도입하여 채굴된 석탄은 수도 우르가의 첫 화력 발전소와 벽돌 공장, 난방용 연료로 공급되며 몽골 산업의 심장부에 꺼지지 않는 에너지를 불어넣고 있습니다."
 eafp_mgl.509.f: "석탄을 실은 광차는 작업장에서 곧장 들어와 긴 철제 미끄럼틀 위의 투입구로 기울어졌다. 양쪽 계단에 선 선별공들은 삽과 갈퀴로 돌을 골라내고 깨끗한 석탄을 모았으며, 석탄은 깔때기를 지나 아래의 철도 화차로 떨어졌다.\n\n— 에밀 졸라, 『제르미날』"
 eafp_mgl.509.a: "울란바토르에 대규모 화력 발전소를 건설하라."
 eafp_mgl.509.b: "발전소 건설 비용이 너무 막대하다. 계획을 취소한다."
 eafp_mgl.509.c: "소규모 발전기를 도입하여 공장 가동에만 우선 사용한다."
 eafp_mgl.510.t: "광업과 공장 규정"
 eafp_mgl.510.d: "1923년, 급성장하는 광산과 제조 시설의 무질서한 난개발을 방지하고 산업 안전을 확립하기 위해 '국가 광업 및 공장 규정'이 공포되었습니다. 근로 시간 제한, 최저 임금 기준, 안전 장비 의무화 및 환경 훼손 방지 조항을 명문화하여 노동자들의 생명을 보호하고 지속 가능한 산업 발전의 기틀을 확립했습니다."
 eafp_mgl.510.f: "군중이 돌아서자 에티엔은 펌프만은 계속 돌려 달라고 간청했다. 갱도를 파괴해서 무엇을 얻을 수 있는지 알 수 없었고, 쌓인 원한에도 불구하고 그런 일은 노동자로서의 마음을 거슬렀으며, 마외 역시 기계에 복수하는 것은 부당하다고 여겼다.\n\n— 에밀 졸라, 『제르미날』"
 eafp_mgl.510.a: "엄격한 노동 규정과 광업법을 제정한다."
 eafp_mgl.510.b: "자본가들의 편의를 위해 규제를 최소화한다."
 eafp_mgl.510.c: "노동 조합의 결성을 허용하고 교섭권을 보장한다."
 eafp_mgl.511.t: "몽골-러시아 은행과 투그릭"
 eafp_mgl.511.d: "1924년 몽골-러시아 합작 은행이 설립되고, 이듬해 1925년 몽골의 독자적인 법정 화폐인 '투그릭(Tögrög)'이 발행되었습니다. 외국의 잡다한 은화와 멕시코 달러, 조잡한 차전(茶錢)이 난립하던 화폐 시장을 단일한 은본위제 투그릭으로 통일함으로써, 국가 재정의 자주성을 확보하고 산업 투자를 위한 안정적인 신용 공급망을 구축했습니다."
 eafp_mgl.511.f: "은행들은 지배 질서를 이루는 가장 중요한 힘 가운데 하나였고, 위기가 닥치자 곧바로 신용을 거두어들였다. 주식 시장은 모든 토지의 가치를 거의 무로 부수는 소용돌이가 되었으며, 그 파산과 폐허 위에서 새 지배 세력은 흔들림 없이 솟아올랐다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.511.a: "몽골 국가은행을 설립하여 독자적인 화폐인 투그릭을 발행하라!"
 eafp_mgl.511.b: "기존의 은화와 멕시코 달러 유통 체제를 유지한다."
 eafp_mgl.511.c: "러시아 루블화를 몽골의 공식 화폐로 채택한다."
 eafp_mgl.512.t: "몽골트란스와 산업 운송"
 eafp_mgl.512.d: "1925년 설립된 국영 수송 합작 회사인 '몽골트란스(Mongoltrans)'가 현대식 트럭과 버스를 대거 도입하여 초원 물류의 일대 혁신을 일으키고 있습니다. 광산의 원료와 공장의 완제품을 신속하게 실어나르며 과거 수개월이 걸리던 시베리아 국경과 수도 사이의 운송 시간을 며칠 단위로 단축시켰습니다."
 eafp_mgl.512.f: "일을 멈춘 사람들은 싸우지 않고 아무것도 하지 않음으로써 제국의 손발을 묶었다. 바퀴 하나 돌지 않았고 기차 한 대 달리지 않았으며 전신 한 줄 오가지 않았으니, 철도원과 전신원도 나머지 백성과 함께 일을 멈춘 까닭이었다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.512.a: "몽골트란스를 국영화하여 물류망을 국가가 통제한다."
 eafp_mgl.512.b: "외국 상인들의 운수 독점권을 당분간 묵인한다."
 eafp_mgl.512.c: "도로 포장과 교량 건설 등 인프라 확충에 먼저 투자한다."
 eafp_mgl.513.t: "수공업자에서 공장 노동자로"
 eafp_mgl.513.d: "전통적인 목축과 영세한 가내수공업에 종사하던 수만 명의 유목민과 장인들이 근대식 기계 공장의 숙련 노동자로 탈바꿈하고 있습니다. 도시로 이주한 이들은 근대적 생산 규율과 기술을 습득하며 몽골 역사상 최초의 '산업 프롤레타리아' 계급을 형성하고, 국가 경제의 강력한 주역으로 부상하고 있습니다."
 eafp_mgl.513.f: "저녁 해의 붉은 빛이 집들의 창문에 힘없이 어른거릴 무렵, 공장은 사람들을 타다 남은 재처럼 밖으로 토해 냈다. 검은 얼굴에는 기계 기름 냄새가 배어 있었지만 하루의 고된 예속이 끝났다는 안도 속에서 목소리에는 다시 생기가 돌았다.\n\n— 막심 고리키, 『어머니』"
 eafp_mgl.513.a: "수공업자들을 대거 공장으로 편입시켜 프롤레타리아 계급을 창출한다."
 eafp_mgl.513.b: "농촌과 초원의 유목민들을 도시 노동자로 유인한다."
 eafp_mgl.513.c: "해외에서 숙련된 노동자들을 수입한다."
 eafp_mgl.514.t: "초이발상 산업 복합체"
 eafp_mgl.514.d: "1934년, 우르가 외곽 톨 강변에 몽골 최대 규모의 종합 산업 기지인 '처이발상 산업 콤비나트(Industrial Combine)'가 완공되었습니다. 대규모 피혁 가공 공장, 양모 세척장, 제화 공장, 직물 방적 공장 및 자가 발전소가 유기적으로 결합된 이 거대한 복합체는 연간 수십만 점의 가죽 제품과 직물을 생산하며 국가 경공업의 자립을 완성했습니다."
 eafp_mgl.514.f: "공장은 하루를 통째로 삼켰고 기계는 필요한 만큼 사람의 근육에서 기운을 빨아냈다. 삶에서 지워진 하루는 흔적도 남기지 않았으며, 사람은 자신도 모르는 사이 무덤을 향해 한 걸음 더 나아갔다.\n\n— 막심 고리키, 『어머니』"
 eafp_mgl.514.a: "처이발상 일대에 거대한 산업 콤비나트를 구축하라!"
 eafp_mgl.514.b: "이러한 대형 프로젝트는 우리 분수에 맞지 않는다."
 eafp_mgl.515.t: "좌경적 일탈"
 eafp_mgl.515.d: "1928년 이후 집권한 급진 좌파 세력은 국가의 경제 현실을 무시한 채 '좌경적 일탈(Left Deviation)' 정책을 강행했습니다. 유목민들의 가축을 강제로 집산화하고, 사원의 재산을 무자비하게 몰수하며, 민간 상거래를 전면 금지하는 극단적인 조치는 농촌 경제의 붕괴와 유목민들의 격렬한 분노를 촉발했습니다."
 eafp_mgl.515.f: "철도는 운임으로 농민을 억눌렀고 은행가와 투기꾼은 가격을 마음대로 움직였으며, 빚은 해마다 농민의 피를 말렸다. 거대 기업들이 힘을 합쳐 농토까지 하나의 독점망으로 묶자, 그물 안에 갇힌 이들에게는 빠져나갈 틈이 남지 않았다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.515.a: "급진적인 좌경화 정책을 추진하여 사유재산을 몰수한다."
 eafp_mgl.515.b: "이러한 극단주의는 국가를 파멸시킬 뿐이다. 책임자를 숙청하라."
 eafp_mgl.516.t: "가축과 사람이 국경을 넘다"
 eafp_mgl.516.d: "가혹한 강제 집산화와 종교 탄압을 견디지 못한 수만 명의 유목민들이 가축을 이끌고 내몽골과 신장, 부랴트 국경을 넘어 대규모 탈출을 감행하고 있습니다. 국경을 넘지 못한 이들은 가축을 국가에 빼앗기느니 차라리 도살하는 극단적인 저항을 선택하면서, 수백만 마리의 가축이 사라지고 국가 생산 기반이 파멸적 타격을 입고 있습니다."
 eafp_mgl.516.f: "사람들은 거의 모두 홀로 걸었고 함께 온 이들도 지쳐 한 줄로 늘어섰다. 맨발로 신을 들고 걷는 자들의 거친 양말이 땅을 스치는 소리는 패배한 군대의 끝없는 행군처럼 이어졌고, 숙인 머리마다 다시 싸워 원한을 갚으려는 뜻이 어둡게 맺혀 있었다.\n\n— 에밀 졸라, 『제르미날』"
 eafp_mgl.516.a: "가축 국유화 조치에 분노한 유목민들의 대규모 이탈이 시작되다."
 eafp_mgl.516.b: "국경 수비대를 강화하여 유목민들의 이탈을 막아라."
 eafp_mgl.517.t: "1932년의 봉기"
 eafp_mgl.517.d: "1932년 봄, 훕스굴, 아르항가이, 자브항 등 서북부 주 전역에서 강제 집산화와 사원 파괴에 맞선 대규모 무장 민중 봉기가 폭발했습니다. 라마 승려들과 유목민들이 결사대를 조직하여 관아를 습격하고 당 간부들을 축출하며 붉은 군대와 처절한 내전을 벌이고 있어, 국가 체제 자체가 붕괴의 위기에 직면했습니다."
 eafp_mgl.517.f: "첫 봉기는 계획되지 않았고 때 이르게 일어났으며, 그 실패 뒤에 준비된 두 번째 봉기마저 더 참혹한 형벌 속에서 무너졌다. 지배 질서가 피로 세운 현실이 된 뒤에도 사람들은 그것이 몇 해 안에 끝나리라 믿었으나, 그 믿음보다 억압의 뿌리가 훨씬 깊었다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.517.a: "불교도 반란군을 무자비하게 진압하라!"
 eafp_mgl.517.b: "신정책(Шинэ эргэлт)을 선포하여 민심을 수습한다."
 eafp_mgl.518.t: "신전환"
 eafp_mgl.518.d: "1932년 여름, 국가 파멸의 위기 앞에서 당과 정부는 극단적인 강제 집산화를 전면 철회하고 '신전환(Shine Ergelt)' 정책을 전격 선포했습니다. 사유 가축 소유권을 회복시키고, 민간 상거래와 종교 활동의 자유를 일부 보장하며, 과도한 세금을 감면하는 유화책을 펼침으로써 극심했던 내전의 상처를 치유하고 경제 안정을 되찾기 시작했습니다."
 eafp_mgl.518.f: "비옥한 대지의 옆구리에서 생명이 뛰쳐나오고 새싹은 푸른 잎을 터뜨렸으며 들판은 자라나는 풀로 떨렸다. 사방에서 씨앗이 부풀어 올라 흙을 갈라 열기와 빛을 향했고, 새 아침의 땅은 다시 시작되는 삶의 소리로 가득 찼다.\n\n— 에밀 졸라, 『제르미날』"
 eafp_mgl.518.a: "국가의 통제 경제 노선을 완화하고 제한적인 자유 시장을 허용한다."
 eafp_mgl.518.b: "반동 세력의 준동을 꺾기 위해 더욱 강력한 철권 통치를 실시한다."
 eafp_mgl.519.t: "새 산업 국가"
 eafp_mgl.519.d: "혹독한 시련과 개혁을 이겨낸 몽골은 마침내 원자재 추출부터 가공 경공업, 전력과 운송망이 유기적으로 결합된 '새 산업 국가'의 위용을 갖추었습니다. 가축을 방목하던 유목민의 땅 위에 근대식 공장과 탄광이 조화롭게 자리 잡으며, 경제적 자립과 번영을 구가하는 강건한 근대 국가로 도약했습니다."
 eafp_mgl.519.f: "나무와 물이 모자라는 초원의 결핍은 사람이 뿌리내리는 데 큰 장애였다. 그러나 석탄이 풍부하고 우물을 파는 일이 잇달아 성공하면서, 사람의 기술과 끈기는 자연이 남긴 빈자리를 하나씩 채워 갔다.\n\n— 제임스 페니모어 쿠퍼, 『대초원』"
 eafp_mgl.519.a: "모든 몽골 영토를 아우르는 통합 산업 계획을 수립한다."
 eafp_mgl.519.b: "각 지역의 고유한 경제 체제를 존중하며 독자 개발을 허용한다."
 eafp_mgl.519.c: "할하 본토의 산업화에만 자원을 집중한다."
 eafp_mgl.520.t: "전국 산업 계획"
 eafp_mgl.520.d: "할하 본토를 넘어 내몽골, 부랴트, 투바, 신장 오이라트 등 통합된 전 몽골 영토를 하나의 유기적인 경제권으로 묶는 '전국 산업 종합 계획'이 수립되었습니다. 각 지역의 지리적 특성과 부존자원에 맞춰 광업, 축산 가공업, 중공업 기지를 효율적으로 분산 배치하여 지역 간 격차를 해소하고 균형 발전을 도모하고 있습니다."
 eafp_mgl.520.f: "기계와 사회 조직이 발전하자 문명인이 만들어 내는 힘은 도구조차 없던 시대와 견줄 수 없이 커졌다. 흩어진 노동을 계획하고 서로 맞물리는 기계로 연결하는 일은 한 사람의 힘을 천 사람의 힘으로 바꾸어 놓았다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.520.a: "지방 왕공들의 반발을 억누르고 중앙 집권적 통제 경제를 강행한다."
 eafp_mgl.520.b: "지방의 경제적 권리를 일정 부분 양보하여 타협한다."
 eafp_mgl.520.c: "오직 자본주의적 시장 경제만이 모두를 풍요롭게 할 것이다."
 eafp_mgl.521.t: "공동 세관과 산업 규격"
 eafp_mgl.521.d: "통합 영토 내부의 모든 기(旗)와 지방 간에 존재하던 봉건적 관세 장벽과 통행세를 전면 철폐하고, 단일한 세관망과 국가 표준 산업 규격을 제정했습니다. 도량형의 통일과 부품 및 자재의 호환성이 확보됨에 따라 광대한 영토 내에서의 상품 이동과 공장 간 협업이 비약적으로 가속화되고 있습니다."
 eafp_mgl.521.f: "협회는 싸움이 닥칠 때 광부들에게 가장 큰 힘이 될 것이었다. 작은 지역 기금이 고갈되더라도 여러 나라의 형제들이 같은 조직을 통해 손을 내밀 수 있었으므로, 하나의 규칙과 하나의 장부는 멀리 떨어진 사람들의 힘을 이어 주었다.\n\n— 에밀 졸라, 『제르미날』"
 eafp_mgl.521.a: "초원 연맹 내부의 모든 관세를 철폐하고 단일 시장을 창설한다."
 eafp_mgl.521.b: "지역 간 산업 격차를 고려하여 점진적으로 관세를 낮춘다."
 eafp_mgl.521.c: "세입 보존을 위해 역내 관세를 그대로 유지한다."
 eafp_mgl.522.t: "광역 수송망"
 eafp_mgl.522.d: "바이칼 호반에서 내몽골 초원과 천산산맥에 이르는 광활한 강역을 연결하는 '대초원 광역 간선 수송망' 구축 사업이 추진되고 있습니다. 간선 철도 부설과 포장도로 건설, 전신선 가설이 동시다발적으로 진행되면서, 거대한 제국의 원자재와 공산품이 며칠 안에 전역으로 보급되는 물류의 대동맥이 완성되었습니다."
 eafp_mgl.522.f: "커다란 작업장 안으로 들어온 석탄 광차는 투입구에 짐을 쏟았고, 골라낸 석탄은 긴 철제 통로와 깔때기를 거쳐 아래의 철도 화차로 흘러들었다. 갱도와 선별장과 철길이 하나로 이어지자 땅속의 검은 돌은 멈추지 않고 먼 곳으로 실려 갔다.\n\n— 에밀 졸라, 『제르미날』"
 eafp_mgl.522.a: "철도망을 깔아 전 몽골을 하나로 연결하라!"
 eafp_mgl.522.b: "비용이 저렴한 도로와 통신망 확충에 우선순위를 둔다."
 eafp_mgl.522.c: "교통망 확충은 외부의 침략로가 될 수 있다. 유보하라."
 eafp_mgl.523.t: "원료와 공장의 배치"
 eafp_mgl.523.d: "목화와 양모, 피혁 등 1차 원자재 생산지와 가공 공장 간의 지리적 불균형을 해소하기 위한 산업 재배치 정책이 시행되었습니다. 원자재 산지 인근에 1차 정제 및 가공 시설을 세워 운송 비용을 획기적으로 절감하고, 최종 소비 도시에는 정밀 가공 및 제조업을 집중시키는 고도화된 공급망 체계가 구축되었습니다."
 eafp_mgl.523.f: "평평한 지평선에는 굴뚝이 줄무늬처럼 늘어섰고 길을 따라 나무 창고와 먼지 낀 큰 창을 단 벽돌 작업장이 이어졌다. 소리가 퍼질 때마다 남자와 여자와 아이가 온 가족으로 집을 나와 뒤따르는 행렬에 합류했고, 서로 떨어졌던 일터와 마을은 하나의 흐름으로 합쳐졌다.\n\n— 에밀 졸라, 『제르미날』"
 eafp_mgl.523.a: "변방의 자원을 수탈하여 수도 우란바토르에 부를 집중시킨다."
 eafp_mgl.523.b: "자원 산지 인근에 공장을 세워 지역 균형 발전을 도모한다."
 eafp_mgl.523.c: "원료를 수출하고 완제품을 수입하는 기존 구조에 순응한다."
 eafp_mgl.524.t: "노동자와 이주민"
 eafp_mgl.524.d: "광역 산업화의 급속한 진전에 따라 새로운 공업 도시들로 수십만 명의 인구가 이동하면서 노동력 재배치와 민족 간 조화가 중대한 과제로 떠올랐습니다. 몽골인 유목민 노동자들과 이주 기술 인력 간의 임금 격차와 문화적 갈등을 해소하고 공정한 노동 조건을 보장함으로써, 산업 평화와 사회 통합을 공고히 다져야 합니다."
 eafp_mgl.524.f: "세계 노동자들의 보편적인 친족 관계는 방 안의 모두를 한 영혼으로 엮었다. 각자 다른 삶에서 온 사람들은 세계의 주인이면서 노예라는 같은 처지를 깨닫고, 편견의 굴레를 벗은 새로운 삶의 주인으로 서로를 바라보았다.\n\n— 막심 고리키, 『어머니』"
 eafp_mgl.524.a: "한인 등 외국인 노동자들의 유입을 적극 수용하여 노동력 부족을 해결한다."
 eafp_mgl.524.b: "외국인 유입을 엄격히 통제하고 몽골인 중심의 고용을 강제한다."
 eafp_mgl.524.c: "외국인 노동자에게 특별세를 부과하여 국가 재정을 확충한다."
 eafp_mgl.525.t: "하나의 산업 시장"
 eafp_mgl.525.d: "수년간의 체계적인 투자와 통합 정책의 결실로, 전 몽골 강역이 완벽하게 자급자족하는 거대한 '단일 산업 시장'으로 거듭났습니다. 광산의 석탄과 철, 초원의 가축과 양모, 도시의 기계와 소비재가 막힘없이 순환하며, 대몽골국은 외세의 경제적 압박에 흔들리지 않는 확고한 경제적 주권을 완성했습니다."
 eafp_mgl.525.f: "일곱 거대 기업은 막대한 잉여를 한데 모아 농업 전체를 하나의 연합으로 묶었다. 철도와 은행과 시장이 함께 움직이는 그 조직 안에서는 운임과 가격과 신용이 따로 흐르지 않았고, 모든 생산과 교환이 하나의 거대한 그물에 걸렸다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.525.a: "드디어 거대한 통합 몽골 산업 지대가 완성되었다!"
 eafp_mgl.525.b: "많은 희생이 따랐지만, 우리는 근대화에 성공했다."
 eafp_mgl.525.c: "산업화의 그늘 아래 남겨진 자들을 위한 복지가 필요하다."
 eafp_mgl.526.t: "통합인가 추출인가"
 eafp_mgl.526.d: "광역 산업 지대가 완성되면서, 제국의 중심부와 주변부 간의 경제적 관계를 둘러싼 근본적인 통치 철학의 갈등이 수면 위로 떠올랐습니다. 변방의 자원을 수도 우르가로 수탈하여 중심부의 번영만을 꾀하는 '자원 추출' 노선을 걸을 것인지, 아니면 모든 자치령과 소수 민족에게 산업의 결실을 공평히 나누는 '상생의 통합' 노선을 완성할 것인지 역사적 선택을 내려야 합니다."
 eafp_mgl.526.f: "산업의 지배자들은 스스로 빚어낸 폭풍을 견디면서 그 속에서 이익까지 거두었다. 무너진 중간 상인과 작은 생산자의 잔해를 헐값에 거두어 소유를 불리고 새 영역으로 뻗어 나간 그들의 번영은 언제나 주변부의 희생을 대가로 삼았다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.526.a: "우리는 피를 나눈 형제들을 단단히 결속시켰다."
 eafp_mgl.526.b: "형제들을 착취하여 이룩한 제국이다."
 eafp_mgl.526.c: "이 거대한 연맹이 언제까지 유지될 수 있을까?"
 eafp_mgl.600.t: "캬흐타의 타협"
 eafp_mgl.600.d: "1915년, 러시아 제국, 중화민국, 대몽골국 3국 대표단이 국경 도시 캬흐타에 모여 9개월간의 치열한 줄다리기 끝에 '캬흐타 협정'을 체결했습니다. 중화민국의 명목상 종주권과 러시아의 경제적 기득권을 인정하는 대가로, 외몽골의 내정 자치권과 군대 보유권, 사법 독립을 국제적으로 확약받으며 불안정한 평화를 획득했습니다."
 eafp_mgl.600.f: "권리의 충돌을 화해시키고 나라 사이의 불신을 가라앉히는 일은 광대한 내륙의 통로를 여는 대가와 함께 이루어졌다. 제국을 평화롭게 나누어야 할 때가 온다면, 이웃이 같은 제도와 정치적 정의의 감각을 지니기를 바라는 희망만이 그 타협을 떠받쳤다.\n\n— 제임스 페니모어 쿠퍼, 『대초원』"
 eafp_mgl.600.a: "우리의 외교적 위상 한계를 인정하고 캬흐타 조약에 서명한다."
 eafp_mgl.600.b: "완전한 독립국으로 인정받기 위해 끝까지 투쟁한다!"
 eafp_mgl.600.c: "러시아의 그늘에서 벗어나 새로운 후원자를 찾아보자."
 eafp_mgl.610.t: "위기에 처한 자치"
 eafp_mgl.610.d: "1919년 가을, 러시아 혁명의 혼란을 틈타 중화민국 안휘파 군벌 쉬수정(徐樹錚) 장군이 이끄는 서북변방군이 우르가를 기습 점령했습니다. 쉬수정은 복드 칸과 왕공들을 무력으로 협박하여 캬흐타 협정의 자치 조항을 강제로 철폐시키고 군정을 실시하며 가혹한 탄압을 자행했습니다. 이에 분노한 유목민들과 민족주의자들은 지하 비밀 조직을 결성하며 결사항전에 나서고 있습니다."
 eafp_mgl.610.f: "주간지는 노동자들 사이에서 수십만 부가 읽혔고 자원자들은 때때로 수백만 부의 특별판을 만들어 나누었다. 우편 당국은 자의적인 판정으로 특별판을 정규 발행물로 인정하지 않았고, 그 결정 하나로 모든 특별판이 우편망에서 쫓겨나는 치명적인 타격을 입었다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.610.a: "중화민국의 쉬수정 장군이 우란바토르를 점령했다..."
 eafp_mgl.610.b: "백위군 로만 폰 운게른슈테른베르크 남작이 도시에 입성했다."
 eafp_mgl.610.c: "자치 철폐의 위기 앞에 놓이다."
 eafp_mgl.610.e: "우리는 결코 굴복하지 않을 것이다! 저항하라!"
 eafp_mgl.620.t: "인민혁명"
 eafp_mgl.620.d: "1921년 7월, 담딘 수흐바타르와 호를로깅 처이발상이 이끄는 몽골 인민의용군이 붉은 군대와 연합하여 쉬수정의 잔당과 백위군 웅게른 남작의 광기 어린 군대를 격파하고 수도 우르가를 해방했습니다. 복드 칸을 제한적 군주로 모시는 '인민임시정부'가 수립되면서, 봉건적 특권과 외세의 지배를 타파하고 민중이 주인이 되는 근대 '몽골 인민혁명'이 찬란하게 승리했습니다."
 eafp_mgl.620.f: "태양의 불타는 빛 아래 젊은 아침의 땅은 망치질 소리로 가득했다. 검은 복수의 군대가 밭고랑에서 천천히 싹터 다음 세기의 수확을 향해 자라났고, 그 발아는 머지않아 온 땅을 뒤집을 것이었다.\n\n— 에밀 졸라, 『제르미날』"
 eafp_mgl.620.a: "수흐바타르와 처이발상이 이끄는 인민혁명군이 승리했다!"
 eafp_mgl.620.b: "구시대의 잔재를 청산하고 몽골 인민 공화국을 수립하라!"
 eafp_mgl.620.c: "혁명의 불꽃이 전 초원을 붉게 물들일 것이다."
 eafp_mgl.410.t: "초원 헌장의 비준"
 eafp_mgl.410.d: "대초원 헌장의 공식 비준 문서가 각국의 서명과 날인을 마치고 대몽골국 정부에 도달했습니다. 이로써 몽골을 맹주로 하는 초원 연맹의 헌정 질서가 완벽한 법적 효력을 발휘하게 되었으며, 참가국 간의 군사적 상호 방위와 경제적 무관세 단일 시장이 공식적으로 발효되었습니다."
 eafp_mgl.410.f: "새 지도자는 지휘봉을 세 번째에야 받아들였고, 그 순간 평원 전체가 찬성의 함성으로 울렸다. 가장 나이 든 전사 넷은 비에 젖어 진흙이 된 흙을 한 줌씩 그의 머리에 얹었고, 흙물이 콧수염과 뺨으로 흘러내리는 동안 그는 움직이지 않고 그 명예에 감사했다.\n\n— 니콜라이 고골, 『타라스 불바』"
 eafp_mgl.410.a: "만장일치로 대몽골 복원 헌장을 비준한다."
 eafp_mgl.410.b: "헌장 비준을 둘러싸고 격렬한 논쟁이 벌어지다."
 eafp_mgl.411.t: "초원 연맹의 확대"
 eafp_mgl.411.d: "초원 연맹에 소속된 모든 부족, 기(旗), 주즈 및 자치령의 강역과 인구를 조사한 통합 영토 명부가 완성되었습니다. 이 명부는 연맹의 방위군 동원 체제와 공동 자원 개발, 교통망 구축의 공식 행정 지침서로 활용되며, 분열되었던 유목 세계가 하나의 체계적인 근대 국가 연합으로 재편되었음을 증명하고 있습니다."
 eafp_mgl.411.f: "한 나라의 백오십만 명과 세계 여러 나라의 이천삼백오십만 명이 같은 조직으로 이어졌다. 서로 먼 땅의 수많은 사람을 하나의 질서와 목적 아래 묶은 그 연결망은 어느 한 지도자의 재능만으로 만들 수 없는 거대한 힘이었다.\n\n— 잭 런던, 『강철 군화』"
 eafp_mgl.411.a: "초원 연맹의 새로운 영토 명부를 확정한다."
