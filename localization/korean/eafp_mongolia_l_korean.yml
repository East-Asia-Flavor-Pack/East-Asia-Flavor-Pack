 ai_strategy_eafp_mgl_industrialization: "몽골 산업화"
 ai_strategy_eafp_mgl_industrialization_desc: "시장 접근과 건설 기반을 먼저 확보한 뒤 현재 산업권의 원료·전력·도구·소비재 병목을 해소합니다."
