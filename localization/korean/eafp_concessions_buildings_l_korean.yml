 eafp_concession_activity_summary: "작동 보유국 #v [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_active_holder_count')|0]#! · 무역소 환산 #v [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_trade_equivalent')|0]레벨#!"
 eafp_concession_open_state: "주 보기"
 eafp_concession_open_building: "조계지 건물 보기"
