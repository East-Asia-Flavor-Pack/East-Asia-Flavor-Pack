 company_eafp_mongol_industrial_combine_desc: "식품·직물 가공과 전력을 잇는 국가 주도 산업 복합체입니다."
 ideology_eafp_mgl_bogd: "복드 신정파"
 ideology_eafp_mgl_bogd_desc: "복드의 종교적 권위 아래 전통 질서를 지키려 합니다."
 ideology_eafp_mgl_borjigin_restoration: "보르지긴 복원파"
 ideology_eafp_mgl_borjigin_restoration_desc: "황금씨족의 군주권과 귀족 질서를 복원하려 합니다."
 ideology_eafp_mgl_constitutionalist: "입헌 민족파"
 ideology_eafp_mgl_constitutionalist_desc: "민족 국가와 근대 행정을 의회 제도로 조화시키려 합니다."
 ideology_eafp_mgl_steppe_federalist: "초원 연방파"
 ideology_eafp_mgl_steppe_federalist_desc: "종교·관습법·지역 대표권을 보장하는 동등한 연방을 지지합니다."
 ideology_eafp_mgl_revolutionary: "몽골 혁명파"
 ideology_eafp_mgl_revolutionary_desc: "공화국, 세속 교육, 토지와 사원 개혁을 지지합니다."
 concept_eafp_mgl_restoration: "몽골 국가의 복원"
 concept_eafp_mgl_restoration_desc: "독립은 새로운 국가의 창건이자 청 이전 정치 질서의 복원으로 주장됩니다."
 concept_eafp_mgl_golden_lineage: "황금씨족"
 concept_eafp_mgl_golden_lineage_desc: "칭기즈 칸의 보르지긴 혈통에서 유래한 정치적 정통성입니다."
 concept_eafp_mgl_steppe_charter: "초원 헌장"
 concept_eafp_mgl_steppe_charter_desc: "연맹 회원들의 종교·관습법·대표권·군사 의무를 정한 맹약입니다."
 concept_eafp_mgl_united_industrial_area: "통합 산업권"
 concept_eafp_mgl_united_industrial_area_desc: "직접령·종속국·투자 조약권 아래의 대상 주를 실시간으로 묶어 평가하는 산업권입니다."
 je_eafp_mgl_invite_steppe_league_candidates_button: "연맹 후보국 초청"
 je_eafp_mgl_invite_steppe_league_candidates_button_desc: "현재 문화·영토 조건을 충족하는 국가에 초청장을 다시 보냅니다. 90일마다 사용할 수 있습니다."
 je_eafp_mgl_leave_steppe_league_button: "초원 연맹 탈퇴"
 je_eafp_mgl_leave_steppe_league_button_desc: "연맹 회원 자격과 관련 저널을 포기합니다."
