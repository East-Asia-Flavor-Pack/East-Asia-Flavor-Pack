# eafp_debug.3
 eafp_debug.3.t: "调试事件3"
 eafp_debug.3.d: "此事件用于测试模组功能。"
 eafp_debug.3.a: "继续"

 # 日本调试决议
 jap_bakufu_authority_zero: "(调试) 幕藩体制：将幕府权威降为零"
 jap_bakufu_authority_zero_desc: "将幕藩体制日志中的幕府权威降至#v 0#!。"

 # 朝鲜调试决议
 kor_scramble_for_korea_setup: "(调试) 朝鲜争夺战：准备日本方面的条件"
 kor_scramble_for_korea_setup_desc: "视需要解除日本的锁国状态、加快维新进程，并使日本获得列强承认。"
 kor_samjeong: "(调试) 三政的紊乱：提高三项进度"
 kor_samjeong_desc: "将官厅状况、军政状况和民生状况的进度各设为#v 2000#!。"
 kor_yangjeon: "(调试) 量田：完成"
 kor_yangjeon_desc: "将量田进度设为完成所需的#v 360#!。"
 kor_sedo: "(调试) 势道政治：结束"
 kor_sedo_desc: "将权力平衡降至结束势道政治所需的#v 0#!。"
 kor_manchurian_policy: "(调试) 满洲政策：启动"
 kor_manchurian_policy_desc: "添加满洲政策日志条目。"
 kor_own_manchuria: "(调试) 满洲政策：接管满洲全境"
 kor_own_manchuria_desc: "将满洲的所有地区移交给朝鲜。"

 # 大清调试决议
 chi_chiwes1: "(调试) 用夷变夏：启动"
 chi_chiwes1_desc: "触发设立总理衙门事件，开启用夷变夏日志。"
 chi_chiwes2: "(调试) 用夷变夏：标记为完成"
 chi_chiwes2_desc: "设置记录用夷变夏已启动和已完成的变量。"
 chi_chistate: "(调试) 接管汉族本土的所有地区"
 chi_chistate_desc: "将汉族本土的所有地区移交给大清。"
 chi_collapse: "(调试) 不稳定统一：将大清统一度降为零"
 chi_collapse_desc: "将大清统一度降至崩溃阈值#v 0%#!。"

 # 富国强兵之路调试决议
 kor_reformation_society_complete: "(调试) 富国强兵之路：标记社会改革完成"
 kor_reformation_society_complete_desc: "设置社会改革的调试完成标记。"
 kor_reformation_military_complete: "(调试) 富国强兵之路：标记军制改革完成"
 kor_reformation_military_complete_desc: "设置军制改革的调试完成标记。"
 kor_reformation_economy_complete: "(调试) 富国强兵之路：标记振兴工商业完成"
 kor_reformation_economy_complete_desc: "设置振兴工商业的调试完成标记。"
 kor_reformation_diplomacy_complete: "(调试) 富国强兵之路：标记外交改革完成"
 kor_reformation_diplomacy_complete_desc: "设置外交改革的调试完成标记。"

 # 양요 디버그 결단
 kor_yangyo_make_interested_power: "(调试) 洋扰：制造利害相关列强"
 kor_yangyo_make_interested_power_desc: "让朝鲜以外的一个列强在东北亚宣布利益。"
 kor_yangyo_fire_ship_event: "(调试) 洋扰：触发异样船事件"
 kor_yangyo_fire_ship_event_desc: "立即触发一个符合条件的异样船事件。"
 kor_yangyo_grant_grievance: "(调试) 洋扰：给予所有列强名分"
 kor_yangyo_grant_grievance_desc: "所有利害相关列强获得讨伐朝鲜的名分。"
 kor_yangyo_launch_now: "(调试) 洋扰：立即发动"
 kor_yangyo_launch_now_desc: "一个拥有战舰的利害相关列强立即发出最后通牒。"
 kor_yangyo_make_opened: "(调试) 洋扰：解除锁国"
 kor_yangyo_make_opened_desc: "解除锁国，以检查远征国只要求赔款的分支。"
 kor_yangyo_reset: "(调试) 洋扰：重置状态"
 kor_yangyo_reset_desc: "清除进行中的远征和固定的远征结果。"
 kor_yangyo_become_aggressor: "(调试) 洋扰：准备朝鲜远征"
 kor_yangyo_become_aggressor_desc: "我国在东北亚宣布利益，并获得讨伐朝鲜的名分。"

 # 예치의 길 디버그 결단
 kor_yechi_complete: "(调试) 礼治之路：完成"
 kor_yechi_complete_desc: "将礼治扎根时间设为#v 60#!个月。下次日志检查时触发礼治之路结局。"
 kor_yangyo_set_fort_level: "(调试) 洋扰：更改京畿海军要塞等级"
 kor_yangyo_set_fort_level_desc: "将京畿海军要塞依次改为#v 0#! → #v 5#! → #v 10#!级。"
 kor_yangyo_force_result: "(调试) 洋扰：固定远征结果"
 kor_yangyo_force_result_desc: "依次固定下一次远征结果：完胜 → 击退 → 战败 → 随机。"
