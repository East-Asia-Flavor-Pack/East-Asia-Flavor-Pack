l_english:
 building_eafp_concession: "Concession"
 pmg_base_building_eafp_concession: "$pm_base$"
 pm_eafp_concession: "$building_eafp_concession$"
 company_eafp_concession: "Concession Company"
 eafp_concession_company_slot: "Additional Concession Company Capacity"
 eafp_concession_capacity_row: "Concessions [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_total_levels')|0] / Cap [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_urban_cap')|0] · Free [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_free_capacity')|0] · Excess [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_over_capacity')|0]"
 eafp_concession_capacity_tt: "One concession level has the employment, trade capacity and inputs of one trade center level.\nEach new concession right grants five levels. The state cap is five times its urban center level: new grants need five free levels and journal expansion needs one.\nExisting buildings and ownership are preserved when the urban center shrinks.\nCurrent trade center equivalent: [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_trade_equivalent')|0] levels"
 eafp_concession_expand_label: "Expand your concession by 1 level (@money![GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_expansion_cost')|D])"
 eafp_concession_company_ownership_row: "[BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.GetFlagTextIcon] [BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.GetNameNoFlag] / [BuildingOwnership.GetOwnerBuilding.GetCompany.GetName]: [BuildingOwnership.GetLevel|0] levels"
 eafp_concession_forced_loss: "Forced Concession Return"
 eafp_concession_shared_assets_note: "Ending a concession right (treaty withdrawal, incident, or war) ends the right and expansion, but built concession levels always remain with their owners, even if the state changes hands."
 eafp_concession_right_live: "Concession right held"
 eafp_concession_right_returned: "No concession right · residual ownership"
 eafp_concession_private_investment_label: "Automatic urban investment: at most one project per state/month"
 eafp_concession_private_investment_tt: "Existing urban industries are ranked by current weekly profit per level and checked for construction eligibility. The selected expansion enters the private queue. Industries already being built or queued are excluded. Ownership and funding follow the engine’s private investment rules."
 eafp_concession_company_right_tt: "[SelectLocalization(GetScriptedGui('eafp_concession_holder_right_gui').IsShown(GuiScope.SetRoot(State.MakeScope).AddScope('holder', BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.MakeScope).End), 'eafp_concession_right_live', 'eafp_concession_right_returned')]"
 eafp_concession_grant_failed_title: "Concession Establishment Failed"
 eafp_concession_grant_failed_desc: "The concession company or its owned building could not be created, so no right was registered. Remove the failed treaty article before negotiating again."
 eafp_concession_overview_heading: "Concessions · [GetDataModelSize(GetGlobalList('concession_candidate_states_gvarlist'))] states"
 eafp_concession_overview_hint: "Select a state to view its holders, ownership and expansion. Profit figures are current values."
 eafp_concession_empty_overview: "No states currently have concession rights. States appear here when a concession treaty takes effect."
 eafp_concession_card_total: "[GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_total_levels')|0] / [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_urban_cap')|0]"
 eafp_concession_cap_status: "[SelectLocalization(GreaterThan_CFixedPoint(GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_over_capacity'), '(CFixedPoint)0'), 'eafp_concession_cap_exceeded', SelectLocalization(GreaterThan_CFixedPoint(GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_free_capacity'), '(CFixedPoint)0'), 'eafp_concession_cap_available', 'eafp_concession_cap_full'))]"
 eafp_concession_cap_available: "#p Room for [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_free_capacity')|0] levels#! · Within urban cap"
 eafp_concession_cap_full: "#v At capacity#! · No grants or expansion"
