je_bakufu_kaikaku: "幕府改革"
je_bakufu_kaikaku_reason: "经过数百年的停滞，现在幕府的体制已经过于陈旧。必须经过多次努力才能实现改革。\n\n[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]死亡时，优势派阀将推举继承人。如果任何一方掌握过度的权力，甚至可能威胁到[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的权威。\n\n根据各派阀的影响力和支持度，将适用以下效果：\n\n#variable $bakufu_kaikaku_daimyo_approval_positive_modifier$#!\n#variable [Multiply_CFixedPoint(Add_CFixedPoint(Multiply_CFixedPoint(Subtract_CFixedPoint(ROOT.GetCountry.MakeScope.ScriptValue('bakufu_kaikaku_hitotsubashiha_approval_progress_bar_value'),'(CFixedPoint)50'),ROOT.GetCountry.MakeScope.ScriptValue('bakufu_hitotsubashiha_hiritsu')),Multiply_CFixedPoint(Subtract_CFixedPoint(ROOT.GetCountry.MakeScope.ScriptValue('bakufu_kaikaku_nankiha_approval_progress_bar_value'),'(CFixedPoint)50'),ROOT.GetCountry.MakeScope.ScriptValue('bakufu_nankiha_hiritsu'))),'(CFixedPoint)0.2')|1+=]#! $interest_group_ig_landowners_approval_add$\n#variable [Multiply_CFixedPoint(Add_CFixedPoint(Multiply_CFixedPoint(Subtract_CFixedPoint(ROOT.GetCountry.MakeScope.ScriptValue('bakufu_kaikaku_hitotsubashiha_approval_progress_bar_value'),'(CFixedPoint)50'),ROOT.GetCountry.MakeScope.ScriptValue('bakufu_hitotsubashiha_hiritsu')),Multiply_CFixedPoint(Subtract_CFixedPoint(ROOT.GetCountry.MakeScope.ScriptValue('bakufu_kaikaku_nankiha_approval_progress_bar_value'),'(CFixedPoint)50'),ROOT.GetCountry.MakeScope.ScriptValue('bakufu_nankiha_hiritsu'))),'(CFixedPoint)-0.01')|%0-=]#! $state_radicals_from_political_movements_mult$\n\n此外，根据各派阀的影响力差异，将适用以下效果：\n\n#variable $bakufu_kaikaku_daimyo_influence_modifier$#!\n#variable [Multiply_CFixedPoint(Subtract_CFixedPoint('(CFixedPoint)0.25',Multiply_CFixedPoint(ROOT.GetCountry.MakeScope.ScriptValue('bakufu_hitotsubashiha_hiritsu'),ROOT.GetCountry.MakeScope.ScriptValue('bakufu_nankiha_hiritsu'))),'(CFixedPoint)-6000')|1+=]#! $country_authority_add$"

