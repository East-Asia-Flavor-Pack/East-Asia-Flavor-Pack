l_simp_chinese:
 je_concessions_in_china2_status: "租界收入与威望"
 je_concessions_in_china2_reason: "我国在华租界是贸易据点，也是国库的收入来源。我们必须处理好与当地政府的关系，并保持足以行使权益的威望。"
 eafp_grant_concession: "授予租界"
 eafp_grant_concession_desc: "在选定地区设立外国租界权益。"
 eafp_grant_concession_effects_desc: "• 地区所有权不变，新增由持有国拥有的五级贸易中心\n• 每个有效持有国获得城市建筑周利润总和的5%作为国家税收，中国所有国承担同额国家支出\n• 地区所有国威望高于持有国时，经济效果暂停"
 eafp_grant_concession_article_short_desc: "[SOURCE_COUNTRY.GetNameNoFormatting]向[TARGET_COUNTRY.GetNameNoFormatting]授予租界"
 eafp_return_concession: "归还租界"
 eafp_return_concession_desc: "归还选定地区的现有租界权益。"
 eafp_return_concession_effects_desc: "• 移除授予方在选定地区的租界权益及租界付款\n• 已暂停的租界也可以归还\n• 保留现有贸易中心所有权"
 eafp_return_concession_article_short_desc: "[SOURCE_COUNTRY.GetNameNoFormatting]向[TARGET_COUNTRY.GetNameNoFormatting]归还租界"
 eafp_grant_concession_valid_tt: "要求中国国家拥有的中国本部合格地区，以及在当地战略区域拥有利益且尚无该租界的列强接收方"
 eafp_return_concession_valid_tt: "接收方必须是该地区当前的中国所有国，授予方必须持有当地租界"
 eafp_concession_duplicate_article_tt: "不得重复添加针对相同地区、国家与方向的同类条款"
 eafp_concession_treaty_instructions: "在条约谈判中选择授予租界或归还租界条款及目标地区，也可将其作为战争要求强制执行。新授予租界时，该地区新增由持有国拥有的五级贸易中心。"
 eafp_concession_state_income: "城市建筑周利润：@money![GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_state_profit')|D=] · 有效持有国：[GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_active_holder_count')|0]"
 eafp_concession_economy_tt: "先合计城市建筑的周利润；总额不为正时不转移款项。\n每个持有国的比例：#v 5%#!\n每个有效持有国所得：@money![GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_state_share')|D=]/周\n中国所有国在本地区的负担：@money![GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_state_debit')|D=]/周\n\n通过中国所有国的国家支出及持有国的国家税收结算，不改变建筑自身利润。此处显示当前计算值，预算修正每周同步更新。"
 eafp_concession_holder_row: "[Country.GetFlagTextIcon] [Country.GetNameNoFlag]：[SelectLocalization(GetScriptedGui('eafp_concession_holder_active_gui').IsShown(GuiScope.SetRoot(State.MakeScope).AddScope('holder', Country.MakeScope).End), 'eafp_concession_active_label', 'eafp_concession_inactive_label')]"
 eafp_concession_active_label: "#positive_value 有效#!"
 eafp_concession_inactive_label: "#negative_value 暂停#!"
 eafp_concession_prestige_tt: "地区所有国威望：[State.GetOwner.GetPrestige|0]\n持有国威望：[Country.GetPrestige|0]\n\n所有国威望更高时，收入及新月度事件暂停；威望相等时有效。非中国所有国或条约港地区也会暂停运作。租界权益与现有贸易中心所有权仍被保留。"
 EAFP_CONCESSION_AI_RIGHT: "租界权益价值"
 EAFP_CONCESSION_AI_TRADE_CENTER: "五级贸易中心价值"
 EAFP_CONCESSION_AI_INCOME: "当前利润带来的税收价值"
 dp_eafp_concession_incident: "收回租界战争"
 dp_eafp_concession_incident_desc: "因租界月度事件而爆发的收回租界战争。"
 dp_eafp_concession_incident_tooltip: "$dp_eafp_concession_incident_desc$"
 war_goal_eafp_concession_incident_return_type_name: "归还租界"
 war_goal_eafp_concession_incident_return_type_desc: "移除选定地区的外国租界权益，保留贸易中心所有权。"
 war_goal_eafp_concession_incident_return: "归还[WAR_GOAL_DRAFT.GetTargetState.GetName]租界"
 war_goal_eafp_concession_incident_return_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName]要求[WAR_GOAL_DRAFT.GetTarget.GetName]归还其在[WAR_GOAL_DRAFT.GetTargetState.GetName]的租界。"
 war_goal_eafp_concession_incident_return_sway_desc: "$war_goal_eafp_concession_incident_return_desc$"
 concessions_in_china.200.t: "租界税务纠纷"
 concessions_in_china.200.d: "[SCOPE.sState('concession_state').GetName]的商人就当地税务惯例要求[SCOPE.sCountry('concession_holder').GetName]出面干预。[SCOPE.sCountry('concession_host').GetName]当局坚持认为，租界权益并不意味着所有交易均可免税。"
 concessions_in_china.200.f: "译成两种文字的条约放在税册旁。两名官员在同一条款下划出的线，却停在不同的句子上。"
 concessions_in_china.200.a: "与地方当局协商。"
 concessions_in_china.200.b: "坚持我们的免税权。"
 concessions_in_china.201.t: "租界边界冲突"
 concessions_in_china.201.d: "在[SCOPE.sState('concession_state').GetName]，[SCOPE.sCountry('concession_holder').GetName]方面的警卫与当地警察发生冲突。[SCOPE.sCountry('concession_host').GetName]官员要求赔偿损失并解决管辖权争议。"
 concessions_in_china.201.f: "翻倒的摊车横在两队巡警之间。商户紧闭店门，等着看哪一方会先退让。"
 concessions_in_china.201.a: "以赔偿结束此事。"
 concessions_in_china.201.b: "提出正式抗议。"
 concessions_in_china.201.c: "以战争收回租界。"
 concessions_in_china.202.t: "本地商人的代表"
 concessions_in_china.202.d: "[SCOPE.sState('concession_state').GetName]的中国商人要求派代表参与同[SCOPE.sCountry('concession_holder').GetName]租界当局的协商。[SCOPE.sCountry('concession_host').GetName]政府支持这一请求。"
 concessions_in_china.202.f: "请愿书末尾挤满了大小商铺的印章。书记认出了那些店号，又搬了一把椅子进会场。"
 concessions_in_china.202.a: "听取商人代表的意见。"
 concessions_in_china.202.b: "协商仍由原有各方进行。"
 concessions_in_china.203.t: "修缮费用"
 concessions_in_china.203.d: "[SCOPE.sState('concession_state').GetName]租界与周边街区共用的道路和排水沟亟需修缮。[SCOPE.sCountry('concession_host').GetName]要求[SCOPE.sCountry('concession_holder').GetName]分担费用。"
 concessions_in_china.203.f: "雨停后，界石旁仍积着水。工匠还没问归哪方管辖，便先指向了堵塞的沟渠。"
 concessions_in_china.203.a: "分担修缮费用。"
 concessions_in_china.203.b: "由地方当局承担。"
 concessions_in_china.204.t: "租界被强行收回"
 concessions_in_china.204.d: "[SCOPE.sCountry('concession_host').GetName]强行废除了[SCOPE.sCountry('concession_holder').GetName]在[SCOPE.sState('concession_state').GetName]的租界权益。相关租界付款已经终止，现有贸易中心所有权仍然保留。"
 concessions_in_china.204.f: "官员贴出新告示，将旧文书封存。账册转手间，街上的传言也涌进了衙署。"
 concessions_in_china.204.a: "归还已记入案册。"
 concessions_in_china.205.t: "租界争端引发战争"
 concessions_in_china.205.d: "[SCOPE.sState('concession_state').GetName]的租界争端已演变为[SCOPE.sCountry('concession_host').GetName]与[SCOPE.sCountry('concession_holder').GetName]之间的战争。[SCOPE.sCountry('concession_host').GetName]要求归还当地租界。只有落实这一战争目标，相关权益才会被移除。"
 concessions_in_china.205.f: "谈判地图被撤走，桌上摆满动员令。传令兵没有等候答复，便赶往下一处官署。"
 concessions_in_china.205.a: "战争已经开始。"
 concessions_in_china.206.t: "内战中的租界"
 concessions_in_china.206.d: "[SCOPE.sCountry('concession_host').GetName]的内战扰乱了[SCOPE.sState('concession_state').GetName]周边的治安与贸易。地方官员请求[SCOPE.sCountry('concession_holder').GetName]资助救济和警备。"
 concessions_in_china.206.f: "难民的车队排在关卡前。打开仓库与批准开支，分别等待着不同官员的签字。"
 concessions_in_china.206.a: "资助救济。"
 concessions_in_china.206.b: "不能再增加我们的负担。"
 concessions_in_china.207.t: "缔结新约的机会"
 concessions_in_china.207.d: "[SCOPE.sState('concession_state').GetName]的[SCOPE.sCountry('concession_holder').GetName]商人建议在中国其他地区建立贸易据点。与[SCOPE.sCountry('concession_host').GetName]的既有联系为考虑进一步条约谈判提供了契机。"
 concessions_in_china.207.f: "商会送来的地图标出了尚未到访的城市。旁边的谈判对象名单，比拟定的行程还要长。"
 concessions_in_china.207.a: "考虑展开条约谈判。"
