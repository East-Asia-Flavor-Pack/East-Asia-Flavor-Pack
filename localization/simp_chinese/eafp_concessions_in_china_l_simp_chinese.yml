l_simp_chinese:

 # 개념
 concept_concession: "租界"
 concept_concessions: "租界"
 concept_concession_desc: "依[concept_treaty]在[glossary_china_proper]由未获承认国家拥有的[concept_state]中，外国[concept_great_power]所获得的权益。获得$concept_concession$的[concept_country]会设立租界[concept_company]，由其持有该$concept_state$的$building_eafp_concession$。每级$building_eafp_concession$的就业和贸易能力相当于一级贸易中心。\n\n$concept_concession$可通过$concept_treaty$获得，或在对方接受或输掉“索取租界”[concept_diplomatic_play]时获得。租界条约消耗[concept_influence]，缔结后持有国在该地区的介入度大幅增加。每个$concept_state$的$building_eafp_concession$规模不能超过由城镇中心等级决定的上限，租界公司每月动用持有国国库，将$building_eafp_concession$或有利可图的当地工业、港口、贸易中心扩建一级。\n\n持有国通过$building_eafp_concession$的贸易和[concept_dividends]获利。让出租界的一方仅在国家等级高于持有国时才能退出条约。退出条约、毁约、战争或事件使权益结束时，仅移除该持有国的持股；最后一项权益结束后，$building_eafp_concession$将被拆除。"

 # 건물·생산 방식·회사·modifier
 building_eafp_concession: "租界"
 pmg_base_building_eafp_concession: "$pm_base$"
 pm_eafp_concession: "$building_eafp_concession$"
 company_eafp_concession: "租界公司"
 eafp_concession_company_slot: "租界公司额外容量"
 eafp_concession_forced_loss: "强制归还租界的冲击"

 # 조약 항목 (조계 양도)
 eafp_grant_concession: "授予租界"
 eafp_grant_concession_effects_desc: "•两个[Concept('concept_country', '$concept_countries|q$')]之间达成的一项协议，其中一个$concept_country$正式向另一个$concept_country$授予选定地区的[concept_concession]权益"
 eafp_grant_concession_article_short_desc: "[SOURCE_COUNTRY.GetNameNoFormatting]向[TARGET_COUNTRY.GetNameNoFormatting]授予租界"
 eafp_grant_concession_valid_tt: "该地区须位于[glossary_china_proper]、不是条约港且由未获承认国家拥有，并在城镇中心上限内有新增五级租界的空余；接收国须为拥有首都且在该地区尚无租界权益的列强"
 eafp_concession_duplicate_article_tt: "不得重复添加针对相同地区、国家与方向的同类条款"
 eafp_concession_treaty_name: "租界条约"
 eafp_concession_grant_failed_title: "租界设立失败"
 eafp_concession_grant_failed_desc: "未能完成租界公司或其持有建筑的创建，因此未登记权益。请移除失败的条约条款后重新谈判。"
 EAFP_CONCESSION_AI_RIGHT: "租界权益价值"
 EAFP_CONCESSION_AI_TRADE_CENTER: "公司持有的五级租界价值（相当于五级贸易中心）"
 EAFP_CONCESSION_AI_CITY: "租界所在城市的规模（城镇中心等级）"

 # 외교전·전쟁 목표: 조계 요구
 dp_eafp_demand_concession: "$war_goal_eafp_demand_concession_type_name$"
 dp_eafp_demand_concession_desc: "要求目标[concept_country]在选定地区让出[concept_concession]。若对方接受要求，租界条约立即生效；若拒绝，则发起以此要求为主要[concept_war_goal]的[concept_diplomatic_play]。"
 dp_eafp_demand_concession_tooltip: "#header 发起$dp_eafp_demand_concession$[concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$dp_eafp_demand_concession_desc$"
 war_goal_eafp_demand_concession_type_name: "索取租界"
 war_goal_eafp_demand_concession_type_desc: "迫使另一个[concept_country]在某个[concept_state]让出[concept_concession]。"
 war_goal_eafp_demand_concession: "[WAR_GOAL_DRAFT.GetTargetState.GetName][concept_concession]"
 war_goal_eafp_demand_concession_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName]迫使[WAR_GOAL_DRAFT.GetTarget.GetName]让出[WAR_GOAL_DRAFT.GetTargetState.GetName]的[concept_concession]。"
 war_goal_eafp_demand_concession_sway_desc: "承诺迫使[WAR_GOAL_DRAFT.GetWarGoalStakeholder.GetName]向[WAR_GOAL_DRAFT.GetHolder.GetName]让出[WAR_GOAL_DRAFT.GetTargetState.GetName]的[concept_concession]，以争取对方加入我方。"

 # 외교전·전쟁 목표: 조계 반환 (사건)
 dp_eafp_concession_incident: "收回租界战争"
 dp_eafp_concession_incident_desc: "因租界月度事件而爆发的收回租界战争。"
 dp_eafp_concession_incident_tooltip: "$dp_eafp_concession_incident_desc$"
 war_goal_eafp_concession_incident_return_type_name: "归还租界"
 war_goal_eafp_concession_incident_return_type_desc: "撤销选定地区的外国租界权益。强制归还造成的关系及威望损失随持有等级及其城市容量占比增加。"
 war_goal_eafp_concession_incident_return: "归还[WAR_GOAL_DRAFT.GetTargetState.GetName]租界"
 war_goal_eafp_concession_incident_return_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName]要求[WAR_GOAL_DRAFT.GetTarget.GetName]归还其在[WAR_GOAL_DRAFT.GetTargetState.GetName]的租界。"
 war_goal_eafp_concession_incident_return_sway_desc: "$war_goal_eafp_concession_incident_return_desc$"

 # 저널
 je_concessions_in_china: "在华租界"
 # https://zh.wikisource.org/wiki/二十年目睹之怪現狀/第001回 참고
 je_concessions_in_china_reason: "商贾成群涌入租界。华洋杂处，轮船往来，百货运进运出。昔日的一片芦苇滩上，洋行与气派的楼宇拔地而起，酒肆和风月场所也随着富商的到来而兴盛。\n$TOOLTIP_DELIMITER$\n@information![concept_great_power]可以通过#b 租界[concept_treaty]#!或#b $war_goal_eafp_demand_concession_type_name$#![concept_diplomatic_play]，在未获承认国家所拥有的[glossary_china_proper][concept_state]获得[concept_concession]。每个持有国设立的租界[concept_company]拥有该州#b $building_eafp_concession$#!的本国股份。\n\n租界公司每月动用持有国国库，将该州的$building_eafp_concession$或有利可图的当地工业、港口、贸易中心扩建一级。"
 je_concessions_in_china_status: "目前有#v [GetDataModelSize(GetGlobalList('concession_candidate_states_gvarlist'))]#!个地区设有租界。"

 # 저널 위젯: 주 행 (현재/상한)
 eafp_concession_card_total: "[GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_total_levels')|0] / [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_urban_cap')|0]"
 eafp_concession_cap_tt: "#header 租界上限#!\n城镇中心为#v [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_urban_levels')|0]#!级，因此租界上限为#v [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_urban_cap')|0]#!级。\n当前租界 #v [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_total_levels')|0]#! 级\n$eafp_concession_cap_status$\n\n新获得租界权需五级空余，每月的租界扩建需一级空余。城镇中心扩大时上限随之提高。城镇中心缩小导致超出上限时，现有租界保留，但不能继续扩建。"
 eafp_concession_cap_status: "[SelectLocalization(GreaterThan_CFixedPoint(GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_over_capacity'), '(CFixedPoint)0'), 'eafp_concession_cap_exceeded', SelectLocalization(GreaterThan_CFixedPoint(GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_free_capacity'), '(CFixedPoint)0'), 'eafp_concession_cap_available', 'eafp_concession_cap_full'))]"
 eafp_concession_cap_available: "#p 可扩建[GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_free_capacity')|0]级#! · 未超出城镇中心上限"
 eafp_concession_cap_full: "#v 已达上限#! · 无法新增或扩建"
 eafp_concession_cap_exceeded: "#n 超出上限[GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_over_capacity')|0]级#! · 保留现有建筑"

 # 저널 위젯: 국가별 소유 지분
 eafp_concession_ownership_heading: "各国持股"
 eafp_concession_owner_share_tt: "[Company.GetCountry.GetFlagTextIcon] [Company.GetCountry.GetNameNoFlag] · [Company.GetName]\n#v [BuildingOwnership.GetLevel|0]级#! · [BuildingOwnership.GetOwnershipRatio|%0]"
 eafp_concession_company_asset: "[BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.GetFlagTextIcon] [BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.GetNameNoFlag]\n[BuildingOwnership.GetOwnerBuilding.GetCompany.GetName]"
 eafp_concession_company_asset_tt: "$eafp_concession_company_ownership_row$\n$eafp_concession_company_right_tt$"
 eafp_concession_company_ownership_row: "[BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.GetFlagTextIcon] [BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.GetNameNoFlag] / [BuildingOwnership.GetOwnerBuilding.GetCompany.GetName]：[BuildingOwnership.GetLevel|0]级"
 eafp_concession_company_right_tt: "[SelectLocalization(GetScriptedGui('eafp_concession_holder_right_gui').IsShown(GuiScope.SetRoot(State.MakeScope).AddScope('holder', BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.MakeScope).End), 'eafp_concession_right_live', 'eafp_concession_right_returned')]"
 eafp_concession_right_live: "持有租界权益"
 eafp_concession_right_returned: "无租界权益 · 残留所有权"
 eafp_concession_asset_amount: "#v [BuildingOwnership.GetLevel|0]级#!\n[BuildingOwnership.GetOwnershipRatio|%0]"
 eafp_concession_urban_usage: "城市建筑 #v [State.MakeScope.GetVariableFromVariableMap('eafp_concession_urban_map', Company.GetCountry.MakeScope).GetValue|0]#! / [BuildingOwnership.GetLevel|0]级"
 eafp_concession_urban_usage_tt: "该租界公司在本地区拥有的工业、港口与贸易中心等级合计为#v [State.MakeScope.GetVariableFromVariableMap('eafp_concession_urban_map', Company.GetCountry.MakeScope).GetValue|0]#!级，上限等于其在本地区的$building_eafp_concession$持股，即#v [BuildingOwnership.GetLevel|0]#!级。\n达到上限后，该公司不再在本地区进行工业投资。租界本身的扩建只受城镇中心上限限制。"
 eafp_concession_company_building_row: "[Building.GetName] · #v [BuildingOwnership.GetLevel|0]#!级（[BuildingOwnership.GetOwnershipRatio|%0]）"

 # 월간 조계 사건 (concessions_in_china.200~207)
 concessions_in_china.200.t: "租界税务纠纷"
 concessions_in_china.200.d: "[SCOPE.sState('concession_state').GetName]的商人就当地税务惯例要求[SCOPE.sCountry('concession_holder').GetName]出面干预。[SCOPE.sCountry('concession_host').GetName]当局坚持认为，租界权益并不意味着所有交易均可免税。"
 # 출처: 『工部局董事会会议录』 제13책, 1897년 4월 6일·8일 특별회의(손수레세 폭동)를 바탕으로 재구성
 concessions_in_china.200.f: "道台张贴的告示，因未盖领事印章，被巡捕揭下。执照捐至本月底仍收400文，自那日起全额征收600文；领事团保证，即使发生骚乱，必要时亦将以武力执行。"
 concessions_in_china.200.a: "与地方当局协商。"
 concessions_in_china.200.b: "坚持我们的免税权。"
 concessions_in_china.201.t: "租界边界冲突"
 concessions_in_china.201.d: "在[SCOPE.sState('concession_state').GetName]，[SCOPE.sCountry('concession_holder').GetName]方面的警卫与当地警察发生冲突。[SCOPE.sCountry('concession_host').GetName]官员要求赔偿损失并解决管辖权争议。"
 concessions_in_china.201.f: "翻倒的摊车横在两队巡警之间。商户紧闭店门，等着看哪一方会先退让。"
 concessions_in_china.201.a: "以赔偿结束此事。"
 concessions_in_china.201.b: "提出正式抗议。"
 concessions_in_china.201.c: "以战争收回租界。"
 concessions_in_china.202.t: "本地商人的代表"
 concessions_in_china.202.d: "[SCOPE.sState('concession_state').GetName]的中国商人要求派代表参与同[SCOPE.sCountry('concession_holder').GetName]租界当局的协商。[SCOPE.sCountry('concession_host').GetName]政府支持这一请求。"
 concessions_in_china.202.f: "请愿书末尾挤满了大小商铺的印章。书记认出了那些店号，又搬了一把椅子进会场。"
 concessions_in_china.202.a: "听取商人代表的意见。"
 concessions_in_china.202.b: "协商仍由原有各方进行。"
 concessions_in_china.206.t: "内战中的租界"
 concessions_in_china.206.d: "[SCOPE.sCountry('concession_host').GetName]的内战扰乱了[SCOPE.sState('concession_state').GetName]周边的治安与贸易。地方官员请求[SCOPE.sCountry('concession_holder').GetName]资助救济和警备。"
 concessions_in_china.206.f: "难民的车队排在关卡前。打开仓库与批准开支，分别等待着不同官员的签字。"
 concessions_in_china.206.a: "资助救济。"
 concessions_in_china.206.b: "不能再增加我们的负担。"
 concessions_in_china.207.t: "缔结新约的机会"
 concessions_in_china.207.d: "[SCOPE.sState('concession_state').GetName]的[SCOPE.sCountry('concession_holder').GetName]商人建议在中国其他地区建立贸易据点。与[SCOPE.sCountry('concession_host').GetName]的既有联系为考虑进一步条约谈判提供了契机。"
 concessions_in_china.207.f: "商会送来的地图标出了尚未到访的城市。旁边的谈判对象名单，比拟定的行程还要长。"
 concessions_in_china.207.a: "考虑展开条约谈判。"
