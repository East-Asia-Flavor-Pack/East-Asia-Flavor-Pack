l_english:
 je_eafp_joseon_qing_war: "The Joseon-Qing War"
 je_eafp_joseon_qing_war_reason: "Ah, how could the humiliation of Namhansanseong ever be forgotten? With Bongcheon under siege, arrows flying into the royal couch, and the ancestral shrines and the state in mortal peril, the King at last walked into the camp of the barbarians; could even the humiliation of Goujian compare?\n\nNow [ROOT.GetCountry.GetName] seeks to wash away the shame of that day, yet if the war once again leaves the people starving and freezing, victory too will remain as a new wound."
 je_eafp_joseon_qing_war_status: "Current [concept_war_support]: #variable [SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').GetValue|0+=]#!"
 je_eafp_joseon_qing_war_status_pending: ""
 je_eafp_joseon_qing_war_progress: "Upon victory, different rewards will be granted according to the war's [concept_war_support], as follows.\n[SelectLocalization(And(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').IsSet,GreaterThanOrEqualTo_CFixedPoint(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').GetValue,'(CFixedPoint)50')),'@green_checkmark_box!','@simple_box!')] #tooltippable;tooltip:[SCOPE.GetRootScope.GetCountry.GetTooltipTag],eafp_jqw_victory_high_reward_tt #p 50 or higher#!#!\n[SelectLocalization(And(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').IsSet,And(GreaterThanOrEqualTo_CFixedPoint(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').GetValue,'(CFixedPoint)0'),LessThan_CFixedPoint(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').GetValue,'(CFixedPoint)50'))),'@green_checkmark_box!','@simple_box!')] #tooltippable;tooltip:[SCOPE.GetRootScope.GetCountry.GetTooltipTag],eafp_jqw_victory_medium_reward_tt #v Below 50 and at least 0#!#!\n[SelectLocalization(And(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').IsSet,LessThan_CFixedPoint(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').GetValue,'(CFixedPoint)0')),'@green_checkmark_box!','@simple_box!')] #tooltippable;tooltip:[SCOPE.GetRootScope.GetCountry.GetTooltipTag],eafp_jqw_victory_low_reward_tt #n Below 0#!#!"
 eafp_jqw_victory_high_reward_tt: "#header $eafp_joseon_qing_war_events.2.c$#!\n$TOOLTIP_DELIMITER$\n[GetScriptedGui('eafp_jqw_victory_high_reward_sgui').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 eafp_jqw_victory_medium_reward_tt: "#header $eafp_joseon_qing_war_events.2.b$#!\n$TOOLTIP_DELIMITER$\n[GetScriptedGui('eafp_jqw_victory_medium_reward_sgui').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 eafp_jqw_victory_low_reward_tt: "#header $eafp_joseon_qing_war_events.2.a$#!\n$TOOLTIP_DELIMITER$\n[GetScriptedGui('eafp_jqw_victory_low_reward_sgui').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"

 eafp_joseon_qing_war_events.1.t: "Gunfire Across the Yalu"
 eafp_joseon_qing_war_events.1.d: "Full-scale war has broken out between Joseon and the Qing."
 eafp_joseon_qing_war_events.1.f: "\"War began between Joseon and the Qing. A song became popular declaring that although China had once possessed the teachings of the sages and given birth to Confucius and Mencius, it had now become a lawless and barbarous country and ought to be chastised. Stones were thrown at the home of a yueqin teacher, while young men who played the Chinese flute were beaten as traitors. Women of the sword-dance troupes tied on red sashes and headbands and sang of warships setting out for battle.\""
 # Source: Sakutaro Hagiwara, Nisshin Senso Ibun: Harada Jukichi no Yume, Part One.
 eafp_joseon_qing_war_events.1.a: "The order under heaven trembles."

 eafp_joseon_qing_war_events.2.t: "The Polity After the War"
 eafp_joseon_qing_war_events.2.d3: "Having won an unprecedented victory over [SCOPE.sCountry('qing_enemy').GetName] and secured complete sovereign independence, [SCOPE.sCountry('joseon_scope').GetName] has proclaimed itself before all under heaven as a proud sovereign state."
 eafp_joseon_qing_war_events.2.d2: "After its war with [SCOPE.sCountry('qing_enemy').GetName], [SCOPE.sCountry('joseon_scope').GetName] cast off the old shackles of tributary submission and achieved sovereign independence, but the price paid for victory was not small."
 eafp_joseon_qing_war_events.2.d1: "[SCOPE.sCountry('joseon_scope').GetName] ultimately broke the shackles of tributary submission to [SCOPE.sCountry('qing_enemy').GetName] and achieved sovereign independence, but suffered grievous wounds in the process."
 eafp_joseon_qing_war_events.2.f3: "A Qing fortress fell and its fleet was destroyed, while in the north Joseon's great army advanced like the tide until not a single enemy horseman could be seen east of the Liao River. Before long, an envoy arrived to negotiate peace, and news of the peace treaty spread far and wide. When the Joseon army returned in triumph, the war suddenly ended, as though a great peng had folded its wings."
 # Source: Tokutomi Roka, "Hototogisu", Part Two, Chapter 7, Section 1.
 eafp_joseon_qing_war_events.2.f2: "Toward the end of the ninth month, news of victory in the Yellow Sea arrived, and a few days later she found her husband's name among the wounded. She did not sleep that night. Fortunately, she learned that his wound was not grave and that he was in the hospital. Her fear for his life eased, but as she thought of him and all she wished to do, resentment at the helplessness of her present circumstances once again filled her breast."
 # Source: Tokutomi Roka, Hototogisu, Middle Part, Chapter 4, Section 2, Aozora Bunko. https://www.aozora.gr.jp/cards/000280/files/1706_44742.html
 eafp_joseon_qing_war_events.2.f1: "\"With my attention wholly taken up by the sick and wounded, I failed to think of such things. Nothing had been prepared and care could not reach everyone, so we were kept desperately busy. We labored without five minutes' rest and without closing our eyes at night. Yet our instruments and medicines were inadequate, and many died for want of proper care; how could we possibly have spared any thought for spying on the enemy?\""
 # Source: Kyoka Izumi, Kaijo Hatsuden, Section Three.
 eafp_joseon_qing_war_events.2.c: "Proclaim this great victory throughout the realm."
 eafp_joseon_qing_war_events.2.b: "Do not forget the price of victory."
 eafp_joseon_qing_war_events.2.a: "First tend to the wounds left by victory."

 eafp_joseon_qing_war_events.3.t: "Humiliation Before the Altars"
 eafp_joseon_qing_war_events.3.d: "Having failed to cast off the shackles of tributary submission to [SCOPE.sCountry('qing_enemy').GetName], [SCOPE.sCountry('joseon_scope').GetName] was left to bear the humiliation and grievous wounds of defeat."
 eafp_joseon_qing_war_events.3.f: "At my age, I have come all this way to war only to be killed for no reason, like a dog. First, I hate the Qing soldier who cut me down. Next, I hate the officer who sent us out to reconnoiter. Last, I hate Joseon and the Qing for starting such a war."
 # Source: Ryunosuke Akutagawa, Kubi ga Ochita Hanashi, Part One.
 eafp_joseon_qing_war_events.3.a: "This shame will endure."

