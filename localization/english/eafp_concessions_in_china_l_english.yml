l_english:

 # 개념
 concept_concession: "Concession"
 concept_concessions: "Concessions"
 concept_concession_desc: "A right held by a foreign [concept_great_power] in a [concept_state] in China Proper owned by an unrecognized country, established by a [concept_treaty]. A [concept_country] that gains a $concept_concession$ founds a concession [concept_company], which owns the $building_eafp_concession$ in that $concept_state$. Each $building_eafp_concession$ level has the employment and trade capacity of one trade center level.\n\nA $concept_concession$ is gained through a $concept_treaty$, or when the target accepts or loses a Demand Concession [concept_diplomatic_play]. The concession treaty costs [concept_influence], and concluding it greatly increases the holder's involvement in the region. In each $concept_state$ the $building_eafp_concession$ cannot grow beyond a cap set by the urban center level, and holders can expand their own share from the treasury.\n\nHolders profit from the $building_eafp_concession$'s trade and [concept_dividends]. The granting country may withdraw from the treaty only while it outranks the holder. When withdrawal, breach, war or an incident ends a right, only that holder's share is removed, and the $building_eafp_concession$ is torn down once the last right ends."

 # 건물·생산 방식·회사·modifier
 building_eafp_concession: "Concession"
 pmg_base_building_eafp_concession: "$pm_base$"
 pm_eafp_concession: "$building_eafp_concession$"
 company_eafp_concession: "Concession Company"
 eafp_concession_company_slot: "Additional Concession Company Capacity"
 eafp_concession_forced_loss: "Forced Concession Return"

 # 조약 항목 (조계 양도)
 eafp_grant_concession: "Grant Concession"
 eafp_grant_concession_effects_desc: "• An agreement between two [Concept('concept_country', '$concept_countries|q$')] where one $concept_country$ officially grants [concept_concession] rights in the selected state to the other $concept_country$"
 eafp_grant_concession_article_short_desc: "[SOURCE_COUNTRY.GetNameNoFormatting] grants a concession to [TARGET_COUNTRY.GetNameNoFormatting]"
 eafp_grant_concession_valid_tt: "The state must be in China Proper, not a treaty port, and owned by an unrecognized country, with room for five more concession levels under its urban center cap. The recipient must be a Great Power with a capital and no existing right in this state"
 eafp_concession_duplicate_article_tt: "The same article cannot be duplicated for the same state and countries in the same direction"
 eafp_concession_treaty_name: "Concession Treaty"
 eafp_concession_grant_failed_title: "Concession Establishment Failed"
 eafp_concession_grant_failed_desc: "The concession company or its owned building could not be created, so no right was registered. Remove the failed treaty article before negotiating again."
 EAFP_CONCESSION_AI_RIGHT: "Value of concession rights"
 EAFP_CONCESSION_AI_TRADE_CENTER: "Value of five company-owned concession levels (five trade center levels equivalent)"
 EAFP_CONCESSION_AI_CITY: "Size of the concession city (urban center levels)"

 # 외교전·전쟁 목표: 조계 요구
 dp_eafp_demand_concession: "$war_goal_eafp_demand_concession_type_name$"
 dp_eafp_demand_concession_desc: "Demands a [concept_concession] in a chosen state of the targeted [concept_country]. If the demand is accepted the concession treaty enters into force at once; if it is refused a [concept_diplomatic_play] starts with this demand as its primary [concept_war_goal]."
 dp_eafp_demand_concession_tooltip: "#header Start a $dp_eafp_demand_concession$ [concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$dp_eafp_demand_concession_desc$"
 war_goal_eafp_demand_concession_type_name: "Demand Concession"
 war_goal_eafp_demand_concession_type_desc: "Force another [concept_country] to grant a [concept_concession] in a [concept_state]."
 war_goal_eafp_demand_concession: "[WAR_GOAL_DRAFT.GetTargetState.GetName] [concept_concession]"
 war_goal_eafp_demand_concession_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName] forces [WAR_GOAL_DRAFT.GetTarget.GetName] to grant a [concept_concession] in [WAR_GOAL_DRAFT.GetTargetState.GetName]."
 war_goal_eafp_demand_concession_sway_desc: "Try to convince [WAR_GOAL_DRAFT.GetHolder.GetName] to join your side by forcing [WAR_GOAL_DRAFT.GetWarGoalStakeholder.GetName] to grant them a [concept_concession] in [WAR_GOAL_DRAFT.GetTargetState.GetName]."

 # 외교전·전쟁 목표: 조계 반환 (사건)
 dp_eafp_concession_incident: "Concession Return War"
 dp_eafp_concession_incident_desc: "A war for the return of a concession, triggered by a monthly incident."
 dp_eafp_concession_incident_tooltip: "$dp_eafp_concession_incident_desc$"
 war_goal_eafp_concession_incident_return_type_name: "Return Concession"
 war_goal_eafp_concession_incident_return_type_desc: "Revoke the foreign concession right in the selected state. Forced-return relations and prestige losses increase with owned levels and their share of urban capacity."
 war_goal_eafp_concession_incident_return: "Return the [WAR_GOAL_DRAFT.GetTargetState.GetName] Concession"
 war_goal_eafp_concession_incident_return_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName] demands that [WAR_GOAL_DRAFT.GetTarget.GetName] return its concession in [WAR_GOAL_DRAFT.GetTargetState.GetName]."
 war_goal_eafp_concession_incident_return_sway_desc: "$war_goal_eafp_concession_incident_return_desc$"

 # 저널
 je_concessions_in_china: "Concessions in China"
 # 출처: 오견인(吳趼人), 『이십년목도지괴현상(二十年目睹之怪現狀)』 제1회 「楔子」를 바탕으로 재구성한 문구.
 # https://zh.wikisource.org/wiki/二十年目睹之怪現狀/第001回
 je_concessions_in_china_reason: "Merchants flock to the concessions. Chinese and foreigners live side by side, while steamships come and go, carrying goods of every kind. Foreign trading houses and imposing buildings rise on land that was once nothing but reed beds, and taverns and pleasure quarters flourish in the wake of wealthy merchants."
 je_concessions_in_china_status: "There are currently concessions in #v [GetDataModelSize(GetGlobalList('concession_candidate_states_gvarlist'))]#! states."

 # 저널 위젯: 주 행 (현재/상한)
 eafp_concession_card_total: "[GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_total_levels')|0] / [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_urban_cap')|0]"
 eafp_concession_cap_tt: "#header Concession cap#!\nThe urban center is at level #v [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_urban_levels')|0]#!, so the concession cap is #v [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_urban_cap')|0]#! levels.\nCurrent concession #v [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_total_levels')|0]#! levels\n$eafp_concession_cap_status$\n\nA new concession right and each journal expansion need five free levels. The cap rises as the urban center grows. If the urban center shrinks below the current size, existing concession levels are kept but cannot grow further."
 eafp_concession_cap_status: "[SelectLocalization(GreaterThan_CFixedPoint(GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_over_capacity'), '(CFixedPoint)0'), 'eafp_concession_cap_exceeded', SelectLocalization(GreaterThan_CFixedPoint(GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_free_capacity'), '(CFixedPoint)0'), 'eafp_concession_cap_available', 'eafp_concession_cap_full'))]"
 eafp_concession_cap_available: "#p Room for [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_free_capacity')|0] levels#! · Within urban cap"
 eafp_concession_cap_full: "#v At capacity#! · No grants or expansion"
 eafp_concession_cap_exceeded: "#n Over cap by [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_over_capacity')|0] levels#! · Existing levels retained"

 # 저널 위젯: 국가별 소유 지분
 eafp_concession_ownership_heading: "Ownership by country"
 eafp_concession_owner_share_tt: "[Company.GetCountry.GetFlagTextIcon] [Company.GetCountry.GetNameNoFlag] · [Company.GetName]\n#v [BuildingOwnership.GetLevel|0] levels#! · [BuildingOwnership.GetOwnershipRatio|%0]"
 eafp_concession_company_asset: "[BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.GetFlagTextIcon] [BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.GetNameNoFlag]\n[BuildingOwnership.GetOwnerBuilding.GetCompany.GetName]"
 eafp_concession_company_asset_tt: "$eafp_concession_company_ownership_row$\n$eafp_concession_company_right_tt$"
 eafp_concession_company_ownership_row: "[BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.GetFlagTextIcon] [BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.GetNameNoFlag] / [BuildingOwnership.GetOwnerBuilding.GetCompany.GetName]: [BuildingOwnership.GetLevel|0] levels"
 eafp_concession_company_right_tt: "[SelectLocalization(GetScriptedGui('eafp_concession_holder_right_gui').IsShown(GuiScope.SetRoot(State.MakeScope).AddScope('holder', BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.MakeScope).End), 'eafp_concession_right_live', 'eafp_concession_right_returned')]"
 eafp_concession_right_live: "Concession right held"
 eafp_concession_right_returned: "No concession right · residual ownership"
 eafp_concession_asset_amount: "#v [BuildingOwnership.GetLevel|0] levels#!\n[BuildingOwnership.GetOwnershipRatio|%0]"
 eafp_concession_urban_usage: "Urban buildings #v [State.MakeScope.GetVariableFromVariableMap('eafp_concession_urban_map', Company.GetCountry.MakeScope).GetValue|0]#! / [BuildingOwnership.GetLevel|0] levels"
 eafp_concession_urban_usage_tt: "This concession company owns #v [State.MakeScope.GetVariableFromVariableMap('eafp_concession_urban_map', Company.GetCountry.MakeScope).GetValue|0]#! levels of industry and port in this state; its cap equals its $building_eafp_concession$ share here, #v [BuildingOwnership.GetLevel|0]#! levels.\nAt the cap the company makes no further industrial investment in this state."
 eafp_concession_company_building_row: "[Building.GetName] · #v [BuildingOwnership.GetLevel|0]#! levels ([BuildingOwnership.GetOwnershipRatio|%0])"

 # 저널 위젯: 조계 확장 버튼
 eafp_concession_expand_label: "Expand your concession by 5 levels (@money![GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_expansion_cost')|D])"
 eafp_concession_expand_title: "Expand Concession"
 eafp_concession_expand_desc: "Increase your concession company's share in [State.GetName] by five levels."
 eafp_concession_expand_button_tt: "#header $eafp_concession_expand_title$#!\n$eafp_concession_expand_desc$\n$TOOLTIP_DELIMITER$\n[GetScriptedGui('eafp_concession_expand_gui').IsValidTooltip(GuiScope.SetRoot(State.MakeScope).AddScope('actor', GetPlayer.MakeScope).End)]\n\n#title Effects:#!\n[GetScriptedGui('eafp_concession_expand_gui').ExecuteTooltip(GuiScope.SetRoot(State.MakeScope).AddScope('actor', GetPlayer.MakeScope).End)]"
 eafp_concession_expand_effect_tt: "Increases our concession company's share of the $building_eafp_concession$ in [SCOPE.sState('concession_state').GetName] by Size #v 5#!"
 eafp_concession_expand_active_tt: "We must hold a valid concession right in this state"
 eafp_concession_expand_capacity_tt: "The urban center cap must have room for at least five more levels"
 eafp_concession_expand_treasury_tt: "[concept_gold_reserves] must be at least @money!#variable [GetPlayer.MakeScope.ScriptValue('eafp_concession_expansion_cost')|D]#!"
 eafp_concession_expand_ownership_tt: "We must already own levels of this state's $building_eafp_concession$"

 # 월간 조계 사건 (concessions_in_china.200~207)
 concessions_in_china.200.t: "Disputed Tax Bills"
 concessions_in_china.200.d: "Merchants in [SCOPE.sState('concession_state').GetName] have asked [SCOPE.sCountry('concession_holder').GetName] to intervene in a dispute over local taxes. The authorities of [SCOPE.sCountry('concession_host').GetName] maintain that concession rights do not exempt every transaction."
 concessions_in_china.200.f: "A translated treaty lay beside the tax ledger. The two officials had underlined different sentences in the same article."
 concessions_in_china.200.a: "Seek an arrangement with the local authorities."
 concessions_in_china.200.b: "Insist on our exemptions."
 concessions_in_china.201.t: "Clash at the Concession Boundary"
 concessions_in_china.201.d: "Guards serving [SCOPE.sCountry('concession_holder').GetName] have clashed with local police in [SCOPE.sState('concession_state').GetName]. Officials of [SCOPE.sCountry('concession_host').GetName] demand compensation and a settlement of the jurisdictional dispute."
 concessions_in_china.201.f: "The overturned stall remained between the patrols. Behind shuttered shops, merchants waited to see which side would withdraw first."
 concessions_in_china.201.a: "Settle the incident with compensation."
 concessions_in_china.201.b: "Deliver a formal protest."
 concessions_in_china.201.c: "Go to war for the concession's return."
 concessions_in_china.202.t: "A Voice for Local Merchants"
 concessions_in_china.202.d: "Chinese merchants in [SCOPE.sState('concession_state').GetName] seek representatives in consultations with the [SCOPE.sCountry('concession_holder').GetName] concession authorities. The government of [SCOPE.sCountry('concession_host').GetName] supports their request."
 concessions_in_china.202.f: "Seals from shops large and small crowded the petition. Recognizing the names, a clerk brought another chair into the meeting room."
 concessions_in_china.202.a: "Hear the merchants' representatives."
 concessions_in_china.202.b: "Keep consultations between the existing parties."
 concessions_in_china.203.t: "Sharing the Repair Bill"
 concessions_in_china.203.d: "Roads and drains shared by the concession and neighboring districts of [SCOPE.sState('concession_state').GetName] need repairs. [SCOPE.sCountry('concession_host').GetName] has asked [SCOPE.sCountry('concession_holder').GetName] to contribute."
 concessions_in_china.203.f: "Water still pooled beneath the boundary stone after the rain. Before asking whose jurisdiction it was, the workman pointed to the blocked drain."
 concessions_in_china.203.a: "Contribute to the repairs."
 concessions_in_china.203.b: "Leave the bill to the local authorities."
 concessions_in_china.204.t: "A Concession Reclaimed"
 concessions_in_china.204.d: "[SCOPE.sCountry('concession_host').GetName] has forcibly abolished the [SCOPE.sCountry('concession_holder').GetName] concession right in [SCOPE.sState('concession_state').GetName], with relations and prestige losses scaled to the returned concession."
 concessions_in_china.204.f: "Officials posted the new notice and sealed the old papers. As ledgers changed hands, rumors from the street filled the office."
 concessions_in_china.204.a: "The return is recorded."
 concessions_in_china.205.t: "War over a Concession"
 concessions_in_china.205.d: "The concession dispute in [SCOPE.sState('concession_state').GetName] has become a war between [SCOPE.sCountry('concession_host').GetName] and [SCOPE.sCountry('concession_holder').GetName]. [SCOPE.sCountry('concession_host').GetName] demands the concession's return. The right remains until that war goal is enforced."
 concessions_in_china.205.f: "Mobilization orders replaced the negotiation map. The courier left for the next office without waiting for an answer."
 concessions_in_china.205.a: "The war has begun."
 concessions_in_china.206.t: "A Concession amid Civil War"
 concessions_in_china.206.d: "Civil war in [SCOPE.sCountry('concession_host').GetName] is disrupting security and trade around [SCOPE.sState('concession_state').GetName]. Local officials have asked [SCOPE.sCountry('concession_holder').GetName] to help fund relief and protection."
 concessions_in_china.206.f: "Refugee carts queued at the checkpoint. Opening the warehouse and authorizing its expenses each required a different official's signature."
 concessions_in_china.206.a: "Help fund relief."
 concessions_in_china.206.b: "We cannot take on further costs."
 concessions_in_china.207.t: "An Opening for a New Treaty"
 concessions_in_china.207.d: "Merchants from [SCOPE.sCountry('concession_holder').GetName] in [SCOPE.sState('concession_state').GetName] propose establishing footholds in other Chinese states. Existing contacts with [SCOPE.sCountry('concession_host').GetName] offer an occasion to consider further treaty negotiations."
 concessions_in_china.207.f: "The merchants' map marked cities they had yet to visit. Beside it lay a list of negotiating partners longer than the proposed itinerary."
 concessions_in_china.207.a: "Consider treaty negotiations."
