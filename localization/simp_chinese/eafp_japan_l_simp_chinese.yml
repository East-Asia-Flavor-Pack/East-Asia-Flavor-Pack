 eafp_japan_regions_text: "#bold 各地区的治理#!\n纵使江户的命令遍及#tooltippable;tooltip:eafp_japan_yashima_tooltip 八洲#!，其权威仍建立在各藩的服从之上。大名虽是将军的臣属，在自己的领地内却与一国之君无异。随着他们忠诚与独立程度的变化，幕府的权威或将日益稳固，亦可能逐渐动摇。"
 eafp_japan_yashima_tooltip: "#tooltip_header 八洲#!\n$TOOLTIP_DELIMITER$\n日本的古称，字面意为“八座岛屿”，源于伊邪那岐与伊邪那美诞下八座大岛的创世神话。此处泛指日本全境。"
