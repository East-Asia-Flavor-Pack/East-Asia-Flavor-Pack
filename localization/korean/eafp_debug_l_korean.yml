# eafp_debug.3
 eafp_debug.3.t: "디버그 사건 3"
 eafp_debug.3.d: "모드 기능을 확인하기 위한 시험 사건이다."
 eafp_debug.3.a: "확인"

 # 일본 디버그 결단
 jap_bakufu_authority_zero: "(디버그) 막번체제: 막부의 권위를 0으로 낮추기"
 jap_bakufu_authority_zero_desc: "막번체제 일지에서 막부의 권위를 #v 0#!으로 낮춘다."

 # 조선 디버그 결단
 kor_scramble_for_korea_setup: "(디버그) 조선 쟁탈전: 일본 측 조건 갖추기"
 kor_scramble_for_korea_setup_desc: "필요에 따라 일본의 쇄국을 풀고 유신을 앞당기며, 일본을 열강이 승인한 국가로 만든다."
 kor_samjeong: "(디버그) 삼정의 문란: 세 진행도 올리기"
 kor_samjeong_desc: "관청현황, 군적현황, 민생현황의 진행도를 각각 #v 2000#!으로 맞춘다."
 kor_yangjeon: "(디버그) 양전: 완료"
 kor_yangjeon_desc: "양전 진행도를 완료 기준인 #v 360#!으로 맞춘다."
 kor_sedo: "(디버그) 세도정치: 종결"
 kor_sedo_desc: "세도정치의 힘의 균형을 종결 기준인 #v 0#!으로 낮춘다."
 kor_manchurian_policy: "(디버그) 만주 정책: 시작"
 kor_manchurian_policy_desc: "만주 정책 일지를 추가한다."
 kor_own_manchuria: "(디버그) 만주 정책: 만주 전역 넘겨받기"
 kor_own_manchuria_desc: "만주의 모든 주를 조선 소유로 바꾼다."

 # 청 디버그 결단
 chi_chiwes1: "(디버그) 용이변하: 시작"
 chi_chiwes1_desc: "총리아문의 설립 사건을 띄워 용이변하 일지를 시작한다."
 chi_chiwes2: "(디버그) 용이변하: 완료 처리"
 chi_chiwes2_desc: "용이변하의 시작과 완료를 기록하는 변수를 설정한다."
 chi_chistate: "(디버그) 한족 본토의 모든 주 넘겨받기"
 chi_chistate_desc: "한족 본토의 모든 주를 청 소유로 바꾼다."
 chi_collapse: "(디버그) 불안정한 통합: 대청 통합을 0으로 낮추기"
 chi_collapse_desc: "대청 통합을 붕괴 기준인 #v 0%#!로 낮춘다."

 # 부국강병의 길 디버그 결단
 kor_reformation_society_complete: "(디버그) 부국강병의 길: 사회 개혁 완료 표시"
 kor_reformation_society_complete_desc: "사회 개혁의 디버그 완료 변수를 설정한다."
 kor_reformation_military_complete: "(디버그) 부국강병의 길: 군제 개혁 완료 표시"
 kor_reformation_military_complete_desc: "군제 개혁의 디버그 완료 변수를 설정한다."
 kor_reformation_economy_complete: "(디버그) 부국강병의 길: 상공업 진흥 완료 표시"
 kor_reformation_economy_complete_desc: "상공업 진흥의 디버그 완료 변수를 설정한다."
 kor_reformation_diplomacy_complete: "(디버그) 부국강병의 길: 외교 개혁 완료 표시"
 kor_reformation_diplomacy_complete_desc: "외교 개혁의 디버그 완료 변수를 설정한다."

 # 양요 디버그 결단
 kor_yangyo_make_interested_power: "(디버그) 양요: 이해관계 열강 만들기"
 kor_yangyo_make_interested_power_desc: "조선이 아닌 강대국 하나가 동북아에 관심 표시를 하게 한다."
 kor_yangyo_fire_ship_event: "(디버그) 양요: 이양선 사건 띄우기"
 kor_yangyo_fire_ship_event_desc: "이양선 사건 가운데 조건이 맞는 하나를 바로 띄운다."
 kor_yangyo_grant_grievance: "(디버그) 양요: 모든 열강에 명분 주기"
 kor_yangyo_grant_grievance_desc: "이해관계가 있는 열강 모두가 조선을 칠 명분을 얻는다."
 kor_yangyo_launch_now: "(디버그) 양요: 바로 일으키기"
 kor_yangyo_launch_now_desc: "전투함이 있는 이해관계 열강 하나가 곧바로 최후통첩을 보낸다."
 kor_yangyo_make_opened: "(디버그) 양요: 쇄국 해제"
 kor_yangyo_make_opened_desc: "쇄국을 풀어, 원정국이 배상금만 요구하는 갈래를 확인한다."
 kor_yangyo_reset: "(디버그) 양요: 상태 초기화"
 kor_yangyo_reset_desc: "진행 중인 원정과 원정 결과 고정을 지운다."
 kor_yangyo_become_aggressor: "(디버그) 양요: 조선 원정 준비"
 kor_yangyo_become_aggressor_desc: "우리 나라가 동북아에 관심 표시를 하고 조선을 칠 명분을 얻는다."

 # 예치의 길 디버그 결단
 kor_yechi_complete: "(디버그) 예치의 길: 완료"
 kor_yechi_complete_desc: "예치의 정착 기간을 #v 60#!개월로 맞춘다. 다음 저널 확인 때 예치의 길 결말이 난다."
 kor_yangyo_set_fort_level: "(디버그) 양요: 경기 해군 요새 단계 바꾸기"
 kor_yangyo_set_fort_level_desc: "경기 해군 요새를 #v 0#! → #v 5#! → #v 10#!단계로 바꾼다."
 kor_yangyo_force_result: "(디버그) 양요: 원정 결과 고정"
 kor_yangyo_force_result_desc: "다음 원정 결과를 완승 → 격퇴 → 패배 → 확률 순으로 바꾼다."
