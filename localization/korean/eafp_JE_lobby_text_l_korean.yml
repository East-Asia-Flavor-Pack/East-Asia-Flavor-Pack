l_korean:

je_chinese_westernization_lobby: "대저 천하의 도는 오직 성현의 가르침에 있나니, 예의와 인륜의 근본은 오직 우리 중화에 있다. 저 바다 건너 서양 오랑캐들이 사서삼경의 구절 한 줄이라도 읊을 수 있겠는가? 그러나 오랑캐의 것이라고 하여 무조건 배척하는 것은 옳지 않다. 비록 겉모습이 기이하고 풍속이 야만스러우며 군신과 부자의 예법을 알지 못하나, 총포와 군선을 다루는 병법과 기계를 다루는 기예만큼은 실로 정교하고 날카롭다고 할 수 있을 지어다. 맹자 왈 중화의 도리로 오랑캐를 교화한다(用夏變夷)라고 하셨으니, 우리 대청은 본디 땅이 넓고 물자가 풍부하여(地大博物) 만물을 품어 기르는 대지의 덕을 지녔다.\n 중화의 강토와 성현의 법도를 몸통(體)으로 삼고, 양이들의 화포와 전함, 그리고 부국강병의 술책을 쓰임(用)으로 삼으면 호랑이가 날개를 단 격이 될 것이니, 저들의 술법을 터럭만큼 받아들인다고 해서 어찌 바다와도 같이 넓은 중화의 도리가 무너지겠는가? 천하가 급변하여 대청의 형세가 벼랑 끝에 놓였으니 시세의 변화를 깨닫지 못하는 어리석은 선비가 되어서는 아니 된다.\n 그러나 저들의 삿된 풍속과 괴이한 사교까지 받아들일 수는 없다. 우리가 취할 것은 오직 오랑캐의 기술 뿐이니, 이것이야말로 능히 오랑캐의 것으로 오랑캐를 제압하는 것(以夷制夷)이 아니겠는가? \n\n요를 말하자면, #v 우리 방식엔 아무런 문제가 없다는 것이다.#!"
je_dowager_cixi_lobby: "대청은 광대하고, 자금성은 깊고도 장엄하다. 이 말은 구중심처(九重深處)라고 하였으니, 즉 궐 안에서 벌어지는 일은 귀신조차 헤아리지 못한다는 뜻이다.\n 함풍제께서 승하하신 이래 조정의 철권은 천하의 모두가 수군거리는 그분, 즉 자희태황후 예허나라씨에게로 돌아갔다.\n\n그로부터 적지 않은 시간이 지났고, 이제 조정의 백관들은 혹 #v 서태후#!라고도 불리는 그 분을 뵐 때마다, 옛 당의 측천무후를 떠올리며 한 가지 의문을 품기 시작했다 : #italic ‘과연 자금성의 주인은 황제인가?’#!\n\n이제 성상 폐하께서 성년이 되어 장성하셨으니, 그 불경한 의문에 친히 답을 내리실 때가 도래하였다. 허나 천하가 너무 어리석어 폐하의 교지를 납득할 수 없다면, 그때는? 곧이어 더더욱 불충한 질문이 뒤따를 것이다. : #italic ‘과연 대청의 주인은 황제인가?’#!"
je_manchus_and_han_lobby: "대청이 천하의 주인이 된 지도 어언 이백여 년이 흘렀다.\n그간 황상(皇上)의 성덕과 조정의 법도는 지극히 공명정대하였으며, 만주와 한족을 아우르는 팔기의 군율은 서릿발같이 엄정하였고, 만한병용(滿漢倂用)의 제도와 화이일가(華異一家) 대의는 사해를 안녕케 했노라. 간혹 바다 도적 정씨와 같은 일부 어리석은 한족이 작은 소요를 일으켰으나 모두 그저 천하를 평정하는 과정에서 빚어진 미미한 티끌에 불과할 뿐이었으니, 본조의 천명이 어디 하나라도 모자란 곳이 있었던가?\n본조의 기조는 언제나 한결같다. 우리 만주족의 대청은 명의 천명을 정통으로 계승하여 도탄에 빠진 창생을 구제하였고, 만주와 한, 몽골과 서장, 신강과 회골에 이르기까지 대청의 강역에 기거하는 만백성을 배불리 먹이는 데 한 치의 소홀함도 없었다. 만한을 모두 아우르는 대청의 자비가 바다와 같으니, 한족 백성들 역시 황은에 감읍할 뿐 그동안 일말의 불만도 품은 바가 없었다.\n\n#v 결코 품어서는 아니 될 것이다. 결코.#!"

je_bakuhantaisei_lobby: "쇄국 정책을 고수해온 에도 막부의 통치 체제, 즉 막번 체제는 외부의 압력과 내부의 불만으로 인해 뿌리째 흔들리고 있다. '존황양이'를 기치로 내건 세력들은 막부의 무능을 비판하며 천황 중심의 새로운 질서를 요구한다."
je_bakufu_kaikaku_lobby: "수백년의 정체 끝에, 이제 막부의 체제는 너무 낡았다. 몇번이고 노력을 거듭해서 개혁을 이루어내야 한다."
je_liberty_civil_right_movement_lobby: "민족주의 사상이 일본에 퍼지며 많은 국민이 뜻을 모아 권리를 요구하기 시작했다."
je_seikanron_lobby: "우리는 마땅히 제국이 되었으니 식민지를 가져야 한다. 진구 황후 때 우리에게 복속되었지만 어느덧 세폐를 바치지 않게 된 바다 건너 한반도를 다시 점령하는 것이 가장 좋은 길이다."

je_korean_kings_health_lobby: "국왕의 건강이 쇠약해져 신료들의 걱정이 이만저만이 아니다. 수년째 후사를 두지 못하셨기에, 자칫 국본이 흔들릴 수 있다는 불안감이 조정 대신들 사이에 퍼지고 있다."
je_korean_land_problem_lobby: "사백 년 종사가 무너지고 있다. 병자년의 치욕조차 능히 견뎌냈던 이 나라가, 안으로부터 스스로 썩어 무너지는 중이다.\n선왕들께서 피와 땀으로 세우신 모든 법도는 한낱 종이쪼가리가 되었고, 세종대왕과 성종대왕께서 이룩하신 기틀은 속절없이 붕괴하고 있다. 본디 참된 세상을 만들고 군자를 기르고자 했던 서원은 권세만을 좇는 위선자들에게 넘어와 썩어빠진 세상을 낳는 온상이 되었으며, 백성을 구휼하고자 만든 법은 도리어 백성을 옥죄어 숨통을 끊는 올가미가 되었다. 나라를 지키라 세운 훈련도감의 군병들은 도리어 백성의 고혈을 빨아먹는 도적이 되었고, 공평해야 할 과거는 매관매직의 장터로 전락하였으며, 나라의 근간을 잡아야 할 사또와 향리의 자리는 시정잡배에게 넘어간 지 오래다.\n대체 무엇이 이 지경을 만들었단 말인가? 국정을 농단한 세도가? 허수아비로 전락한 군왕? 백성의 뼈를 깎는 탐관오리? 뒤에서 건더기를 줏어 먹는 아전들?\n반상의 법도를 허물려 드는 상민과 천예들? 혹은 그저, 이 땅에 발을 딛고 사는 사람들 모두?\n아니면.. 우리가 하늘처럼 떠받들면, 성리학의 도 그 자체?\n\n원인이 무엇이든, 지금의 조선이 패망의 벼랑 끝으로 굴러떨어지고 있다는 사실만은 부정할 수 없다. 망국의 가장 뚜렷한 징조는 텅 비어버린 국고이니, 무엇보다 먼저 나라의 재정을 바로 세워야만 한다. 지금 #italic 세 가지 거대한 구멍#!이 조선의 재물과 민심을 끝없이 집어삼키고 있으니, 구멍을 틀어막고 나라의 기강을 다시 세우기 위해서는 #v 세 개의 균형추#!를 조율해야 한다. 방도는 오직 그것 뿐이니, 아주 신중하고 정교하게 다루어야 한다.\n\n만약 이 구멍들을 막아내지 못한다면 임진년의 참화가 반복될 것이고, 이번에는 왜구가 이길 것이다.\n\n그 때가 오면, 이 땅의 백성들은 더 이상 '조선인'이라는 이름으로 숨 쉬지 못하게 될 것이니."
je_korean_imsul_boom_lobby: "균역법의 시행, 대동법의 확대 등 여러 정책이 시도되었으나, 수백 년간 쌓여온 병폐는 쉽게 해결되지 않고 있다. 이러한 상황에서 민심은 점점 더 흉흉해지고 있으며, 백성들 사이에서는 한탄이 들려오고 있다."
je_sedo_politics_lobby: "어린 국왕이 즉위한 이래, 국정은 왕의 손을 떠나 특정 외척 가문의 손아귀에 들어갔다. 안동 김씨를 위시한 소수의 가문이 비변사의 요직을 독점하며, 사실상 국정을 사유화하고 있다."
je_korean_reformation_lobby: "군사의 제도를 개혁하고, 농상공의 이익을 일으키며, 신기의 제작을 배워 우리의 힘을 길러야 만이 만국 가운데 자주독립할 수 있을 것이다."

je_khmer_issue_lobby: "캄보디아는 우리의 지배를 받고 있으나, 이에 대한 크메르인들의 반발이 심해지고 있다."
