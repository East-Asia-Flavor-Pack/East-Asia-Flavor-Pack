 ig_eafp_mgl_shabi_and_lamas: "Shabi and Lamas"
 ig_eafp_mgl_scribes_and_theologians: "Scribes and Theologians"
 gov_eafp_bogd_khanate: "Bogd Khanate"
 gov_eafp_bogd_khanate_desc: "A government in which the Bogd Khan combines religious authority with temporal rule."
 RULER_TITLE_EAFP_BOGD_KHAN: "Bogd Khan"
 RULER_TITLE_EAFP_BOGD_KHATUN: "Bogd Khatun"
 company_eafp_mongol_industrial_combine: "Mongol Industrial Combine"
 company_eafp_mongol_industrial_combine_desc: "A state-led combine linking food and textile processing with electrical power."
 ideology_eafp_mgl_bogd: "Bogd Theocrat"
 ideology_eafp_mgl_bogd_desc: "Seeks to preserve traditional order beneath the Bogd's religious authority."
 ideology_eafp_mgl_borjigin_restoration: "Borjigin Restorationist"
 ideology_eafp_mgl_borjigin_restoration_desc: "Seeks to restore Golden Lineage monarchy and aristocratic order."
 ideology_eafp_mgl_constitutionalist: "Constitutionalist"
 ideology_eafp_mgl_constitutionalist_desc: "Seeks to reconcile national state-building and modern administration through representative institutions."
 ideology_eafp_mgl_steppe_federalist: "Steppe Federalist"
 ideology_eafp_mgl_steppe_federalist_desc: "Supports an equal federation safeguarding religion, customary law, and local representation."
 concept_eafp_mgl_restoration: "Restoration of the Mongol State"
 concept_eafp_mgl_restoration_desc: "Independence is presented both as state creation and the restoration of a pre-Qing political order."
 concept_eafp_mgl_golden_lineage: "Golden Lineage"
 concept_eafp_mgl_golden_lineage_desc: "Political legitimacy derived from the Borjigin lineage of Chinggis Khan."
 concept_eafp_mgl_steppe_charter: "Steppe Charter"
 concept_eafp_mgl_steppe_charter_desc: "A covenant defining members' religious, customary, representative, and military guarantees."
 concept_eafp_mgl_united_industrial_area: "United Industrial Area"
 concept_eafp_mgl_united_industrial_area_desc: "An industrial area dynamically evaluated across eligible states under direct rule, subjects, or investment treaties."
 je_eafp_mgl_invite_steppe_league_candidates_button: "Invite League Candidates"
 je_eafp_mgl_invite_steppe_league_candidates_button_desc: "Send invitations to countries that currently meet the cultural and territorial conditions. Usable every 90 days."
 je_eafp_mgl_leave_steppe_league_button: "Leave the Steppe League"
 je_eafp_mgl_leave_steppe_league_button_desc: "Renounce league membership and its journal obligations."
 dyn_c_great_mongolian_state: "Great Mongolian State"
 dyn_c_great_mongolian_state_adj: "Mongolian"
 dyn_c_mongolian_peoples_republic: "Mongolian People's Republic"
 dyn_c_mongolian_peoples_republic_adj: "Mongolian"
 ai_strategy_eafp_mgl_industrialization: "Mongol Industrialization"
 ai_strategy_eafp_mgl_industrialization_desc: "Build market access and construction capacity first, then address resource, power, tools, and consumer-goods bottlenecks across the current industrial area."
