 korea_scramble_sovereignty_button_desc: "Commit 50 Bureaucracy for 24 months. Korea gains 3 influence; the unique foreign leader loses 3. Tied foreign leaders lose nothing. Cooldown: 24 months."
 scramble_for_korea_events.1.t: "A Candle in the Wind"
 scramble_for_korea_events.1.d: "The rising tide of imperialism has reached the shores of [ROOT.GetCountry.GetName]. From neighbors along our borders to unfamiliar great powers across the sea, foreign nations are revealing their dark intentions."
 scramble_for_korea_events.1.f: "\"Our country lies at the very throat of Asia, its position as precarious as an egg beneath a heavy stone. The great powers watch us, each wary of moving before the others. Should one invade, the rest will not stand idle, and our country will surely be unable to withstand the resulting calamity.\"" # 유길준 전서에 있다는데 암만 뒤져도 못 찾겠다. 적당해서 넣음.
 scramble_for_korea_events.1.a: "Even in a tiger's den, a clear head can save us."

 scramble_for_korea_events.2.t: "Ambitions toward the Korean Peninsula"
 scramble_for_korea_events.2.d: "The neighboring peninsula is a strategic crossroads between continent and ocean, a bridgehead essential to securing supremacy in East Asia. Yet we are not alone in coveting it."
 scramble_for_korea_events.2.f: "\"Look at the map. Korea is a dagger pointed at the heart of [ROOT.GetCountry.GetName]. If we leave its hilt in the hands of another great power, we must live in constant fear of the moment it strikes.\"" # Jacob Meckel 말 적당히 써먹음
 scramble_for_korea_events.2.a: "It rightfully belongs within our sphere of influence."

 scramble_for_korea_events.3.t: "The Korean Question"
 scramble_for_korea_events.3.d: "The regional powers keep each other in check, each determined to bring Korea within its sphere of influence."
 scramble_for_korea_events.3.f: "\"Anyone seeking to understand the Korean question must recognize that Korea is a grain caught between the millstones of its powerful neighbors. Its strategic value has made it a shuttlecock, struck back and forth as rival powers confront one another.\"" # 그리피스, 은자의 왕국 조선 + 조지 커존, 극동의 문제들. 적당히 섞음.
 scramble_for_korea_events.3.a: "Keep watch on the Far East."
 scramble_for_korea_events.4.t: "Korean Sovereignty Secured"
 scramble_for_korea_events.4.d: "The scramble for Korea has ended in a Korean victory. The contest over the peninsula has come to a close, strengthening Korea’s position in determining its own future."
 scramble_for_korea_events.4.f: "\"The rights of a nation cannot be shaken by heedless words, nor can the sovereignty upheld by millions be disposed of at the whim of a single person; this is self-evident. Consider a servant employed in another man's household who, without the master's direction or command, takes it upon himself to transact the affairs of that household with others. Having no authority to conduct such business, he will find that his arrangements receive no approval from his master, while others will mock his pretensions. Thus, the rights of a nation cannot be altered by threats or arbitrary acts.\"" # 출처: 유길준, 『서유견문』 제3편 「방국의 권리」 제8절 후반부. 원문의 논지와 비유를 유지하고 생소한 한자어와 연결 표현을 고풍스러운 현대어로 다듬음. https://ko.wikisource.org/wiki/서유견문/제3편
 scramble_for_korea_events.4.a: "We shall determine our own future."
 scramble_for_korea_events.4.b: "We must acknowledge Korea’s position."
 scramble_for_korea_events.5.t: "A New Ascendant Power"
 scramble_for_korea_events.5.d: "[SCOPE.sCountry('scramble_winner').GetName] has prevailed in the Korean contest. The resulting subject relationship and diplomatic position define the new order."
 scramble_for_korea_events.5.f: "\"In time, the Korean Peninsula will become the possession of [SCOPE.sCountry('scramble_winner').GetName]. The same irresistible, inexorable force that gradually expanded the borders of [SCOPE.sCountry('scramble_winner').GetName], extended our protection little by little over our domains, and finally set us in motion is now driving us toward the Korean Peninsula.\"" # 출처: 로젠 남작, 「4등관 로젠 남작이 제출한 단신」(1902. 9. 12.), 『러시아국립해군성문서Ⅱ(1900~1903)』, 문서 57. РГАВМФ, ф. 417, оп. 1, д. 2303, лл. 51–63. 특정 국가에 한정되지 않도록 재구성. https://db.history.go.kr/item/compareViewer.do?levelId=fs_021r_0570
 scramble_for_korea_events.5.a: "Our position is secured."
 scramble_for_korea_events.5.b: "We must respond to this new order."
 scramble_for_korea_events.6.t: "Japanese Ascendancy"
 scramble_for_korea_events.6.d: "[SCOPE.sCountry('scramble_winner').GetName] has prevailed in the Korean contest. The resulting subject relationship and diplomatic position define the new order."
 scramble_for_korea_events.6.f: "\"Now the whole world acknowledges the greatness of Japan's strength, and she has naturally taken her place among the great powers. Yet you gentlemen cling to the dreams of ten or twenty years ago, failing to perceive how the times have changed and passing judgment as you please. Such conduct shows a profound ignorance of the state of affairs. Your country lacks the strength necessary for independence. Its independence is truly no more than an empty name.\"" # 출처: 이토 히로부미, 1905년 11월 16일 「伊藤 大使 한국 각 대신 및 원로대신과 담화의 요령」, 『주한일본공사관기록』, 국사편찬위원회 한국사데이터베이스. 발췌·중간 생략. https://db.history.go.kr/joseon/level.do?levelId=jh_025r_0070_0030&types=r
 scramble_for_korea_events.6.a: "Our position is secured."
 scramble_for_korea_events.6.b: "We must respond to this new order."
 scramble_for_korea_events.7.t: "Qing Ascendancy"
 scramble_for_korea_events.7.d: "[SCOPE.sCountry('scramble_winner').GetName] has prevailed in the Korean contest. The resulting subject relationship and diplomatic position define the new order."
 scramble_for_korea_events.7.f: "\"An appraisal of your strength reveals only weaknesses. Not only are you unable to stand as a sovereign state, but you have no great power to protect you. That you cannot preserve yourselves unaided is therefore a natural truth known to all under heaven.\n\nKorea originally belonged to China. If she now seeks to abandon China and turn elsewhere, she is like a young child leaving its parents to seek the care of strangers.\"" # 출처: 원세개 「조선대국론(朝鮮大局論)」, 『고종실록』 23권, 고종 23년(1886) 음력 7월 29일 제3기사, 국사편찬위원회. 발췌·중간 생략 및 종결 어미 조정. https://sillok.history.go.kr/id/wza_12307029_003
 scramble_for_korea_events.7.a: "Our position is secured."
 scramble_for_korea_events.7.b: "We must respond to this new order."
