l_english:
 je_scramble_for_korea: "The Scramble for Korea"
 je_scramble_for_korea_reason: "Reform and foreign intervention will decide Korea’s future. Each participant accumulates influence independently. A foreign country wins at an uncontested 100. Korea must be independent, recognized and alone at 100 to secure sovereignty. A direct overlord other than Qing wins regardless of influence.\n\nA foreign influence victory over Qing’s Korean subject transfers Korea to the winner. While this journal is active, Korea has −50% power bloc leverage resistance."
 je_scramble_for_korea_status: "Participants are accumulating influence. A tie at 100 keeps the contest open."
 korea_scramble_status_war: "War suspends influence, proposals and score victories. The non-Qing overlord rule still applies."
 korea_scramble_status_tied: "Two or more participants have 100 influence. The contest awaits an uncontested leader."
 korea_scramble_status_overlord: "Korea has a direct overlord other than Qing. The overlord wins."
 korea_scramble_gui_heading: "Influence by participant"
 korea_scramble_role_korea: "Sovereignty"
 korea_scramble_role_foreign: "Foreign influence"
 korea_scramble_gui_value: "[Country.Custom('korea_scramble_role')]: [Country.MakeScope.Var('scramble_for_korea_participants_influence').GetValue|1]/100"
 korea_scramble_gui_tooltip: "Expected monthly change: [Country.MakeScope.ScriptValue('scramble_for_korea_monthly_change')|=+2]\n[Country.MakeScope.GetScriptValueDesc('scramble_for_korea_monthly_change')]\nMonthly total: −1 to +1. Influence: 0–100. This forecast uses current conditions."
