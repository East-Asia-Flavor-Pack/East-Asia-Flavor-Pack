l_korean:
 je_eafp_joseon_qing_war: "조청전쟁"
 je_eafp_joseon_qing_war_reason: "아, 남한산성의 치욕을 어찌 잊을 수 있겠는가? 봉천이 포위되어 어상에 화살이 날아들고 종묘사직이 몹시 위태롭게 되자, 끝내 상께서 몸소 걸어 오랑캐의 진영으로 나아가셨으니 구천의 곤욕인들 이에 비길 수 있으랴.\n\n이제 [ROOT.GetCountry.GetName]은 그날의 치욕을 씻으려 하나, 전쟁이 다시 백성을 굶기고 얼린다면 승리 또한 새로운 상처로 남을 것이다."
 je_eafp_joseon_qing_war_status: "현재 [concept_war_support]: #variable [SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').GetValue|0+=]#!"
 je_eafp_joseon_qing_war_status_pending: ""
 je_eafp_joseon_qing_war_progress: "승전 시 전쟁의 [concept_war_support]에 따라 다른 보상을 얻게 됩니다. 이는 다음과 같습니다.\n[SelectLocalization(And(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').IsSet,GreaterThanOrEqualTo_CFixedPoint(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').GetValue,'(CFixedPoint)50')),'@green_checkmark_box!','@simple_box!')] #tooltippable;tooltip:[SCOPE.GetRootScope.GetCountry.GetTooltipTag],eafp_jqw_victory_high_reward_tt #p 50 이상#!#!\n[SelectLocalization(And(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').IsSet,And(GreaterThanOrEqualTo_CFixedPoint(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').GetValue,'(CFixedPoint)0'),LessThan_CFixedPoint(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').GetValue,'(CFixedPoint)50'))),'@green_checkmark_box!','@simple_box!')] #tooltippable;tooltip:[SCOPE.GetRootScope.GetCountry.GetTooltipTag],eafp_jqw_victory_medium_reward_tt #v 50 미만 0 이상#!#!\n[SelectLocalization(And(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').IsSet,LessThan_CFixedPoint(SCOPE.GetRootScope.GetCountry.MakeScope.Var('eafp_var_jqw_current_war_support').GetValue,'(CFixedPoint)0')),'@green_checkmark_box!','@simple_box!')] #tooltippable;tooltip:[SCOPE.GetRootScope.GetCountry.GetTooltipTag],eafp_jqw_victory_low_reward_tt #n 0 미만#!#!"
 eafp_jqw_victory_high_reward_tt: "#header $eafp_joseon_qing_war_events.2.c$#!\n$TOOLTIP_DELIMITER$\n[GetScriptedGui('eafp_jqw_victory_high_reward_sgui').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 eafp_jqw_victory_medium_reward_tt: "#header $eafp_joseon_qing_war_events.2.b$#!\n$TOOLTIP_DELIMITER$\n[GetScriptedGui('eafp_jqw_victory_medium_reward_sgui').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 eafp_jqw_victory_low_reward_tt: "#header $eafp_joseon_qing_war_events.2.a$#!\n$TOOLTIP_DELIMITER$\n[GetScriptedGui('eafp_jqw_victory_low_reward_sgui').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"

 eafp_joseon_qing_war_events.1.t: "압록강을 넘은 포성"
 eafp_joseon_qing_war_events.1.d: "조선과 청 사이에 전면적인 전쟁이 발발했다."
 eafp_joseon_qing_war_events.1.f: "\"조선과 청의 전쟁이 시작되었다. 청은 옛날 성현의 가르침이 있고 공자와 맹자가 태어난 중화였으나 이제는 포악무도한 나라가 되었으니 마땅히 징벌해야 한다는 노래가 유행했다. 월금 스승의 집에는 돌이 날아들었고 명적을 부는 젊은이들은 매국노라며 구타당했다. 붉은 띠와 머리띠를 두른 검무패의 여인들은 군함의 출정을 노래했다.\""
 # 출처: 하기와라 사쿠타로(萩原朔太郎), 『일청전쟁이문(日清戦争異聞): 하라다 주키치의 꿈』 상편.
 eafp_joseon_qing_war_events.1.a: "천하의 질서가 흔들리는구나."

 eafp_joseon_qing_war_events.2.t: "전쟁 뒤의 국체"
 eafp_joseon_qing_war_events.2.d3: "[SCOPE.sCountry('qing_enemy').GetName](을)를 상대로 전례 없는 대승을 거두며 완벽한 자주독립을 쟁취한 [SCOPE.sCountry('joseon_scope').GetName](은)는 온 천하에 당당한 주권국가임을 선포하였다."
 eafp_joseon_qing_war_events.2.d2: "[SCOPE.sCountry('joseon_scope').GetName](은)는 [SCOPE.sCountry('qing_enemy').GetName]과의 전란 끝에 오래된 사대의 굴레를 끊어내고 자주독립을 이루어냈으나, 승리를 위해 치른 대가는 작지 않았다."
 eafp_joseon_qing_war_events.2.d1: "[SCOPE.sCountry('joseon_scope').GetName](은)는 끝내 [SCOPE.sCountry('qing_enemy').GetName]의 사대 굴레를 끊어내고 자주독립을 쟁취하였으나, 그 과정에서 참혹한 상처를 입었다."
 eafp_joseon_qing_war_events.2.f3: "청의 요새가 함락되고 그 함대가 멸망했으며, 북쪽에서는 조선의 대군이 조수처럼 진격하여 요하 이동에 적의 기병 한 필도 보이지 않았다. 이윽고 강화사가 찾아오고 평화 조약 체결의 소식이 널리 전해졌다. 조선군이 개선하자 전쟁은 마치 대붕이 날개를 접듯 홀연히 끝났다."
 # 출처: 도쿠토미 로카(徳冨蘆花), 『불여귀(不如帰)』 하편 7장 1절.
 eafp_joseon_qing_war_events.2.f2: "구월 말에 이르러 황해의 승전보가 들려왔고, 다시 며칠이 지나 부상자들 가운데 그녀는 남편의 이름을 찾아냈다. 그녀는 밤새 잠들지 못했다. 다행히 남편의 부상이 심하지 않고 병원에 있다는 소식을 알게 되었다. 생사의 근심은 누그러졌으나, 그를 생각하며 이리저리 해주고 싶은 일이 많아질수록 뜻대로 할 수 없는 지금의 처지에 대한 한이 다시 가슴을 메웠다."
 # 출처: 도쿠토미 로카(徳冨蘆花), 『불여귀(不如帰)』 중편 4장 2절, 아오조라 문고. https://www.aozora.gr.jp/cards/000280/files/1706_44742.html
 eafp_joseon_qing_war_events.2.f1: "\"무엇보다 병든 군인과 부상병들에게만 정신이 팔려 미처 그런 데까지 생각하지 못했습니다. 준비가 조금도 갖추어지지 않아 치료의 손길도 미치지 못했으므로 몹시 분주했습니다. 오 분도 쉴 틈 없이 밤에도 눈을 붙이지 못한 채 힘을 다했습니다. 그러나 기구와 약품이 온전하지 않아 제대로 간호하지 못하고 그대로 죽게 내버려 둔 이가 많았으니, 적정을 살필 겨를이 어디 있었겠습니까?\""
 # 출처: 이즈미 교카(泉鏡花), 『해성발전(海城発電)』 제3절.
 eafp_joseon_qing_war_events.2.c: "대승의 영광을 온 나라에 선포하라."
 eafp_joseon_qing_war_events.2.b: "승리의 대가를 잊지 마라."
 eafp_joseon_qing_war_events.2.a: "승전 뒤에 남은 상처부터 수습하라."

 eafp_joseon_qing_war_events.3.t: "무너진 사직의 체면"
 eafp_joseon_qing_war_events.3.d: "[SCOPE.sCountry('joseon_scope').GetName](은)는 [SCOPE.sCountry('qing_enemy').GetName]의 굴레를 끊어내지 못한 채 패전의 치욕과 참혹한 상처를 떠안았다."
 eafp_joseon_qing_war_events.3.f: "이 젊은 나이에 이런 곳까지 전쟁하러 와서는 개처럼 까닭도 없이 죽고 만다. 첫째 나를 벤 청나라 병사가 밉다. 그 다음에는 우리를 정찰하러 내보낸 부대의 상관이 밉다. 마지막으로 이런 전쟁을 시작한 조선과 청이 밉다."
 # 출처: 아쿠타가와 류노스케(芥川龍之介), 『목이 떨어진 이야기(首が落ちた話)』 상편.
 eafp_joseon_qing_war_events.3.a: "이 치욕은 오래 남을 것이다."

 eafp_modifier_joseon_qing_war_great_victory: "조청전쟁: 대승리"
 eafp_modifier_joseon_qing_war_costly_victory: "조청전쟁: 값비싼 승리"
 eafp_modifier_joseon_qing_war_pyrrhic_victory: "조청전쟁: 상처뿐인 승리"
 eafp_modifier_joseon_qing_war_defeat: "조청전쟁: 패배"
