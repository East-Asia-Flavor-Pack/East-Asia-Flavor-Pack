 eafp_concession_company_slot: "조계회사 특별 기업 한도"
 eafp_concession_capacity_row: "조계 [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_total_levels')|0] / 상한 [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_urban_cap')|0] · 잔여 [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_free_capacity')|0] · 초과 [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_over_capacity')|0]"
 eafp_concession_capacity_tt: "조계지 1레벨은 무역소 1레벨 상당의 고용·무역능력·투입량을 갖는다.\n새 조계권을 획득하면 조계지 5레벨을 지급한다. 주별 상한은 도심지 레벨의 5배이며 신규 획득에는 5레벨, 저널 확장에도 5레벨의 여유가 필요하다.\n도심지가 감소해도 기존 건물과 지분은 보존한다.\n현재 무역소 환산: [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_trade_equivalent')|0]레벨"
 eafp_concession_expand_label: "자국 조계 +5레벨 확장 (@money![GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_expansion_cost')|D])"
 eafp_concession_company_ownership_row: "[BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.GetFlagTextIcon] [BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.GetNameNoFlag] / [BuildingOwnership.GetOwnerBuilding.GetCompany.GetName]: [BuildingOwnership.GetLevel|0]레벨"
 eafp_concession_forced_loss: "강제 조계 반환의 충격"
 eafp_concession_shared_assets_note: "다른 국가의 조계권이 남아 있으면 반환된 지분이 잔존할 수 있습니다. 마지막 권리 해제 시 건물을 철거합니다."
 eafp_concession_right_live: "조계권 보유"
 eafp_concession_right_returned: "조계권 없음 · 잔존 지분"
 eafp_concession_private_investment_label: "도시 산업 자동 투자: 주별 월간 최대 1건"
 eafp_concession_private_investment_tt: "기존 도시 산업의 레벨당 주간 순이익과 건설 조건을 계산하여 민간 건설 큐에 추가합니다. 진행·대기 중인 동일 산업은 제외합니다. 완공 소유권과 재원은 엔진의 민간 투자 규칙으로 정해집니다."
 eafp_concession_company_right_tt: "[SelectLocalization(GetScriptedGui('eafp_concession_holder_right_gui').IsShown(GuiScope.SetRoot(State.MakeScope).AddScope('holder', BuildingOwnership.GetOwnerBuilding.GetCompany.GetCountry.MakeScope).End), 'eafp_concession_right_live', 'eafp_concession_right_returned')]"
 eafp_concession_grant_failed_title: "조계지 설치 실패"
 eafp_concession_grant_failed_desc: "조계회사 또는 기업 소유 조계지 생성이 완료되지 않아 권리를 등록하지 않았습니다. 해당 조약 항목을 정리한 뒤 다시 협상해야 합니다."
 eafp_concession_overview_heading: "조계 현황 · [GetDataModelSize(GetGlobalList('concession_candidate_states_gvarlist'))]개 주"
 eafp_concession_overview_hint: "주 이름을 누르면 보유국·소유 지분·확장 메뉴를 펼칩니다. 순이익은 현재 값 기준입니다."
 eafp_concession_empty_overview: "현재 조계권이 있는 주가 없습니다. 조계 양도 조약이 발효되면 이곳에 표시됩니다."
 eafp_concession_card_total: "[GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_total_levels')|0] / [GuiScope.SetRoot(State.MakeScope).ScriptValue('eafp_concession_urban_cap')|0]"
