 kor_own_manchuria_desc: "将满洲的所有地区移交给朝鲜。"

 # 大清调试决议
 chi_chiwes1: "(调试) 用夷变夏：启动"
 chi_chiwes1_desc: "触发设立总理衙门事件，开启用夷变夏日志。"
