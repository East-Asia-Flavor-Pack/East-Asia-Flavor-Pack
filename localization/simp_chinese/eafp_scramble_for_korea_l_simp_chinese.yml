l_simp_chinese:
 je_scramble_for_korea: "朝鲜争夺战"
 je_scramble_for_korea_reason: "改革与列强干预将决定朝鲜的未来。各参与国独立积累影响力。外国独自达到100即获胜；朝鲜必须独立、获得认可并独自达到100，才能巩固主权。清朝以外的直接宗主国无须影响力即可获胜。\n\n其他参与国在朝鲜仍附属于清朝时赢得影响力竞争，将接管朝鲜的宗主权。日志期间朝鲜的势力集团控制力抵抗降低50%。"
 je_scramble_for_korea_status: "各参与国正在积累影响力。100点并列时继续竞争。"
 korea_scramble_status_war: "相关战争期间暂停影响力、提案和点数胜利；非清朝宗主国的自动胜利仍有效。"
 korea_scramble_status_tied: "至少两个参与国的影响力达到100。竞争将持续到出现唯一领先者。"
 korea_scramble_status_overlord: "朝鲜的直接宗主国并非清朝。该宗主国获胜。"
 korea_scramble_gui_heading: "各参与国影响力"
 korea_scramble_role_korea: "主权"
 korea_scramble_role_foreign: "外国影响力"
 korea_scramble_gui_value: "[Country.Custom('korea_scramble_role')]: [Country.MakeScope.Var('scramble_for_korea_participants_influence').GetValue|1]/100"
 korea_scramble_gui_tooltip: "预计每月变化：[Country.MakeScope.ScriptValue('scramble_for_korea_monthly_change')|=+2]\n[Country.MakeScope.GetScriptValueDesc('scramble_for_korea_monthly_change')]\n每月总变化限制为−1至+1，影响力为0至100。预测根据当前条件计算。"
 korea_scramble_drift_pressure: "遏制外国压力"
 korea_scramble_drift_rank: "朝鲜国家等级"
 korea_scramble_drift_money: "对朝鲜的资金援助"
 korea_scramble_drift_obligation: "朝鲜所欠义务"
 korea_scramble_drift_advisers: "获准派驻的军事顾问"
 korea_scramble_drift_bloc: "朝鲜所属势力集团的领袖"
 modifier_korea_enlightenment_support: "支持朝鲜改革派"
 modifier_reject_korea_enlightenment_support: "拒绝改革援助"
 modifier_enlightenment_support_from_foreign: "外国改革援助"
 modifier_kor_foreign_influence: "朝鲜争夺：外国影响"
 modifier_kor_improved_labor_conditions: "改善劳动条件"
 modifier_curtailed_kor_labor_abuses: "遏制劳工剥削"
 modifier_struggling_kor_colonists: "在朝鲜遇困的侨民"
 modifier_korea_scramble_advisers: "驻朝鲜军事顾问团"
 modifier_korea_scramble_diplomatic_cost: "干预朝鲜的外交成本"
 modifier_korea_scramble_administration_cost: "自主外交的行政成本"
 modifier_korea_scramble_sovereignty: "朝鲜主权得到保障"
 modifier_korea_scramble_victory: "在朝鲜占据优势"
 korea_scramble_claim_button: "宣示宗主权与权益"
 korea_scramble_claim_button_desc: "影响力低于外国领先者时可用。承担36个月的50外交力成本，获得3点影响力；一个竞争国可抵消最多3点。冷却36个月。"
 korea_scramble_invest_button: "支持朝鲜商业"
 korea_scramble_invest_button_desc: "需要在朝鲜拥有建筑。提出方案花费£10,000。朝鲜接受后获得3点影响力、改善劳动条件并向朝鲜提供£5,000。冷却24个月。"
 korea_scramble_advisers_button: "提议派遣军事顾问"
 korea_scramble_advisers_button_desc: "提出方案需承担24个月的50外交力成本。朝鲜接受后获得3点影响力，且24个月内每月增加0.5。竞争国可作出回应。冷却24个月。"
 korea_scramble_lobby_button: "争取朝廷支持者"
 korea_scramble_lobby_button_desc: "支持朝鲜政府内的利益集团。提出方案花费£10,000。接受后该集团加入亲我国游说团并增加3点影响力。冷却24个月。"
 korea_scramble_sovereignty_button: "自主外交"
 korea_scramble_sovereignty_button_desc: "承担24个月的50行政力成本。朝鲜影响力增加3，唯一外国领先者减少3；外国领先者并列时不扣除。冷却24个月。"
 scramble_for_korea_events.1.t: "风中残烛"
 scramble_for_korea_events.1.d: "帝国主义的汹涌浪潮已抵达[ROOT.GetCountry.GetName]的海岸。从接壤的邻国到远隔重洋的陌生列强，无数外来势力正露出险恶的用心。"
 scramble_for_korea_events.1.f: "\"我国如今实处亚洲咽喉之地，其形势犹如巨石压卵，危殆至极。强国彼此忌惮，不敢率先行动，只是虎视眈眈。然而一旦某国入侵，其余各国必不会袖手旁观，我国也必将无力承受这场灾祸。\""
 scramble_for_korea_events.1.a: "纵入虎穴，只要沉着应对，便有生机。"

 scramble_for_korea_events.2.t: "觊觎朝鲜半岛"
 scramble_for_korea_events.2.d: "邻近的半岛是连接大陆与海洋的战略要地，也是夺取东亚霸权必须掌握的桥头堡。然而觊觎这片土地的并非只有我们。"
 scramble_for_korea_events.2.f: "\"请看地图。朝鲜犹如一把直指我们[ROOT.GetCountry.GetName]心脏的匕首。若不由我们握住刀柄，而任由其他列强掌控，我们就只能终日活在不知何时会遭到刺杀的恐惧之中。\""
 scramble_for_korea_events.2.a: "那里理应处于我们的势力范围之内。"

 scramble_for_korea_events.3.t: "朝鲜问题"
 scramble_for_korea_events.3.d: "地区强国相互牵制，都一心想将朝鲜纳入自己的势力范围。"
 scramble_for_korea_events.3.f: "\"任何试图理解朝鲜问题的人，都必须认清一个事实：朝鲜是一颗夹在强大邻国这两块磨盘之间的谷粒。正因其战略价值极高，它已沦为竞争列强迎面交锋时来回击打的羽毛球。\""
 scramble_for_korea_events.3.a: "密切注视远东。"
 scramble_for_korea_events.23.t: "日本占据优势"
 scramble_for_korea_events.23.d: "[SCOPE.sCountry('scramble_winner').GetName]赢得了朝鲜争夺。由此确定的附属关系与外交地位构成新秩序的基础。"
 scramble_for_korea_events.23.f: "印章落定之后，改变的不仅是地图上的界线，更是权力的方向。"
 scramble_for_korea_events.23.a: "我们的地位已巩固。"
 scramble_for_korea_events.23.b: "我们必须应对新秩序。"
 scramble_for_korea_events.24.t: "清朝宗主权的再确立"
 scramble_for_korea_events.24.d: "[SCOPE.sCountry('scramble_winner').GetName]赢得了朝鲜争夺。由此确定的附属关系与外交地位构成新秩序的基础。"
 scramble_for_korea_events.24.f: "印章落定之后，改变的不仅是地图上的界线，更是权力的方向。"
 scramble_for_korea_events.24.a: "我们的地位已巩固。"
 scramble_for_korea_events.24.b: "我们必须应对新秩序。"
 scramble_for_korea_events.22.t: "新的主导强国"
 scramble_for_korea_events.22.d: "[SCOPE.sCountry('scramble_winner').GetName]赢得了朝鲜争夺。由此确定的附属关系与外交地位构成新秩序的基础。"
 scramble_for_korea_events.22.f: "印章落定之后，改变的不仅是地图上的界线，更是权力的方向。"
 scramble_for_korea_events.22.a: "我们的地位已巩固。"
 scramble_for_korea_events.22.b: "我们必须应对新秩序。"
 scramble_for_korea_events.20.t: "朝鲜主权得到保障"
 scramble_for_korea_events.20.d: "独立并获得国际认可的朝鲜已确立无可争议的地位。朝鲜终于能够自主决定未来。"
 scramble_for_korea_events.20.f: "主权并非一纸宣言，而是捍卫宣言所需的力量与制度。"
 scramble_for_korea_events.20.a: "我们的未来由我们决定。"
 scramble_for_korea_events.20.b: "必须承认朝鲜的地位。"
 scramble_for_korea_events.21.t: "争夺中止"
 scramble_for_korea_events.21.d: "继续竞争的条件已不复存在。"
 scramble_for_korea_events.21.f: "现实已经改变，旧日的算计失去了意义。"
 scramble_for_korea_events.21.a: "重新评估局势。"
 scramble_for_korea_events.21.dkorea: "朝鲜已不复存在，争夺随之结束。"
 scramble_for_korea_events.21.dcollapse: "中国崩溃，竞争的前提随之消失。"
 scramble_for_korea_events.21.dchina: "清朝已消失，原有竞争格局无法维持。"
 scramble_for_korea_events.21.djapan: "日本已消失，原有竞争格局无法维持。"
 scramble_for_korea_events.4.t: "支持改革派"
 scramble_for_korea_events.4.d: "资助改革或许能在朝鲜朝廷中争取支持。我们可以提供资金，但是否接受仍由朝鲜决定。"
 scramble_for_korea_events.4.f: "新书与机器传入之处，也总有外交官的足迹。"
 scramble_for_korea_events.4.a: "推进提案。"
 scramble_for_korea_events.4.b: "这次暂且作罢。"
 scramble_for_korea_events.4.cancel: "局势已变，撤回提案。"
 scramble_for_korea_events.5.t: "在朝鲜的商业"
 scramble_for_korea_events.5.d: "我们在朝鲜的产业需要就劳动条件和进一步援助进行协商。"
 scramble_for_korea_events.5.f: "商人翻开账簿，官员翻开报告。同样的数字，却有不同的含义。"
 scramble_for_korea_events.5.a: "推进提案。"
 scramble_for_korea_events.5.b: "这次暂且作罢。"
 scramble_for_korea_events.5.cancel: "局势已变，撤回提案。"
 scramble_for_korea_events.6.t: "军事顾问团提案"
 scramble_for_korea_events.6.d: "我们可以派遣军事顾问团帮助朝鲜改革军制。顾问团必须获得朝鲜同意才能开展工作。"
 scramble_for_korea_events.6.f: "操场上口令的变化，从来不只是军队的问题。"
 scramble_for_korea_events.6.a: "推进提案。"
 scramble_for_korea_events.6.b: "这次暂且作罢。"
 scramble_for_korea_events.6.cancel: "局势已变，撤回提案。"
 scramble_for_korea_events.8.t: "宗主权与权益"
 scramble_for_korea_events.8.d: "竞争国的影响力已经领先。清朝可主张宗主权，日本可援引条约权益，其他国家则可强调本国利益。"
 scramble_for_korea_events.8.f: "外交文书中的一句话，有时比一艘军舰留下的影响更久。"
 scramble_for_korea_events.8.a: "推进提案。"
 scramble_for_korea_events.8.b: "这次暂且作罢。"
 scramble_for_korea_events.8.cancel: "局势已变，撤回提案。"
 scramble_for_korea_events.9.t: "寻找朝廷支持者"
 scramble_for_korea_events.9.d: "我们应在朝鲜政府中寻找愿意听取提议的利益集团。实际资助仍需进一步协商并获得朝鲜同意。"
 scramble_for_korea_events.9.f: "介绍信有时比正式条约更早叩开大门。"
 scramble_for_korea_events.9.a: "推进提案。"
 scramble_for_korea_events.9.b: "这次暂且作罢。"
 scramble_for_korea_events.9.cancel: "局势已变，撤回提案。"
 scramble_for_korea_events.10.t: "侨民纠纷"
 scramble_for_korea_events.10.d: "朝鲜境内与我国同文化居民的待遇引发争议。我们可寻求协商，或帮助愿意自愿返乡的人。"
 scramble_for_korea_events.10.f: "使馆堆积的请愿书里写的不是数字，而是人们的遭遇。"
 scramble_for_korea_events.10.a: "推进提案。"
 scramble_for_korea_events.10.b: "这次暂且作罢。"
 scramble_for_korea_events.10.cancel: "局势已变，撤回提案。"
 scramble_for_korea_events.12.t: "支持友好游说团"
 scramble_for_korea_events.12.d: "朝鲜政府中的一个利益集团愿意讨论合作。如果朝鲜接受，它将加入现有的亲我国游说团，或协助建立新的游说团。"
 scramble_for_korea_events.12.f: "公开会场之外，围绕政策的游说从未停歇。"
 scramble_for_korea_events.12.a: "推进提案。"
 scramble_for_korea_events.12.b: "这次暂且作罢。"
 scramble_for_korea_events.12.cancel: "局势已变，撤回提案。"
 scramble_for_korea_events.10.c: "援助愿意自愿返乡者。"
 scramble_for_korea_events.7.t: "朝鲜的回应"
 scramble_for_korea_events.7.d: "必须审议[SCOPE.sCountry('scramble_actor').GetName]的提案。"
 scramble_for_korea_events.7.f: "大臣们权衡得失。开放国门，从来不只有一种方式。"
 scramble_for_korea_events.7.a: "接受提案。"
 scramble_for_korea_events.7.b: "依靠自己的力量解决。"
 scramble_for_korea_events.7.c: "折中为有限的一次性合作。"
 scramble_for_korea_events.7.cancel: "提案已不再有效。"
 scramble_for_korea_events.7.d4: "[SCOPE.sCountry('scramble_actor').GetName]提议支持改革。接受后该国增加3点影响力并实施提案；拒绝则朝鲜增加3、提议国减少2；折中仅使双方各增加1，不产生持续承诺。"
 scramble_for_korea_events.7.d5: "[SCOPE.sCountry('scramble_actor').GetName]提议改善劳动条件与提供资金。接受后该国增加3点影响力并实施提案；拒绝则朝鲜增加3、提议国减少2；折中仅使双方各增加1，不产生持续承诺。"
 scramble_for_korea_events.7.d6: "[SCOPE.sCountry('scramble_actor').GetName]提议派遣军事顾问团。接受后该国增加3点影响力并实施提案；拒绝则朝鲜增加3、提议国减少2；折中仅使双方各增加1，不产生持续承诺。"
 scramble_for_korea_events.7.d10: "[SCOPE.sCountry('scramble_actor').GetName]提议协商侨民纠纷并提供援助。接受后该国增加3点影响力并实施提案；拒绝则朝鲜增加3、提议国减少2；折中仅使双方各增加1，不产生持续承诺。"
 scramble_for_korea_events.7.d12: "[SCOPE.sCountry('scramble_actor').GetName]提议支持友好政治游说团。接受后该国增加3点影响力并实施提案；拒绝则朝鲜增加3、提议国减少2；折中仅使双方各增加1，不产生持续承诺。"
 scramble_for_korea_events.11.t: "顾问团冲突危机"
 scramble_for_korea_events.11.d: "[SCOPE.sCountry('scramble_actor').GetName]与[SCOPE.sCountry('scramble_rival').GetName]的顾问团发生冲突。朝鲜可以调停，也可以要求一方撤离。"
 scramble_for_korea_events.11.f: "协助训练的承诺已经变成外交对峙。"
 scramble_for_korea_events.11.a: "双方都应保持克制。"
 scramble_for_korea_events.11.b: "要求[SCOPE.sCountry('scramble_actor').GetName]顾问团撤离。"
 scramble_for_korea_events.11.cancel: "争端的条件已经改变。"
 scramble_for_korea_events.13.t: "竞争国的回应"
 scramble_for_korea_events.13.d: "我们必须回应[SCOPE.sCountry('scramble_actor').GetName]在朝鲜的行动。可以投入外交资源抵消其影响，也可以接受现状，或撤回自己的顾问团。"
 scramble_for_korea_events.13.f: "一个国家的进展，改变了另一个国家的盘算。"
 scramble_for_korea_events.13.a: "在外交上加以制衡。"
 scramble_for_korea_events.13.b: "这次接受现状。"
 scramble_for_korea_events.13.c: "撤回我国顾问团。"
 scramble_for_korea_events.13.cancel: "作出回应的前提已消失。"
