 eafp_mgl_heartland_goal_foundation_tt: "#bold 勘测与建设基础#!：至少两个本土地区；75%的地区荒废低于10%、市场接入不低于85%、税收能力充足；建设部门达到2级"
 eafp_mgl_heartland_goal_resources_tt: "#bold 燃料与原料#!：煤、铁、伐木中至少两类，合计8级；75%的相关建筑现金储备高于25%"
 eafp_mgl_heartland_goal_capital_tt: "#bold 技能与资本#!：拥有实质自治；行政3级、城市中心4级、建设3级；75%的地区税收能力充足且生活水平不低于10"
 eafp_mgl_heartland_goal_network_tt: "#bold 蒙古工业网#!：工具与电力3级，食品与纺织5级；75%的相关地区和建筑满足稳定条件"
 eafp_mgl_united_goal_market_tt: "#bold 统一稳定市场#!：当前参与地区的75%满足市场接入、荒废与动乱条件"
 eafp_mgl_united_goal_administration_tt: "#bold 可负担行政#!：直辖与附属地区的75%税收能力充足，且无未整合直辖地区"
 eafp_mgl_united_goal_resources_tt: "#bold 广域原料网#!：三类资源、合计18级，75%的相关建筑现金储备高于25%"
 eafp_mgl_united_goal_industry_tt: "#bold 广域工业网#!：建设、铁路与电力8级；工具、食品与纺织12级；至少两个参与地区有制造业"
 eafp_mgl_united_goal_sustainable_tt: "#bold 可持续整合#!：75%的参与地区与工业建筑满足市场、生活水平、荒废、动乱及储备要求"
