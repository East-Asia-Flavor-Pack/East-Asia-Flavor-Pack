 je_eafp_mgl_restoration_of_the_state: "国家复兴"
 je_eafp_mgl_restoration_of_the_state_reason: "在清廷崩溃的动荡中宣告[concept_eafp_mgl_restoration|l]，争取外交庇护并确立有效统治结构，以立大蒙古国之主权。"
 je_eafp_mgl_bogd_khanate: "博克多汗国"
 je_eafp_mgl_bogd_khanate_reason: "独立之后，需整顿五部行政官署与世俗书记官队伍，在博克多汗的神圣正统性与现代国家行政之间确立平衡。"
 je_eafp_mgl_unite_the_mongols: "统一蒙古诸部"
 je_eafp_mgl_unite_the_mongols_reason: "继承[concept_eafp_mgl_golden_lineage|l]的历史遗产，将内蒙古、巴尔虎、布里亚特、卫拉特与图瓦的所有蒙古民族统合为一个全蒙古国家。"
 je_eafp_mgl_echoes_of_chinggis: "成吉思的回响"
 je_eafp_mgl_echoes_of_chinggis_reason: "在斡难河上游召开大库鲁尔台，将成吉思汗的记忆提炼为共同外交语言，并在统一的[concept_eafp_mgl_steppe_charter|l]下签署游牧草原诸국의和平盟约。"
 je_eafp_mgl_develop_the_heartland: "蒙古本土工业化"
 je_eafp_mgl_develop_the_heartland_reason: "将喀尔喀本土的资源勘测、手工业合作社、纳来哈煤炭与电力及职业教育有效结合，完成蒙古本土自立的工业基础与经济腾飞。"
 eafp_mgl_heartland_gdp_growth_goal_tt: "蒙古本土的[Concept('concept_gdp', '$concept_gdp_short$')]达到日志条目开始时的#v 1.5倍#!，即至少为@gdp!#variable [GetPlayer.MakeScope.Var('eafp_mgl_heartland_gdp_goal').GetValue|K]#!（当前：@gdp!#variable [GetPlayer.MakeScope.ScriptValue('eafp_mgl_heartland_gdp')|K]#!）"
 je_eafp_mgl_develop_the_united_mongol_lands: "全蒙古统一工业区"
 je_eafp_mgl_develop_the_united_mongol_lands_reason: "通过连接全蒙古统合领土的道路与运输网、统一关税、加工工业及广域市场，实现整个[concept_eafp_mgl_united_industrial_area|l]的均衡繁荣。"
 je_eafp_mgl_kiakhta_settlement: "恰克图协定"
 je_eafp_mgl_kiakhta_settlement_reason: "在俄国与中国两大强权之间展开恰克图外交谈判，捍卫蒙古的实际自治权与对外缔约权。"
 je_eafp_mgl_autonomy_in_peril: "危局中的自治"
 je_eafp_mgl_autonomy_in_peril_reason: "面对中国军阀撤销自治与占领大库伦的压力，必须凝聚地下抵抗网络与军政决心，捍卫蒙古自治。"
 je_eafp_mgl_people_revolution: "人民革命"
 je_eafp_mgl_people_revolution_reason: "结合苏赫巴托尔与乔巴山领导的人民义勇军及外部援助，解放大库伦，奠定现代世俗共和国之基石。"
 eafp_mgl_secular_clerks: "世俗书记员"
 eafp_mgl_secular_clerks_desc: "世俗书记员队伍支持行政与公共教育，同时削弱寺院影响力。"
 eafp_mgl_frontier_commission: "边疆委员会"
 eafp_mgl_frontier_commission_desc: "常设委员会协调边疆各旗义务，并提高复国政府的权威。"
 eafp_mgl_diplomatic_secretariat: "外交书记处"
 eafp_mgl_diplomatic_secretariat_desc: "受训的译员与使节提高蒙古外交的效率。"
 eafp_mgl_national_volunteers: "国民志愿军"
 eafp_mgl_national_volunteers_desc: "志愿部队增强军事信心与复国后的国家威望。"
 eafp_mgl_princely_compact: "王公协约"
 eafp_mgl_princely_compact_desc: "协商达成的盟约将王公与国家绑定，并提高统一事业的正统性。"
 eafp_mgl_popular_mandate: "民众授权"
 eafp_mgl_popular_mandate_desc: "平民请愿扩大政府基础并缓和社会分裂。"
 eafp_mgl_petition_registry: "请愿登记局"
 eafp_mgl_petition_registry_desc: "记录并答复请愿的制度扩大政治正统性，却限制任意权威。"
 eafp_mgl_debt_inspection: "债务账簿审查"
 eafp_mgl_debt_inspection_desc: "反映所选政策对国家与工业基础影响的临时效果。"
 eafp_mgl_russian_trade_credit: "俄国贸易信贷"
 eafp_mgl_russian_trade_credit_desc: "获得俄国商号与银行提供的商业信贷，降低采购成本并促进物资流通。"
 eafp_mgl_translation_school: "翻译学校"
 eafp_mgl_translation_school_desc: "反映所选政策对国家与工业基础影响的临时效果。"
 eafp_mgl_independence_prepared: "有准备的独立"
 eafp_mgl_independence_prepared_desc: "在宣告独立前完成行政与征税调整，最大限度地减少了建国后的政治混乱。"
 eafp_mgl_independence_crisis: "独立财政危机"
 eafp_mgl_independence_crisis_desc: "独立后对华贸易中断与债务清算危机导致国库空虚、财政瘫痪。"
 eafp_mgl_secular_state: "世俗国家"
 eafp_mgl_secular_state_desc: "排除僧侣干政，由世俗政府与受训文官队伍主导国家制度运行。"
 eafp_mgl_russian_military_mission: "俄国军事使团"
 eafp_mgl_russian_military_mission_desc: "俄国教官与战术手册受邀改革蒙古军队编制、骑兵战术及现代射击术。"
 eafp_mgl_steppe_federal_charter: "草原联邦宪章"
 eafp_mgl_steppe_federal_charter_desc: "大草原联邦宪章为各成员国平等保障宗教、习惯法及地方代表权。"
 eafp_mgl_steppe_imperial_charter: "大蒙古复兴宪章"
 eafp_mgl_steppe_imperial_charter_desc: "在黄金家族与博克多汗的等级秩序下，动员全员复兴大蒙古帝国荣耀的宪章正在运行。"
 eafp_mgl_steppe_patron_charter: "北方庇护宪章"
 eafp_mgl_steppe_patron_charter_desc: "北方庇护宪章为联盟争取到了北方列强的外交保护与经济贷款。"
 eafp_mgl_steppe_revolutionary_charter: "革命草原宪章"
 eafp_mgl_steppe_revolutionary_charter_desc: "革命宪章废除了王公特权，强调游牧劳动大众之间的革命团结。"
 eafp_mgl_industrial_roads: "工业道路"
 eafp_mgl_industrial_roads_desc: "连接库伦、矿山与主要驿路的车马与汽车道路整修得到加速，降低了运输成本。"
 eafp_mgl_resource_survey: "资源勘测"
 eafp_mgl_resource_survey_desc: "地质学家与矿业工程师开展全国地质勘测，清查煤炭、铁矿与金矿蕴藏。"
 eafp_mgl_artisan_procurement: "手工业采购"
 eafp_mgl_artisan_procurement_desc: "将传统皮革与羊毛手工业者纳入中央采购网络，扩大皮革与纺织原料产出。"
 eafp_mgl_foreign_technical_dependency: "外国技术依赖"
 eafp_mgl_foreign_technical_dependency_desc: "依赖外国工程师与资本运营矿山与工厂，限制了主权行使与利润分享。"
 eafp_mgl_cooperative_procurement: "合作采购"
 eafp_mgl_cooperative_procurement_desc: "通过人民互助合作社系统，以合理价格收集并加工牧民的牲畜原料。"
 eafp_mgl_vocational_training: "职业培训"
 eafp_mgl_vocational_training_desc: "世俗职业学校与技术培训所正在培养现代机械操作、卫生与矿业技术人员。"
 eafp_mgl_industrial_hygiene: "工业卫生"
 eafp_mgl_industrial_hygiene_desc: "松基诺兽医站与防疫体系控制了牲畜疫病，提高了羊毛与皮革质量。"
 eafp_mgl_mongolor_concession: "蒙古金矿公司租让"
 eafp_mgl_mongolor_concession_desc: "蒙古金矿公司租让契约引进了外资技术，但也向外资让渡了矿山开采权与税收。"
 eafp_mgl_nalaikh_fuel_program: "纳来哈燃料计划"
 eafp_mgl_nalaikh_fuel_program_desc: "纳来哈煤矿国有化与增产计划为首都库伦及附近工业设施提供煤炭燃料。"
 eafp_mgl_mining_regulations: "矿业条例"
 eafp_mgl_mining_regulations_desc: "实施1923年矿业条例与细则，遏制外商越界采掘，保障国家税收。"
 eafp_mgl_mining_bureau: "矿务局"
 eafp_mgl_mining_bureau_desc: "规模有限的监管机构在不直接经营矿井的情况下改善安全、生产率与市场连接。"
 eafp_mgl_fiscal_cadastre: "财政地籍"
 eafp_mgl_fiscal_cadastre_desc: "全国登记册提高征税能力、减少流失，同时挑战王公的免税特权。"
 eafp_mgl_tugrik_industrial_credit: "图格里克工业信贷"
 eafp_mgl_tugrik_industrial_credit_desc: "蒙俄银行与图格里克货币改革为国内工业形成提供中央信贷。"
 eafp_mgl_mongoltrans: "蒙古运输"
 eafp_mgl_mongoltrans_desc: "蒙古运输国营汽车与车马运输公司运营卡车与重型车队，实现了草原物流网的现代化。"
 eafp_mgl_public_works_office: "公共工程局"
 eafp_mgl_public_works_office_desc: "公共工程局加快建设和道路整修，但会推高材料成本。"
 eafp_mgl_workshop_registry: "作坊登记制"
 eafp_mgl_workshop_registry_desc: "登记作坊更易扩建，也能更有效地组织劳动力。"
 eafp_mgl_emergency_supply_board: "紧急供应委员会"
 eafp_mgl_emergency_supply_board_desc: "协调粮食分配可在短缺期间稳定工业城镇并吸引工人。"
 eafp_mgl_state_industrial_board: "国家工业委员会"
 eafp_mgl_state_industrial_board_desc: "国家工业委员会协调建设与制造业，但会牺牲政治灵活性。"
 eafp_mgl_industrial_takeoff: "工业腾飞"
 eafp_mgl_industrial_takeoff_desc: "煤炭、铁矿、电力、工具制造与轻工业产业链条闭合，推动蒙古经济进入全面工业腾飞阶段。"
 eafp_mgl_forced_collectivization: "强制集体化"
 eafp_mgl_forced_collectivization_desc: "激进的强制集体化征发牧民牲畜并没收寺院财产，引发了严重的社会危机。"
 eafp_mgl_livestock_and_factory_crisis: "牲畜与工厂危机"
 eafp_mgl_livestock_and_factory_crisis_desc: "大规模屠宰牲畜、牧民逃亡及工厂原料短缺导致农业与工业生态系统瘫痪。"
 eafp_mgl_new_turn: "新转向"
 eafp_mgl_new_turn_desc: "1932年新转向政策撤销强制集体化，恢复私有游牧与自由交易，使牲畜与市场得以复苏。"
 eafp_mgl_united_industrial_market: "统一工业市场"
 eafp_mgl_united_industrial_market_desc: "通过在全蒙古统合领土废除关税、统一规格及联动加工厂，形成了巨大的单一统一工业市场。"
 eafp_mgl_kiakhta_compromise: "恰克图妥协"
 eafp_mgl_kiakhta_compromise_desc: "1915年恰克图三方协定确立了外蒙古的内政自治与俄国的经济既得利益。"
 eafp_mgl_autonomy_resistance: "自治抵抗"
 eafp_mgl_autonomy_resistance_desc: "针对外力撤销自治的企图，正通过组织民兵与地下网络展开决死抗争。"
 eafp_mgl_revolutionary_network: "革命网络"
 eafp_mgl_revolutionary_network_desc: "苏赫巴托尔的库伦小组与乔巴山的革命小组结合，建立了全国性的人民革命秘密网络。"
 eafp_mgl_soviet_support: "苏联援助"
 eafp_mgl_soviet_support_desc: "红军军事远征、苏联红十字会及武器援助强化了人民政府的军事与行政基础。"
 eafp_mgl.100.t: "大库伦秘密会议"
 eafp_mgl.100.d: "1911年夏，为反抗清廷新政与残酷压迫，喀尔喀四部的核心王公与高级喇嘛秘密集结于大库伦郊外的博克多汗山密林之中。那木囊苏伦、罕达多尔济、策凌齐密特等领袖人物齐聚一堂，密谋发动起义以斩断屈辱的宗藩关系，彻底光复属于蒙古固有的独立主权。"
 eafp_mgl.100.f: "“在松林深处跳动的篝火旁，草原的命运就此定夺。结束两百年的屈从、重建我们自己汗国的时刻，就在今朝！”\n\n——1911年库伦密盟记录"
 eafp_mgl.100.a: "宣布蒙古主权的时候到了！"
 eafp_mgl.100.b: "时机尚未成熟，让我们暗中积蓄力量。"
 eafp_mgl.101.t: "前往圣彼得堡的使团"
 eafp_mgl.101.d: "在与清廷摊牌前夕，由罕达多尔济亲王与达喇嘛策凌齐密特率领的秘密使团，冒雪踏上横跨西伯利亚的旅途，急赴俄国首都圣彼得堡。使节团向沙皇尼古拉二世及俄国政府恳求正式承认蒙古独立，并紧急求购现代步枪、军火与财政贷款。然而，圣彼得堡朝廷因顾忌与北京彻底决裂，在提供完全支持上态度审慎。"
 eafp_mgl.101.f: "“倘若北方的巨人肯施以援手，我们便能彻底斩断身上的枷锁。但在沙皇大理石宫殿中奉上的黄金，背后往往藏着看不见的锁链。”\n\n——罕达多尔济亲王密信"
 eafp_mgl.101.a: "只有俄罗斯的援助才能保障我们的独立。"
 eafp_mgl.101.b: "接触其他列强以避免外交孤立。"
 eafp_mgl.101.c: "我们必须不依靠外力，自力更生。"
 eafp_mgl.102.t: "与清朝断绝关系"
 eafp_mgl.102.d: "在蒙古义勇军包围官衙之下，清朝官吏与守军被尽数缴械并驱逐出境。自1691年多伦诺尔会盟以来延续的清朝统治就此终结，大蒙古国的全面复兴正式昭告天下。"
 eafp_mgl.102.f: "在被翻耕得一片漆黑的荒野中央，一株被车轮碾压过的鞑靼蓟倾斜地挺立着。它仿佛被撕去了一块血肉，被掏出了内脏，斩断了一只手臂，剜去了一只眼睛。然而它依然挺立着，绝不向灭绝了它身旁所有同类的征服者低头。\n\n‘多么顽强的生命力啊！人征服了一切，毁灭了成千上万的草木，可这仅存的一株却至死不屈。’"
 eafp_mgl.102.a: "万岁！"
 eafp_mgl.103.t: "博克多即位"
 eafp_mgl.103.d: "在大库伦大寺举行的隆重即位典礼上，哲布尊丹巴呼图克图正式登基为统领全蒙古政教大权的“博克多汗”。"
 eafp_mgl.103.f: "一位老将把权杖呈递给新统帅，他依照古老习俗推辞了两次，直到第三次才欣然接下。人群中爆发出一阵欢呼，如雷鸣般在辽阔的平原上久久回荡，最年长的勇士们则将一把把被雨水浸湿的泥土轻轻洒在他的头顶。"
 eafp_mgl.103.a: "我们将成为侍奉博克多汗的神圣佛教国家。"
 eafp_mgl.103.b: "建立保障王公权利的君主立宪制。"
 eafp_mgl.200.t: "蒙藏友好条约"
 eafp_mgl.200.d: "1913年1月，大蒙古国政府与西藏十三世达赖喇嘛的全权特使阿旺·德尔智在库伦正式签署了具有历史意义的《蒙藏友好条约》。双方宣告摆脱满清宗主羁绊，相互承认主权独立，并立誓依托格鲁派黄教的神圣同盟，在遭遇外敌侵犯时予以全力声援与军事外交互助。"
 eafp_mgl.200.f: "“达赖喇嘛与博克多汗终于发出了同一种声音。当雪域的雄狮与草原的雄鹰携起手来，三宝法光与民族主权必将万古长青。”\n\n——库伦街头的欢呼声"
 eafp_mgl.200.a: "与西藏缔结神圣同盟。"
 eafp_mgl.200.b: "现在应将重点放在国际承认上。"
 eafp_mgl.210.t: "武器与教官"
 eafp_mgl.210.d: "为使初生的大蒙古国军队迅速近代化，俄罗斯帝国运抵了批量的莫辛-纳甘步枪、马克沁重机枪及野战火炮，并派驻了经验丰富的军事教官团。在库伦近郊的呼吉尔布兰军营中，数千名游牧骑兵在俄国教官指导下严格操练现代阵列、射击与协同战术，逐步蜕变为纪律严明的正规国防军。"
 eafp_mgl.210.f: "“角弓与雕翎的时代已然落幕。如今握在我们草原健儿手中的，是喷吐雷霆的钢铁枪炮，足以为保卫圣洁疆土抵御一切来犯之敌。”\n\n——呼吉尔布兰军营的军官"
 eafp_mgl.210.a: "积极接收俄罗斯的武器和教官。"
 eafp_mgl.210.b: "必须培养我们自己的独立军事力量。"
 eafp_mgl.211.t: "贷款与商业权"
 eafp_mgl.211.d: "独立后随着清商撤离与库帑空虚，大蒙古国朝廷为维持政府运转，不得不与俄国西伯利亚商业银行展开大额借款谈判。圣彼得堡在提供救急借款的同时，开出了极为苛刻的交换条件：全境免税通商特权、电报线架设权及矿产开采优先权，试图借此全方位掌控蒙古的经济命脉。"
 eafp_mgl.211.f: "“国库里每搬进一袋白银，我们的牧场上便多钉下一根俄国人的地界桩。这难道就是维系生存必须咽下的苦果吗？”\n\n——财政衙门官员的叹息"
 eafp_mgl.211.a: "即使出让商业权也要争取贷款。"
 eafp_mgl.211.b: "经济附庸会导致政治附庸。拒绝。"
 eafp_mgl.212.t: "俄国调停"
 eafp_mgl.212.d: "面对中华民国北洋政府以武力收复相威胁的强硬表态，俄罗斯帝国以调停者自居强势介入。为避免直接卷入中俄边境大战，圣彼得堡极力迫使库伦当局接受折中方案：名义上承认中国宗主权，以换取外蒙古内政高度自治及俄国在蒙独占性商业特权。"
 eafp_mgl.212.f: "“俄国公使要我们把国家主权腰斩一半。天底下岂有半截的独立？但若弃这面北方之盾于不顾，南面压境的北洋大军又当由谁去阻挡？”\n\n——外务大臣罕达多尔济亲王"
 eafp_mgl.212.a: "接受俄罗斯的外交调停。"
 eafp_mgl.212.b: "我们将亲自走上谈判桌。"
 eafp_mgl.213.t: "独立路线"
 eafp_mgl.213.d: "大蒙古国朝廷拒绝屈服于列强的外交讹诈与妥协要求，毅然宣布走完全自力更生的“独走路线”。政府决心不再仰仗任何外部庇护，动员各旗王公与牧民全民皆兵加固边防，独自承担起建国御敌的重任，即便这意味着必须承受外交极端孤立与全面经济封锁的严酷考验。"
 eafp_mgl.213.f: "“我们的主权绝不是列强谈判桌上讨价还价的筹码！仰人鼻息偷来的独立终究如沙上建塔；纵使流尽鲜血，我们也誓要用自己的双脚屹立于长生天下！”\n\n——内务大臣达喇嘛策凌齐密特"
 eafp_mgl.213.a: "我们的道路由我们自己决定。我们将走独立路线。"
 eafp_mgl.213.b: "没有外力支持无法维持国家……"
 eafp_mgl.300.t: "博克多颁向四方的诏书"
 eafp_mgl.300.d: "继库伦宣告独立之后，博克多汗朝廷向内亚四方的所有蒙古部族颁发了宣谕诏书：内蒙古四十九旗、呼伦贝尔巴尔虎、俄属布里亚特、新疆卫拉特以及唐努图瓦。诏书以成吉思汗的共同血脉与格鲁派神圣信仰为号召，郑重敦促普天下所有蒙古同胞摆脱异族统治，合力归于大蒙古国的一统旗帜之下。"
 eafp_mgl.300.f: "“同根共祖的同胞骨肉如今被荒漠与国界无情割裂，在异族的皮鞭下呻吟。快快汇聚在博克多汗的神圣九斿白纛之下，再造属于我们全体蒙古人的无上家国！”\n\n——传谕全蒙的博克多汗檄文"
 eafp_mgl.300.a: "所有蒙古人都是兄弟。敦促他们加入！"
 eafp_mgl.300.b: "首先争取邻近的内蒙古地区的响应。"
 eafp_mgl.300.c: "为了避免外交摩擦，必须谨慎行事。"
 eafp_mgl.301.t: "王公的回信"
 eafp_mgl.301.d: "响应博克多汗的号召，内蒙古四十九旗中有三十余旗的王公代表纷呈效忠誓书至库伦。然而，由于深惧民国北洋军的武力报复，且忧虑自身封爵特权受损，部分南疆王公仍持观望态度。若要彻底赢得内蒙古各旗的衷心归附，必须对各王公传统的领地自治与世袭爵禄做出切实保障。"
 eafp_mgl.301.f: "“我们的心早已飞向了北方的黄金王座。奈何北京的刺刀已抵在咽喉；唯祈博克多汗赐予明誓，必当力保我等各旗世袭牧场与封爵不坠！”\n\n——锡林郭勒盟王公密信"
 eafp_mgl.301.a: "热烈欢迎他们的加入！"
 eafp_mgl.301.b: "在保障王公自治权的同时逐步整合。"
 eafp_mgl.302.t: "平民请愿"
 eafp_mgl.302.d: "在内蒙古与巴尔虎一带，长期遭受晋商残酷盘剥与本旗王公沉重差税的平民牧民“阿拉德”，纷纷发起名为“独贵龙（环形签名会）”的抗争运动，并派出请愿团来到库伦。他们泣血陈词，恳求大蒙古国朝廷切莫一味偏袒王公贵胄，务必保护贫苦牧民的牧场生计并豁免无理债务。"
 eafp_mgl.302.f: "“我们将名字签成环形，官府便辨不出谁是领头之人。我们斩断满清锁链绝不是为了继续当牛做马；我们长途跋涉来到库伦，只求能作为堂堂正正的蒙古自由人活下去！”\n\n——鄂尔多斯独贵龙代表请愿书"
 eafp_mgl.302.a: "接受平民的请愿，禁止剥削。"
 eafp_mgl.302.b: "王公的支持更为重要。无视请愿。"
 eafp_mgl.303.t: "军队穿越戈壁"
 eafp_mgl.303.d: "1913年，为彻底解放内蒙古并实现全蒙古一统大业，博克多汗政府兵分五路大举越过茫茫戈壁南征。在传奇名将马克思尔扎布、丹毕坚赞及托克托台吉等率领下，蒙古游牧骑兵顶着酷暑与绝粮的极限考验，在内蒙古全境连克北洋军数十处据点，捷报频传。"
 eafp_mgl.303.f: "“万马奔腾之处，戈壁的黄沙已被热血浸染。南疆千万同胞的呼救之声犹在耳畔，纵有千难万险，我军将士何惜一战！”\n\n——南征前线的马克思尔扎布将军"
 eafp_mgl.303.a: "派兵解放戈壁以南的兄弟们！"
 eafp_mgl.303.b: "避免武装冲突，施加外交压力。"
 eafp_mgl.304.t: "俄国照会"
 eafp_mgl.304.d: "眼见蒙古大军势如破竹、与民国全面开战的危机迫在眉睫，沙皇俄国政府向库伦发出了措辞严厉的最后通牒。俄方警告：若不立即停止南进并将军队全线撤回戈壁以北，将全面切断一切军火供给与财政援助，企图强行将蒙古的事业扼杀在外蒙古一隅。"
 eafp_mgl.304.f: "“难道我军将士用鲜血换回的山河，竟要凭列强的一纸空文拱手相让？哪怕断了枪弹火药，我们也绝不后退半步！”\n\n——前线指挥官丹毕坚赞"
 eafp_mgl.304.a: "无视俄罗斯的警告，继续进军！"
 eafp_mgl.304.b: "不能刺激俄罗斯。撤军。"
 eafp_mgl.305.t: "分岔之路"
 eafp_mgl.305.d: "在俄国切断补给、北洋大军反扑以及列强外交绞杀的多重夹击下，全蒙古一统大业走到了决定命运的十字路口。究竟是含泪自戈壁以南撤军以保全喀尔喀本土的独立与生息，还是不惜赌上国运破釜沉舟、誓与强敌血战到底以谋求全蒙一统？"
 eafp_mgl.305.f: "“被迫勒马北还的将士们，其沉痛的长叹响彻苍穹。纵使今日的国土被强敌横加割裂，全蒙古期盼团聚的热血却将永世不息地燃烧！”\n\n——撤军军阵见闻录"
 eafp_mgl.305.a: "我们决不会放弃大蒙古的梦想。"
 eafp_mgl.305.b: "能牢牢守住喀尔喀地区就足够了。"
 eafp_mgl.400.t: "斡难河畔的旗帜"
 eafp_mgl.400.d: "在斡难河畔——成吉思汗诞生并首次建立大蒙古帝国的神圣故土上，来自内亚草原各部的首领与使节齐聚一堂。在这场空前绝后的“草原大忽里勒台（大国会）”上，喀尔喀、卫拉特、布里亚特、图瓦，乃至远道而来的哈萨克与柯尔克孜游牧代表济济一堂，共同商讨重构浩瀚游牧民族大联盟的历史宏愿。"
 eafp_mgl.400.f: "“在斡难河奔腾的碧波之上，九斿白纛再度拔地而起！七百年前的誓言重新激荡着游牧民族的心脏，天下健儿皆当聚集在同一面战旗之下！”\n\n——斡难河忽里勒台开幕宣言"
 eafp_mgl.400.a: "在斡难河畔召开大忽里勒台！"
 eafp_mgl.400.b: "仅让王公们聚集，举行简单的宣誓仪式。"
 eafp_mgl.400.c: "没有必要执着于过去的辉煌。"
 eafp_mgl.401.t: "谁能代表成吉思的遗产？"
 eafp_mgl.401.d: "忽里勒台甫一开幕，关于联盟的最高正统性与主导权便爆发了激烈争论。黄金家族后裔强调孛儿只斤氏的神圣世袭血统；高级喇嘛们极力主张博克多汗的佛法政教至高地位；而平民知识分子与草莽首领则呼吁建立基于全体游牧民平等互助的民主联邦。"
 eafp_mgl.401.f: "“成吉思汗的遗产绝非锁在深闺中的陈旧族谱！在大草原上策马驰骋的每一位游牧健儿心中所流淌的自由与血性，方是大汗真正的意志所在！”\n\n——忽里勒台上的辩论"
 eafp_mgl.401.a: "只有黄金家族才能继承这份伟大的遗产。"
 eafp_mgl.401.b: "博克多汗的神圣权威将把我们团结在一起。"
 eafp_mgl.401.c: "草原上的所有人民都是成吉思汗的真正后裔！"
 eafp_mgl.402.t: "哈萨克托热的空席"
 eafp_mgl.402.d: "统治西方钦察草原哈萨克诸玉兹的成吉思汗后裔“托烈（Töre）”贵族与长者代表团应邀与会。他们虽认同与蒙古古老的血缘羁绊，但经历沙俄殖民统治后，对自身伊斯兰教法、部落自治与习惯法（Adat）极其珍视，唯恐受库伦直接管辖。唯有平等包容，方能促成真正的草原同盟。"
 eafp_mgl.402.f: "“我们是热爱辽阔草原与无拘自由的哈萨克人。我们愿在大汗的号召下并肩作战，但前提是你们必须以长生天的名义起誓，绝不侵犯我们的信仰与部落公约！”\n\n——哈萨克苏丹代表发言"
 eafp_mgl.402.a: "邀请西方的哈萨克兄弟加入我们的联盟。"
 eafp_mgl.402.b: "承诺自治，与突厥系游牧民结盟。"
 eafp_mgl.402.c: "他们的土地太遥远了。我们只专注于蒙古系。"
 eafp_mgl.403.t: "新月下的誓言"
 eafp_mgl.403.d: "信奉藏传佛教的蒙古各部与笃信伊斯兰教的突厥游牧民，达成了具有划时代意义的宗教宽容与和睦协议。草原宪章庄严载明：信仰自由神圣不可侵犯，佛门法堂与清真寺院将在大草原联盟的庇佑下永享太平、并存共荣。"
 eafp_mgl.403.f: "“金佛的慈光与夜空的新月在同一片地平线上交相辉映。祈祷之声虽有不同，但同饮草原之水的我们皆为骨肉兄弟！”\n\n——宗教和睦大典颂词"
 eafp_mgl.403.a: "佛教与伊斯兰教在草原的怀抱中地位平等。"
 eafp_mgl.403.b: "我们的核心是佛教。排斥异教徒。"
 eafp_mgl.404.t: "沙皇的边疆官员"
 eafp_mgl.404.d: "眼见西伯利亚与中亚各游牧民族正以蒙古为核心形成空前庞大的联合体，沙俄边疆总督与外交官深感震恐。为遏制布里亚特与哈萨克大草原的离心倾向，俄国大幅强化了边境驻军，并启动强有力的外交与政治施压以图瓦解这一新兴联盟。"
 eafp_mgl.404.f: "“边境之外的草原上正刮起危险的狂风。倘若放任这些游牧蛮族的联盟彻底坐大，沙皇在亚洲苦心经营的秩序将毁于一旦！”\n\n——伊尔库茨克总督密报"
 eafp_mgl.404.a: "坚决拒绝俄罗斯边防官员的要求。"
 eafp_mgl.404.b: "为了避免冲突，在适当的程度上妥协。"
 eafp_mgl.405.t: "北京的抗议照会"
 eafp_mgl.405.d: "中华民国北洋政府就斡难河忽里勒台及大草原联盟的成立发表了极为强硬的官方抗议，斥其为公然分裂疆土的叛乱行径。北京严正重申内外蒙古、新疆及西北边疆皆为不可分割之国家领土，勒令立即解散联盟，否则必将兴师问罪、予以痛击。"
 eafp_mgl.405.f: "“北京的大总统不过是在公文纸堆里修筑万里长城。这片辽阔草原真正的主人是马背上的游牧儿女，绝非深居南朝宫阙的深阁官僚！”\n\n——外务衙门回绝电"
 eafp_mgl.405.a: "中华民国无权干涉蒙古！"
 eafp_mgl.405.b: "动用外交辞令平息中国的愤怒。"
 eafp_mgl.406.t: "来自赤塔的资金"
 eafp_mgl.406.d: "在俄国内战的惊涛骇浪中，盘踞赤塔的白军头目格里戈里·谢苗诺夫阿塔曼及其背后的日本军部势力，主动提出愿提供巨额军费、枪炮与军火以支持泛蒙古联盟。这笔援助固然能瞬间壮大军威，但也包藏着沦为帝国主义傀儡并招致布尔什维克无情碾压的巨大凶险。"
 eafp_mgl.406.f: "“赤塔送来的黄金上沾满了西伯利亚的风雪与军阀的血腥。妄图借异邦军阀之手立国，无异于引狼入室、与虎谋皮。”\n\n——元老重臣的告诫"
 eafp_mgl.406.a: "接受来自赤塔的资金，巩固草原联盟的基础。"
 eafp_mgl.406.b: "那笔钱可能有毒。拒绝接受。"
 eafp_mgl.407.t: "大草原宪章"
 eafp_mgl.407.d: "历经数月艰苦卓绝的磋商，凝聚全体游牧民族共识的最高根本大法——《大草原宪章》终于正式草签完成。宪章以根本法律形式确立了各成员国的领地自治、军事互保、自由商贸与习惯法地位，成为二十世纪游牧文明重获新生的坚实宪政基石。"
 eafp_mgl.407.f: "“此宪章绝非仅以墨水书于皮纸之上，而是全体草原儿女以热血与灵魂镌刻的不灭誓言。大汗的无上荣光，必将重新普照大地！”\n\n——大草原宪章宣布文"
 eafp_mgl.407.a: "在神权国家的基础上宣布大蒙古。"
 eafp_mgl.407.b: "宣布大蒙古为王公们的君主立宪国。"
 eafp_mgl.407.c: "宣布大蒙古为所有游牧民平等的共和国。"
 eafp_mgl.407.e: "迈向自由民主的草原联邦！"
 eafp_mgl.408.t: "草原联盟的邀请"
 eafp_mgl.408.d: "大草原宪章颁布后，各加盟部族与政权相继开启了批准程序。随着哈萨克部族会议、卫拉特议会、图瓦呼拉尔及布里亚特代表团以压倒性多数正式批准宪章，大草原联盟正式从政治构想蜕变为具备国际法效力的多边联邦同盟。"
 eafp_mgl.408.f: "“在钤盖印信、互换战旗的庄严时刻，营帐内万众相拥，喜极而泣。千百年来被强权割裂的骨肉兄弟，终于在同一片苍穹下重获团圆！”\n\n——批准大典纪实"
 eafp_mgl.408.a: "响应草原联盟的构想并派遣代表。"
 eafp_mgl.408.b: "我们自保都自顾不暇了。"
 eafp_mgl.409.t: "马背帝国还是盟约联邦？"
 eafp_mgl.409.d: "随着大草原联盟的巍然确立与国际地位的跃升，关于联盟长远道路的终极抉择摆在了领袖面前。究竟是重温成吉思汗时代的铁血征服之路、建立高度集权的庞大帝国，还是致力于建设一个基于主权平等、多元自治与繁荣共治的近代草原联邦？亚洲的地缘格局将因这一决断彻底重塑。"
 eafp_mgl.409.f: "“凭战刀夺得的土地终将被战刀夺走，唯有依托信义、法律与公道铸就的同盟方能坚如磐石。我们究竟要将怎样的未来交到子孙后代手中？”\n\n——忽里勒台闭幕讲词"
 eafp_mgl.409.a: "黄金家族的荣耀将再次号令亚洲！"
 eafp_mgl.409.b: "这将是一个尊重各部落自治权的松散联邦。"
 eafp_mgl.409.c: "一道保护游牧民权益的巨大屏障已经建立。"
 eafp_mgl.500.t: "通往工厂的道路"
 eafp_mgl.500.d: "推进近代工业化所亟需的原材料与机械设备，正受制于极为落后的内陆交通。仅靠穿越数百里戈壁土路的骆驼队与牛车早已无法满足建设需求。我们必须在主要矿区、工业城镇与集散市场之间修筑干线道路、架设桥梁，以大幅提升建筑建材与工业物资的运输流转效率。"
 eafp_mgl.500.f: "“绑在骆驼背上的砖石与钢铁要花上数旬才能运抵库伦。若不及早开山筑路、逢水架桥，我们工厂的高耸烟囱将永远无法燃起熊熊烈火。”\n\n——工务部门测绘官奏报"
 eafp_mgl.500.a: "解散手工业行会，转为近代化工厂。"
 eafp_mgl.500.b: "不能威胁手工业者们的生计。"
 eafp_mgl.500.c: "与手工业行会合作，谋求渐进式的工业化。"
 eafp_mgl.501.t: "煤铁勘测队"
 eafp_mgl.501.d: "为探明国家工业化所必不可少的燃料与金属资源，由地质学者与采矿工程师组成的大规模国土矿产勘探队已深入北部山峦。他们对纳来哈煤田及中部铁矿储量进行精确测绘，评估开采价值，旨在为建立自给自足的近代化采矿基础设施奠定科学依据。"
 eafp_mgl.501.f: "“沉睡在大地怀抱深处的乌金与赤铁终于重见天日。这些富饶的地下宝藏，必将成为驱动蒙古近代工商业永不休止跳动的强劲心脏！”\n\n——地质勘探队队长日记"
 eafp_mgl.501.a: "吸引外国资本进行大规模的矿山开发。"
 eafp_mgl.501.b: "资源是我们的。我们将亲手挖掘。"
 eafp_mgl.502.t: "库伦的作坊"
 eafp_mgl.502.d: "散落在库伦街巷间的铁匠、鞣皮匠、鞍辔匠及毡毯手艺人，在政府扶持下被系统整编为集约化合作工坊。通过打破传统家庭作坊的陈规，引入精细分工、统一质量标准及基础动力机械，大幅提高了军需被服、马具及民用日用品的生产效率。"
 eafp_mgl.502.f: "“风箱的呼啸与锻锤的铿锵此起彼伏，唤醒了库伦的清晨。曾经各自为营的工匠们如今拧成一股绳，用长满老茧的双手铸就国家的繁荣！”\n\n——库伦手工业行会会长感言"
 eafp_mgl.502.a: "国家控制纳来哈矿山的特权。"
 eafp_mgl.502.b: "保障外国矿业公司的自主权。"
 eafp_mgl.502.c: "优先改善矿工的权益和待遇。"
 eafp_mgl.503.t: "工业采购账簿"
 eafp_mgl.503.d: "为统筹矿山与工厂建设所需的大额资金与原材料采购，财政部门编制了详尽的国家产业采购清册。通过引导本国商民资本参与、合理调度税收与外债以采购木料、砖石、水泥及进口机器，确保各项重大工矿建设项目不致因资金链断裂而中途夭折。"
 eafp_mgl.503.f: "“每一分银钱、每一根梁木皆不可浪掷于荒沙之中。唯有精打细算、毫厘不爽的账簿，方能成为拔地而起的工厂最坚固的基石。”\n\n——财政衙门计核官"
 eafp_mgl.503.a: "在全国范围内征集牲畜，建立大型皮革加工厂。"
 eafp_mgl.503.b: "必须保护传统的皮革加工方式。"
 eafp_mgl.503.c: "通过出口皮革和肉类筹集工业资本。"
 eafp_mgl.504.t: "矿山与城市的粮食"
 eafp_mgl.504.d: "随着大量牧民涌入新兴矿区与工矿工坊，保障城镇工人的粮食与肉乳供应成为当务之急。为防止发生粮荒与物价飞涨，政府必须与邻近各游牧旗建立稳定的牲畜肉品定向收购契约，设立储备粮仓，建立高效的工业人口食品保供网络。"
 eafp_mgl.504.f: "“饥肠辘辘的矿工挥不动镐头，饥饿的纺织工也转不动机器。唯有草原的肉乳与田野的粮食源源不断运抵，工业的烈火才永不熄灭。”\n\n——粮食调度专员奏报"
 eafp_mgl.504.a: "强迫游牧民定居和从事农耕。"
 eafp_mgl.504.b: "游牧生活是蒙古的认同。不能强迫他们。"
 eafp_mgl.504.c: "增加粮食进口，以满足城市的粮食需求。"
 eafp_mgl.505.t: "人民互助合作社"
 eafp_mgl.505.d: "1921年，为彻底斩断外国奸商的高利盘剥、保障牧民与劳工切身利益，蒙古成立了“人民互助合作社（Ardyn Khariltsan Tuslaltsakh Khorsho）”。合作社以公道价格收购羊毛、生皮与牲畜，并平价供应铁器农具与日用必需品，成为国家自主贸易与物资流通的坚实中枢。"
 eafp_mgl.505.f: "“从今往后，我们的牛羊再不会被高利贷奸商强行掳走。在合作社的旗帜下，我们用自己的双手生产，公平地分享劳动的果实！”\n\n——合作社成立典礼欢呼声"
 eafp_mgl.505.a: "通过人民互助合作社控制流通网络。"
 eafp_mgl.505.b: "保留中国和俄罗斯商人的商权。"
 eafp_mgl.505.c: "国家直接行使贸易垄断权。"
 eafp_mgl.506.t: "第一所世俗职业学校"
 eafp_mgl.506.d: "为培育引领国家近代化与工业化的专业技术人才，蒙古第一批世俗公立学校与职业技术学堂正式落成开学。大批青年牧民入学攻读机械工程、测绘、簿记会计、兽医学及基础文化识字，为改变工业现场全盘依赖外国技师的局面培育出首批本土技术骨干。"
 eafp_mgl.506.f: "“昨日手握牧鞭的少年，今日已能熟练操纵扳手、圆规与图纸。他们求知的热忱，必将成为驱散草原蒙昧、照亮未来的永恒明灯！”\n\n——职业学堂监督讲词"
 eafp_mgl.506.a: "广泛建立西式技术学校，培养工程师。"
 eafp_mgl.506.b: "考虑到寺庙的反对，放缓教育改革的步伐。"
 eafp_mgl.506.c: "只选拔少数人才，派往海外留学。"
 eafp_mgl.507.t: "松基诺兽医站与工业卫生"
 eafp_mgl.507.d: "1923年，为彻底扑灭炭疽、牛瘟等烈性牲畜传染病，保障皮革与毛纺工业原料的卫生安全，松吉诺中央生物兽医研究所正式建立。通过在全境铺设防疫检疫网并自制疫苗血清，大幅降低了牲畜死亡率，为畜牧经济与加工工业的稳健发展筑牢了防疫屏障。"
 eafp_mgl.507.f: "“在显微镜下研制出的一支小小疫苗，挽救了成千上万只羊的性命。近代科学的力量不仅守护着草原的生灵，也驱动着皮革工厂的机轮飞转。”\n\n——松吉诺兽医研究所报告"
 eafp_mgl.507.a: "强制实行全国性的牲畜防疫系统。"
 eafp_mgl.507.b: "尊重那些不信任新兽医学的游牧民的意愿。"
 eafp_mgl.507.c: "宣传松吉诺兽医院的成果，引导自愿参与。"
 eafp_mgl.508.t: "蒙古金矿公司租让"
 eafp_mgl.508.d: "长期由俄国资本把持的色楞格与也罗河流域“蒙古金矿公司（Mongolor）”特许权，迎来了全面的主权谈判。为遏止巨额贵金属外流、增加国库矿税并改善本国矿工的恶劣劳作待遇，政府必须对这项外国租让特权实施严格监管、提高国家持股乃至逐步收归国有。"
 eafp_mgl.508.f: "“从我们祖国土地里掘出的黄金，绝不能尽数流入外国银行的保险库。蒙古地下的一切宝藏，理当用来造福全体蒙古人民！”\n\n——矿务专员的誓言"
 eafp_mgl.508.a: "国家收回蒙古金矿公司的股份。"
 eafp_mgl.508.b: "承认外国资本的金矿开采权，仅征收税款。"
 eafp_mgl.508.c: "大幅提高金矿工人的工资。"
 eafp_mgl.509.t: "纳来哈与工业燃料"
 eafp_mgl.509.d: "位于库伦东南35英里处的纳来哈煤田，迎来了大规模近代化技术改造。通过深挖改良矿井并引入蒸汽提升设备，纳来哈源源不断开采出的煤炭直接供应首都第一座火力发电厂、砖窑及金属冶炼车间，为蒙古的工业心脏注入了源源不竭的澎湃动力。"
 eafp_mgl.509.f: "“纳来哈开采出的乌黑煤炭，点亮了首都的电灯，驱动着工厂的涡轮。这正是近代工业文明在广袤草原上升起的最耀眼曙光！”\n\n——纳来哈煤矿总管"
 eafp_mgl.509.a: "在乌兰巴托建设大型火力发电厂。"
 eafp_mgl.509.b: "发电厂建设成本过于巨大。取消计划。"
 eafp_mgl.509.c: "引入小型发电机，优先用于工厂运转。"
 eafp_mgl.510.t: "矿业与工厂条例"
 eafp_mgl.510.d: "1923年，为遏止矿区与厂矿盲目无序的野蛮开发、确立工业生产安全，政府正式颁布了《国家矿业与工厂规程》。规程明文规定了工时上限、工资底线、强制安全劳保及防止污染条款，为保障劳工权益及工业经济的健康可持续发展奠定了法治基石。"
 eafp_mgl.510.f: "“以摧残工人躯体与生命为代价的工业化绝非福祉，而是灾难。唯有用严明法律捍卫劳工尊严，工厂的烟囱才能光明磊落地吐纳青烟。”\n\n——劳工监察官"
 eafp_mgl.510.a: "制定严格的劳动规章和矿业法。"
 eafp_mgl.510.b: "为了资本家的便利，将监管降至最低。"
 eafp_mgl.510.c: "允许组建工会并保障谈判权。"
 eafp_mgl.511.t: "蒙俄银行与图格里克"
 eafp_mgl.511.d: "1924年蒙俄合办商业银行宣告成立，并于次年1925年正式发行了蒙古自主的主权货币——“图格里克（Tögrög）”。彻底终结了外国银圆、墨西哥鹰洋及茶砖充当通货的混乱局面，以坚挺的银本位图格里克统一全国金融，确立了货币主权并为工业投资提供了充沛稳定的信贷支持。"
 eafp_mgl.511.f: "“铸有神圣索永堡图案的崭新银币在各族人民掌心熠熠生辉。唯有用我们自己的钱币买卖自己工厂生产的物资，才是真正意义上的经济独立！”\n\n——蒙古银行行长宣言"
 eafp_mgl.511.a: "建立蒙古国家银行，发行独立的货币图格里克！"
 eafp_mgl.511.b: "维持现有的银币和墨西哥鹰洋流通体系。"
 eafp_mgl.511.c: "将俄罗斯卢布作为蒙古的官方货币。"
 eafp_mgl.512.t: "蒙古运输与工业交通"
 eafp_mgl.512.d: "1925年创立的国家运输企业“蒙古运输公司（Mongoltrans）”大举引进了重型卡车车队，掀起了辽阔草原物流运输的深刻革命。卡车穿梭于矿区与工厂之间运载煤炭与布匹，将往昔依靠骆驼跋涉需数月之久的西伯利亚边境至首都路程，缩短至区区数日之内。"
 eafp_mgl.512.f: "“钢铁巨兽引擎的轰鸣声裹挟着滚滚烟尘震颤着大地！曾经回荡着悠扬驼铃声的古老驿道，如今正被呼啸而过的近代速度彻底征服。”\n\n——蒙古运输公司卡车司机感怀"
 eafp_mgl.512.a: "将蒙古运输公司国有化，由国家控制物流网络。"
 eafp_mgl.512.b: "暂时默许外国商人的运输垄断权。"
 eafp_mgl.512.c: "优先投资于道路铺设和桥梁建设等基础设施。"
 eafp_mgl.513.t: "从手工业者到工厂工人"
 eafp_mgl.513.d: "数以万计曾经从事传统放牧与简陋手工业的牧民和工匠，正脱胎换骨蜕变为机动化工厂中的熟练产业工人。迁入工矿城镇的他们迅速掌握了近代生产纪律与操作技能，铸就了蒙古历史上第一代产业工人阶级，成为推动国家经济腾飞的崭新主力军。"
 eafp_mgl.513.f: "“我们收起游牧的毡包，穿上了工厂的工作服。用我们这双握惯缰绳如今驾驭车床与纺机的双手，必将锻造出蒙古钢铁般的辉煌未来！”\n\n——首都工人的誓言"
 eafp_mgl.513.a: "将大量手工业者编入工厂，创造无产阶级。"
 eafp_mgl.513.b: "吸引农村和草原的游牧民成为城市工人。"
 eafp_mgl.513.c: "从海外引进熟练工人。"
 eafp_mgl.514.t: "乔巴山工业联合体"
 eafp_mgl.514.d: "1934年，蒙古规模最为宏大的综合型工业旗舰——“乔巴山工业联合企业（Industrial Combine）”在图拉河畔正式建成投产。集大型洗毛厂、皮革厂、制鞋厂、毛纺厂及自备发电厂于一体的庞大工业联合体，每年产出数十万件皮革制品与呢绒被服，标志着国家轻工业全面实现了自主自足。"
 eafp_mgl.514.f: "“耸立在图拉河畔的巍峨烟囱所吐纳的滚滚青烟，是游牧民族用汗水筑就的不朽丰碑。蒙古自主自立的近代工业体系，今日终于大功告成！”\n\n——1934年工业联合企业落成典礼讲词"
 eafp_mgl.514.a: "在乔巴山一带建立庞大的工业联合体！"
 eafp_mgl.514.b: "这种大型项目超出了我们的能力范围。"
 eafp_mgl.515.t: "左倾偏差"
 eafp_mgl.515.d: "1928年掌权的极左派势力罔顾蒙古畜牧业基本国情，强行推行激进的“左倾偏向”政策。对牧民牲畜实施强制集体化、无情没收寺庙资产并全面取缔私营商贸。这些盲动冒进的极端举措导致农村经济濒临崩溃，激起了广大牧民的强烈愤慨。"
 eafp_mgl.515.f: "“他们打着‘集体公有’的旗号，强行夺走我们用血汗养大的牛羊。连挤奶的母羊和代步的坐骑都不给我们留下一头，这算哪门子的人民政府！”\n\n——绝望牧民的控诉"
 eafp_mgl.515.a: "推行激进的左倾政策，没收私有财产。"
 eafp_mgl.515.b: "这种极端主义只会毁了国家。清洗责任人。"
 eafp_mgl.516.t: "牲畜与人口越过国境"
 eafp_mgl.516.d: "不堪忍受严酷的强制集体征发与宗教清洗，成千上万走投无路的牧民拖家带口，赶着牲畜大规模越境逃亡内蒙古与新疆。未能逃脱者宁可将牛羊就地宰杀也绝不上交国营农场，导致全境数以百万计的牲畜在短时间内锐减，国家经济命脉遭遇毁灭性重创。"
 eafp_mgl.516.f: "“边境的风沙中堆满了遭屠宰牲畜的森森白骨。亲手挥刀宰杀自家心爱牛羊的牧民们，其滚烫的血泪浸透了脚下冰冷的大地。”\n\n——边防哨所的凄凉报告"
 eafp_mgl.516.a: "因牲畜国有化措施而愤怒的游牧民开始大规模逃亡。"
 eafp_mgl.516.b: "加强边防，阻止游牧民逃亡。"
 eafp_mgl.517.t: "1932年起义"
 eafp_mgl.517.d: "1932年春，库苏古尔、后杭爱、扎布汗等西北诸省爆发了反对强制集体化与毁寺灭佛的特大规模武装起义。武装喇嘛与起义牧民组成义军，攻占县衙处决党政干部，与正规军及内卫部队展开浴血内战，国家政权与社会秩序陷入彻底崩溃的边缘。"
 eafp_mgl.517.f: "“古刹的钟声已然停歇，密集的枪声响彻整个山谷！被逼上绝路的愤怒民众正挥舞刀枪直逼乌兰巴托；若要挽救社稷，唯有立即改弦更张！”\n\n——前线指挥官急电"
 eafp_mgl.517.a: "无情镇压佛教徒叛军！"
 eafp_mgl.517.b: "宣布新政策（Шинэ эргэлт）以安抚民心。"
 eafp_mgl.518.t: "新转向"
 eafp_mgl.518.d: "1932年夏，在面临彻底亡党亡国的悬崖边上，政府果断踩下刹车，宣布实施全盘调整的“新转折（Shine Ergelt）”政策。全面废止强制牲畜集体农庄，恢复牧民私有产权与自由商贸，宽容宗教信仰并大幅减免赋税，从而平息了内乱战火，使国民经济重归稳定发展的轨道。"
 eafp_mgl.518.f: "“极左狂热的暴风雨终于退去，和平重归这片辽阔草野。看到牧民们照料着属于自己的牛羊重绽笑容，方知唯有顺应民心方是国泰民安的真谛。”\n\n——新转折政策发布辞"
 eafp_mgl.518.a: "放宽国家统制经济路线，允许有限的自由市场。"
 eafp_mgl.518.b: "实施更强硬的铁腕统治以粉碎反动势力的蠢动。"
 eafp_mgl.519.t: "新的工业国家"
 eafp_mgl.519.d: "历经风雨淬炼与科学建设，蒙古终于建成了集矿产采掘、火力发电、干线物流与轻工制造于一体的“新兴工业国”。在传统的游牧沃土之上，近代工厂与现代化矿山星罗棋布，巍然屹立于世界民族之林，迎来了主权自立与经济繁荣的崭新时代。"
 eafp_mgl.519.f: "“在草原古老的宁静之上，激荡着近代工业的强劲脉搏。我们不再仰赖任何列强的施舍，正用自己的双手创造着属于蒙古的无限繁荣！”\n\n——国家工业化竣工典礼致辞"
 eafp_mgl.519.a: "制定涵盖所有蒙古领土的综合工业计划。"
 eafp_mgl.519.b: "尊重各地区的固有经济体系，允许独立开发。"
 eafp_mgl.519.c: "将资源集中在喀尔喀本土的工业化上。"
 eafp_mgl.520.t: "全国工业计划"
 eafp_mgl.520.d: "统筹喀尔喀本土、内蒙古、布里亚特、图瓦及新疆卫拉特等全蒙古版图的《全国工业综合总体规划》正式出台。因地制宜依循各地的矿产禀赋与牧业资源，合理布局矿山采掘、畜产加工与重工业基地，旨在消除区域发展壁垒，实现全疆域的协调平衡发展。"
 eafp_mgl.520.f: "“阿尔泰山脉的矿石与大戈壁的优质羊毛，如今在统一的国家蓝图下高效流转。大蒙古国的辽阔疆土，正如同同一台开足马力的宏伟巨兽般强劲轰鸣。”\n\n——国家计划委员会报告"
 eafp_mgl.520.a: "镇压地方王公的反对，强行实施中央集权的统制经济。"
 eafp_mgl.520.b: "做出让步，赋予地方一定的经济权利以达成妥协。"
 eafp_mgl.520.c: "只有资本主义市场经济才能使所有人富裕。"
 eafp_mgl.521.t: "共同关税与工业标准"
 eafp_mgl.521.d: "全盘废除统一领土内部各旗份与地方割据势力设立的封建厘金关卡与通行杂税，建立统一的海关税政与国家工业标准体系。随着度量衡、零部件规格与技术标准的全面统一步调，横跨数千公里的物资流通与跨区域厂矿协作迎来了爆发式增长。"
 eafp_mgl.521.f: "“过关斩将、逢卡掏钱的屈辱历史一去不返。在统一关税与同一把公道铁尺之下，全蒙古的商贾与工矿企业终于融为一个休戚与共的整体。”\n\n——商务部令宣布文"
 eafp_mgl.521.a: "废除草原联盟内部的所有关税，建立单一市场。"
 eafp_mgl.521.b: "考虑到地区间的工业差距，逐步降低关税。"
 eafp_mgl.521.c: "为了保全税收，维持区域内关税。"
 eafp_mgl.522.t: "跨区域运输网"
 eafp_mgl.522.d: "横贯贝加尔湖畔、内蒙古大草原至天山山脉的“大草原干线综合交通网”工程全线开工。通过干线铁路铺设、硬化公路修筑与电报长途走廊建设的协同并进，构筑起贯通全帝国的战略运输大动脉，使原材料与工业制成品能在数日内通达边疆各要冲。"
 eafp_mgl.522.f: "“在向地平线无限延伸的钢轨之上，蒸汽机车拉响了响彻云霄的汽笛！昔日万马奔腾方能横越的荒原，如今正被钢铁机车如雷霆般瞬息飞驰穿越！”\n\n——铁路通车典礼欢呼"
 eafp_mgl.522.a: "铺设铁路网，将整个蒙古连接起来！"
 eafp_mgl.522.b: "优先扩建成本较低的道路和通信网络。"
 eafp_mgl.522.c: "扩建交通网可能会成为外部入侵的路线。暂缓实施。"
 eafp_mgl.523.t: "原料与工厂布局"
 eafp_mgl.523.d: "为解决棉花、羊毛、生皮等初级原料产地与精深加工工厂之间脱节的地理矛盾，政府实施了科学的产业优化再布局。在资源产地就近建立初级洗选与精炼厂以大幅摊薄运输成本，而在终端消费城镇重点集聚精密加工与装配制造，形成了高度协同的产业链。"
 eafp_mgl.523.f: "“剪下的羊毛就地洗涤，剥下的生皮就近鞣制，再无半点虚掷在运送泥沙上的时间与路费。这正是深具远见的产业统筹智慧。”\n\n——工业部规划专员"
 eafp_mgl.523.a: "掠夺边疆资源，将财富集中在首都乌兰巴托。"
 eafp_mgl.523.b: "在资源产地附近建立工厂，谋求地区均衡发展。"
 eafp_mgl.523.c: "顺应出口原料、进口成品的现有结构。"
 eafp_mgl.524.t: "工人与移民"
 eafp_mgl.524.d: "随着跨区域工业化的飞速推进，数十万人口向新兴工矿城市大规模迁徙，劳动力统筹与各族同胞和睦相处成为核心课题。必须通过消除工薪差距、提供职业技能培训并保障公平劳动权益，化解游牧工人与迁入技术人才之间的摩擦，巩固社会团结与产业稳定。"
 eafp_mgl.524.f: "“大草原的牧民与城镇的技工在同一座车间里并肩奋战。纵使出身背景各异，我们皆是建设繁荣富强祖国的光荣劳动者！”\n\n——全国劳工代表大会宣言"
 eafp_mgl.524.a: "积极接收汉人等外国劳工流入，解决劳动力短缺问题。"
 eafp_mgl.524.b: "严格控制外国人流入，强制实行以蒙古人为主的雇佣。"
 eafp_mgl.524.c: "对外国劳工征收特别税，以扩充国家财政。"
 eafp_mgl.525.t: "统一工业市场"
 eafp_mgl.525.d: "历经数年如一日的统筹投资与深度整合，全蒙古版图已破茧成蝶为高度自给自足、有机循环的“单一工业化大市场”。煤铁矿产、草原肉毛、精密机械与日用消费品无障碍自由流转，大蒙古国终于铸就了任凭任何列强经济制裁也无法撼动的坚不可摧的经济主权。"
 eafp_mgl.525.f: "“用我们自己的双手采掘，用我们自己的机器铸造，在我们自己的市场上繁荣商贸。大草原的帝国，今日终于巍然屹立于坚不可摧的钢铁经济基石之上！”\n\n——统一大市场竣工盛典讲词"
 eafp_mgl.525.a: "庞大的综合蒙古工业区终于建成了！"
 eafp_mgl.525.b: "虽然付出了很多代价，但我们成功地实现了近代化。"
 eafp_mgl.525.c: "需要为被留在工业化阴影下的人们提供福利。"
 eafp_mgl.526.t: "整合还是榨取？"
 eafp_mgl.526.d: "随着跨区域工业区的全面建成，围绕帝国核心都市与边疆属地之间经济关系的根本治理哲学冲突浮出水面。究竟是将边陲之地视作单纯为首都输血的“资源掠夺区”，还是践行各民族平权共享工业化成果的“休戚与共联合体”？历史将见证这决定国格的崇高抉择。"
 eafp_mgl.526.f: "“靠残酷榨取同胞骨肉所堆砌的帝国，终如沙雕般转瞬崩塌。唯有让全草原的所有儿女公平共享繁荣富裕的阳光，我们的国家方能万世永固。”\n\n——最高国务会议决议"
 eafp_mgl.526.a: "我们将血脉相连的兄弟们紧紧团结在一起。"
 eafp_mgl.526.b: "这是一个建立在剥削兄弟基础上的帝国。"
 eafp_mgl.526.c: "这个庞大的联盟能维持多久？"
 eafp_mgl.600.t: "恰克图协定"
 eafp_mgl.600.d: "1915年，沙皇俄国、中华民国与大蒙古国三方代表齐聚边境重镇恰克图，历经长达九个月艰苦卓绝的纵横捭阖，最终签署了《中俄蒙恰克图协约》。以外蒙古名义上承认中国宗主权与俄国商业特权为代价，换取了国际条约形式确认的外蒙古内政高度自治、保留军队与司法独立，赢得了暂时的和平喘息。"
 eafp_mgl.600.f: "“追求完全独立的利刃暂时被迫收归剑鞘。虽然被迫戴上名义宗主权的枷锁，但只要牢牢保全自治法权与国防武力，待天下有变，燎原的火种便永不熄灭。”\n\n——恰克图全权使团回忆录"
 eafp_mgl.600.a: "承认我们外交地位的局限，签署恰克图条约。"
 eafp_mgl.600.b: "为获得完全独立国的承认战斗到底！"
 eafp_mgl.600.c: "让我们摆脱俄罗斯的阴影，寻找新的援助者。"
 eafp_mgl.610.t: "危局中的自治"
 eafp_mgl.610.d: "1919年秋，趁俄国十月革命与内战动荡之机，中华民国皖系军阀将领徐树铮率西北边防军长驱直入占领库伦。徐树铮以武力胁迫博克多汗与各旗王公签署“自愿取消自治呈文”，强行撤销自治并实行严酷军事戒严统治。被逼入绝境的蒙古各阶层志士迅速结成秘密地下抵抗组织，决死反抗。"
 eafp_mgl.610.f: "“在军阀的刺刀面前，神圣的条约被撕得粉碎。但被强权夺走的自主唯有靠鲜血才能夺回！在草原的无边夜幕中，复仇起义的利刃已然出鞘！”\n\n——库伦地下义军誓词"
 eafp_mgl.610.a: "中华民国将军徐树铮占领了乌兰巴托……"
 eafp_mgl.610.b: "白军男爵罗曼·冯·恩琴-史登伯格进入了这座城市。"
 eafp_mgl.610.c: "面临取消自治的危机。"
 eafp_mgl.610.e: "我们决不屈服！抵抗！"
 eafp_mgl.620.t: "人民革命"
 eafp_mgl.620.d: "1921年7月，由达木丁·苏赫巴托尔与霍尔洛·乔巴山率领的蒙古人民义勇军，在苏俄红军协同下彻底击溃了北洋军阀残部及白匪狂人恩琴男爵的血腥统治，光复首都库伦。宣告成立以博克多汗为立宪象征的“人民临时政府”，推翻封建农奴特权与外敌压迫，迎来了1921年人民革命的伟大胜利。"
 eafp_mgl.620.f: "“红旗漫卷库伦晴空，自由的战歌响彻云霄！斩断双重枷锁的蒙古，终于迎来了属于人民革命与民族解放的壮丽黎明！”\n\n——苏赫巴托尔将军胜利宣言"
 eafp_mgl.620.a: "苏赫巴托尔和乔巴山领导的人民革命军取得了胜利！"
 eafp_mgl.620.b: "清除旧时代的残余，建立蒙古人民共和国！"
 eafp_mgl.620.c: "革命的火种将把整个草原染红。"
 eafp_mgl.410.t: "批准草原宪章"
 eafp_mgl.410.d: "载有各加盟邦国元首印玺与全权签字的《大草原宪章》正式批准文书已送抵国库档案馆。至此，以蒙古为盟主的大草原联盟宪政秩序全面生效，各成员国之间的军事互保同盟、无关税统一市场及法律互认机制正式付诸施行。"
 eafp_mgl.410.f: "“这封泥上盖下的朱红印章，是全草原儿女用百年血泪凝聚的结晶。从今往后，我们拥有了一道任凭任何列强也无法摧毁的巍峨长城！”\n\n——宪章入库大典致辞"
 eafp_mgl.410.a: "全票批准大蒙古复兴宪章。"
 eafp_mgl.410.b: "围绕宪章的批准展开了激烈的争论。"
 eafp_mgl.411.t: "草原联盟扩张"
 eafp_mgl.411.d: "囊括大草原联盟旗下所有加盟部族、旗份、玉兹及自治领的领土疆界、人口与产出清册——《联盟总名册》正式编纂告成。该册作为全联盟军事动员、资源统筹与干线交通建设的根本行政依据，昭示着曾经四分五裂的游牧世界已彻底重构为严密有序的近代国家联合体。"
 eafp_mgl.411.f: "“从北境的贝加尔湖畔到南疆的天山雪峰，草原上的每一处山川、每一支部落皆已赫然载于此黄金册籍之上。先祖的万里江山，终获完璧归一！”\n\n——内务部典籍官奏报"
 eafp_mgl.411.a: "确定草原联盟新的领土名册。"
