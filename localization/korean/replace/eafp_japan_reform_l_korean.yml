 eafp_japan_start_kobu_reforms_tt: "공무합체 성립 후 개국·군제·내정·재정의 네 후속 개혁 일지를 시작합니다."
 eafp_japan_marriage_ended_tt: "황실 혼인 과제가 종료됩니다. 다른 개혁 목표의 진행은 유지됩니다."
