 eafp_japan_start_kobu_reforms_tt: "Establishing Kōbu Gattai starts four subsequent reforms: opening the country, the army, internal administration and public finance."
 eafp_japan_marriage_ended_tt: "The imperial marriage undertaking ends. Progress towards the other reform goal is preserved."
 eafp_japan_negotiate_government_desc: "Petitioning with at least 75 legitimacy and the Kōbu Gattai prerequisites leads to the Shogun’s retention. Meeting the Kōgi Yoron prerequisites instead leads to a settlement with Tokugawa participation. Kōbu Gattai takes precedence if both qualify. If neither qualifies, a hardline political confrontation follows even with high legitimacy. Accepting the response and meeting the completion conditions confirms the outcome."
 je_meiji_restoration_proclaim_imperial_restoration_desc: "$eafp_japan_negotiate_government_desc$"
 eafp_japan_kogi_petition_accepted_tt: "Secured approval of the Kōgi Yoron settlement through the petition for imperial restoration"
