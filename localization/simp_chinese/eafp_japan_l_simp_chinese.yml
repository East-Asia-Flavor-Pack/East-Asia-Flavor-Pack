eafp_japan.2106.t: "流言蜚语"
eafp_japan.2106.d: "江户城内流传着一个传闻。据说现在即位的将军，实际上并不是前任将军遗嘱指定的继承人。"
eafp_japan.2106.f: "“你听到那个传闻了吗？”\n\n“什么传闻？”\n\n“据说现任将军不是先代遗嘱指定的继承人。真正的继承人另有其人……”\n\n“小心点！乱说话可能会丢掉性命。隔墙有耳啊。”"
eafp_japan.2106.a: "现在将军连自己的继承人都无法随心所欲地指定了吗。"
eafp_japan.2107.t: "将军的意愿"
eafp_japan.2107.d: "[ROOT.GetCountry.GetRuler.GetFullName]决定表明自己对继任人选的意愿。拥护庆喜与家达的两派正等候将军开口。"
eafp_japan.2107.f: "江户城内一片寂静。将军的意愿虽有分量，却无法束缚所有人的心。今日俯首的人们，待到继位之时，还会拥护同一位候选人吗？\n\n将军望向两派的代表，缓缓开口。"
eafp_japan.2107.a: "支持庆喜继任。"
eafp_japan.2107.b: "支持家达继任。"
