 korea_scramble_sovereignty_button_desc: "承担24个月的50行政力成本。朝鲜影响力增加3，唯一外国领先者减少3；外国领先者并列时不扣除。冷却24个月。"
 scramble_for_korea_events.1.t: "风中残烛"
 scramble_for_korea_events.1.d: "帝国主义的汹涌浪潮已抵达[ROOT.GetCountry.GetName]的海岸。从接壤的邻国到远隔重洋的陌生列强，无数外来势力正露出险恶的用心。"
 scramble_for_korea_events.1.f: "\"我国如今实处亚洲咽喉之地，其形势犹如巨石压卵，危殆至极。强国彼此忌惮，不敢率先行动，只是虎视眈眈。然而一旦某国入侵，其余各国必不会袖手旁观，我国也必将无力承受这场灾祸。\"" # 유길준 전서에 있다는데 암만 뒤져도 못 찾겠다. 적당해서 넣음.
 scramble_for_korea_events.1.a: "纵入虎穴，只要沉着应对，便有生机。"

 scramble_for_korea_events.2.t: "觊觎朝鲜半岛"
 scramble_for_korea_events.2.d: "邻近的半岛是连接大陆与海洋的战略要地，也是夺取东亚霸权必须掌握的桥头堡。然而觊觎这片土地的并非只有我们。"
 scramble_for_korea_events.2.f: "\"请看地图。朝鲜犹如一把直指我们[ROOT.GetCountry.GetName]心脏的匕首。若不由我们握住刀柄，而任由其他列强掌控，我们就只能终日活在不知何时会遭到刺杀的恐惧之中。\"" # Jacob Meckel 말 적당히 써먹음
 scramble_for_korea_events.2.a: "那里理应处于我们的势力范围之内。"

 scramble_for_korea_events.3.t: "朝鲜问题"
 scramble_for_korea_events.3.d: "地区强国相互牵制，都一心想将朝鲜纳入自己的势力范围。"
 scramble_for_korea_events.3.f: "\"任何试图理解朝鲜问题的人，都必须认清一个事实：朝鲜是一颗夹在强大邻国这两块磨盘之间的谷粒。正因其战略价值极高，它已沦为竞争列强迎面交锋时来回击打的羽毛球。\"" # 그리피스, 은자의 왕국 조선 + 조지 커존, 극동의 문제들. 적당히 섞음.
 scramble_for_korea_events.3.a: "密切注视远东。"
 scramble_for_korea_events.4.t: "朝鲜主权得到保障"
 scramble_for_korea_events.4.d: "朝鲜争夺战以朝鲜获胜告终。围绕半岛的竞争已告一段落，朝鲜在决定自身未来方面的地位得到了巩固。"
 scramble_for_korea_events.4.f: "\"一国之权利，岂因轻率之言而动摇；千万人共同守护之主权，亦不能任由一人独断处置，此理昭然。譬如受雇于他人之家者，未经主人指挥命令，便擅自与他人商议处置主人家中事务，既本无办理此事之权，其所议之事自然不得主人认可，他人亦将耻笑其狂妄。故一国之权利，不能因威胁与独断而更易。\"" # 출처: 유길준, 『서유견문』 제3편 「방국의 권리」 제8절 후반부. 원문의 논지와 비유를 유지하고 생소한 한자어와 연결 표현을 고풍스러운 현대어로 다듬음. https://ko.wikisource.org/wiki/서유견문/제3편
 scramble_for_korea_events.4.a: "我们的未来由我们决定。"
 scramble_for_korea_events.4.b: "必须承认朝鲜的地位。"
 scramble_for_korea_events.5.t: "新的主导强国"
 scramble_for_korea_events.5.d: "[SCOPE.sCountry('scramble_winner').GetName]赢得了朝鲜争夺。由此确定的附属关系与外交地位构成新秩序的基础。"
 scramble_for_korea_events.5.f: "\"随着时间的推移，朝鲜半岛终将成为[SCOPE.sCountry('scramble_winner').GetName]的领地。那股曾逐步拓展[SCOPE.sCountry('scramble_winner').GetName]的疆界、将我们的保护统治一点点扩展至我们的领土，并最终推动我们行动的不可抗拒之力，如今正驱使我们走向朝鲜半岛。\"" # 출처: 로젠 남작, 「4등관 로젠 남작이 제출한 단신」(1902. 9. 12.), 『러시아국립해군성문서Ⅱ(1900~1903)』, 문서 57. РГАВМФ, ф. 417, оп. 1, д. 2303, лл. 51–63. 특정 국가에 한정되지 않도록 재구성. https://db.history.go.kr/item/compareViewer.do?levelId=fs_021r_0570
 scramble_for_korea_events.5.a: "我们的地位已巩固。"
 scramble_for_korea_events.5.b: "我们必须应对新秩序。"
 scramble_for_korea_events.6.t: "日本占据优势"
 scramble_for_korea_events.6.d: "[SCOPE.sCountry('scramble_winner').GetName]赢得了朝鲜争夺。由此确定的附属关系与外交地位构成新秩序的基础。"
 scramble_for_korea_events.6.f: "\"如今，世界一致承认日本实力之强大，日本也自然而然地跻身列强之列。然而诸君仍追忆十年乃至二十年前的旧梦，不明时势之变迁，任凭己意妄下判断，实在是不通时务。贵国并不具备独立所需的实力。所谓独立，实不过徒有虚名罢了。\"" # 출처: 이토 히로부미, 1905년 11월 16일 「伊藤 大使 한국 각 대신 및 원로대신과 담화의 요령」, 『주한일본공사관기록』, 국사편찬위원회 한국사데이터베이스. 발췌·중간 생략. https://db.history.go.kr/joseon/level.do?levelId=jh_025r_0070_0030&types=r
 scramble_for_korea_events.6.a: "我们的地位已巩固。"
 scramble_for_korea_events.6.b: "我们必须应对新秩序。"
 scramble_for_korea_events.7.t: "清朝宗主权的再确立"
 scramble_for_korea_events.7.d: "[SCOPE.sCountry('scramble_winner').GetName]赢得了朝鲜争夺。由此确定的附属关系与外交地位构成新秩序的基础。"
 scramble_for_korea_events.7.f: "\"核算贵国之实力，所见唯有弱点，不仅无法成为自主之国，又无强国予以保护，因而断难独力自存，此乃自然之理，天下皆知。\n\n朝鲜本来隶属于中国，如今若要舍弃中国而转向他处，便如幼童离开自己的父母，转而寻求他人的照料一般。\"" # 출처: 원세개 「조선대국론(朝鮮大局論)」, 『고종실록』 23권, 고종 23년(1886) 음력 7월 29일 제3기사, 국사편찬위원회. 발췌·중간 생략 및 종결 어미 조정. https://sillok.history.go.kr/id/wza_12307029_003
 scramble_for_korea_events.7.a: "我们的地位已巩固。"
 scramble_for_korea_events.7.b: "我们必须应对新秩序。"
