eafp_japan.1.t: "摇摇欲坠的幕府权威"
eafp_japan.1.d: "自关原之战以来，统治日本数百年的幕府的权威正在动摇。"
eafp_japan.1.f: "目前幕府的权威正在崩溃。这种传统的权力只沉迷于过去的荣耀，不愿进行任何创新或改革。社会越来越充满混乱和不安。百姓们渴望以前的稳定与和谐。\n现在是寻找新道路的时候了。"
eafp_japan.1.a: "明白了。"
eafp_japan.1.tt_authority: "随着#b 幕府权威#!的#r 衰退#!，#italic 尊王攘夷派#!不断扩张，反对幕府者的影响力也#r 日益增强#!。"
eafp_japan.1.tt_council: "可以将#b 幕府官员#!#b 安排到各个职位#!并#b 指派任务#!，通过他们参与幕府政务与各藩的治理。"
eafp_japan.2.t: "大老登庸"
eafp_japan.2.d: "围绕这次大老任命，幕府内的派阀们正在竞争，以提高各自的利益和影响力。"
eafp_japan.2.f: "围绕大老登庸，各派阀为了各自的利益，在暗地里展开激烈的竞争。在这种矛盾中，将军的选择将对幕府的走向产生重大影响。"
eafp_japan.2.a: "强烈支持[ROOT.GetCountry.GetCustom('hitotsubashiha_loc')]"
eafp_japan.2.b: "支持[ROOT.GetCountry.GetCustom('hitotsubashiha_loc')]"
eafp_japan.2.c: "支持[ROOT.GetCountry.GetCustom('nankiha_loc')]"
eafp_japan.2.e: "强烈支持[ROOT.GetCountry.GetCustom('nankiha_loc')]"
eafp_japan.2.z: "告诉他们自己选吧。"
eafp_japan.2.zz: "我需要再考虑一下。"
