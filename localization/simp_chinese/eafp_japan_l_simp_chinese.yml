#### 事件 4000 多 ####
eafp_japan.4001.t: "[SCOPE.sCountry('country_scope').GetName]的要求"
eafp_japan.4001.d: "[SCOPE.sCountry('country_scope').GetName]以为了两国的名义，以黑船为首，要求[ROOT.GetCountry.GetName]开港。"
eafp_japan.4001.f: "“在过去的 50 年里，西方发生了许多变化。自从蒸汽船发明以来，遥远的国家变得像近在咫尺的国家一样，特别是自从电报发明以来，即使在最遥远的地方也可以进行快速通信。”\n\n“自从蒸汽发明以来，商业得到了极大的扩展，因此西方国家变得富裕起来。西方国家希望通过蒸汽通信使全世界成为一个家庭。任何拒绝与其他国家交往的国家都必须预计会被排除在这个家庭之外，任何国家都没有权利拒绝与其他国家交往。”"
# Many changes have taken place in the West within the last fifty years. Since the invention of steam-ships distant countries have become like those that are near at hand, Since the invention of the electric telegraph especially, rapid communication may be had between the most distant parts.\n\nCommerce has become very extensive since the invention of steam, and the countries of the West have in consequence become rich. The nations of the West hope that by means of steam communication all the world will become as one family. Any nation that refuses to hold intercourse with other nations must expect to be excluded from this family, donation has the right to refuse to hold intercourse with others.
eafp_japan.4001.a: "如果不答应，就会发生战争。"
eafp_japan.4002.t: "[SCOPE.sCountry('ryu_scope').GetName]开港"
eafp_japan.4002.d: "随着[ROOT.GetCountry.GetName]的开港，[SCOPE.sCountry('ryu_scope').GetName]也开港了。"
eafp_japan.4002.f: "$meiji.13.f$"
eafp_japan.4002.a: "$meiji.13.a$"
eafp_japan.4004.t: "外国人攀登富士山"
eafp_japan.4004.d: "[SCOPE.sCountry('country_scope').GetName]人登上了富士山。"
eafp_japan.4004.f: "\"根据罗宾逊中尉的实测，火山口呈椭圆形，长约1100码，平均宽600码，深约350码，边缘呈锯齿状。 在另一侧的北坡，即使在较低的地方也似乎完全没有植被，而我们离开的富饶土地完全被远处漂浮的云层所遮蔽。\""
eafp_japan.4004.a: "竟敢踏足富士山。"
eafp_japan.4006.t: "藩请求赔款援助"
eafp_japan.4006.d: "[SCOPE.sCountry('relevant_gp').GetName]要求为其商人之死支付赔偿。[SCOPE.sState('namamugi_daimyo_state').GetName]的大名无力承担赔款，向幕府请求援助。"
eafp_japan.4006.f: "“我们无力筹措赔款。若幕府不予援助，只能拒绝支付。外国舰队一旦到来，[SCOPE.sState('namamugi_daimyo_state').GetPortHubName]就会化为火海！”"
eafp_japan.4006.a: "由幕府代为支付赔款。"
eafp_japan.4006.b: "不予援助，拒绝赔偿要求。"
eafp_japan.4008.t: "浪人袭击外国人"
eafp_japan.4008.d: "发生了一起[SCOPE.sCountry('country_scope').GetAdjective]人被袭击身亡的事件，[SCOPE.sCountry('country_scope').GetName]要求[ROOT.GetCountry.GetName]赔偿。"
eafp_japan.4008.f: "\"我们不能再容忍这种暴力行为了。立即采取行动。\""
eafp_japan.4008.a: "别无选择。"
eafp_japan.4008.b: "他们只是无礼而已。"
#### 事件 5000号段 ####
# 乙巳条约事件用replace
eafp_japan.5002.t: "迁都决定"
eafp_japan.5002.d: "关于将新日本的首都迁往江户，并改名为东京的方案，意见不一。"
eafp_japan.5002.f: "目前，有将现在有皇居的京都作为首都的意见，有改建大阪城将大阪作为首都的方案，以及将江户改名为东京作为首都的方案三种方案并立，最终候选只剩下京都和江户。\n\n现在是做出决定的时候了。"
eafp_japan.5002.a: "新国家需要新的首都。"
eafp_japan.5002.b: "没有必要改变拥有悠久传统的首都。"
eafp_japan.5003.t: "政体书"
eafp_japan.5003.d: "决定新日本国家基本方针和行政组织的政体书颁布了。"
eafp_japan.5003.f: "第一条，将五条御誓文作为国家的基本方针。\n第二条，将权力集中于太政官，确立立法、行政、司法三权分立的基调。\n\n（下略）"
eafp_japan.5003.a: "好的开始！"
#### 自由民权运动 ####
je_liberty_civil_right_movement: "自由民权运动"
je_liberty_civil_right_movement_reason: "\"#italic 看看现在政权归结的地方，不在于皇室，不在于人民，而只在于有司。\"#!\n\n幕府虽然倒台，尊皇的梦想也得以实现，但其果实却被少数#bold 藩阀#!们独占。尝到了开国后涌入的#bold 西方民主主义思想#!的士族和农民们，不久便开始团结起来要求权利。\n\n在#bold $je_liberty_civil_right_movement$#! [concept_journal_entry]激活期间，参与#bold $eafp_movement_liberty_civil_right$#! [Concept('concept_political_movement','$concept_political_movements$')]的人数将会增加。"
je_liberty_civil_right_movement_tt: ""
liberty_civil_right_movement_below_5_tt: "#v $eafp_movement_liberty_civil_right$#!的[concept_activism]低于#b 5%#!"
liberty_civil_right_movement_above_15_tt: "#v $eafp_movement_liberty_civil_right$#!的[concept_activism]高于#b 15%#!"
liberty_civil_right_support_below_5_tt: "#v $eafp_movement_liberty_civil_right$#!的已识别[concept_pop] [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')]低于#b 5%#!"
liberty_civil_right_support_above_5_tt: "#v $eafp_movement_liberty_civil_right$#!的已识别[concept_pop] [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')]高于#b 5%#!"
liberty_civil_right_radicalism_below_5_tt: "#v $eafp_movement_liberty_civil_right$#!的已识别[concept_pop] [Concept('concept_activism', '$concept_activism_short$')]低于#b 5%#! "
liberty_civil_right_movement_events.1.t: "斗争的果实"
liberty_civil_right_movement_events.1.d: "自由民权运动的要求终于得以实现。"
liberty_civil_right_movement_events.1.f: "\"各位，今天是历史性的一天。\"\n\n一位年迈的民权运动家在聚集在议会前的人群面前，用颤抖的声音说道。\n\n\"我们梦想的那一天到来了。现在我们的声音将在议会中回响。报纸可以自由地传递真相了。\"\n\n人群中一位年轻的记者擦去了眼泪。\n\n\"现在我们的战斗结束了。但这仅仅是个开始。守护和发展这份宝贵的权利是我们的新使命。\""
liberty_civil_right_movement_events.1.a: "自由之花绽放了。"
following_bankikoron_modifier: "遵循万机公论"
liberty_civil_right_movement_events.2.t: "被遗忘的要求"
liberty_civil_right_movement_events.2.d: "民权派对改革的要求没有得到回应，失去了影响力。"
liberty_civil_right_movement_events.2.f: "\"现在来的人也没几个了。\"\n\n一位活动家环顾仓库说道。曾经热烈飘扬的旗帜现在已经布满了灰尘。\n\n\"时代变了。人们现在只关心增强国家的力量。\"\n\n另一位活动家叹了口气说道。\n\n\"我们的梦想去哪儿了？自由和民权...\""
liberty_civil_right_movement_events.2.a: "现在只剩下痕迹了。"
liberty_civil_right_movement_events.2.b: "国权更为重要。"
minken_ember_extinguished_modifier: "熄灭的火种"
focus_on_kokken_modifier: "集中于国权"
liberty_civil_right_movement_events.3.t: "自由永不消逝"
liberty_civil_right_movement_events.3.d: "$eafp_movement_liberty_civil_right$ 内的一位有影响力的人物在 [SCOPE.sState('state_scope').GetCityHubName] 发表讲话时，遭到一名陌生人的袭击。听到这个消息后，各地的民权主义者聚集到 [SCOPE.sState('state_scope').GetCityHubName]，表达他们的愤怒。"
liberty_civil_right_movement_events.3.f: "演讲者向人们鞠躬，走了两三步，突然一个陌生人喊着“国籍”冲过来，用匕首刺入他的胸膛。经过一番搏斗，一名同伴冲过来抓住陌生人的脖子，把他拉倒在地。蓝色的刀刃划破黑暗，掉落在几步之外。"
liberty_civil_right_movement_events.3.a: "不能让他死去。支付治疗费用。"
liberty_civil_right_movement_events.3.b: "最好不要干预。"
liberty_civil_right_movement_events.3.c: "监视民权主义者，防止他们做出不纯洁的行为。"
tempered_anger_modifier: "平息的愤怒"
congregating_minken_activists_modifier: "聚集的人权活动家"
monitoring_minken_activists_modifier: "人权活动家监视"
liberty_civil_right_movement_events.4.t: "建白书"
liberty_civil_right_movement_events.4.d: "[SCOPE.sCharacter('agitator_scope').GetFullName] 向政府提交了一篇关于立宪制和上下共治重要性的文章。 [SCOPE.sCharacter('agitator_scope').GetSheHe] 提交的“建白书”被驳回，但其全文发表在 [SCOPE.sCountry('country_scope').GetName] 的报纸上，引起了巨大的反响。"
liberty_civil_right_movement_events.4.f: "“你看过这篇文章了吗？民选议员，真是个及时的建议，不是吗？”\n\n“但我认为现在还为时过早。你认为我们的国家已经准备好接受这种西式制度了吗？”\n\n“为时过早，胡说八道！我们现在必须走一条新的道路，不是吗？现在是需要一个能够代表民意的机构的时候了。”"
liberty_civil_right_movement_events.4.a: "我们必须等待平静下来。"
liberty_civil_right_movement_events.4.b: "我们不能再等了吗？"
liberty_civil_right_movement_events.4.c: "收回报纸并审查文章。"
minken_propaganda_modifier: "民权派宣传"
expecting_crowds_modifier: "期待的人群"
blackouted_newspaper_modifier: "被涂黑的报纸"
liberty_civil_right_movement_events.5.t: "越来越大的声音"
liberty_civil_right_movement_events.5.d: "在[SCOPE.sState('state_scope').GetName]举行了关于$eafp_movement_liberty_civil_right$的演讲会，规模越来越大。"
liberty_civil_right_movement_events.5.f: "“今天聚集在此的各位，我们为了什么而战？”\n\n演讲台上演讲者的声音响起，数百名听众倾耳聆听。\n\n“我们为了自由而聚集！维新推翻了幕府，但真正的自由尚未到来。”\n\n人群中爆发出了赞同的欢呼声。警察们不安地注视着，演讲者继续慷慨陈词。\n\n“现在我们也到了实践文明开化的真谛的时候了。设立民选议员是我们的正当权利！”"
liberty_civil_right_movement_events.5.a: "太过分了。加强管制。"
liberty_civil_right_movement_events.5.b: "应该慎重考虑他们的要求。"
quieted_minken_speech_modifier: "压制演讲会"
crowded_minken_speech_modifier: "盛况空前的演讲会"
liberty_civil_right_movement_events.6.t: "恐怖未遂"
liberty_civil_right_movement_events.6.d: "沉迷于激进思想的年轻民权家们计划暗杀政府高官。他们计划报复镇压$eafp_movement_liberty_civil_right$的政治家们，但事先被发现并被逮捕。"
liberty_civil_right_movement_events.6.f: "“#italic 打倒压制政府#!” “#italic 自由的旗手#!”\n\n写满红色字体的传单在街头随风飘扬。年轻人每晚聚集在一起，计划袭击官员，但他们的阴谋最终还是暴露了。黑暗中响起了脚步声和尖叫声，警察开始搜查街道。"
liberty_civil_right_movement_events.6.a: "必须彻底偿还这份罪孽。"
liberty_civil_right_movement_events.6.b: "刺激他们没什么好处。"
mass_arrested_minken_activists_modifier: "大规模逮捕"
some_arrested_minken_activists_modifier: "小规模逮捕"
liberty_civil_right_movement_events.7.t: "起义集会"
liberty_civil_right_movement_events.7.d: "[SCOPE.sState('state_scope').GetName]的农民为了减免租税和冻结债务而揭竿而起。起初，他们控制了官厅，撕毁借据，掌握了地区，但由于迅速的镇压而完全解散。"
liberty_civil_right_movement_events.7.f: "“我们的要求是正当的！减免租税，冻结债务！”\n\n群众的呼声响彻云霄，起义军在严格的纪律下井然有序地行进。几天后，镇压军的枪声划破长空。"
liberty_civil_right_movement_events.7.a: "严惩不贷。"
liberty_civil_right_movement_events.7.b: "必须安抚民心。"
liberty_civil_right_movement_events.7.c: "借起义之名，征收更多的税。"
minken_tax_resistance_modifier: "租税抵抗"
liberty_civil_right_movement_events.8.t: "掌控舆论"
liberty_civil_right_movement_events.8.d: "一部分民权家试图掌控舆论。"
liberty_civil_right_movement_events.8.f: "有消息称，民权家们试图掌控报社，主导舆论。已经有小报刊登满了改革派的主张，受此影响的人们开始创立结社。如果对此坐视不理，将会陷入无法承受的舆论漩涡。"
liberty_civil_right_movement_events.8.a: "向报社施压。"
liberty_civil_right_movement_events.8.b: "区区报纸，何必如此大惊小怪。"
liberty_civil_right_movement_events.9.t: "空荡荡的教室"
liberty_civil_right_movement_events.9.d: "[SCOPE.sState('state_scope').GetName]大学生们对民权运动的参与愈发激烈，教室变得冷清。"
liberty_civil_right_movement_events.9.f: "最近，大学生之间主张应该为自由发声的呼声越来越高，想要参与运动的人也越来越多。示威长期持续，大学方面感到为难，并向政府请求仲裁。"
liberty_civil_right_movement_events.9.a: "这是大学的事情，不要干预。"
liberty_civil_right_movement_events.9.b: "为了让学生们回去，我会尽最大努力。"
minken_students_modifier: "学生的参与"
minken_students_building_modifier: "空荡荡的教室"
suppress_minken_students_modifier: "阻止学生参与"
#### 定韩论 ####
je_seikanron: "征韩论"
je_seikanron_reason: "我们理应成为帝国，所以必须拥有殖民地。在神功皇后时期臣服于我们的朝鲜半岛，如今已不再进贡，重新占领它是最好的选择。"
je_seikanron_0_states: "我们未能踏足朝鲜半岛。"
je_seikanron_1_states: "我们在朝鲜半岛建立了桥头堡。总有一天我们会占领整个朝鲜半岛。"
je_seikanron_3_states: "我们成功控制了朝鲜半岛的大部分地区。总有一天我们会占领整个朝鲜半岛。"
je_seikanron_5_states: "我们完全占领了朝鲜半岛。广阔的大陆就在我们眼前。"
seikanron_events.1.t: "战争的呐喊"
seikanron_events.1.d: "征韩论者所期望的与[SCOPE.sCountry('korea_scope').GetName]的战争开始了。"
seikanron_events.1.f: "“天皇陛下万岁！”“向[SCOPE.sCountry('korea_scope').GetNameNoFlag]前进！”\n\n群众们声嘶力竭地呐喊着。每当散发宣告战争爆发的号外时，人们都互相拥抱。自诩为武士后裔的青年们，脸上都带着意气扬扬的表情。他们的眼神中，蕴含着要找回维新之后失去的武士自尊心的坚决意志。"
seikanron_events.1.a: "胜利是我们的！"
bugle_for_advance_modifier: "前进的号角"
seikanron_events.2.t: "谣言"
seikanron_events.2.d: "[ROOT.GetCountry.GetName]试图征服[SCOPE.sCountry('korea_scope').GetName]的消息登上了[SCOPE.sCountry('news_country_scope').GetName]的报纸。对此，[SCOPE.sCountry('korea_scope').GetName]政府要求做出解释。"
seikanron_events.2.f: "'日本试图征服朝鲜。日本试图征服朝鲜的原因是朝鲜停止了每五年一次的朝贡，并且很久以前就废除了。'"
seikanron_events.2.a: "彻底否认。"
seikanron_events.2.b: "这次机会派遣特使也不错。"
sending_envoys_to_korea_modifier: "派遣特使"
seikanron_events.3.t: "拒绝交涉"
seikanron_events.3.d: "[SCOPE.sCountry('korea_scope').GetName]不承认[ROOT.GetCountry.GetName]新政府并拒绝外交交涉，要求征服的声音越来越大。"
seikanron_events.3.f: "\"希望尽快确定天下的方向，派遣使节到朝鲜询问他们的无礼，如果他们不服从，就斥责他们的罪行，攻击他们的土地，大大提高神州的威严。\""
seikanron_events.3.a: "应该向[SCOPE.sCountry('korea_scope').GetName]抗议。"
seikanron_events.3.b: "增强国力是首要任务。"
seikanron_events.4.t: "传令书"
seikanron_events.4.d: "[SCOPE.sCountry('korea_scope').GetName]向公馆发送了传令书。内容无礼，舆论沸腾。"
seikanron_events.4.f: "'最近日本人的行为，难道不是无法无天的国家吗？朝鲜有朝鲜的法令。我们只是在倭馆实施这个法律。从现在开始，如果按照约定行事，就会原谅至今为止的错误。'"
seikanron_events.4.a: "这是绝对无法容忍的侮辱。"
seikanron_events.4.b: "应该向[SCOPE.sCountry('korea_scope').GetName]追究事实关系。"
seikanron_events.5.t: "启蒙运动家的社论"
seikanron_events.5.d: "一位具有代表性的启蒙运动家撰写了一篇社论，为了[SCOPE.sCountry('korea_scope').GetName]民众，应该与[SCOPE.sCountry('korea_scope').GetName]开战。"
seikanron_events.5.f: "\"[SCOPE.sCountry('korea_scope').GetNameNoFormatting] 为了民众， 祈愿[SCOPE.sCountry('korea_scope').GetNameNoFormatting] 灭亡。 既无法守护人民的生命、财产和自尊，这样的国家不如就此灭亡，才是拯救民众的道路。\""
seikanron_events.5.a: "那个人说得对。"
seikanron_events.5.b: "启蒙家们也这么想。"
enlightenment_activist_editorial_modifier: "启蒙运动家的社论"
seikanron_events.6.t: "军官们的辞职"
seikanron_events.6.d: "在征韩派军官们不满并提交辞呈的情况下，[SCOPE.sCharacter('character_scope').GetFullName]召见了提交辞呈的部下军官们并劝阻了他们。"
seikanron_events.6.f: "\"军人理应具有透彻的护国精神，忠实于保卫国家的任务，不应徒劳地关心政治，做出有违本分的轻率举动，希望你们撤回辞呈。\""
seikanron_events.6.a: "但毫无用处。"
seikanron_events.6.b: "军人们改变了心意。"
seikan_officers_resign_modifier: "征韩派军官们的辞职"
seikanron_events.7.t: "可疑的动静"
seikanron_events.7.d: "在[SCOPE.sState('state_scope').GetName]的炮兵仓库里，武器和弹药消失了。"
seikanron_events.7.f: "接连收到炮兵仓库的武器和弹药失踪的报告。 虽然加强了巡逻并开始了调查，但犯人仍然没有抓到，搜查人员报告说他们发现了一些可疑的动静。"
seikanron_events.7.a: "全力以赴进行调查！"
seikanron_events.7.b: "虽然可疑，但这是军队的事情，我不介入。"
weapons_theft_investigation_modifier: "武器盗窃事件调查"
seikanron_events.8.t: "征韩派刺客"
seikanron_events.8.d: "征韩派刺客袭击了反对派政治家，但未能成功。"
seikanron_events.8.f: "护卫与刺客之间迅速爆发了战斗，他们一直在马车后面。刀光剑影中，[SCOPE.sCharacter('character_scope').GetFirstName]从座位上跳起来，猛地向相反的方向扑去。刺客挥舞的刀划过了[SCOPE.sCharacter('character_scope').GetFirstName]的肩膀。\n\n刺客紧追不舍，护卫迅速扣动了扳机。砰！枪声响起，刺客们仿佛约好了一般，全部跳入了森林。"
seikanron_events.8.a: "务必抓住罪犯。"
seikan_assassins_attack_modifier: "征韩派刺客的袭击"
seikan_assassins_attack_character_modifier: "征韩派刺客的袭击"
seikanron_events.9.t: "海报"
seikanron_events.9.d: "[SCOPE.sState('state_scope').GetName]上张贴着征韩派的不良海报。内容暗示着暗杀和起义，扰乱民心。"
seikanron_events.9.f: "“正义之剑正在闪耀。”\n\n“不久之后，太政官将被鲜血染红。”"
seikanron_events.9.a: "搜查不纯分子。"
seikanron_events.9.b: "必须加强警卫。"
intimidated_by_investigation_modifier: "活动受限"
seikanron_events.13.t: "私学校"
seikanron_events.13.d: "有报告称，征韩派的主要领导人回到家乡，设立学校，聚集势力。"
seikanron_events.13.f: "“我们的学生人数正在增加。 尤其是武士出身的子弟很多。”\n\n“但是政府的监视也在加强……”\n\n“不用担心。 我们表面上只是纯粹的教育机构。 但在这个围墙内，我们正在教授真正的日本精神。”"
seikanron_events.13.a: "派遣兵力监视他们。"
seikanron_events.13.b: "聚集势力并不会构成威胁。"
seikanron_events.14.t: "征韩党的叛乱"
seikanron_events.14.d: "在[SCOPE.sState('state_scope').GetName]中，有人对不征服[SCOPE.sCountry('korea_scope').GetName]的政府感到不满，发动了叛乱，但被镇压了。 领导人全部被逮捕，等待审判。"
seikanron_events.14.f: "一名武士跪在冰冷的监狱地板上，低头看着自己被绑住的手腕。 锁链的声音在他耳边回响。\n\n“到底是从什么时候开始的呢……” 他自言自语道。 也许是从他们第一次看到西方军舰的时候开始的。 还是从他们开始一件件穿上西式服装的时候开始的。 还是从枪弹战胜刀刃的那一刻开始的。"
seikanron_events.14.a: "执行死刑。"
seikanron_events.14.b: "展现慈悲才能平息不满。"
captured_and_executed_modifier: "被俘并处决"
seikanron_events.15.t: "要求扩大战争"
seikanron_events.15.d: "与[SCOPE.sCountry('korea_scope').GetName]的局势一触即发，征韩派正利用这个机会，要求吞并[SCOPE.sCountry('korea_scope').GetName]。"
seikanron_events.15.f: "“必须完全掌控朝鲜。这不仅仅是征服，更是为了[ROOT.GetCountry.GetNameNoFormatting]的生存所必需的措施！”"
seikanron_events.15.a: "没有那个必要。"
seikanron_events.15.b: "渡过[SCOPE.sCountry('korea_scope').GetName]，夺取一切。"
seikanron_events.16.t: "要求扩大战争"
seikanron_events.16.d: "与[SCOPE.sCountry('korea_scope').GetName]的局势一触即发，征韩派正利用这个机会，要求吞并[SCOPE.sCountry('korea_scope').GetName]。"
seikanron_events.16.f: "“必须完全掌控朝鲜。这不仅仅是征服，更是为了[ROOT.GetCountry.GetNameNoFormatting]的生存所必需的措施！”"
seikanron_events.16.a: "没有那个必要。"
seikanron_events.16.b: "渡过[SCOPE.sCountry('korea_scope').GetName]，夺取一切。"
seikanron_events.99.t: "征韩论：结果"
seikanron_events.99.d0: "我们未能踏足朝鲜半岛。"
seikanron_events.99.d1: "我们在朝鲜半岛建立了桥头堡。终有一日，我们将占领整个朝鲜半岛。"
seikanron_events.99.d3: "我们成功控制了朝鲜半岛的相当一部分。终有一日，我们将占领整个朝鲜半岛。"
seikanron_events.99.d5: "我们已完全占领朝鲜半岛。广袤的大陆就在我们的眼前铺展开来。"
seikanron_events.99.f: "\"欲唤太阁地下起，高丽山巅日之丸。\"" # 太閤を地下より起し見せばやな 高麗やま高く昇る日の丸
seikanron_events.99.a: "这只是[ROOT.GetCountry.GetName]的开端！"

# 류큐 처분 저널
je_ryukyu_disposition: "琉球处分"
je_ryukyu_disposition_status: ""
je_ryukyu_disposition_reason: "[SCOPE.sCountry('RYU_scope').GetName]长期以来作为[ROOT.GetCountry.GetAdjective]萨摩藩的属国存在，但同时处于双重效忠状态，向[SCOPE.sCountry('CHI_scope').GetName]朝贡。为了巩固我国南方边境的安全，有必要将[SCOPE.sCountry('RYU_scope').GetName]完全并入[ROOT.GetCountry.GetName]。\n\n然而，[SCOPE.sCountry('CHI_scope').GetName]有可能以保护朝贡国为由干预此事态。此外，西方列强和邻国也在关注这一局势。\n\n通过[concept_article]进行$ryukyu_split$，可以与[SCOPE.sCountry('CHI_scope').GetName]进行#bold 谈判#!，[SCOPE.sCountry('RYU_scope').GetName] $dp_annex_war$ [concept_diplomatic_play]的结果将由此决定。"

je_ryukyu_disposition_chi: "琉球处分"
je_ryukyu_disposition_chi_status: ""
je_ryukyu_disposition_chi_reason: "[SCOPE.sCountry('RYU_scope').GetName]是多年来向[ROOT.GetCountry.GetName]朝贡的忠实藩属。然而，[SCOPE.sCountry('JAP_scope').GetName]正试图强行主张宗主权并觊觎琉球，如今更表露出彻底吞并的野心。\n\n保护藩属、维护东海稳定是我们的应尽之责。但是，[SCOPE.sCountry('JAP_scope').GetName]的军事挑衅和西方列强介入的可能性使我们难以轻率采取军事行动。\n\n通过[concept_article]进行$ryukyu_split$，可以与[SCOPE.sCountry('JAP_scope').GetName]进行#bold 谈判#!，[SCOPE.sCountry('RYU_scope').GetName] $dp_annex_war$ [concept_diplomatic_play]的结果将由此决定。"

ryukyu_split: "琉球分割"
ryukyu_split_desc: ""
ryukyu_split_effects_desc: "• 分割琉球，将奄美群岛划为日本领土，同时给予冲绳独立。"
ryukyu_split_article_short_desc: "[SOURCE_COUNTRY.GetNameNoFormatting]向[TARGET_COUNTRY.GetNameNoFormatting]提供$ryukyu_split$。"

